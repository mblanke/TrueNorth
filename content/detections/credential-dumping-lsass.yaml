title: Credential Dumping via LSASS Memory Access
id: tn-detect-006
status: stable
description: |
  Detects attempts to dump credentials from LSASS process memory using
  tools such as Mimikatz, procdump, comsvcs.dll MiniDump, or direct
  memory access. Covers multiple known techniques for LSASS access.
author: TrueNorth Range
date: 2026/02/25
severity: critical
mitre_technique:
  - T1003.001   # OS Credential Dumping: LSASS Memory

data_source:
  - sysmon
  - windows_security

logsource:
  category: process_access
  product: windows

detection:
  selection_target:
    TargetImage|endswith: "\\lsass.exe"
    GrantedAccess|contains:
      - "0x1010"
      - "0x1038"
      - "0x1FFFFF"
  selection_procdump:
    Image|endswith:
      - "\\procdump.exe"
      - "\\procdump64.exe"
    CommandLine|contains: "lsass"
  selection_comsvcs:
    Image|endswith: "\\rundll32.exe"
    CommandLine|contains:
      - "comsvcs.dll"
      - "MiniDump"
  selection_mimikatz_indicators:
    CommandLine|contains:
      - "sekurlsa"
      - "logonpasswords"
      - "lsadump"
  selection_taskmgr_dump:
    Image|endswith: "\\taskmgr.exe"
    TargetImage|endswith: "\\lsass.exe"
  filter_legitimate:
    Image|endswith:
      - "\\MsMpEng.exe"
      - "\\csrss.exe"
      - "\\wininit.exe"
  condition: (selection_target or selection_procdump or selection_comsvcs or selection_mimikatz_indicators or selection_taskmgr_dump) and not filter_legitimate

level: critical

query: |
  (TargetImage:*\\lsass.exe AND GrantedAccess:(0x1010 OR 0x1038 OR 0x1FFFFF)
    AND NOT Image:(*\\MsMpEng.exe OR *\\csrss.exe OR *\\wininit.exe)) OR
  (Image:(*procdump*.exe) AND CommandLine:*lsass*) OR
  (Image:*\\rundll32.exe AND CommandLine:(*comsvcs.dll* AND *MiniDump*)) OR
  (CommandLine:(*sekurlsa* OR *logonpasswords* OR *lsadump*))

sample_log:
  timestamp: "2026-02-25T03:22:15Z"
  event_id: 10
  source: Microsoft-Windows-Sysmon
  computer: "WS-FINANCE-02"
  description: "Process accessed (rule: LsassAccess)"
  fields:
    SourceProcessId: 5148
    SourceImage: "C:\\Windows\\System32\\rundll32.exe"
    TargetProcessId: 672
    TargetImage: "C:\\Windows\\System32\\lsass.exe"
    GrantedAccess: "0x1FFFFF"
    CallTrace: "|C:\\Windows\\SYSTEM32\\ntdll.dll+9D4C4|C:\\Windows\\System32\\KERNELBASE.dll+2C13E|C:\\Windows\\SYSTEM32\\comsvcs.dll+..."
    SourceUser: "CORP\\admin"

false_positive_notes: |
  - Windows Defender (MsMpEng.exe) and other AV legitimately access LSASS
  - Credential Guard health checks may trigger Sysmon event 10 on LSASS
  - Some enterprise SSO or password management tools access LSASS legitimately
  - Filter by known security product process names to reduce false positives
  - Task Manager "Create dump file" by administrators during troubleshooting