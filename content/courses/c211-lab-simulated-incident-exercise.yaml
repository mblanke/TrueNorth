  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: 'A hot wash should be held:'
      options:
      - A) A week later
      - B) Immediately after the exercise while recollection is fresh
      - C) Before the exercise
      - D) Only if problems occurred
      answer: B
    - question: 'Evaluation should be made against:'
      options:
      - A) General impressions
      - B) The criteria defined during design
      - C) Participant seniority
      - D) Time taken alone
      answer: B
    - question: 'Exercise findings must be clearly marked as such because:'
      options:
      - A) They are less important
      - B) Simulated artefacts must never be mistaken for real incidents later
      - C) They are confidential
      - D) They expire
      answer: B
    - question: 'Capturing what went well is important because it:'
      options:
      - A) Improves morale only
      - B) Identifies practices worth preserving and spreading
      - C) Balances the report
      - D) Satisfies participants
      answer: B
    - question: 'A hot wash should focus on:'
      options:
      - A) Individual performance
      - B) Process, information flow and decision quality
      - C) Tool selection
      - D) Scenario realism
      answer: B
- ordinal: 6
  title: Improvement Planning
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Convert exercise findings into owned improvement actions.
  - Prioritise improvements by risk reduction.
  - Verify that improvements were effective.
  topics:
  - Finding to action conversion.
  - Prioritisation and sequencing.
  - Ownership and tracking.
  - Verification through re-exercise.
  lab: 'Lab: Convert your exercise findings into a prioritised improvement plan with named owners, target
    dates and the verification method for each action.'
  refs:
  - nist-sp-800-61r3
  - nist-cswp-29
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: 'An improvement action should always specify:'
      options:
      - A) The finding only
      - B) Owner, target date and how completion will be verified
      - C) The cost
      - D) The exercise date
      answer: B
    - question: 'Prioritisation of improvements should be based on:'
      options:
      - A) Ease of implementation
      - B) Expected risk reduction relative to effort
      - C) Order discovered
      - D) Participant preference
      answer: B
    - question: 'The most reliable verification that a process improvement worked is:'
      options:
      - A) Documentation update
      - B) Re-exercising and observing the improved behaviour
      - C) Owner confirmation
      - D) Ticket closure
      answer: B
    - question: 'Improvement plans commonly fail because:'
      options:
      - A) They are too detailed
