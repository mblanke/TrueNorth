# Unsourced draft -- not validated by Standards. TAZ upskilling catalogue v1 (GLM draft).
# Instructor pack for C526 Memory Forensics with Volatility (content/courses/up-dfi-02-memory-forensics-with-volatility.yaml).

course_code: C526
audience: staff_only
overview: 'Memory Forensics with Volatility is an intermediate, self-paced course of six 50-minute modules
  (300 minutes, 5 hours) for one Student working alone. Each module pairs about 10 minutes of teaching with a
  30-minute lab on the soc-training range and a 10-minute quiz passed at 70 percent. Modules 1 to 5 build one
  continuous case around the v-ws01 memory image, from acquisition through process and network artefacts,
  injection signatures and a timeline, and Module 6 closes the case with an escalation note. The Student hands
  in lab notes at each module: digests and custody lines, process and network findings, injection
  classifications, a merged chronology and the final note.'
