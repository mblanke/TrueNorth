# C101 - Computer Architecture & Systems - INSTRUCTOR PACK. Staff only; do not distribute to Students.
# Companion to content/courses/c101-computer-architecture-systems.yaml (readiness: draft).
# Every answer letter below is that quiz key; each note says why the keyed option is right and what
# each distractor tests. Keys are to module objectives and topics, not to page numbers.

course_code: C101
audience: staff_only
overview: 'Computer Architecture & Systems is a beginner course of six 60-minute modules on the small-enterprise
  range (360 minutes total). Each module has the same split: 15 minutes contact, 35 minutes lab on the range
  jump-box, and a 10-minute assessment block for the five-item quiz passed at 70 percent. Every lab observes
  one host and ends in a recorded judgement, not a fix; say ''Student'' throughout and keep every description
  defensive and observable.'
