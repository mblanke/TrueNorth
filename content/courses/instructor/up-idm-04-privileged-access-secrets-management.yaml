# Unsourced draft -- not validated by Standards. TAZ upskilling catalogue v1 (GLM draft).
# Instructor pack for C510. Instructor-only material: keys, range preparation and the faults
# Students most often commit. Every description is defensive and observable; the range is
# content/ranges/medium-enterprise throughout.
course_code: C510
audience: staff_only
overview: >-
  C510 is an intermediate, self-paced upskilling course of six 50-minute modules (300 minutes,
  5 hours) taken individually on the medium-enterprise range; each module follows the same split
  of 10 minutes teaching, 30 minutes on the range and 10 minutes quiz. Each module teaches three
  objectives, runs one range lab that produces recorded evidence, and ends with a five-item quiz
  passed at 70 percent. The modules move from observing standing privilege through vaulting,
  brokering and pipeline secrets to session evidence and the integrative break-glass design in
  Module 6. Students hand in lab notes with the recorded evidence and the marked judgements the
  lab brief requires.
timings:
- module: 1
  minutes: 50
  plan: '10 teach (standing privilege and the credential attack surface), 30 lab (privileged
    inventory on the range), 10 quiz'
- module: 2
  minutes: 50
  plan: '10 teach (vaulting), 30 lab (credential storage audit on web01, siem01, mail01), 10 quiz'
- module: 3
  minutes: 50
  plan: '10 teach (brokering and just-in-time access), 30 lab (standing rights observed, workflow
    designed), 10 quiz'
- module: 4
  minutes: 50
  plan: '10 teach (secrets in pipelines and code), 30 lab (web01 and siem01 secret audit), 10 quiz'
- module: 5
  minutes: 50
  plan: '10 teach (session recording and credential isolation), 30 lab (session opened and
    reconstructed from siem01), 10 quiz'
- module: 6
  minutes: 50
  plan: '10 teach (break-glass accounts), 30 lab (break-glass procedure designed around dc01),
    10 quiz'
answer_key_notes:
- module: 1
  notes: 'Q1 C: Continuous rights used twice a month is the definition of standing privilege; A
    names the remedy, B a different account class, D a broker that would remove the standing right.
    Q2 A: The workstation compromise now yields highly privileged credentials; B, C and D test
    whether the Student invents policy, logging or expiry effects that do not follow. Q3 D: Grant
    at window start, revoke at close is just-in-time access with a time box; A, B and C test
    confusion with custody, permanence and distribution. Q4 B: A three-year password in a
    configuration file breaks rotation and vaulted storage; A, C and D name real controls the
    scenario says nothing about. Q5 A: Local password reuse lets the attacker sign in to the other
    workstations; B, C and D overstate the reach of a local credential.'
- module: 2
  notes: 'Q1 B: The application authenticates with its own identity and fetches a leased
    credential; A, C and D are the static, human and embedded patterns the module rejects. Q2 D:
    The security value of a lease is that a leaked secret expires; A, B and C test performance and
    policy misconceptions. Q3 C: With a shared password no one can be held accountable; A, B and
    D are properties sharing does not touch. Q4 A: Rotation changes the secret on a schedule
    without an incident; B, C and D confuse the credential with the engine, the network path and
    the code. Q5 B: Least privilege per workload identity; A, C and D are the permissive and
    blinded designs the module warns against.'
- module: 3
  notes: 'Q1 A: A broker releases the credential to an approved, recorded session rather than
    revealing it; B, C and D test beliefs that brokering removes cryptography, authentication or
    platform support. Q2 B: Expiry must revoke the elevation and record the revocation; A, C and
    D test silent renewal, account sharing and audit-on-a-timer. Q3 C: The broker records who
    checked the credential out, on which host and for how long; A, B and D test hash leakage,
    the unlogged myth and an irrelevant artefact. Q4 B: A distributed password can be used with
    no check-out, time box or expiry; A, C and D are typing, licensing and platform claims with
    no bearing on control. Q5 C: Forty minutes a month calls for a scoped just-in-time elevation
    that expires with the window; A, B and D are standing, emailed and permanent patterns.'
- module: 4
  notes: 'Q1 B: Earlier commits and existing clones still contain the key, so it must be rotated;
    A, C and D test the belief that deletion shortens, regenerates or rejects anything. Q2 C: A
    short-lived credential fetched from the vault when the step runs; A, B and D are the broad
    variable, logged value and committed file patterns the module rejects. Q3 A: Rotate first,
    then clean the history; B, C and D test deletion, renaming and scan-pausing as false first
    moves. Q4 C: Everyone who can open the log can read every secret in those variables; A, B and
    D test duration, size and record-keeping effects that do not follow. Q5 D: Pre-commit checks
    stop many secrets from entering the history at all; A, B and C test the beliefs that they
    replace rotation, encrypt history or move anything themselves.'
- module: 5
  notes: 'Q1 D: Recording shows who held the credential, on which host and what happened during
    the session; A, B and C test exit codes, patching and segmentation as the valued output. Q2
    B: Privileged credentials held only on a dedicated administrative host removes the exposure
    most directly; A, C and D are password length, browser cache and retention measures that do
    not move the credential. Q3 A: Check the change calendar and ask the account owner first;
    B, C and D test destructive or irrelevant responses to an unexplained sign-in. Q4 B: A
    sign-in-only recording establishes who connected and when, but not what they did; A, C and D
    test over-reading the record. Q5 D: An isolated credential still needs the same rotation,
    vaulting and audit trail as any other; A, B and C test isolation as an endpoint, convenience
    sharing and browser storage.'
- module: 6
  notes: 'Q1 C: The account designed for an outage that takes brokering and the directory offline
    is the break-glass account; A, B and D test service, shared and guest accounts. Q2 A: In
    two-person control the credential is sealed so one person alone cannot open it; B, C and D
    are desk notes, single custody and email distribution. Q3 D: An alert on every sign-in by the
    break-glass account makes the 02:40 to 03:05 use visible; A, B and C test password length,
    periodic review and disabling as the visibility control. Q4 B: The account returns to its
    sealed, disabled state with the session''s evidence retained; A, C and D test staying enabled,
    deleting the trail and leaving the password unchanged. Q5 C: The scheduled test proves the
    credential opens, the alerts fire and the account reseals; A, B and D test password strength,
    directory health and vault contents.'
lab_setup:
- module: 1
  setup: Revert the medium-enterprise range to its baseline. Confirm ws01, ws02, fs01, dc01 and
    fw01 are reachable. Assign the administrator account on ws01, an ordinary domain account for
    ws02, and an account with service rights on fs01. Evidence values to know in advance — the
    groups granting domain administrative rights on dc01 and their members; the service accounts
    fs01 runs; the denial message on the administrative share; the fw01 management-to-all rule.
- module: 2
  setup: Revert the range to its baseline. Confirm web01, siem01 and mail01 are reachable and
    assign the ubuntu accounts. Evidence values to know in advance — the credential-bearing
    settings in the web server, log shipper and mail service configuration files, and whether
    each is clear text, so classification debriefs are quick.
- module: 3
  setup: Revert the range to its baseline. Confirm dc01, fw01, ws01 and fs01 are reachable.
    Assign the administrator account on dc01 and an ordinary domain account for ws01. Evidence
    values to know in advance — the groups granting domain administrative rights; the fw01
    management-to-all rule; whether the ordinary account can open a remote administrative session
    to fs01.
- module: 4
  setup: Revert the range to its baseline. Confirm web01 and siem01 are reachable and assign the
    ubuntu accounts. Evidence values to know in advance — the credential-bearing files in web01's
    deployed application and configuration; the deployment and configuration events for web01 in
    the siem01 indices and whether any log line shows an unmasked credential.
- module: 5
  setup: Revert the range to its baseline. Confirm ws01, dc01 and siem01 are reachable. Assign
    the administrator account on ws01 and the analyst account on siem01. Evidence values to know
    in advance — the sign-in events the window should return for a ws01-to-dc01 administrative
    session, and that command-level detail is absent.
- module: 6
  setup: Revert the range to its baseline. Confirm dc01, fw01 and siem01 are reachable. Assign
    the administrator account on dc01 and the analyst account on siem01. Evidence values to know
    in advance — the built-in Administrator account's enabled state and last sign-in date on dc01;
    the fw01 logs-to-siem01 rule and its ports; whether any Administrator sign-in appears in the
    siem01 logs.
common_faults:
- module: 1
  fault: Students copy the value of every credential they find into the lab notes instead of
    recording file names and settings.
  remedy: Point at the Pass line that forbids copying values; a note that leaks secrets fails the
    lab it is documenting.
- module: 1
  fault: Standing privilege is marked "time-boxed" because an account is used rarely.
  remedy: Have the Student state the revocation point for each finding; a right with no expiry is
    standing however seldom it is used.
- module: 2
  fault: A clear-text setting is classified "acceptable as configured" because the file has
    restrictive permissions.
  remedy: Ask what the setting's protection is worth once the file is copied, backed up or logged;
    file permissions guard the file, not the secret.
- module: 2
  fault: Vault authentication is described as one shared account for all workloads.
  remedy: Return to the workload identity topic; one identity per workload with a scoped policy is
    what makes audit attribution possible.
- module: 3
  fault: The just-in-time workflow names a standing group as approver.
  remedy: Insist on a named role or person; "the administrators approve" reproduces the standing
    right the workflow is meant to retire.
- module: 3
  fault: The time box is left open-ended because the task "might overrun".
  remedy: Have the Student state what happens at expiry and how a longer window is obtained; the
    answer is a new request, not an absent expiry.
- module: 4
  fault: History cleanup is treated as the first action for a leaked key.
  remedy: Walk the exposure order from the topics — the key is already in clones, so rotation
    comes first and cleanup second.
- module: 4
  fault: Masked log lines are recorded as leaked credentials.
  remedy: Have the Student quote the exact log line and mark which part would have been a secret;
    most lines show masking already applied.
- module: 5
  fault: The sign-in record is treated as proof of what was done inside the session.
  remedy: Return to step 4 of the lab; the absence of command-level detail is the finding, and the
    control that fills the gap is the judgement.
- module: 5
  fault: Time windows on siem01 are searched in the wrong zone or granularity, so the events are
    reported as missing.
  remedy: Have the Student compare the recorded connection time against the query window before
    concluding anything is absent.
- module: 6
  fault: The break-glass procedure is written with one person performing all steps.
  remedy: Check the Pass line for two distinct people; two-person control is the point of the
    sealing.
- module: 6
  fault: The account is left enabled after the procedure so it is "ready next time".
  remedy: Return to the resealing topic; an always-enabled break-glass account is a standing
    administrator by another name.
