course_code: C533
audience: staff_only
overview: >-
  Incident Timeline Reconstruction is a self-paced course for a Student working alone across six
  50-minute modules (300 minutes, 5 hours). It teaches one chain of work on the soc-training
  range: read the clocks and sources (Module 1), measure skew and correlate (Module 2), merge
  host and network evidence (Module 3), build the master timeline (Module 4), write the attack
  narrative (Module 5) and review and hand over the finished work (Module 6). Each module has
  15 minutes of teaching, a 25-minute range lab and a 10-minute quiz passed at 70 percent. The
  Modules 4 and 5 labs carry forward: the timeline built in Module 4 is the one the Student
  turns into a narrative in Module 5. The Student hands in lab notes with the recorded evidence,
  the master timeline table and the cited narrative.
