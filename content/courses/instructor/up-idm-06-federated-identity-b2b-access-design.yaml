course_code: C512
audience: staff_only
overview: 'Federated Identity & B2B Access Design is an advanced self-paced course of six 60-minute
  modules for Students who already hold directory and web single sign-on fundamentals from C509 and
  C510. Modules 1 and 2 define and trace the two federation protocols; modules 3 and 4 design and
  govern guest and partner access; modules 5 and 6 operate the trust, first through certificate
  rollover and then through a federated outage. Every module pairs a short teaching block with a
  hands-on lab on the greyspace-internet range and ends with a five-item quiz passed at 70 percent.
  Students hand in a lab evidence sheet per module; the evidence items are listed in each module
  brief and the expected range values are in lab_setup below.'
timings:
