# C106 Cryptography Basics - instructor pack (staff only).
# Answer keys, expected values, lab setup and common faults live here, never in the
# course file the Student reads. scripts/check_course.py checks this pack against
# content/courses/c106-cryptography-basics.yaml.
course_code: C106
audience: staff_only
overview: Cryptography Basics is a beginner course of six 60-minute modules (360 minutes, 6 hours) for
  Students new to cryptography in the cyber-operator programme. Modules 1 to 3 build the classical-to-modern
  foundation (ciphers and cryptanalysis, symmetric modes, hashes and message authentication) and modules 4 to
  6 apply it (public key exchange, certificates and TLS, key management and failure modes). Every module
  teaches three objectives, runs one hands-on lab on the medium-enterprise range - usually on web01, with the
  TLS session observed from siem01 - and ends with a five-item quiz passed at 70 percent. Students hand in lab
  notes with the recorded evidence each lab brief names, and the instructor marks each Pass item yes or no.
