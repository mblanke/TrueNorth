# Unsourced draft -- not validated by Standards. TAZ upskilling catalogue v1 (GLM draft).

course_code: C523
audience: staff_only
overview: >-
  SOAR & Automation for Analysts is an advanced self-paced course for one Student working alone on the
  soc-training range: six 60-minute modules, each split 15 minutes of teaching, 35 minutes of lab and a
  10-minute quiz passed at 70 percent. Across the six labs the Student builds and tests one guarded
  playbook in TheHive and Cortex on thehive01, from classifying which tasks automation may take through
  enrichment from misp01, an approval gate, and finally measuring what the playbook changed. The Student
  hands in an evidence table at the end of every lab; the range must be reset to the module's prepared
  state before each session.
timings:
- module: 1
  minutes: 60
  plan: '15 teach, 35 lab, 10 quiz'
- module: 2
  minutes: 60
  plan: '15 teach, 35 lab, 10 quiz'
