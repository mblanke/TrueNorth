  origin: TAZ upskilling catalogue v1 (2026-10-28)
  notes:
  - 'NICE work roles: Cyber Defense Forensics Analyst (IN-FOR-002).'
  - 'NIST CSF 2.0: RS.AN, DE.AE.'
