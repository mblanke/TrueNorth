modules:
- ordinal: 1
  title: Transport Layer Security in Depth
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Describe the TLS 1.3 handshake and name the legacy mechanisms it removed
  - Interpret a negotiated cipher suite and state what each of its component algorithms provides
  - Select server TLS settings against recognised guidance and justify each disabled legacy option
  topics:
  - TLS 1.2 versus 1.3 handshake flow and round trips.
  - Cipher suites in TLS 1.3 and what each component algorithm provides.
  - Session resumption, 0-RTT early data and its replay risk.
  - Downgrade protection and negotiation fallback.
  - Server configuration guidance and legacy option removal.
  lab: >-
    Lab: On the large-enterprise range, find out which protocol version and cipher suite the TLS service on
    web01 negotiates with two clients, and judge every option the server still enables against current
    guidance. Evidence: the negotiated protocol version, cipher suite and server certificate dates from each
    client, and the list of protocol versions and cipher suites the server configuration still enables.
    Pass: all recorded exactly as the range shows them; each enabled legacy option marked "meets guidance" or
    "does not" with a one-sentence reason; one change proposed for each option marked "does not".
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH, open a terminal and write the start time in the lab notes.
    - hosts: [jump01, web01]
      action: From jump01, connect to the TLS service on web01 and record the negotiated protocol version,
        cipher suite and server certificate dates.
    - hosts: [web02, web01]
      action: From web02, connect to web01 again and record whether this second client negotiates the same
        protocol version and cipher suite.
    - hosts: [jump01, web01]
      action: List the TLS configuration on web01 and record each protocol version and cipher suite still
        enabled.
    - hosts: [jump01]
      action: Mark each enabled legacy option "meets guidance" or "does not" with one sentence of reason, and
        propose one change for every option marked "does not".
  refs:
  - rfc-8446
  - nist-sp-800-52r2
  quiz:
    title: Quiz 1
    pass_threshold: 70
    questions:
    - question: A browser completes a TLS 1.3 handshake in a single round trip before sending encrypted
        data. Which design change makes this possible compared with TLS 1.2?
      options:
      - A) Server certificates are verified only after encrypted data flows
      - B) Key exchange messages are combined into fewer round trips
      - C) The offered cipher suite list is hidden from the network path
      - D) Session resumption replaces the full handshake every time
      answer: B
    - question: An application resumes a session and sends its first request as 0-RTT early data. What
        specific risk does the server accept?
      options:
      - A) The certificate chain fails validation
      - B) The session keys expire at once
      - C) The client cannot resume the session
      - D) An attacker replays the early data
      answer: D
    - question: A web server's TLS 1.3 configuration lists the cipher suite TLS_AES_128_GCM_SHA256. Which
        statement describes its components correctly?
      options:
      - A) AES-GCM encrypts and authenticates, and SHA-256 derives keys
      - B) AES-GCM signs the certificate, and SHA-256 encrypts each record
      - C) AES-GCM negotiates the keys, and SHA-256 authenticates servers
      - D) AES-GCM compresses the records, and SHA-256 checks revocation
      answer: A
    - question: A security review finds a server that still supports static RSA key exchange and CBC cipher
        suites. How should the reviewer classify these settings?
      options:
      - A) Safe while the certificate key length stays comfortably long
      - B) A design flaw in the TLS protocol itself, not a choice
      - C) Legacy options the guidance removes, dropped by TLS 1.3
      - D) Required for compatibility with the most modern clients only
      answer: C
    - question: A proxy repeatedly offers an old protocol version to a mail server that also supports
        modern versions. Which protection stops the server from accepting it?
      options:
      - A) The validity period shown on the server certificate
      - B) Downgrade protection built into the handshake
      - C) Session resumption tickets held by the client
      - D) The available bandwidth between server and proxy
      answer: B
- ordinal: 2
  title: Certificate Management at Scale
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Describe the stages of a certificate lifecycle from issuance through renewal
  - Explain how a client builds a certificate chain and validates it against a trusted root
  - Select monitoring and revocation controls that detect certificate failures before an outage
  topics:
  - Certificate lifecycle stages and automated issuance and renewal.
  - Internal certificate authorities and protecting the root private key.
  - Trust store distribution and certificate pinning trade-offs.
  - Chain building, revocation checking and transparency logs.
  - Expiry monitoring and avoiding certificate-related outages.
  lab: >-
    Lab: On the large-enterprise range, record what the internal certificate authority on ca01 has issued,
    what the web01 service presents, and which clients trust it, then judge the findings for expiry risk.
    Evidence: each certificate ca01 has issued, with subject and expiry date; the issuer, validity dates and
    chain of the certificate web01 presents; and whether a connection from web02 validates against the client
    trust store. Pass: all three findings recorded exactly as the range shows them; each finding marked
    "ready to operate" or "at risk of an expiry outage" with a one-sentence reason; one monitoring or renewal
    control proposed for every finding marked "at risk".
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH, open a terminal and write the start time in the lab notes.
    - hosts: [jump01, ca01]
      action: From jump01, open the certificate authority on ca01 and record each certificate it has issued,
        with its subject and expiry date.
    - hosts: [jump01, web01]
      action: Read the certificate the TLS service on web01 presents and record its issuer, validity dates
        and chain.
    - hosts: [web02, web01]
      action: From web02, connect to web01 and record whether the presented certificate validates against the
        trusted roots in the client trust store.
    - hosts: [jump01]
      action: Mark each finding "ready to operate" or "at risk of an expiry outage" with one sentence of
        reason, and propose one monitoring or renewal control for every finding marked "at risk".
  refs:
  - nist-sp-800-52r2
  - nist-sp-800-57pt1r5
  quiz:
    title: Quiz 2
    pass_threshold: 70
    questions:
    - question: A web service fails two days after its certificate expired, although the issuing CA was
        healthy throughout. Which control would most likely have prevented the outage?
      options:
      - A) A validity period on the certificate twice as long
      - B) Publishing the certificate to a transparency log
      - C) Automated renewal paired with expiry monitoring
      - D) Pinning the certificate inside every client
      answer: C
    - question: A team pins its mobile application to one leaf certificate. The CA rotates that certificate
        on schedule and the application breaks for every user. What does this failure show?
      options:
      - A) Pinning trades operational resilience for strict control
      - B) The CA issued the wrong certificate type
      - C) The device trust store was out of date
      - D) Rotation should be disabled for pinned services
      answer: A
    - question: An internal CA issues certificates for the payroll service. Which two conditions make
        relying clients trust and verify those certificates?
      options:
      - A) A public root listed by a vendor and a daily renewal
      - B) A long root key and a wide cipher suite list
      - C) A transparency log entry and a short validity period
      - D) The root in each client trust store and a protected root private key
      answer: D
    - question: The owners of a domain discover a certificate for their mail service that nobody in the
        organisation requested. Which record set exposes certificates like this?
      options:
      - A) The CA's scheduled expiry reports
      - B) Certificate transparency logs
      - C) The relying party's session cache
      - D) Revocation lists published by the CA
      answer: B
    - question: A compromised server certificate is revoked, yet clients keep accepting it for days. What
        must be true for revocation to work at all?
      options:
      - A) The certificate's validity period must be short
      - B) The CA must operate a transparency log
      - C) Clients must actually perform revocation checking
      - D) The private key must be destroyed after each signing
      answer: C
- ordinal: 3
  title: Virtual Private Networks
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Distinguish the roles of IKE, ESP and AH in a deployed IPsec configuration
  - Compare tunnel and transport modes by what each protects in a captured packet
  - Select a site-to-site or remote-access VPN topology for a stated requirement
  topics:
  - IPsec building blocks such as IKE negotiation, ESP and AH.
  - Tunnel mode versus transport mode and what each encrypts.
  - TLS-based remote-access VPNs and their gateway.
  - Site-to-site and remote-access topologies, full and split tunnel.
  - Routing and name resolution effects of a split tunnel policy.
  lab: >-
    Lab: On the large-enterprise range, record which VPN services the gateway vpn01 offers, what a client
    session installs on the connecting client, and which destinations the session carries, then judge the
    tunnel policy. Evidence: the VPN services and tunnel mode each uses on vpn01; the addresses and routes
    the session installs on jump01; and the destinations the tunnel carries from jump01 toward exch01. Pass: all
    three findings recorded exactly as the range shows them; each recorded route marked "inside the tunnel"
    or "outside the tunnel"; the installed policy judged a full or a split tunnel with a one-sentence reason.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH, open a terminal and write the start time in the lab notes.
    - hosts: [jump01, vpn01]
      action: From jump01, open the VPN gateway vpn01 and record the VPN services it offers and the tunnel
        mode each uses.
    - hosts: [jump01, vpn01]
      action: From jump01, connect to vpn01, bring up a VPN session and record the addresses assigned to the
        client and the routes the session installs.
    - hosts: [jump01, exch01]
      action: From jump01, send ordinary traffic to exch01 while the session is up and record which
        destinations the tunnel carries and which it does not.
    - hosts: [jump01]
      action: Mark each recorded route "inside the tunnel" or "outside the tunnel", and judge the installed
        policy a full or a split tunnel with one sentence of reason.
  refs:
  - nist-sp-800-77r1
  quiz:
    title: Quiz 3
    pass_threshold: 70
    questions:
    - question: A firewall operator inspects encrypted packets whose original IP headers are hidden inside
        a new outer header. Which IPsec mode and protocol produce this?
      options:
      - A) Transport mode with AH
      - B) Tunnel mode with ESP
      - C) Transport mode with ESP
      - D) Tunnel mode with AH
      answer: B
    - question: During IKE negotiation between two sites, what does the negotiation produce before any
        data packet flows?
      options:
      - A) Routing tables on both gateways
      - B) The payload encryption of user traffic
      - C) The name server settings of both networks
      - D) Paired security associations and shared keys
      answer: D
    - question: A gateway offers AH on a network path that rewrites addresses along the way. Which service
        fails, and why?
      options:
      - A) Integrity verification, because the addresses are part of what AH protects
      - B) Confidentiality, because AH removes encryption from the packet
      - C) Key exchange, because AH carries the negotiated keys itself
      - D) Compression, because AH expands every packet it processes
      answer: A
    - question: A remote workstation reaches an internal file share and public websites at the same time,
        and only the internal range crosses the VPN. What policy is in effect?
      options:
      - A) A full tunnel policy
      - B) IPsec transport mode
      - C) Split tunnelling
      - D) IPsec tunnel mode
      answer: C
    - question: An auditor reviews a remote-access design in which client internet traffic bypasses the
        VPN gateway entirely. Which risk belongs to that design decision?
      options:
      - A) The VPN gateway exhausts its address pool
      - B) The client links a trusted and an untrusted network at once
      - C) The encryption of the tunnel becomes weaker
      - D) The name resolution records of the domain change
      answer: B
- ordinal: 4
  title: Secure Messaging and Data in Transit
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Distinguish transport encryption from end-to-end encryption by who can read each message
  - Explain how verifying a contact's key out of band defeats a machine-in-the-middle substitution
  - Identify the metadata that stays observable when message content is encrypted
  topics:
  - Transport encryption and end-to-end encryption compared.
  - Key agreement and verifying a contact's key out of band.
  - Forward secrecy and compromise of a long-term key.
  - Metadata such as who communicated, when, and how much.
  - Traffic analysis and inferring relationships from patterns.
  lab: >-
    Lab: On the large-enterprise range, compare what the mail relay, the mail server and the monitoring
    platform each record about the same messages, then classify every recorded field as content or
    metadata. Evidence: for each recent message, the fields the relay mail-relay01 logs; the fields the
    server exch01 holds for the same messages; and the message fields the monitoring platform on siem01
    sees. Pass: the fields at each of the three points recorded exactly as the range shows them; each
    recorded field marked "content" or "metadata"; a list written of the fields an end-to-end design would
    still expose to the operator.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH, open a terminal and write the start time in the lab notes.
    - hosts: [jump01, mail-relay01]
      action: From jump01, open the mail logs on mail-relay01 and record for each recent message the sender,
        recipient, size and time the relay logged.
    - hosts: [jump01, exch01]
      action: From jump01, open the message logs on exch01 and record which fields the server holds for the
        same messages.
    - hosts: [siem01]
      action: Open the mail dashboards on siem01 and record which message fields the monitoring platform
        sees.
    - hosts: [jump01]
      action: Mark each recorded field "content" or "metadata", and list the fields an end-to-end design
        would still expose to the operator.
  refs:
  - nist-sp-800-57pt1r5
  - rfc-8446
  quiz:
    title: Quiz 4
    pass_threshold: 70
    questions:
    - question: A messaging service applies encryption only between each client and its relay. Which party
        can read every message in plaintext?
      options:
      - A) The recipient of the message alone
      - B) Nobody, the relay only ever sees ciphertext
      - C) The sender of the message alone
      - D) The operator of the relay
      answer: D
    - question: Two staff verify each other's key fingerprint on a video call before exchanging their
        first message. Which attack does this step defeat?
      options:
      - A) Replay of an older captured message
      - B) Substitution of keys by a machine in the middle
      - C) Traffic analysis of message timing
      - D) Loss or theft of a device
      answer: B
    - question: An operator of an end-to-end encrypted service logs connection times and message sizes.
        Which exposure does this record show?
      options:
      - A) Metadata, although the content stays hidden
      - B) Message content in a summarised form
      - C) The participants' private signing keys
      - D) Nothing, because the content is encrypted
      answer: A
    - question: A long-term identity key is stolen after months of ordinary use. Which design property
        keeps earlier captured messages unreadable?
      options:
      - A) Stronger password hashing on the server
      - B) Certificate pinning in every client
      - C) Forward secrecy in the session keys
      - D) A public key transparency directory
      answer: C
    - question: Analysts who never see message content still predict which departments work together. What
        makes that inference possible?
      options:
      - A) The choice of cipher suite on the link
      - B) Patterns in timing, volume and endpoints
      - C) The strength of stored password hashes
      - D) The version of the encryption library
      answer: B
- ordinal: 5
  title: Cryptographic Protocol Failures
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Classify a recorded TLS failure as a design flaw or a configuration flaw
  - Interpret scanner findings against current protocol and cipher guidance
  - Propose a remediation order for a service that fails an assessment
  topics:
  - Downgrade attacks and oracle behaviour that leaks decryption validity.
  - Design flaws versus configuration flaws in deployed services.
  - Deprecated protocol versions and cipher suites still in service.
  - Scanner findings, certificate validation and reading them against guidance.
  - Remediation planning and migration of dependent clients.
  lab: >-
    Lab: On the large-enterprise range, scan the TLS service on web02, record every weakness the scanner
    reports, and judge each one before proposing a remediation order. Evidence: every weakness the scanner
    on vuln01 reports for web02, with its severity; the protocol version and cipher suite the service
    actually negotiates from a client connection; and a design-or-configuration marking for each reported
    weakness. Pass: every reported weakness recorded with its severity; each marked "design flaw" or
    "configuration flaw" with a one-sentence reason; a remediation order written with one sentence of
    reason for the first fix.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH, open a terminal and write the start time in the lab notes.
    - hosts: [vuln01, web02]
      action: From vuln01, scan the TLS service on web02 and record every weakness the scanner reports, with
        its severity.
    - hosts: [jump01, web02]
      action: From jump01, connect to web02 and record the protocol version and cipher suite the service
        actually negotiates.
    - hosts: [jump01]
      action: Mark each reported weakness "design flaw" or "configuration flaw" with one sentence of reason.
    - hosts: [jump01]
      action: Rank the recorded weaknesses for remediation and state which to fix first with one sentence of
        reason.
  refs:
  - nist-sp-800-52r2
  - nist-sp-800-115
  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: An assessment finds TLS 1.0 enabled beside TLS 1.3 on a payment service. Which failure mode
        does keeping the older version introduce?
      options:
      - A) It corrupts the stored certificates
      - B) It removes the server certificate check
      - C) It gives an attacker a path to force the weakest version
      - D) It silently lengthens the negotiated keys
      answer: C
    - question: A review shows strong algorithms deployed behind a rule set that still permits their
        weakest combinations. Where does the fault lie?
      options:
      - A) In the design of the cipher primitives themselves
      - B) In the configuration, not in the primitives
      - C) In the certificate authority that issued the keys
      - D) In the bandwidth the service has available
      answer: B
    - question: A client application lets its user dismiss any certificate warning and continue. Which
        protection has the application removed?
      options:
      - A) Cipher negotiation with the server
      - B) Session resumption across restarts
      - C) Forward secrecy of the session keys
      - D) Protection against interception of the link
      answer: D
    - question: A server answers differently when padding is invalid than when it is not, and an adversary
        measures the difference. Which attack class is this?
      options:
      - A) A padding oracle against the decryption
      - B) A downgrade negotiation with the client
      - C) A certificate expiry failure on the server
      - D) A weak key generation in the library
      answer: A
    - question: A scanner flags a deprecated cipher suite that is still served to legacy partner systems.
        Which response matches current guidance?
      options:
      - A) Ignore the finding until an attack is published
      - B) Raise the suite's priority so modern clients pick it
      - C) Plan removal on a date and migrate those partners
      - D) Document the suite and keep it indefinitely
      answer: C
- ordinal: 6
  title: Designing a Secure Communications Architecture
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Map the flows of a three-tier application and select a protection in transit for each
  - Justify where TLS terminates and which links a design must re-encrypt to the backend
  - Record a cryptographic decision with its requirement, options considered and rationale
  topics:
  - Requirement-driven selection of protections for data in transit.
  - Trust inside the perimeter and service-to-service encryption.
  - TLS termination at gateways and re-encryption to backends.
  - Mutual TLS and key management integration.
  - Decision records and cryptographic review.
  lab: >-
    Lab: On the large-enterprise range, observe which service flows the core firewall allows, which services
    present TLS, and which hold certificates from the internal CA, then judge each flow's protection.
    Evidence: the service flows between zones that the rules on fw01 allow; for exch01 and web01, whether a
    client connection negotiates TLS; and which services hold certificates issued by ca01. Pass: each
    recorded flow and service listed exactly as the range shows it; each flow marked "encrypted", "encrypted
    to the gateway only" or "plaintext"; one proposed protection written for every flow not marked
    "encrypted".
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH, open a terminal and write the start time in the lab notes.
    - hosts: [jump01, fw01]
      action: From jump01, list the rules on fw01 and record which service flows between zones they allow.
    - hosts: [jump01, exch01]
      action: From jump01, connect to exch01 and to web01 and record for each whether the session negotiates
        TLS.
    - hosts: [jump01, ca01]
      action: Open the certificate authority on ca01 and record which services hold certificates it issued.
    - hosts: [jump01]
      action: Mark each observed flow "encrypted", "encrypted to the gateway only" or "plaintext", and
        propose one protection for every flow not marked "encrypted".
  refs:
  - nist-sp-800-52r2
  - nist-sp-800-57pt1r5
  - nist-sp-800-207
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: A designer argues that service-to-service traffic inside the perimeter needs no encryption
        because the network is private. Which principle does that decision contradict?
      options:
      - A) Certificate pinning of every public endpoint across the estate
      - B) Zero trust, which treats the internal network as untrusted
      - C) Forward secrecy of the negotiated session keys
      - D) Traffic shaping rules applied at the perimeter gateway
      answer: B
    - question: Two services already hold certificates from the internal CA. Which design adds
        authentication of both endpoints to their link?
      options:
      - A) A shared password table on both hosts
      - B) Source address allow-listing on the gateway
      - C) A VLAN rule between the two segments
      - D) Mutual TLS between the two services
      answer: D
    - question: A load balancer terminates TLS and forwards plaintext to the application tier behind it.
        What must the design add for that hop?
      options:
      - A) Re-encryption from the balancer to the backend
      - B) A longer certificate chain presented by the balancer
      - C) Compression on the link between balancer and backend
      - D) A second public address assigned to the balancer
      answer: A
    - question: What should a decision record for a cipher choice contain beyond the algorithm name?
      options:
      - A) The vendor's licence cost for the library
      - B) The requirement, the options considered and the rationale
      - C) The implementation date and the operator who happened to be on shift
      - D) The personal preference list of the most senior administrator
      answer: B
    - question: A platform team chooses between a fast unencrypted link and a slower encrypted one for
        telemetry that carries personal data. What starts the selection?
      options:
      - A) The protection requirement for the data and its threat model
      - B) The measured speed of the unencrypted link
      - C) The default settings of the vendor product
      - D) The largest key size available on the platform
      answer: A
