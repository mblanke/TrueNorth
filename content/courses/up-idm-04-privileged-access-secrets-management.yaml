course_code: C510
title: Privileged Access & Secrets Management
version: '1.0'
difficulty: intermediate
duration_hours: 5
provenance: unsourced
status: draft
is_published: false
readiness: draft
prerequisites:
- C507
source:
  origin: TAZ upskilling catalogue v1 (2026-10-28)
  notes:
  - 'NICE work roles: Systems Security Analyst; Cyber Defense Infrastructure Support Specialist.'
  - 'NIST CSF 2.0: PR.AA (Identity Management, Authentication and Access Control); PR.DS (Data
    Security).'
  - Self-paced upskilling, outside DP1/DP2.
  - Unpublished pending Standards review.
modules:
- ordinal: 1
  title: Standing Privilege and the Credential Attack Surface
  content_type: reading
  duration_minutes: 50
  is_required: true
  pass_threshold: 70
  objectives:
  - Distinguish standing privilege from time-boxed access in an observed account inventory
  - Enumerate the privileged groups, accounts and service accounts a Windows domain exposes
  - Identify the credential exposures an ordinary workstation adds to a privileged account
  topics:
  - Standing privilege, just-in-time access and the cost of always-on administrator rights.
  - Privileged accounts, groups and service accounts in a Windows domain.
  - 'Credential theft exposure: cached credentials, stored secrets and password reuse.'
  - Mapping a path from a workstation to domain administration.
  lab: >-
    Lab: On the medium-enterprise range, build an inventory of the standing privileged accounts
    and paths the range exposes, then judge which one to fix first. Evidence: the member names of
    the groups holding domain administrative rights on dc01; the service accounts fs01 runs and
    the rights they hold; the exact error when an ordinary account reads an administrative share
    on dc01; the source and destination of the fw01 rule that lets the management zone reach every
    other zone. Pass: all four items recorded exactly as the range shows them; each finding marked
    "standing" or "time-boxed" with a one-sentence reason; one finding named as the first to fix,
    with a reason.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [ws01]
      action: Log on to ws01 with the administrator account your instructor assigned, open a
        terminal and note the start time in the lab notes.
    - hosts: [ws01, dc01]
      action: From ws01, query dc01 for the groups that grant domain administrative rights and
        record every group name and its member count.
    - hosts: [fs01, dc01]
      action: From fs01, list the accounts its services run under and record for each whether it
        holds domain-level rights.
    - hosts: [ws02, dc01]
      action: From ws02, try to open an administrative share on dc01 with the ordinary account
        your instructor assigned and record the exact error shown.
    - hosts: [fw01]
      action: On fw01, find the rule that lets the management zone reach every other zone and
        record its source, destination and action.
    - hosts: [ws01]
      action: Mark each finding "standing" or "time-boxed" with one sentence of reason, and name
        the one finding to fix first with a reason.
  refs:
  - nist-sp-800-207
  - cis-benchmarks
  quiz:
    title: Quiz 1
    pass_threshold: 70
    questions:
    - question: >-
        A help desk account holds domain administrator rights continuously although it is
        used about twice a month. This arrangement is best described as:
      options:
      - A) Just-in-time access
      - B) A break-glass account
      - C) Standing privilege
      - D) Credential brokering
      answer: C
    - question: >-
        A domain administrator signs in daily to a workstation also used for ordinary web
        browsing. The main added risk is:
      options:
      - A) A compromise of the workstation exposes highly privileged credentials
      - B) The domain's password policy becomes weaker
      - C) The domain controller stores fewer log events
      - D) The account's password expires sooner
      answer: A
    - question: >-
        An operator's elevation is granted at the start of a change window and expires
        when the window closes. This design follows:
      options:
      - A) Shared credential custody
      - B) Permanent delegation
      - C) Password distribution
      - D) Just-in-time access with a time box
      answer: D
    - question: A backup service account on fs01 has held the same password for three years, and
        the password is written in the backup tool's configuration file. Which practices does
        this break?
      options:
      - A) Network segmentation and session recording
      - B) Credential rotation and vaulted storage
      - C) Multi-factor authentication and logging
      - D) Patching and backup verification
      answer: B
    - question: >-
        An attacker steals the local administrator password from one workstation. Where
        the same local password is reused on other workstations, the attacker can most directly:
      options:
      - A) Sign in to those machines with the same credential
      - B) Read every file on the domain controller
      - C) Disable the domain's password policy
      - D) Delete the collected log record
      answer: A
- ordinal: 2
  title: Vaulting
  content_type: reading
  duration_minutes: 50
  is_required: true
  pass_threshold: 70
  objectives:
  - Select what belongs in a vault and what may stay in configuration or code
  - Explain how vault authentication, leasing and rotation reduce credential exposure
  - Classify the weaknesses of shared, static credential storage in a running service
  topics:
  - 'What a vault stores: passwords, keys, tokens and certificates.'
  - 'Vault authentication: workload identity, policies and audit logging.'
  - Leases, time-limited secrets and automatic rotation.
  - Shared credentials, static secrets and their audit blind spots.
  lab: >-
    Lab: On the medium-enterprise range, find where the Linux services store the credentials they
    need and judge each storage place against vaulting practice. Evidence: every credential-bearing
    setting in the web server configuration on web01, the log shipper configuration on siem01 and
    the mail service configuration on mail01, with file names; a note of whether each value is
    readable in clear text; the classification of each secret. Pass: each secret listed with its
    file and marked clear text or not; each marked "vault-ready", "environment-owned" or
    "acceptable as configured" with a one-sentence reason; no secret's value copied into the lab
    notes.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [web01]
      action: Log on to web01 with the account your instructor assigned, open a terminal and note
        the start time in the lab notes.
    - hosts: [web01]
      action: Search the web server's configuration on web01 for credential-bearing settings and
        record each file name, the setting name and whether the value is clear text.
    - hosts: [siem01]
      action: Inspect the log shipper's configuration on siem01 and record the credential settings
        it holds, whether each value is clear text and which other hosts they let it reach.
    - hosts: [mail01]
      action: List the credential settings the mail services on mail01 read at start-up and record
        where each value comes from and whether it appears in clear text.
    - hosts: [web01]
      action: Mark each recorded secret "vault-ready", "environment-owned" or "acceptable as
        configured", with one sentence of reason.
  refs:
  - nist-sp-800-57pt1r5
  quiz:
    title: Quiz 2
    pass_threshold: 70
    questions:
    - question: >-
        An application needs a database password when it starts. Under vaulting practice,
        the application should:
      options:
      - A) Keep the password in a root-readable configuration file on the host
      - B) Fetch a leased credential after authenticating with its own identity
      - C) Receive the password from each developer who builds it
      - D) Embed the password inside the application binary
      answer: B
    - question: >-
        A reporting service draws its database credential from the vault as a lease
        that expires after one hour. The main benefit of issuing time-limited leased
        secrets is that:
      options:
      - A) The vault stores less data
      - B) Applications start faster
      - C) Password policies stop applying to them
      - D) A leaked secret stops working when its lease expires
      answer: D
    - question: A firewall's administrator password is shared across the whole team. After a wrong
        change, no one can show who made it. Which property did sharing remove?
      options:
      - A) Confidentiality
      - B) Availability
      - C) Accountability
      - D) Capacity
      answer: C
    - question: >-
        A web application's database credential is rotated automatically by the vault
        every thirty days, with no incident recorded. Automatic rotation primarily
        changes:
      options:
      - A) The secret itself, on a schedule, without waiting for an incident
      - B) The database engine's version
      - C) The network path between the application and its database server tier
      - D) The application's source code
      answer: A
    - question: >-
        A vault holds database, mail and certificate secrets for several services.
        Its access policy is strongest when it:
      options:
      - A) Lets every authenticated application read every secret
      - B) Gives each workload identity only the secrets its role requires
      - C) Disables audit logging to save storage
      - D) Issues one shared token to all workloads
      answer: B
- ordinal: 3
  title: Brokering and Just-in-Time Access
  content_type: reading
  duration_minutes: 50
  is_required: true
  pass_threshold: 70
  objectives:
  - Explain how a credential broker removes direct knowledge of privileged secrets from administrators
  - Design a just-in-time elevation workflow with approval, a time box and expiry
  - Distinguish credential brokering from shared password vaults and plain password distribution
  topics:
  - 'Credential brokering: the broker holds the secret and releases it to a checked-out session.'
  - 'Just-in-time elevation: request, approval, time box, expiry and audit trail.'
  - Brokering, shared vaults and password distribution compared.
  - The evidence a brokered session leaves behind.
  lab: >-
    Lab: On the medium-enterprise range, record which standing administrative rights and network
    paths exist, then design a just-in-time workflow that would replace them for one named task.
    Evidence: the groups granting domain administrative rights on dc01; the fw01 rule that lets the
    management zone reach every zone; whether the ordinary account assigned by your instructor can
    open a remote administrative session to fs01 from ws01; the designed workflow with request, approver,
    time box, expiry and the standing right it retires. Pass: all three range items recorded as
    observed; the workflow names a specific approver and an expiry time; at least one standing right
    named for retirement with a one-sentence reason.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [dc01]
      action: Log on to dc01 with the administrator account your instructor assigned and record
        the groups that grant domain administrative rights.
    - hosts: [fw01]
      action: On fw01, read the rule that lets the management zone reach every destination and
        record its source, destination and action.
    - hosts: [ws01, fs01]
      action: From ws01, attempt to open a remote administrative session on fs01 with the ordinary
        account your instructor assigned and record whether it is allowed.
    - hosts: [dc01]
      action: For each administrative right recorded, write the task that genuinely needs it and
        how long that task takes.
    - hosts: [dc01]
      action: Write the request, approver, time box and expiry for the shortest task, and state
        which standing right it would retire.
  refs:
  - nist-sp-800-207
  quiz:
    title: Quiz 3
    pass_threshold: 70
    questions:
    - question: >-
        The difference between credential brokering and a shared password vault is that a
        broker:
      options:
      - A) Releases a credential to an approved, recorded session
      - B) Keeps every password in clear text inside the shared vault
      - C) Removes the need to authenticate the requester
      - D) Serves Linux hosts only
      answer: A
    - question: An administrator's just-in-time elevation expires two hours after approval. What
        should happen at expiry?
      options:
      - A) The elevation renews itself silently
      - B) The elevation is revoked, and the revocation appears in the audit trail
      - C) The elevation moves to a shared account
      - D) The elevation stays active until the next audit
      answer: B
    - question: An administrator finishes a brokered privileged session on a database server.
        Which record does the broker leave behind?
      options:
      - A) A copy of the credential's password hash stored on the target host
      - B) Nothing, because brokered sessions are unlogged
      - C) Who checked the credential out, on which host, and for how long
      - D) The vendor's support ticket number
      answer: C
    - question: >-
        Handing one privileged password to several administrators for daily use is weaker
        than brokering because:
      options:
      - A) Distributed passwords are harder to type
      - B) Each holder can use it with no check-out, time box or expiry
      - C) Distribution needs extra licences
      - D) Brokers cannot serve Windows servers
      answer: B
    - question: >-
        An operator needs domain administration for about forty minutes each month to rotate
        a service credential. The best design is:
      options:
      - A) A permanent domain administrator account for the operator
      - B) The administrator password sent by email each month
      - C) A just-in-time elevation scoped to that task, expiring with the window
      - D) The operator's daily account added to the administrators group permanently
      answer: C
- ordinal: 4
  title: Secrets in Pipelines and Code
  content_type: reading
  duration_minutes: 50
  is_required: true
  pass_threshold: 70
  objectives:
  - Identify the places a delivery pipeline leaks credentials, from source to build log
  - Apply secret scanning and pre-commit checks to a described repository workflow
  - Select vault retrieval over embedded secrets for a pipeline's deployment steps
  topics:
  - Hard-coded secrets in source, configuration and build files.
  - 'Pipeline credential exposure: variables, logs and artefacts.'
  - Secret scanning, commit history and why deletion alone does not revoke a leaked key.
  - Short-lived pipeline credentials and vault retrieval at deploy time.
  lab: >-
    Lab: On the medium-enterprise range, audit the deployed web service and the collected logs for
    secrets that a repository or pipeline would have carried, then plan their removal. Evidence:
    each credential-bearing file in web01's application and configuration, with the kind of secret
    it holds; the deployment or configuration events for web01 found in the logs on siem01, with
    timestamps; whether any collected log line shows a credential in clear text. Pass: every
    credential-bearing file listed with the kind of secret it holds; each marked "rotate", "move to
    the vault" or "acceptable" with a reason; a fix order given, with the most exposed secret first.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [web01]
      action: Log on to web01 with the account your instructor assigned, open a terminal and note
        the start time in the lab notes.
    - hosts: [web01]
      action: Search the deployed application and its configuration on web01 for credentials written
        directly into files, and record each file name and the kind of secret it holds.
    - hosts: [siem01]
      action: Search the collected logs on siem01 for events that record deployment or configuration
        changes to web01 and record every timestamp returned.
    - hosts: [siem01]
      action: Check whether any collected log line contains a credential value rather than a masked
        one, and record the log source of any line that does.
    - hosts: [web01]
      action: Mark each embedded secret "rotate", "move to the vault" or "acceptable", and write
        the fix order, most exposed first.
  refs:
  - nist-sp-800-218
  quiz:
    title: Quiz 4
    pass_threshold: 70
    questions:
    - question: A developer deletes a hard-coded API key from the repository's newest commit. Why
        does the key still have to be rotated?
      options:
      - A) Deletion shortens the key's life but not its exposure
      - B) Earlier commits and existing clones still contain it
      - C) Scanning tools regenerate it
      - D) The pipeline rejects the change
      answer: B
    - question: >-
        A deployment step in a build pipeline needs a database credential. The safest way
        to supply it is:
      options:
      - A) A pipeline variable every job can read
      - B) A value printed into the build log for the audit
      - C) A short-lived credential fetched from the vault when the step runs
      - D) A file committed beside the deployment script
      answer: C
    - question: >-
        A secret scanner finds a credential committed to the repository eight months ago.
        The first action should be:
      options:
      - A) Rotate the credential, then clean the history
      - B) Delete the newest commit and continue the sprint unchanged
      - C) Rename the file that held it
      - D) Pause scanning until the noise drops
      answer: A
    - question: >-
        A pipeline prints its environment variables into the build log. The direct
        consequence is:
      options:
      - A) Builds take longer to finish
      - B) Artefacts grow in size
      - C) Anyone opening the log can read every secret in those variables
      - D) The pipeline loses its delivery record
      answer: C
    - question: >-
        A team adds a pre-commit check that scans each staged commit for credential
        patterns before the push is accepted. Pre-commit secret checks mainly:
      options:
      - A) Replace the need for rotation
      - B) Encrypt the repository's history
      - C) Move secrets into the vault by themselves without a migration
      - D) Stop many secrets from entering the history at all
      answer: D
- ordinal: 5
  title: Session Recording and Credential Isolation
  content_type: reading
  duration_minutes: 50
  is_required: true
  pass_threshold: 70
  objectives:
  - Explain what a recorded privileged session captures and what it leaves out
  - Select the isolation controls that keep privileged credentials off ordinary workstations
  - Reconstruct a privileged sign-in from collected authentication logs and state its limits
  topics:
  - What a recorded privileged session captures and where its evidence lives.
  - 'Credential isolation: dedicated administrative hosts and limits on cached credentials.'
  - Authentication and session logs as evidence of privileged access.
  - Reconstructing a privileged sign-in from collected logs.
  lab: >-
    Lab: On the medium-enterprise range, open one privileged session from ws01 to dc01, then
    reconstruct it from the logs collected on siem01 and judge what the evidence proves. Evidence:
    the connection time of the session; the sign-in events the logs return for that window, with
    account name, source host and target host; whether any log detail shows what was done inside
    the session. Pass: the session's sign-in found in the logs and matched to the recorded time;
    each event listed with its account and hosts; a written statement of what the evidence proves
    and does not prove, plus one control named to fill the largest gap.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [ws01, dc01]
      action: Log on to ws01, note the start time, then open a remote administrative session to
        dc01 with the administrator account your instructor assigned and record the exact
        connection time.
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned and search the
        collected logs for the recorded connection window; record the sign-in events returned, with
        account name, source host and target host.
    - hosts: [siem01]
      action: Narrow the search to the account that opened the session and record every event in
        the window that shows the session's start.
    - hosts: [siem01]
      action: Search for events that show what was done inside the session, such as individual
        commands, and record whether any such detail is present.
    - hosts: [ws01]
      action: State what the collected evidence proves about the session and what it does not, and
        name one control that would fill the largest gap.
  refs:
  - nist-sp-800-92
  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: >-
        Session recording on a brokered privileged session is valued chiefly because it
        shows:
      options:
      - A) Whether every command run in the session succeeded on the target
      - B) That the target host was patched on time
      - C) That the network is properly segmented
      - D) Who held the credential and what happened during the session
      answer: D
    - question: A workstation used for email and web browsing also holds a domain administrator's
        cached credentials. Which isolation control removes that exposure most directly?
      options:
      - A) A longer account password
      - B) Holding privileged credentials only on a dedicated administrative host
      - C) Encrypting the web browser's cache
      - D) Extending the log retention period across the whole collection platform
      answer: B
    - question: >-
        Authentication logs show an administrator account signing in to a server at 03:12
        from a workstation outside the administrative pool. The best first step is:
      options:
      - A) Check the change calendar, then ask the account owner about the sign-in
      - B) Delete the events from the log store
      - C) Rotate the log platform's own certificates
      - D) Disable logging on the target server
      answer: A
    - question: >-
        A contractor's privileged session on a firewall was recorded, but the recording
        stores only the sign-in event. Such a recording establishes:
      options:
      - A) What the session changed on the target
      - B) Who connected and when, but not what they did
      - C) That the session was hostile
      - D) That the credential was rotated
      answer: B
    - question: >-
        A domain administrator's credential is stored only on a dedicated administrative
        host that ordinary workstations cannot reach. That isolated credential still
        requires:
      options:
      - A) No further monitoring at all, because isolation on its own is enough
      - B) Sharing with the service desk for convenience
      - C) Storage in the web browser for quick reuse
      - D) The same rotation, vaulting and audit trail as any other credential
      answer: D
- ordinal: 6
  title: Break-Glass Accounts Done Right
  content_type: reading
  duration_minutes: 50
  is_required: true
  pass_threshold: 70
  objectives:
  - Design a break-glass account with sealed credentials, two-person control and alerting
  - Distinguish a break-glass account from a standing administrator account by purpose and oversight
  - Plan the scheduled test that proves a break-glass account works before it is needed
  topics:
  - 'What break-glass is for: outages where brokering and directory services are down.'
  - Sealed credentials, two-person control and offline custody.
  - Alerting on every break-glass sign-in and returning the account to its sealed state.
  - Scheduled testing of the break-glass path and retaining the session's evidence.
  lab: >-
    Lab: On the medium-enterprise range, record how the built-in Administrator account on dc01 is
    configured and watched, then design the break-glass procedure around it. Evidence: the account's
    name, enabled state and last sign-in date; the fw01 rule that ships logs to siem01, with its
    ports; whether the logs on siem01 show any sign-in by that account; the unsealing, use and
    resealing steps with the alert that should fire. Pass: the account details recorded as the range
    shows them; the procedure names two distinct people and states where the credential is stored
    and returned; an alert is specified with the events it matches.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [dc01]
      action: Log on to dc01 with the administrator account your instructor assigned, find the
        built-in Administrator account and record its name, whether it is enabled and the date it
        last signed in.
    - hosts: [fw01]
      action: On fw01, confirm the rule that lets every zone ship logs to siem01 and record its
        source, destination and ports.
    - hosts: [siem01]
      action: On siem01, search the collected logs for any sign-in by the built-in Administrator
        account and record whether any event appears.
    - hosts: [dc01]
      action: Write the two-person unsealing steps for the break-glass credential, recording who
        approves, who opens the sealed record and where the credential is returned afterwards.
    - hosts: [dc01]
      action: State which monitoring rule would alert on a break-glass sign-in, which events it
        should match and how the account returns to its sealed state after use.
  refs:
  - nist-sp-800-61r3
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: >-
        A storage array fails and the directory service that normally brokers administrative
        access is offline. The account designed for this situation is:
      options:
      - A) A standing service account
      - B) A shared help desk account
      - C) A break-glass account
      - D) A locked guest account
      answer: C
    - question: >-
        A hospital stores its break-glass credential so that two different staff members
        must be present to open the sealed record. In such a two-person control design,
        the credential is:
      options:
      - A) Sealed so that one person alone cannot open it
      - B) Written on the administrator's desk for the whole team to read
      - C) Stored in the password manager of one engineer
      - D) Emailed to the whole response team at the start of each quarter
      answer: A
    - question: >-
        A break-glass account was used at 02:40 and closed again at 03:05. The control that
        makes this visible is:
      options:
      - A) A longer password chosen for the account at its most recent rotation
      - B) A weekly access review conducted by a manager after the fact
      - C) Disabling the account for a month at a time between uses
      - D) An alert that fires on every sign-in by the break-glass account
      answer: D
    - question: >-
        An engineer uses the break-glass account during an outage and the session closes
        afterwards. After a break-glass session ends, the account should:
      options:
      - A) Stay enabled with its credential unchanged, ready for reuse with no unsealing
      - B) Return to its sealed, disabled state with the session's evidence retained
      - C) Be deleted to remove the trail of the outage and its session
      - D) Have its password kept unchanged until the next quarterly audit cycle
      answer: B
    - question: >-
        Once a quarter, an administrator runs the planned test of the break-glass account
        instead of waiting for a real outage. The scheduled test proves:
      options:
      - A) That the password on the account is long enough to resist guessing
      - B) That the directory service the break-glass sign-in depends on is healthy
      - C) That the credential opens, the alerts fire and the account reseals
      - D) That the vault storing the credential contains no other credentials
      answer: C
