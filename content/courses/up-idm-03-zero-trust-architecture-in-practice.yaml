course_code: C509
title: Zero Trust Architecture in Practice
version: '1.0'
difficulty: intermediate
duration_hours: 5
provenance: unsourced
status: draft
is_published: false
readiness: draft
prerequisites:
- C507
- C109
source:
  origin: TAZ upskilling catalogue v1 (2026-10-28)
  notes:
  - 'NICE work roles: Systems Security Analyst; Cyber Defense Infrastructure Support Specialist.'
  - 'NIST CSF 2.0: PR.AA, PR.IR, ID.AM.'
  - Self-paced upskilling, outside DP1/DP2.
