course_code: C504
title: Supply-Chain & Third-Party Risk Management
version: '1.0'
difficulty: intermediate
duration_hours: 5
provenance: unsourced
status: draft
is_published: false
readiness: draft
prerequisites:
- C502
source:
  origin: TAZ upskilling catalogue v1 (2026-10-28)
  notes:
  - 'NICE work roles: Program Director, Cybersecurity Risk Manager.'
  - 'NIST CSF 2.0: GV.SC, ID.RA.'
