modules:
- ordinal: 1
  title: Risk Fundamentals
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Classify the confidentiality, integrity or availability impact of each event in a written outage scenario
  - Identify the assets, threats and vulnerabilities in a described system and rate each asset's value
  - Distinguish inherent, residual and accepted risk by labelling each state in a treatment decision
  topics:
  - Risk as the combination of likelihood and impact.
  - Asset identification, valuation and criticality in a running environment.
  - Threats, vulnerabilities and asset value in the risk relationship.
  - Inherent risk, residual risk after controls, and accepted risk.
  - Risk appetite and tolerance as organisation-level statements.
  lab: >-
    Lab: On the medium-enterprise range, inventory the hosts that keep the business services running,
    rate each one's criticality, and classify the threat and the vulnerability behind two written
    scenarios. Evidence: each host with the service it provides and the zone it sits in; a criticality
    rating of high, medium or low for each host with a one-sentence reason; for each written scenario,
    the range host that carries the vulnerability and the asset value at stake. Pass: every host that
    provides a service is listed; each criticality rating has a reason tied to what stops working; each
    scenario names one threat, one vulnerability and one asset.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned, open a terminal and record the start time.
    - hosts: [siem01, dc01, fs01]
      action: From siem01, identify the servers that hold sign-in and file services, and record each host with the service it provides.
    - hosts: [siem01, web01, mail01]
      action: From siem01, check the DMZ hosts web01 and mail01 and record the service each one exposes and its zone.
    - hosts: [siem01, dc01]
      action: From siem01, confirm the domain controller dc01 answers a directory query and record the result as evidence of dependence.
    - hosts: [siem01]
      action: Rate each recorded host high, medium or low criticality, with one sentence on what stops working if it fails.
    - hosts: [siem01]
      action: For the two written scenarios your instructor supplies, name the range host that carries the vulnerability and the asset value at stake.
  refs:
  - nist-sp-800-30r1
  quiz:
    title: Quiz 1
    pass_threshold: 70
    questions:
    - question: A warehouse server holds the only copy of its delivery records, and a ransomware campaign
        is active in the sector. Which statement describes the risk?
      options:
      - A) Low impact, because ransomware is common
      - B) Low likelihood, because the server is new
      - C) High impact, because losing the only records stops deliveries
      - D) No risk, because no attack has happened yet
      answer: C
    - question: 'A council rates losing its e-mail service as high impact, then installs a second mail
        relay. The risk remaining after this control is best called:'
      options:
      - A) Residual risk
      - B) Inherent risk
      - C) Accepted risk
      - D) Avoided risk
      answer: A
    - question: 'An owner reviews a risk and decides to run the old payment terminal one more year,
        records the decision and signs it. This decision is best described as:'
      options:
      - A) Risk transfer to the manufacturer
      - B) Risk mitigation by a new control
      - C) Risk avoidance by ending the service
      - D) Risk acceptance with a documented owner
      answer: D
    - question: 'A retailer lists its payment system, its website and its staff laptops, then rates
        which losses it could survive. The rating exercise is best described as:'
      options:
      - A) Threat modelling of attacker behaviour
      - B) Asset valuation to support risk decisions
      - C) Vulnerability scanning of each device
      - D) Quantitative loss expectancy calculation
      answer: B
    - question: 'A board states in writing how much delivery-delay risk it will carry before a project
        needs escalation. That statement is the organisation''s:'
      options:
      - A) Residual risk
      - B) Control baseline
      - C) Risk appetite
      - D) Impact rating
      answer: C
- ordinal: 2
  title: Risk Assessment Methods
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Compare qualitative and quantitative assessment of the same two risks and state where they disagree
  - Conduct a structured assessment of a described system by defining its scope, gathering evidence and rating each risk
  - Communicate uncertainty in an assessment by recording estimates, their sources and their limits
  topics:
  - Qualitative scales, likelihood-impact matrices and relative prioritisation.
  - 'Quantitative measures: single loss expectancy, annual rate of occurrence and annualised loss expectancy.'
  - Assessment scope, boundaries and why conclusions stop at the boundary.
  - Estimation bias, false precision and honest communication of uncertainty.
  lab: >-
    Lab: On the medium-enterprise range, gather the facts that feed two assessments of the file server
    fs01 failing, calculate an annualised loss expectancy for the outage, rank both scenarios on a
    qualitative matrix, and state where the two approaches disagree. Evidence: the firewall rule that
    allows workstations to reach fs01; an asset value, an occurrence frequency and an annualised loss
    expectancy for the outage; a matrix cell for each of the two scenarios; one sentence on where the
    approaches disagree and why. Pass: each input to the calculation is recorded before the result; each
    scenario sits in one named matrix cell; the disagreement names a feature of each approach, not a
    preference.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned, open a terminal and record the start time.
    - hosts: [siem01, fw01]
      action: From siem01, read the rules on fw01 and record the name of the rule that allows the workstation network to reach the server network.
    - hosts: [siem01, fs01]
      action: From siem01, open the file share on fs01 and record whether it answers, as evidence the file service is live for clients.
    - hosts: [siem01]
      action: Estimate an asset value for fs01 and how many full outages a year to plan for, and calculate the annualised loss expectancy.
    - hosts: [siem01, web01]
      action: Rank the fs01 outage and a defacement of the public website web01 in a likelihood-by-impact matrix, and record each cell.
    - hosts: [siem01]
      action: Record in one sentence where the calculated figure and the matrix placement disagree, and which estimate each approach is most sensitive to.
  refs:
  - nist-sp-800-30r1
  quiz:
    title: Quiz 2
    pass_threshold: 70
    questions:
    - question: 'A single outage of a file server costs an estimated 40,000 dollars, and the organisation
        expects two such outages a year. The annualised loss expectancy is:'
      options:
      - A) 40,000 dollars
      - B) 20,000 dollars
      - C) 42,000 dollars
      - D) 80,000 dollars
      answer: D
    - question: 'A team cannot find reliable loss figures for losing a community library''s catalogue, but
        must still tell the board which of four risks to fund first. The best fit is:'
      options:
      - A) An annualised loss expectancy per risk
      - B) A qualitative likelihood-by-impact matrix
      - C) Deferring the decision until data arrives
      - D) Treating all four risks as equal
      answer: B
    - question: 'Two assessors rate the same risk differently: one anchors on last year''s incident, the
        other on the newest one. The failing they share is best described as:'
      options:
      - A) Estimation bias in the likelihood input
      - B) False precision in a calculated result
      - C) A scope boundary drawn too narrowly
      - D) A quantitative measure applied twice
      answer: A
    - question: 'An assessment of a mail service concludes the risk is high, but its scope excluded the
        mail provider''s own network. The conclusion is best handled by:'
      options:
      - A) Extending it to cover the provider anyway
      - B) Lowering the rating to avoid alarm
      - C) Stating that the conclusion stops at the assessed boundary
      - D) Re-rating every other service to match
      answer: C
    - question: 'An analyst reports the annual rate of occurrence as exactly 1.37 outages per year,
        derived from two observed incidents. The report''s main weakness is:'
      options:
      - A) False precision that two observations cannot support
      - B) A missing impact estimate for the outage
      - C) An unsuitable scope
      - D) Ignoring the asset value
      answer: A
- ordinal: 3
  title: Risk Treatment and Controls
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Select among avoid, mitigate, transfer and accept for three assessed risks and justify each choice
  - Classify controls as preventive, detective or corrective from what each one does in a described incident
  - Justify a control choice against its cost and the residual risk expected after it is in place
  topics:
  - 'The four treatment options: avoid, mitigate, transfer and accept.'
  - Preventive, detective and corrective control functions.
  - Compensating controls when the intended control is not feasible.
  - Cost, residual risk and the treatment decision record.
  lab: >-
    Lab: On the medium-enterprise range, read the firewall rules as controls in place, test one permitted
    path, identify one forbidden path, and select a treatment for the remaining gap. Evidence: each fw01
    rule that allows traffic between zones, with source, destination and purpose; each recorded rule's
    control function and the function no rule exercises; the result of one permitted connection to web01;
    one traffic path the rule set forbids; a treatment option, a named control and its cost.
    Pass: each rule marked preventive or detective with a one-sentence reason; the missing control
    function named; the forbidden path named from the rule set, not from memory; the treatment names
    the residual risk expected after the control is in place.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned, open a terminal and record the start time.
    - hosts: [siem01, fw01]
      action: From siem01, list the rules on fw01 and record each rule's name, source zone, destination zone and what it allows.
    - hosts: [siem01, web01]
      action: From siem01, open the web service on web01 and record whether the connection succeeds, as evidence a permitted path works.
    - hosts: [siem01, fw01]
      action: Choose one zone pair the rule set does not allow and record the rule searched for and the default action that answered instead.
    - hosts: [siem01]
      action: Classify each recorded rule as preventive or detective from what it does to the traffic it matches, and record which control function the rule set does not exercise.
    - hosts: [siem01]
      action: Select a treatment for the recorded gap, naming the option, a named control, cost consideration and the residual risk expected after it.
  refs:
  - nist-sp-800-37r2
  - nist-cswp-29
  quiz:
    title: Quiz 3
    pass_threshold: 70
    questions:
    - question: A company stops offering public file uploads altogether after an assessment. Which
        treatment option did it choose?
      options:
      - A) Risk mitigation
      - B) Risk avoidance
      - C) Risk transfer
      - D) Risk acceptance
      answer: B
    - question: 'Ransomware encrypts the files on a server, and a restored backup returns the service to
        working order the same day. The backup is best classified as a:'
      options:
      - A) Preventive control
      - B) Detective control
      - C) Deterrent control
      - D) Corrective control
      answer: D
    - question: 'A standard requires a second network path between two sites, but the budget cannot fund
        one this year. An equivalent alternative control is best called:'
      options:
      - A) A compensating control
      - B) A preventive control
      - C) A corrective control
      - D) Risk acceptance
      answer: A
    - question: 'A firewall rule blocks workstation access to a database server, and an intrusion
        detection sensor watches the same zone. The sensor''s control function is:'
      options:
      - A) Preventive, it stops the first packet
      - B) Detective, it watches and alerts
      - C) Corrective, it restores the service
      - D) Deterrent, it discourages attackers
      answer: B
    - question: 'A treatment leaves a residual risk that the owner has accepted in writing. A year later
        the same risk is re-rated higher. The owner should first:'
      options:
      - A) Renew the acceptance unchanged
      - B) Transfer the risk to the supplier
      - C) Review the acceptance against the new rating
      - D) Delete the risk from the register
      answer: C
- ordinal: 4
  title: Governance, Compliance and Assurance
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Assign accountability for a risk decision to the role that bears its consequence and justify the assignment
  - Describe what an audit finding needs in evidence before it can be raised against a control
  - Distinguish a compliance obligation from a risk-based decision in a described control gap
  topics:
  - Governance structures, accountability and the risk decision record.
  - The three lines model and where assurance sits.
  - Audit evidence, findings and independent verification.
  - Regulatory obligations versus risk-based control decisions.
  lab: >-
    Lab: On the medium-enterprise range, verify which controls produce evidence, map each
    observed control to an accountable owner and an assurance activity, and
    name any control the range cannot verify. Evidence: the log indices siem01 holds, the host or zone
    each covers and the newest timestamp each shows; the fw01 rule that ships logs to the management network; one
    sign-in test result against dc01; an owner and a verification activity for each observed control;
    any control with no verification on the range. Pass: every observed control
    has one owner and one assurance activity; each control with no verification says what evidence
    an auditor needs instead; no owner is the analyst who did the mapping.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned, open a terminal and record the start time.
    - hosts: [siem01]
      action: From siem01, query the log store and record which log indices exist, the host or zone each covers and the newest timestamp each shows.
    - hosts: [siem01, fw01]
      action: From siem01, record the fw01 rule that sends every zone's logs to the management network, with its ports.
    - hosts: [siem01, dc01]
      action: From siem01, confirm the sign-in service on dc01 answers a connection attempt and record the result as evidence the identity control operates.
    - hosts: [siem01]
      action: Map each observed control to an accountable owner and an assurance activity that verifies it, and record the mapping.
    - hosts: [siem01]
      action: Name one control the range shows running but cannot verify, and record the evidence an auditor would ask for instead.
  refs:
  - nist-cswp-29
  - nist-sp-800-37r2
  quiz:
    title: Quiz 4
    pass_threshold: 70
    questions:
    - question: A risk register lists an accepted risk on the payroll system, and the payroll business
        unit bears the loss if it fires. Who is accountable for the decision?
      options:
      - A) The security analyst who operates the payroll system
      - B) The external auditor
      - C) The payroll business owner
      - D) The platform vendor
      answer: C
    - question: 'An auditor writes that a control has failed, citing a screenshot with no date, system
        name or source. Before the finding can be raised it needs:'
      options:
      - A) Evidence tied to a time, source and system
      - B) A stricter control standard
      - C) Approval from the control owner
      - D) A second auditor to agree with the finding
      answer: A
    - question: 'A regulation requires every supplier contract to include security terms, and the team
        adds them to renewals without assessing which suppliers matter most. This is best described as:'
      options:
      - A) A risk-based treatment decision applied to every supplier
      - B) An independent assurance activity
      - C) A compensating control
      - D) A compliance obligation met without a risk-based choice
      answer: D
    - question: 'The three lines model places operational management, a risk function and internal audit.
        Checking that the other two lines do what they claim belongs to:'
      options:
      - A) The third line, internal audit
      - B) The first line, operational management
      - C) The second line, the risk function
      - D) The supplier, as fourth line
      answer: A
    - question: 'A control worked on audit day, but nobody has looked at its logs since, and six months
        of failures went unnoticed. The untested assumption is that compliance:'
      options:
      - A) Replaces the need for monitoring
      - B) Applies to every control equally
      - C) Only proves conformance at one moment in time
      - D) Requires no independent review
      answer: C
- ordinal: 5
  title: Business Continuity and Resilience
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Derive a recovery time objective and a recovery point objective for a described process from its business impact analysis
  - Explain how a continuity plan is exercised and what an exercise proves that a document cannot
  - Identify the single point of failure that most threatens a stated recovery objective in a described system
  topics:
  - Business impact analysis and the consequence of losing a process over time.
  - Recovery time objective, recovery point objective and maximum tolerable downtime.
  - Continuity strategies, alternate sites and replication frequency.
  - Plan testing, exercises and what they prove.
  lab: >-
    Lab: On the medium-enterprise range, run a short business impact analysis for the file service on
    fs01 and the public web service on web01, set an RTO and an RPO for each, and name the single point
    of failure that most threatens the tighter objective. Evidence: the hosts that each service depends
    on and whether any has a second instance; an RTO and an RPO for each service with the consequence
    over time that justifies it; the single host whose loss breaks the tighter objective. Pass: each
    dependency is taken from the range, not from memory; each objective states a consequence over time;
    the single point of failure names one host and the objective it threatens.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned, open a terminal and record the start time.
    - hosts: [siem01, fs01]
      action: From siem01, open the file share on fs01 and record whether it answers, as evidence the file service is live.
    - hosts: [siem01, web01]
      action: From siem01, open the web service on web01 and record whether it answers, as evidence the public service is live.
    - hosts: [siem01, fs01, web01]
      action: List the hosts behind each service and record which of them no second host can stand in for.
    - hosts: [siem01]
      action: Set a recovery time objective and a recovery point objective for each service, and record the consequence over time that justifies each.
    - hosts: [siem01]
      action: Name the single point of failure that most threatens the tighter objective and record which objective it threatens.
  refs:
  - nist-sp-800-30r1
  source_gaps:
  - The NIST guide dedicated to IT contingency planning and business continuity is not in the
    reference library, so the continuity strategies and plan-exercise topics have no dedicated
    source and teach from the impact assessment guidance.
  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: 'A mail outage may last two hours before the business stops functioning; after two hours
        the impact becomes unacceptable. This outer limit is:'
      options:
      - A) The recovery time objective for the mail service
      - B) The maximum tolerable downtime
      - C) The recovery point objective
      - D) The backup window
      answer: B
    - question: A team can restore a file service within one hour but loses everything typed since last
        night's copy. Which objective did the team miss?
      options:
      - A) The recovery time objective
      - B) The maximum tolerable downtime
      - C) The recovery point objective
      - D) The exercise schedule
      answer: C
    - question: 'A continuity plan exists as a polished document nobody has ever followed, and the last
        restore took three times its estimate. What the plan still lacks is:'
      options:
      - A) An exercise that proves it works under pressure
      - B) A longer policy statement approved by senior management
      - C) A second written copy
      - D) An approved version number
      answer: A
    - question: A tighter recovery point objective is agreed for the payment database. What must change
        to make the new objective achievable?
      options:
      - A) Longer backup retention for the database
      - B) A slower recovery path
      - C) A larger server
      - D) More frequent backups or replication
      answer: D
    - question: 'A business impact analysis ranks the ordering system above the staff directory because
        orders stop paying customers within minutes. The analysis measures:'
      options:
      - A) Threat likelihood for each process
      - B) Consequence over time of losing each process
      - C) Control cost for each process
      - D) Vendor risk for each process
      answer: B
- ordinal: 6
  title: Third-Party and Supply Chain Risk
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Assess the risk a supplier introduces by examining what it holds, what depends on it and what it must evidence
  - Specify security requirements a supplier must meet in contractual terms, including a right to audit
  - Rank concentration and fourth-party exposure across the services a described organisation depends on
  topics:
  - Supplier assessment, tiering and the evidence each tier must show.
  - Contractual security requirements, breach notice and the right to audit.
  - Concentration risk and fourth-party dependence in upstream supplier chains.
  - Ongoing monitoring and secure offboarding of a supplier.
  lab: >-
    Lab: On the medium-enterprise range, treat the DMZ web and mail services as supplier-operated,
    record what each exposes and what would be lost at offboarding, and rank the two by concentration
    risk. Evidence: the fw01 rule that allows workstations to reach web01 and mail01, with its ports;
    what each DMZ service serves; for each service, the data a supplier would hold and the dependency
    lost at offboarding; a concentration ranking of the two services with a reason. Pass: each service's
    exposure is observed on the range, not assumed; each offboarding entry names the data and the access
    that must be returned or revoked; the ranking gives one reason tied to dependency.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 as the analyst account your instructor assigned, open a terminal and record the start time.
    - hosts: [siem01, fw01]
      action: From siem01, record the fw01 rule that lets the workstation network reach the DMZ, with the ports it allows.
    - hosts: [siem01, web01]
      action: From siem01, open the web service on web01 and record that it answers and what it serves.
    - hosts: [siem01, mail01]
      action: From siem01, record the mail service mail01 provides and which workstation ports the recorded rule allows to reach it.
    - hosts: [siem01]
      action: For each DMZ service, record the data a supplier would hold and the dependency the organisation would lose at offboarding.
    - hosts: [siem01]
      action: Rank the two services by concentration risk, record the ranking and give one reason tied to dependency for the first.
  refs:
  - nist-sp-800-37r2
  - nist-sp-800-218
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: 'A payment provider a shop depends on itself relies on one cloud region. If that region
        fails, the shop''s checkout fails with it. This chain is best labelled:'
      options:
      - A) Fourth-party dependence
      - B) Offboarding failure
      - C) Concentration risk across the payment chain
      - D) Right to audit
      answer: A
    - question: Three of an organisation's five critical services run on one provider's platform. Which
        risk does this arrangement create regardless of how well the provider performs?
      options:
      - A) Fourth-party risk from the provider's own suppliers
      - B) Offboarding risk
      - C) Audit risk
      - D) Concentration risk
      answer: D
    - question: 'A supplier shows a current security certificate for the data centre it runs, but a
        tenancy is configured by its staff with default settings. The certificate alone does not show:'
      options:
      - A) Whether the data centre has power backup
      - B) Whether your own use meets your requirements
      - C) Whether the certificate covers the site
      - D) Whether the supplier exists
      answer: B
    - question: A right-to-audit clause is negotiated into a cloud contract. What does it let the
        customer do that a certificate does not?
      options:
      - A) Skip its own supplier assessment
      - B) Transfer the risk to the supplier
      - C) Verify the supplier's own claims against its systems
      - D) Reduce the contract price
      answer: C
    - question: 'A photo supplier holds the only copy of an organisation''s product images, and the
        contract ends next month. Offboarding must include:'
      options:
      - A) Return of the data and revocation of access
      - B) A final invoice
      - C) A renewal offer
      - D) A reference letter
      answer: A
