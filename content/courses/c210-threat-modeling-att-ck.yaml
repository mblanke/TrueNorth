modules:
- ordinal: 1
  title: Threat Modelling Foundations
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Explain why a threat model is built during design and refreshed when the design changes
  - Select a threat modelling methodology that fits a described system and the decisions it must support
  - Scope a threat model so it names its in-scope assets and states what is out of scope
  topics:
  - 'Purpose and outcomes of threat modelling: mitigations with owners, not exhaustive lists.'
  - 'Methodologies compared: STRIDE, PASTA and attack trees, and when each fits.'
  - Scoping and abstraction level, so significant risks stay visible.
  - 'Common failure modes: enumerating everything, stale models and unowned mitigations.'
  lab: >-
    Lab: On the red-vs-blue range, scope a threat model for the public-facing DMZ: enumerate its hosts and
    services, read the firewall rules governing attack traffic into it, then write a scope statement naming
    what the model covers and one methodology to apply, with a reason. Evidence: each DMZ host with the
    service it exposes; the rule that lets the red team network reach the DMZ; the scope statement naming
    in-scope assets, out-of-scope assets and the chosen methodology with a one-sentence reason.
    Pass: all DMZ hosts and services recorded as the range shows them; the statement names at least three
    in-scope assets and one out-of-scope asset; the methodology is justified in one sentence tied to a
    decision the model must support.
  lab_range:
    template: red-vs-blue
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH and write the start time in your lab notes.
    - hosts: [jump01, web01, web02, mx01, rproxy01, vpn01]
      action: From jump01, enumerate the hosts in the DMZ and record each host id with the service it exposes.
    - hosts: [blue01]
      action: Connect to the blue analyst workstation blue01, open the router ruleset your instructor placed
        there and record what each rule allows from the red team network to the DMZ.
    - hosts: [blue01]
      action: Write a scope statement for a threat model of the DMZ naming the in-scope assets, one asset that
        is out of scope, and the methodology to apply first with a one-sentence reason.
  refs:
  - nist-sp-800-30r1
  - nist-sp-800-218
  quiz:
    title: Quiz 1
    pass_threshold: 70
    questions:
    - question: A team finishes the design of a payment service and starts coding the following week. When
        should its threat model first be produced and revisited?
      options:
      - A) Once the service is deployed, so real behaviour can be observed
      - B) During design, and again whenever the design changes
      - C) At the annual risk assessment, together with other controls
      - D) After the first incident, so the real adversary shapes it
      answer: B
    - question: A product owner asks how an attacker could reach one goal by several different routes through
        a system. Which methodology decomposes the goal into alternative paths?
      options:
      - A) An attack tree
      - B) A compliance checklist
      - C) A network diagram
      - D) A patch report
      answer: A
    - question: A threat model grows to list every conceivable threat for a large system, and reviews now take
        longer than the design changes they support. What does this failure mode produce?
      options:
      - A) Deeper coverage, because every entry point is documented
      - B) Lower risk, since the threat list is complete
      - C) Audit evidence that satisfies every requirement
      - D) A model abandoned because no one can act on it
      answer: D
    - question: A modeller describes one service down to its internal function calls while the review needs a
        decision about its external interfaces. What does the mismatched abstraction level cause?
      options:
      - A) The diagram becomes small enough to print on one page
      - B) The modelling tool refuses to open the file
      - C) The significant risks are obscured by the detail
      - D) The cost of the review falls
      answer: C
    - question: A threat model is finished and filed, but no mitigation in it has an owner. What is its most
        valuable missing output?
      options:
      - A) A larger diagram
      - B) Prioritised mitigations assigned to someone accountable
      - C) A longer threat list
      - D) A record for the compliance archive
      answer: B
- ordinal: 2
  title: System Decomposition
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Produce a data flow diagram for a described system with its processes, stores and trust boundaries
  - Identify the assets, entry points and privilege levels a data flow diagram exposes
  - Validate a data flow diagram against the running system and record every discrepancy
  topics:
  - 'Data flow diagram notation: processes, data stores, flows and external entities.'
  - Trust boundaries between zones of different trust and the privilege levels on each side.
  - 'Entry points and assets: where external input arrives and what it can reach.'
  - Validating the model against the running system to catch drift.
  lab: >-
    Lab: On the red-vs-blue range, decompose the enterprise network into a data flow diagram: record the DMZ
    entry points, the server-network rules and the log path to the SIEM, then draw the diagram with trust
    boundaries and privilege levels marked. Evidence: each DMZ entry point with its exposed service; each
    server-network rule with its ports toward dc01, db01 and fs01; each hop on the log path to siem01; the
    diagram with trust boundaries marked; one discrepancy between a first sketch and the running rules, with
    a reason. Pass: every DMZ entry point and its service recorded; each server-network rule
    listed with its ports; the log path drawn with every hop named; at least one discrepancy recorded with
    a reason.
  lab_range:
    template: red-vs-blue
    steps:
    - hosts: [jump01]
      action: Log on to jump01 over SSH and write the start time in your lab notes.
    - hosts: [jump01, web01, web02, mx01, rproxy01, vpn01]
      action: From jump01, reach each DMZ host and record its id and the service it exposes to outside traffic.
    - hosts: [blue01, dc01, db01, fs01]
      action: Connect to blue01, open the router ruleset your instructor placed there and record each rule
        that carries traffic into the server network with the ports it allows toward dc01, db01 and fs01.
    - hosts: [blue01, siem01]
      action: From blue01, open the siem01 dashboards and trace the log shipping path, recording each hop from
        the DMZ host web01 through relay01 to siem01.
    - hosts: [blue01]
      action: Draw the data flow diagram with trust boundaries marked and the privilege level on each side,
        then record at least one discrepancy between a first sketch and the rules with one sentence of reason.
  refs:
  - nist-sp-800-218
  quiz:
    title: Quiz 2
    pass_threshold: 70
    questions:
    - question: Two application servers sit on the same subnet, but one holds customer records and the other
        only renders pages. When does a data flow between them cross a trust boundary?
      options:
      - A) Whenever the two components have different owners
      - B) When the components hold different levels of trust or privilege
      - C) When the components are written in different languages
      - D) Only when a firewall rule names both hosts
      answer: B
    - question: A reviewer lists the login page as the sole entry point of a web application. What does an
        entry point actually cover?
      options:
      - A) The sign-in form alone, because only it accepts credentials
      - B) The database, because it stores everything
      - C) The perimeter firewall, because all traffic passes it
      - D) Any location where external input enters the system
      answer: D
    - question: A threat model drawn two years ago describes a single database, but the team has since added a
        second store for analytics. Why must it be validated against the implementation?
      options:
      - A) Because models drift from reality and a stale model misleads
      - B) Because diagrams fade and need redrawing
      - C) Because the modelling tool requires a refresh
      - D) Because validation is quicker than modelling
      answer: A
    - question: In data flow diagram notation, which element represents something that transforms or acts on
        data in motion?
      options:
      - A) A data store
      - B) A trust boundary
      - C) A process
      - D) An external entity
      answer: C
    - question: A modeller omits the backup archive from a data flow diagram because it is offline most of the
        time. Which threats does the model now miss?
      options:
      - A) Threats to data in transit between zones
      - B) Threats to data at rest in the omitted store
      - C) Threats to the diagram itself
      - D) Threats that only external entities carry
      answer: B
- ordinal: 3
  title: Applying STRIDE
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Apply STRIDE to each element of a data flow diagram and name the categories that fit it
  - Write each threat as a concrete scenario stating who acts, on what, with what effect
  - Link every threat to a candidate mitigation with a named owner
  topics:
  - The six STRIDE categories and which element types each threatens.
  - 'Threat statement construction: a concrete scenario, not a category label.'
  - 'Mitigation mapping: pairing each threat with a control and an accountable owner.'
  - Prioritisation and residual risk after mitigations are chosen.
  lab: >-
    Lab: On the red-vs-blue range, apply STRIDE to the log shipping path you traced in Module 2: record how
    log traffic enters the relay, who can reach the SIEM, and whether a delivery manager could dispute a
    record, then write one concrete threat per applicable STRIDE category with a mitigation and owner.
    Evidence: the rule that carries log traffic from the DMZ to relay01; the zones that can reach siem01;
    each STRIDE category applied with one concrete threat sentence; for each threat a candidate mitigation
    and a named owner. Pass: every threat written as a scenario naming who acts, on what, with what effect;
    at least four STRIDE categories applied; every threat carries a mitigation and an owner.
  lab_range:
    template: red-vs-blue
    steps:
    - hosts: [jump01, blue01]
      action: Log on to jump01 over SSH, connect to blue01 and write the start time in your lab notes.
    - hosts: [blue01]
      action: From blue01, open the router ruleset your instructor placed there and record which rule carries
        log traffic to relay01, with its source zones and ports.
    - hosts: [blue01, siem01, score01]
      action: Using the ruleset, record which zones can reach siem01 and which can reach score01, and note
        who could alter or delete the records there.
    - hosts: [blue01, web01, relay01, siem01]
      action: From blue01, walk the log path from web01 through relay01 to siem01 and record where an identity
        could be faked, data altered in transit, or a delivery manager could dispute a record.
    - hosts: [blue01]
      action: For the log path, write one concrete threat per applicable STRIDE category, each as a scenario
        naming who acts, on what and with what effect, and pair each with a candidate mitigation and an owner.
  refs:
  - nist-sp-800-218
  - owasp-top-10
  quiz:
    title: Quiz 3
    pass_threshold: 70
    questions:
    - question: A review records the threat "tampering" against a payment flow and moves on. What is wrong
        with that threat statement?
      options:
      - 'A) Nothing: naming the STRIDE category is the required output'
      - B) It is a category label, not a concrete threat scenario
      - C) It should instead cite the CVE number of the component
      - D) It should name the control rather than the threat
      answer: B
    - question: A database holds salary records, and a modeller lists information disclosure against the data
        store. Which pairing of threat and mitigation fits most directly?
      options:
      - A) Rate limiting the query endpoint
      - B) Logging every query
      - C) Validating the query input
      - D) Access control on the store and encryption of the records
      answer: D
    - question: An unauthenticated status endpoint answers any request and floods when one client loops over
        it. Which STRIDE category fits, and which control counters it?
      options:
      - A) Denial of service, countered by rate limiting, quotas and resource controls
      - B) Spoofing, countered by stronger authentication
      - C) Repudiation, countered by audit logging
      - D) Elevation of privilege, countered by patching
      answer: A
    - question: While writing a concrete threat statement for a supplier's monitoring feed, a modeller cannot
        confirm the feed really comes from the supplier's systems. Which STRIDE category fits?
      options:
      - A) Tampering
      - B) Information disclosure
      - C) Spoofing
      - D) Denial of service
      answer: C
    - question: A threat review closes with twelve mitigations listed and no names beside them. What is the
        most likely outcome?
      options:
      - A) They are mitigated first, because the list is fresh
      - B) They are formally accepted as residual risk and never revisited
      - C) They remain unmitigated, because no one is accountable
      - D) They are reclassified as compliance findings
      answer: C
- ordinal: 4
  title: MITRE ATT&CK in Depth
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Navigate the ATT&CK matrix and distinguish tactics, techniques and sub-techniques
  - Map described adversary behaviour to ATT&CK techniques and the tactics they serve
  - Use the data sources ATT&CK lists to judge what telemetry a technique needs for detection
  topics:
  - 'The matrix structure: tactics as goals, techniques as means, sub-techniques as specific ways.'
  - Enterprise, mobile and ICS matrices and why they are separate.
  - Groups, software and campaigns in the ATT&CK knowledge base.
  - Detection entries and the data sources each technique names.
  lab: >-
    Lab: On the red-vs-blue range, map an instructor-supplied intrusion narrative to ATT&CK tactics and
    techniques, then for three mapped techniques record which data sources ATT&CK lists for detection and
    whether the range collects them. Evidence: each narrative step mapped to a tactic and technique; for three
    techniques the data sources ATT&CK lists; the log sources visible on siem01; the endpoint telemetry ws01
    produces; a collected-or-missing judgement for each listed data source. Pass: every narrative step mapped
    to a tactic with a technique name; three techniques checked against ATT&CK data sources; each source
    marked collected, partial or missing with the evidence that shows it.
  lab_range:
    template: red-vs-blue
    steps:
    - hosts: [jump01, blue01]
      action: Log on to jump01 over SSH, connect to blue01 and write the start time in your lab notes.
    - hosts: [blue01, siem01]
      action: From blue01, open the SIEM dashboards on siem01 and record each log source feeding it and what
        that source observes.
    - hosts: [ws01, blue01]
      action: Inspect the endpoint configuration of ws01 and record each kind of endpoint telemetry it
        produces, with the component that emits it.
    - hosts: [blue01, siem01, nids01]
      action: From blue01, open the siem01 dashboards, review the network sensor nids01 events and record
        which zones its monitoring reaches.
    - hosts: [blue01]
      action: Map each step of the instructor-supplied narrative to an ATT&CK tactic and technique, choose
        three, list the data sources ATT&CK names for each, and mark each source collected, partial or
        missing using the recorded telemetry.
  refs:
  - mitre-attack
  quiz:
    title: Quiz 4
    pass_threshold: 70
    questions:
    - question: 'An analyst notes a specific variant that abuses a rare flag of a scheduled task technique. In
        ATT&CK structure, that variant is:'
      options:
      - 'A) A sub-technique: a more specific means of achieving the technique'
      - 'B) A tactic: the adversary''s broader goal'
      - 'C) A group: a tracked intrusion activity set'
      - 'D) A mitigation: a way to block the behaviour'
      answer: A
    - question: A detection engineer wants to know what telemetry a technique requires before promising to
        detect it. Which part of the ATT&CK entry answers this?
      options:
      - A) The list of threat groups observed using the technique
      - B) The data sources ATT&CK lists for the technique
      - C) The likelihood the technique is used this year
      - D) The identity of the threat actor behind it
      answer: B
    - question: A vendor advertises that its product gives complete ATT&CK coverage. Why is that claim
        misleading?
      options:
      - A) The matrix changes too often to measure
      - B) ATT&CK documents observed behaviour, not every possible technique
      - C) The matrix is proprietary and incomplete
      - D) The matrix lacks the detail vendors need
      answer: B
    - question: An intelligence analyst wants to link three intrusions that reused the same tooling and
        infrastructure. Which ATT&CK knowledge base entry groups related activity as one adversary?
      options:
      - A) A software entry describing the tool family
      - B) A mitigation entry describing the countermeasure
      - C) A group entry tracking the adversary
      - D) A data source entry describing the telemetry
      answer: C
    - question: 'A plant''s operators cannot reuse the Enterprise matrix for their programmable controllers.
      Why does the ICS matrix exist?'
      options:
      - A) Industrial systems use identical techniques, so it is a copy
      - B) Industrial sites are more secure and need fewer entries
      - C) Industrial sites lack the telemetry the Enterprise matrix assumes
      - D) Industrial technology and consequences need separate modelling
      answer: D
- ordinal: 5
  title: Threat-Informed Defence
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Prioritise defensive investment by which adversaries plausibly target the organisation
  - Assess detection coverage for a set of relevant techniques on a live environment
  - Plan improvement by ranking coverage gaps with evidence and a rationale
  topics:
  - 'Relevance filtering: sector, data value and adversary behaviour.'
  - Coverage assessment and heatmaps, and what a heatmap can hide.
  - Ranking gaps by likelihood of use and impact if used.
  - Reassessment as the environment and adversary behaviour change.
  lab: >-
    Lab: On the red-vs-blue range, assess detection coverage for ten techniques an adversary would plausibly
    use against the enterprise network, then rank the three highest-priority gaps and justify the ranking.
    Evidence: the ten techniques chosen with one sentence each on relevance; the coverage value recorded for
    each (covered, partial or gap) with the telemetry that shows it; the ranked list of three gaps with a
    rationale naming likelihood and impact for each; one proposed improvement for the top gap. Pass: ten
    techniques assessed, each with a coverage value and its evidence; three gaps ranked with likelihood and
    impact stated; one improvement proposed for the top-ranked gap.
  lab_range:
    template: red-vs-blue
    steps:
    - hosts: [jump01, blue01]
      action: Log on to jump01 over SSH, connect to blue01 and write the start time in your lab notes.
    - hosts: [blue01, siem01, nids01]
      action: From blue01, review the log sources on siem01 and what nids01 watches, and record the telemetry
        the range actually collects.
    - hosts: [ws01, lnx01, blue01]
      action: Record the endpoint telemetry ws01 and lnx01 produce and note which record it in the SIEM.
    - hosts: [blue01]
      action: Choose ten techniques an adversary would plausibly use against this network, and record a
        coverage value of covered, partial or gap for each, with the telemetry that shows it.
    - hosts: [blue01]
      action: Rank the three highest-priority gaps, state the likelihood of use and the impact if used for
        each, and propose one improvement for the top-ranked gap.
  refs:
  - mitre-attack
  - nist-sp-800-150
  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: A defence team ranks all matrix techniques equally because the matrix lists them all. What
        should relevance filtering have considered instead?
      options:
      - A) Which adversaries plausibly target this organisation and how
      - B) An equal weight for every technique in the matrix
      - C) The alphabetical order of the technique names
      - D) The identifier each technique carries
      answer: A
    - question: A heatmap marks a technique green because a detection rule exists for it, though nobody has
        tested the rule and it fires on almost nothing. What does the heatmap misrepresent?
      options:
      - A) Untested, low-fidelity detections counted as full coverage
      - B) Tested detections counted twice
      - C) Data sources counted instead of rules
      - D) Mitigations counted instead of detections
      answer: A
    - question: A compliance programme ticks control checklists; a threat-informed programme ranks work by
        adversary behaviour. What does the threat-informed team prioritise?
      options:
      - A) Documentation the auditors ask for
      - B) Audit findings from the last review
      - C) Defences against how adversaries actually operate
      - D) Control checklists the standard requires, ticked every quarter
      answer: C
    - question: A team ran a coverage assessment last year and the heatmap still looks green. Why must the
        assessment be repeated?
      options:
      - A) Because heatmap colours fade on the printed copy
      - B) Because both the environment and adversary behaviour change
      - C) Because assessment tools expire after a year
      - D) Because auditors demand a fresh copy
      answer: B
    - question: 'Two gaps exist: one is cheap to close, the other matches a technique the organisation''s most
        likely adversary uses with severe impact. Which gap ranks first?'
      options:
      - A) The cheapest, because progress motivates the team
      - B) The newest addition to the matrix
      - C) The most discussed one in the industry
      - D) The one with the greatest likely use and impact
      answer: D
- ordinal: 6
  title: Communicating Threat Models
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Present a threat model to a delivery manager and to engineers at the detail each audience needs
  - Track each mitigation from decision through implementation to verified effectiveness
  - Define the triggers that require a threat model to be revised
  topics:
  - 'Audience-appropriate presentation: risk and decisions for managers, elements and flows for engineers.'
  - Mitigation tracking and verification that a control works as modelled.
  - 'Model maintenance triggers: new integrations, trust boundaries and design change.'
  - Keeping the model current inside the development workflow.
  lab: >-
    Lab: On the red-vs-blue range, turn the findings from Modules 1 to 5 into a one-page threat model summary
    for a delivery manager and an engineering annex, then define the triggers that would force a revision.
    Evidence: the one-page summary naming the top risks, the decisions required and the effort each needs; the
    engineering annex naming the modelled hosts, trust boundaries and the telemetry gaps from Module 5; the
    written revision triggers. Pass: the summary names at least three risks with a decision and an effort
    estimate each; the annex names at least three hosts and one trust boundary; at least three revision
    triggers are defined, each tied to a change that would alter the model.
  lab_range:
    template: red-vs-blue
    steps:
    - hosts: [jump01, blue01]
      action: Log on to jump01 over SSH, connect to blue01 and write the start time in your lab notes.
    - hosts: [blue01]
      action: Re-read the router ruleset on blue01 from Module 2 and record the trust boundaries your model
        claims, with the rule that enforces each.
    - hosts: [blue01, siem01]
      action: Re-check the telemetry recorded in Module 5 on siem01 and record the coverage gaps your summary
        will carry as open risks.
    - hosts: [blue01]
      action: Write the one-page summary for a delivery manager naming the top risks, the decision each needs
        and the effort each remediation takes.
    - hosts: [blue01]
      action: Write the engineering annex naming the modelled hosts and trust boundaries, then define at least
        three triggers that would require the model to be revised.
  refs:
  - nist-sp-800-218
  - nist-cswp-29
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: A team approves its threat model once, files it and moves on; eighteen months later the
        architecture bears no resemblance to it. What makes a model a living artefact instead?
      options:
      - A) Being stored in a shared document library
      - B) Revision whenever the design or threat landscape changes
      - C) One approval recorded at the start
      - D) Publication to the whole organisation
      answer: B
    - question: A delivery manager must decide which modelled risks to fund this quarter. What should the
        model's presentation to that manager emphasise?
      options:
      - A) The STRIDE category of every threat
      - B) Risk, the decisions required and the effort each needs
      - C) The notation of the data flow diagram
      - D) The identifiers of the mapped techniques
      answer: B
    - question: A mitigation for a spoofing threat was chosen in the review and a ticket was opened. When is
        the mitigation tracked as complete?
      options:
      - A) When the design approval is signed
      - B) When the ticket is created and assigned
      - C) When implementation is verified to work as modelled
      - D) When the project reaches handover and the vendor closes the ticket
      answer: C
    - question: A team maintains a threat model for its payment service. Which event is a genuine trigger for
        revising it?
      options:
      - A) A new external integration that adds a trust boundary
      - B) A new developer joining the team
      - C) A routine upgrade of the modelling tool
      - D) The calendar reaching the next quarter
      answer: A
    - question: 'A team argues threat modelling belongs inside the development workflow, not at the end.
      What is the strongest reason for that placement?'
      options:
      - A) It needs fewer people in the review and less scheduled time
      - B) It produces shorter documents
      - C) It lets the team skip design review
      - D) It lands while design decisions can still change cheaply
      answer: D
