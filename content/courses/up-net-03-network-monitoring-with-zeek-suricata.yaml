course_code: C515
title: Network Monitoring with Zeek & Suricata
version: '1.0'
difficulty: intermediate
duration_hours: 5
provenance: unsourced
status: draft
is_published: false
readiness: draft
prerequisites:
- C513
source:
  origin: TAZ upskilling catalogue v1 (2026-10-28)
  notes:
  - 'NICE work roles: Cyber Defense Analyst (PR-CDA-001).'
  - 'NIST CSF 2.0: DE.CM (Continuous Monitoring), DE.AE (Adverse Event Analysis).'
  - Self-paced upskilling, outside DP1/DP2.
