- C549
- C502
source:
  origin: TAZ upskilling catalogue v1 (2026-10-28)
  notes:
  - 'NICE work roles: Systems Security Analyst; Cybersecurity Risk Manager.'
  - 'NIST CSF 2.0: ID.RA; PR.IR; GV.RM.'
