modules:
- ordinal: 1
  title: Enterprise Incident Command
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Assign incident command roles and workstreams for a multi-team enterprise response and name the single executive interface
  - Record three response decisions made on incomplete information, each stating the information held, the assumptions made and the review trigger
  - Sustain a prolonged response by applying shift rotation, handover discipline and a reporting cadence that protects responder time
  topics:
  - Incident command structure for a large response; commander, workstream leads and scribes.
  - Decision records; the information held, the assumptions made and the review trigger.
  - Sustaining a prolonged response; shift rotation, handover discipline and responder welfare.
  - Escalation paths and the executive interface; one cadence and defined decision rights.
  - Revising conclusions as evidence emerges and communicating the change clearly.
  lab: >-
    Lab: On the large-enterprise range, stand up incident command for an active multi-host intrusion:
    assign the command roles and workstreams, record three decisions made on incomplete information, and set
    the executive reporting cadence. Evidence: the command structure naming the commander, each workstream lead
    and the open alerts each lead owns; three decision records, each stating the information held, the
    assumptions made and the review trigger; the executive cadence and the first handover time. Pass: every
    open alert is assigned to one lead; each decision record names its information, assumptions and review
    trigger; the cadence names a single interface role so responders are not interrupted directly.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01]
      action: Log on to jump01, open the incident queue on soar01 and record the start time and each open alert.
    - hosts: [jump01, siem01]
      action: >-
        From jump01, open siem01 and record which detection sources are reporting: the SIEM indexes, the
        network sensor on ids01 and the endpoint server edr01.
    - hosts: [jump01]
      action: Draft the command structure and record the commander, each workstream lead and the alerts that lead owns.
    - hosts: [jump01]
      action: Write three decision records for choices the scenario forces on incomplete information, each stating
        the information held, the assumptions made and the review trigger.
    - hosts: [jump01]
      action: Set the executive reporting cadence and the handover plan, and record the first handover time and owner.
    - hosts: [jump01]
      action: Mark each decision ready to execute or held pending evidence with a one-sentence reason, and name the
        decision to revisit first when new evidence arrives.
  refs:
  - nist-sp-800-61r3
  quiz:
    title: Quiz 1
    pass_threshold: 70
    questions:
    - question: Two hours into a ransomware response, the commander faces the decision to isolate the file server
        while finance closes its month-end run. Which record captures that decision best?
      options:
      - A) The isolation request ticket number
      - B) The name of the responder who objected
      - C) What was decided, the information held and the assumptions made
      - D) The final outcome for the file server once eradication had completed
      answer: C
    - question: A major incident runs into its eleventh day and responders are making errors from fatigue. Which
        command practice addresses this directly?
      options:
      - A) Shift rotation with disciplined handovers between shifts
      - B) Longer shifts to keep one experienced responder in charge
      - C) A second incident commander appointed in parallel
      - D) Fewer workstreams to track
      answer: A
    - question: During a major incident, executives keep telephoning the malware analyst directly for status
        updates. What does the command structure put in their place?
      options:
      - A) A public status page updated hourly
      - B) A defined reporting cadence through a single interface role
      - C) Silence until eradication is complete
      - D) Direct telephone lines from every executive to every workstream lead
      answer: B
    - question: New log evidence contradicts the team's conclusion that only two workstations were affected. What
        does incident command expect of the scope owner?
      options:
      - A) Keep the original conclusion in place until the incident closes
      - B) Escalate the question to threat attribution
      - C) Wait for the next scheduled executive report
      - D) Revise the conclusion and communicate the change clearly
      answer: D
    - question: A workstream lead must choose between rebuilding a server now and waiting for more evidence, and no
        further evidence exists. What belongs in the decision record?
      options:
      - A) Only the choice that was made
      - B) The decision, the information held and the assumptions made
      - C) Every dissenting opinion raised during the response call that day
      - D) The estimated cost of each choice alone
      answer: B
- ordinal: 2
  title: Scoping a Complex Compromise
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Scope a compromise across workstations, identity and cloud segments using indicator matches and adversary behaviours
  - Expand a compromise scope iteratively as new evidence emerges from telemetry and directory records
  - State confidence in scope completeness and name the evidence that would expand it
  topics:
  - Scoping methodology; indicators, behaviours and the assets that connect them.
  - Indicator-driven scoping from SIEM, endpoint and network telemetry.
  - Behaviour-driven scoping; the actions the adversary must have performed.
  - Iterative scope expansion as new evidence emerges.
  - Stating confidence in scope completeness and what would change it.
  lab: >-
    Lab: On the large-enterprise range, scope an active intrusion that began on one workstation: follow
    the indicator matches and the behaviours the adversary must have performed across the corporate, server
    and cloud segments, and state the confidence. Evidence: every host that matched the indicator, with its
    address and segment; the account, source address and time of each related sign-in on dc01; whether
    aadconnect01 synchronises any affected account into the cloud segment; a scope statement for each segment
    marked complete or incomplete with the confidence held. Pass: each matched host is listed with its segment;
    each segment is marked complete or incomplete with a one-sentence reason; the evidence that would expand
    the scope is named for every incomplete segment.
  lab_range:
    template: large-enterprise
    scenario: apt-nation-state
    steps:
    - hosts: [jump01]
      action: Log on to jump01, open the case on soar01 and record the initial indicator and the workstation that
        raised it.
    - hosts: [jump01, siem01]
      action: From jump01, search siem01 for every host that matched the indicator and record each host name,
        address and network segment.
    - hosts: [jump01, edr01]
      action: From jump01, open edr01 and record the process activity and network connections the endpoint agent
        captured on each matched host.
    - hosts: [jump01, dc01]
      action: From jump01, query dc01 for sign-ins by the affected account and record each source address and its
        time.
    - hosts: [jump01, aadconnect01]
      action: From jump01, read the aadconnect01 synchronisation records and record whether any affected account
        also exists in the cloud segment.
    - hosts: [jump01]
      action: Mark each segment complete or incomplete with a one-sentence reason, and name the evidence that would
        expand each incomplete segment.
  refs:
  - nist-sp-800-61r3
  - mitre-attack
  quiz:
    title: Quiz 2
    pass_threshold: 70
    questions:
    - question: Eradication ran on every host the SIEM flagged, and the same behaviour reappeared on two new
        servers the next morning. What did the scope miss?
      options:
      - A) The hosts' outstanding patch levels
      - B) The SIEM's log retention window
      - C) The team's recent change approvals
      - D) Footholds outside the indicator matches
      answer: D
    - question: A scoping team has every host matching a file-hash indicator but no picture of what the adversary
        did on them. Which addition makes the scope complete?
      options:
      - A) Behaviour-driven scoping from the actions the adversary must have performed
      - B) A faster SIEM with more storage for matches
      - C) More file-hash indicators from a vendor threat feed
      - D) A wider vulnerability scan of the whole subnet
      answer: A
    - question: During scoping, a cloud segment appears in the intrusion for the first time. What does the scope
        owner do before eradication proceeds?
      options:
      - A) Continue on the original scope plan unchanged
      - B) Close the alert as a duplicate entry
      - C) Reassess the scope and state the confidence held
      - D) Ask the cloud vendor to investigate it alone
      answer: C
    - question: >-
        Two analysts read the same sign-in records: one says the compromise is contained to a single
        workstation, the other counts three source addresses. What does the disagreement most need?
      options:
      - A) A larger alert queue for triage
      - B) A stated confidence in the current scope
      - C) Attribution of the three source addresses found
      - D) A new detection rule for sign-ins
      answer: B
    - question: An adversary's infrastructure changes every week, but each entry creates the same kind of rogue
        account. Why does indicator-only scoping fail against this pattern?
      options:
      - A) Indicators expire before ingestion finishes
      - B) Indicators cannot name user accounts
      - C) Behaviour persists while indicators change
      - D) Behaviour needs vendor tooling to see
      answer: C
- ordinal: 3
  title: Coordinated Eradication
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Plan simultaneous eradication across endpoints, identity and cloud so the adversary cannot re-establish access
  - Sequence credential, token and trust resets with host removal to close every foothold at once
  - Design post-eradication verification that hunts for the adversary's known behaviours instead of waiting for alerts
  topics:
  - Eradication planning at scale; scope, order and rollback.
  - Timing and simultaneity; denying the adversary observation and reaction.
  - Credential and trust reset; passwords, service accounts, tokens and key material.
  - Rebuild versus clean-in-place decisions for compromised hosts.
  - Verification by active hunting for known behaviours after the action.
  lab: >-
    Lab: On the large-enterprise range, plan a coordinated eradication for the scoped intrusion: order the
    removal and rebuild of every foothold across endpoints, identity and cloud, and set the credential and
    trust resets that execute at one moment. Evidence: each confirmed foothold with its host and evidence;
    the accounts the footholds used, including service accounts; which accounts aadconnect01 synchronises
    into the cloud segment; the eradication order marking each foothold rebuilt or cleaned; the single reset
    time; the behaviours the hunt must search for afterwards. Pass: every foothold appears in the order with
    a rebuild or clean decision; one reset time covers the corporate forest and the cloud segment; each
    action is marked simultaneous or staged with a one-sentence reason.
  lab_range:
    template: large-enterprise
    scenario: apt-nation-state
    steps:
    - hosts: [jump01, soar01]
      action: From jump01, open the case on soar01 and record each confirmed foothold with its host and the
        evidence that confirms it.
    - hosts: [jump01, dc01]
      action: From jump01, query dc01 for the accounts those footholds used and record each account name and
        whether it is a service account.
    - hosts: [jump01, aadconnect01]
      action: From jump01, read aadconnect01 and record which of those accounts synchronise into the cloud segment.
    - hosts: [jump01]
      action: >-
        Write the eradication order: mark each foothold rebuilt or cleaned, and record the single time every
        credential and trust reset executes.
    - hosts: [jump01, siem01]
      action: From jump01, prepare the post-eradication hunt on siem01 and record each adversary behaviour the
        hunt must search for after the action.
    - hosts: [jump01]
      action: Mark each planned action simultaneous or staged with a one-sentence reason, and state which staged
        action would let the adversary re-establish access.
  refs:
  - nist-sp-800-61r3
  - nist-sp-800-63-4
  quiz:
    title: Quiz 3
    pass_threshold: 70
    questions:
    - question: A response team removes the malware it found on Monday, cleans two more servers on Wednesday and
        the rest on Friday, and the same accounts reappear each time. Why?
      options:
      - A) The malware reinstalls itself without credentials
      - B) Staged removal lets the adversary observe each step and regain access
      - C) The antivirus signatures were stale
      - D) Removal requires domain administrator rights that the on-call team does not hold
      answer: B
    - question: The hosts are rebuilt from clean images, but the response plan leaves the service accounts
        untouched. What most likely follows?
      options:
      - A) Nothing, because the rebuilt hosts are all verified clean
      - B) A compliance finding at the next audit
      - C) Slower sign-ins for domain users
      - D) Rapid re-compromise using the retained credentials
      answer: D
    - question: The eradication plan covers the corporate forest and the subsidiary forest, both compromised.
        When should the credential resets across both forests execute?
      options:
      - A) Simultaneously, so neither forest can regain the other
      - B) One forest at a time to limit the operational risk involved
      - C) After monitoring confirms the first forest is clean
      - D) Whenever each forest owner becomes available
      answer: A
    - question: After eradication, no alerts have fired for two days. What does the response lead require before
        declaring success?
      options:
      - A) System uptime statistics collected for the rebuilt hosts
      - B) Closure of the incident ticket
      - C) Active hunting for the adversary's known behaviours
      - D) A vendor attestation of cleanliness
      answer: C
    - question: The plan resets every user password but keeps the same VPN pre-shared keys and inter-forest trusts.
        What does the plan miss?
      options:
      - A) Nothing material to eradication
      - B) Refresher training for all users plus a new awareness campaign
      - C) The patch baseline for rebuilt hosts
      - D) Other credential and trust material the adversary may hold
      answer: D
- ordinal: 4
  title: Recovery and Trust Restoration
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Sequence service restoration so identity trust is re-established before dependent services return
  - Prioritise rebuilds by business criticality and dependency order from an observed service inventory
  - Define heightened monitoring and business expectations for the period after recovery
  topics:
  - Recovery sequencing; identity trust before dependent services.
  - Rebuild strategy; verified sources, new credentials and validated configuration.
  - Prioritising rebuilds by business criticality and dependency order.
  - Re-establishing trust in identity, certificates and shared credentials.
  - Heightened monitoring and business expectation management after recovery.
  lab: >-
    Lab: On the large-enterprise range, plan the recovery after eradication: build the inventory from what
    the range reports, order the rebuilds so identity trust returns before dependent services, and set the
    heightened monitoring that follows. Evidence: the hosts and services reporting into siem01; the domain
    accounts, service accounts and computer trusts on dc01; the ca01 certificates for the affected servers,
    with each expiry; the rebuild order with each service's criticality and dependencies; the heightened
    monitoring rules and what they must alert on. Pass: identity trust precedes every dependent service in
    the order; each service is marked safe to return or held with a one-sentence reason; the expectation
    message for one held service names its owner and next review time.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01, siem01]
      action: From jump01, record from siem01 which hosts and services are reporting, so the recovery inventory
        starts from observed state.
    - hosts: [jump01, dc01]
      action: From jump01, record from dc01 the domain accounts, service accounts and computer trusts that exist
        for the affected segment.
    - hosts: [jump01, ca01]
      action: From jump01, record from ca01 the certificates the affected servers hold and the expiry date of each
        one.
    - hosts: [jump01]
      action: >-
        Write the rebuild order: record each service with its criticality, its dependencies and whether
        trust is re-established before it returns.
    - hosts: [jump01, siem01]
      action: From jump01, define the heightened monitoring rule set on siem01 and record which repeat-access
        attempts it must alert on.
    - hosts: [jump01]
      action: Mark each service safe to return or held with a one-sentence reason, and state the expectation
        message for the service owner whose return is held.
  refs:
  - nist-sp-800-61r3
  - nist-sp-800-63-4
  quiz:
    title: Quiz 4
    pass_threshold: 70
    questions:
    - question: After a domain compromise, the recovery team restores the finance application first and points it
        at the directory that eradication has not yet cleared. What is wrong with that sequence?
      options:
      - A) Finance applications should always be rebuilt last during a recovery
      - B) The application needs new hardware before returning
      - C) Restoring services before identity trust is re-established
      - D) Nothing, provided the backups verified cleanly
      answer: C
    - question: Executives press the recovery team to restore the customer portal tonight, before the directory
        rebuild is verified. What does that pressure risk?
      options:
      - A) A budget increase for the recovery
      - B) Unsafe shortcuts in the rebuild sequence
      - C) More accurate status reporting to customers
      - D) Faster notifications to affected customers
      answer: B
    - question: Twenty systems need rebuilding and the incident commander asks for the order. What sets the
        rebuild queue?
      options:
      - A) Alphabetical order by host name and network segment
      - B) Whichever team becomes available first
      - C) The age of each system
      - D) Business criticality and dependency order
      answer: D
    - question: A rebuilt server is declared clean on the strength of a single antivirus scan run against its old
        image. Why is trust in it not established?
      options:
      - A) Trust comes from verified sources and validated configuration
      - B) Antivirus scans are unreliable as the sole evidence on a rebuilt server
      - C) The server should have been renamed first
      - D) A scan proves the image is current
      answer: A
    - question: The environment is recovered and the response lead keeps heightened monitoring in place. What is
        that monitoring watching for?
      options:
      - A) Baseline configuration drift on rebuilt hosts
      - B) Expiry of security tool licences
      - C) Residual or repeat access attempts after eradication
      - D) Failures in the backup job schedule during the recovery window
      answer: C
- ordinal: 5
  title: Crisis Communication and Stakeholders
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Draft holding statements for staff, customers, regulators and media that acknowledge without speculating
  - Extract reportable facts, times and affected systems from response records for legal and regulatory coordination
  - Plan a communication cadence that keeps internal staff informed and protects external credibility
  topics:
  - Crisis communication planning and the holding statement.
  - Legal and regulatory coordination; obligations, timelines and one voice.
  - Public and customer communication; certainty, retraction and credibility.
  - Internal communication during a breach; informed staff speculate less.
  - Attribution in public; why early naming carries legal and diplomatic risk.
  lab: >-
    Lab: On the large-enterprise range, build the communication plan for the breach from the facts the
    response records hold: separate established fact from unsupported claim, draft holding statements for
    the first 24 hours, and set who owns each audience. Evidence: every reportable fact with its time and
    source; the first detection and containment times and the affected host count from siem01; each
    unsupported claim, with the evidence that would confirm it; one holding statement each for staff,
    customers and regulators; the 24-hour update cadence and each audience's owner. Pass: each statement
    uses only recorded facts; each is marked fact-only or speculative with a one-sentence reason; the line
    to remove before release is named for any speculative statement.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01, soar01]
      action: From jump01, open the case on soar01 and record every reportable fact with the time and the source
        that establishes it.
    - hosts: [jump01, siem01]
      action: From jump01, record from siem01 the first detection time, the containment time and the number of
        hosts affected.
    - hosts: [jump01]
      action: Separate the recorded facts from claims not yet supported, and record for each unsupported claim the
        evidence that would confirm it.
    - hosts: [jump01]
      action: Draft one holding statement each for staff, customers and regulators, using only the recorded facts
        and naming no unconfirmed cause.
    - hosts: [jump01]
      action: Set the update cadence for the first 24 hours and record the owner of each audience.
    - hosts: [jump01]
      action: Mark each statement fact-only or speculative with a one-sentence reason, and name the line to remove
        before release.
  refs:
  - nist-sp-800-61r3
  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: A retailer confirms an intrusion at 09:00 but cannot yet say what data was taken. What does its
        first public statement do?
      options:
      - A) Describes the attacker's most likely country of origin for reporters
      - B) Acknowledges the situation credibly while facts are established
      - C) Promises a full technical report tonight
      - D) Denies that any incident occurred
      answer: B
    - question: A spokesperson tells reporters the stolen data was encrypted and therefore safe; three days later
        unencrypted copies surface. What is the cost of that early certainty?
      options:
      - A) Faster media cycles for a week
      - B) Regulator fines and nothing else
      - C) Reassured customers and reporters in the short term
      - D) A public retraction that damages credibility
      answer: D
    - question: Front-line staff learn of the breach from a customer's social media post and begin speculating to
        callers. Which communication failure caused this?
      options:
      - A) Internal staff were not informed early with approved facts
      - B) The media statement was too short and too technical for callers
      - C) The regulators were notified too late
      - D) The executives were briefed too often
      answer: A
    - question: A regulator's 72-hour notification window opens in the middle of eradication. Who owns the
        notification and its timeline?
      options:
      - A) The media relations team
      - B) Whichever analyst is free first
      - C) Legal counsel, with the obligations and timelines tracked
      - D) The customer service desk, which handles most customer conversations
      answer: C
    - question: A journalist asks which country the attacker came from; the evidence points nowhere yet. Why does
        the response team decline to speculate?
      options:
      - A) Attribution is a matter for police investigators only, not for companies
      - B) Early attribution is often wrong and carries legal and diplomatic risk
      - C) Speculation helps the attacker hide
      - D) Journalists cannot verify technical claims
      answer: B
- ordinal: 6
  title: Programme-Level Learning
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Analyse incident records in aggregate to expose systemic causes that no single incident shows
  - Propose organisational changes for a shared root cause and name the sponsor level able to enact each
  - Define improvement measures from detection and containment times and repeat root causes
  topics:
  - Systemic analysis; why the incident was possible, not only what happened.
  - Reading incident records in aggregate for recurring patterns.
  - Organisational change; sponsorship able to alter process, resourcing or structure.
  - Trend analysis across incidents and repeat root causes.
  - Measuring improvement; detection and containment times, repeat causes and reporting quality.
  lab: >-
    Lab: On the large-enterprise range, turn the incident into programme learning: measure how the response
    performed, find the systemic gaps behind the timeline, and propose changes with a sponsor and a measure
    for each. Evidence: the detection-to-containment time and the alerts raised before review, from siem01;
    each case-history decision dependent on missing telemetry or an unclear owner; each gap classified as
    tooling, process or ownership; one organisational change per gap, with its sponsor level; the siem01
    measures for detection time, containment time and repeat root causes. Pass: each gap is classified with
    a one-sentence reason; each change names a sponsor level able to change process or resourcing; each
    change is ranked by expected effect on the measures.
  lab_range:
    template: large-enterprise
    steps:
    - hosts: [jump01, siem01]
      action: From jump01, record from siem01 the time from first detection to containment and the number of
        alerts raised before review.
    - hosts: [jump01, soar01]
      action: From jump01, open the case history on soar01 and record each decision that depended on missing
        telemetry or an unclear owner.
    - hosts: [jump01]
      action: Classify each recorded gap as tooling, process or ownership, and state which other incidents the
        same gap would explain.
    - hosts: [jump01]
      action: Propose one organisational change per gap and record the sponsor level able to enact each change.
    - hosts: [jump01, siem01]
      action: >-
        From jump01, define on siem01 the measures that show improvement: detection time, containment time
        and repeat root causes.
    - hosts: [jump01]
      action: Rank the proposed changes by expected effect on the measures, with a one-sentence reason for each
        rank.
  refs:
  - nist-sp-800-61r3
  - nist-cswp-29
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: Five incidents in a year each received a clean root-cause fix, yet the same class of failure keeps
        recurring. What does analysing them together reveal?
      options:
      - A) The identity of the attacker
      - B) Individual analyst error in each case, five times running
      - C) A systemic pattern invisible in any single incident
      - D) A tooling licence due for renewal
      answer: C
    - question: The post-incident review shows patching failed because no team owned exception tracking. What does
        the recommended change need in order to succeed?
      options:
      - A) Sponsorship able to change process and ownership
      - B) A faster patch tool with a new licence and more storage
      - C) A larger incident response team
      - D) A new dashboard for metrics
      answer: A
    - question: The same file-share permission error appears in three separate incidents across the year. What does
        that recurrence indicate about the earlier remediation?
      options:
      - A) Detection and reporting improved between the incidents
      - B) Targeting of the organisation increased
      - C) The recurrence is coincidence
      - D) It addressed symptoms rather than the cause
      answer: D
    - question: A response programme wants evidence that its capability is improving year over year. Which measure
        shows that best?
      options:
      - A) The total number of security incidents reported to the programme each year
      - B) Reduced detection and containment times with fewer repeat causes
      - C) The volume of alerts raised each month
      - D) The headcount of the response team
      answer: B
    - question: After a training push, reported incidents drop by half. Why does the programme hold off celebrating?
      options:
      - A) Training always reduces the number of incidents a programme receives
      - B) The measure is incapable of falling
      - C) Incident reports are never incomplete
      - D) The drop may reflect degraded detection or reporting
      answer: D
