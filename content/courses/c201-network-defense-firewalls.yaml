modules:
- ordinal: 1
  title: Defensive Architecture
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Map the trust zones of a described network and the boundary each pair of zones shares
  - Classify sample traffic as north-south or east-west and name the boundary each flow crosses
  - Select the control for each boundary of a layered design and justify the placement
  topics:
  - 'Defence in depth applied to networks: layers, failure and independence.'
  - Trust zones, common security policy and boundary placement.
  - North-south traffic at the edge versus east-west traffic inside the boundary.
  - Perimeter erosion from remote access, cloud services and lateral paths.
  - Reading a firewall rule set as a map of the zone boundaries.
  lab: >-
    Lab: On the medium-enterprise range, map the trust zones fw01 serves, record which boundaries
    carry an explicit control and judge whether the default-deny design covers the rest.
    Evidence: the name of each fw01 interface and the zone it serves; each fw01 rule in order with
    its source zone, destination zone and ports; the observed result when a workstation touches a
    service no rule allows; whether workstation-to-workstation traffic inside one zone crosses any
    fw01 boundary. Pass: every zone named with its interface; each inter-zone rule recorded with
    source and destination; the default action stated as observed, not assumed; each boundary marked
    "explicit control" or "default deny only"; the workstation-to-workstation finding stated as
    observed.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [ws01]
      action: Log on to ws01 with the account your instructor assigned, open a terminal and note the start time.
    - hosts: [fw01]
      action: Open the firewall configuration interface and record the name of each network interface and
        the zone it serves.
    - hosts: [fw01]
      action: List the rules on fw01 in order and record, for each, the source zone, the destination zone
        and the ports it allows.
    - hosts: [ws01, web01]
      action: From ws01, try to open one service on web01 that no fw01 rule allows and record whether the
        connection succeeds, is refused or times out.
    - hosts: [ws01, ws02]
      action: From ws01, open one shared service on ws02 and record whether the connection succeeds and
        whether any fw01 interface or rule appears on that path.
    - hosts: [ws01]
      action: Mark each zone boundary "explicit control" or "default deny only" from your recorded rules,
        and state whether workstation-to-workstation traffic inside one zone crosses any fw01 boundary
        or control.
  refs:
  - nist-sp-800-41r1
  - nist-sp-800-207
  quiz:
    title: Quiz 1
    pass_threshold: 70
    questions:
    - question: Two departments on one firewall follow separate rule sets, and a third follows neither. What
        makes each group a trust zone?
      options:
      - A) A shared VLAN number and subnet
      - B) A common security policy and trust level
      - C) The same physical equipment room and cabling
      - D) A shared default gateway address and mask
      answer: B
    - question: 'A workstation copies a file to a server on the same internal network. In direction vocabulary,
        this traffic is:'
      options:
      - A) East-west, because both systems sit inside the same boundary
      - B) North-south, because it crosses a firewall
      - C) North-south, because servers rank above workstations in every model
      - D) East-west, because the copy leaves the site
      answer: A
    - question: A control inspects traffic between the user zone and the server zone. Where does that control
        belong?
      options:
      - A) At the boundary the two zones share
      - B) On the users' workstations only, enforced by local policy
      - C) On the server's backup job
      - D) At the internet edge only
      answer: A
    - question: A company added remote access and a cloud service outside its firewall. What did this do to
        the perimeter?
      options:
      - A) It grew stronger, because more security services now exist at the edge
      - B) It eroded, because traffic now enters without crossing it
      - C) Nothing changed, because the firewall still runs
      - D) It disappeared completely, along with the network
      answer: B
    - question: An attacker who breaches the edge firewall still faces segmentation and host hardening inside.
        Which property of layered defence does this show?
      options:
      - A) Each layer is perfect on its own and never needs the others
      - B) Every layer must come from one vendor to work at all
      - C) Any single layer can fail and the others still constrain the attacker
      - D) Detailed logging can replace the inner layers of the whole design
      answer: C
- ordinal: 2
  title: Firewall Technologies
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Distinguish packet filtering, stateful inspection and application-layer inspection by what each examines
  - Select a firewall technology for a stated service, placement and performance requirement
  - Explain what a next-generation firewall adds and where identity-aware rules change the access decision
  topics:
  - Packet filters, state tables and the cost of connection tracking.
  - Application proxies and deep inspection of payloads.
  - Next-generation features, application awareness and identity.
  - Encryption, lost visibility and inspection performance trade-offs.
  lab: >-
    Lab: On the medium-enterprise range, show on fw01 what stateful inspection allows without a rule
    and what an application-aware decision adds to a port-only rule. Evidence: the fw01 rule that
    carries the connection from ws01 to web01, with its ports; the fields the state table entry
    records while the session runs; one session detail those fields do not show; the observed result
    when ws01 reopens the web service over HTTPS, a second port the same rule allows. Pass: the
    carrying rule recorded with its ports; the state table entry's fields and one session detail
    outside them recorded; the HTTPS result recorded as allowed or refused; one sentence naming each
    observation's technology and what an application-aware firewall inspects that the port-only rule
    never sees.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [ws01]
      action: Log on to ws01 with the account your instructor assigned and note the workstation's zone.
    - hosts: [fw01]
      action: On fw01, record the rule and its ports that carry corporate zone traffic to the dmz zone.
    - hosts: [ws01, web01]
      action: From ws01, open the web service on web01, keep the session open, and record the fields
        of the matching entry in fw01's state table.
    - hosts: [ws01, web01]
      action: While the session stays open, record one thing the session carries that the entry shows
        nothing about, such as the page the web service returns.
    - hosts: [ws01, web01]
      action: From ws01, open the web service on web01 again over HTTPS on port 443, a second port the
        same rule allows, and record whether it succeeds.
    - hosts: [ws01]
      action: Name the firewall technology each recorded observation demonstrates, and write one
        sentence on what an application-aware firewall inspects that the port-only rule never sees.
  refs:
  - nist-sp-800-41r1
  quiz:
    title: Quiz 2
    pass_threshold: 70
    questions:
    - question: A workstation opens a web session through a stateful firewall and the server's reply arrives.
        Why is the reply allowed with no rule of its own?
      options:
      - A) The firewall trusts every packet that comes from any internal server
      - B) The rule set holds a mirror rule for replies
      - C) The open connection's entry in the state table matches the reply
      - D) Replies are exempt from filtering by convention
      answer: C
    - question: A security team must stop file uploads that hide inside allowed web traffic. Which firewall
        design examines that traffic most closely?
      options:
      - A) A port-based packet filter at the edge
      - B) An application proxy that reassembles the session
      - C) A stateful filter tracking connections
      - D) A router access list on the boundary router at the edge
      answer: B
    - question: Most traffic to a software service is encrypted end to end. What does this most limit on a
        firewall that does not terminate the session?
      options:
      - A) Decisions made on the address and port of each packet
      - B) Tracking of the connection's state
      - C) Selection of the outbound route
      - D) Inspection of the payload inside the session
      answer: D
    - question: A firewall's rated throughput halves after administrators enable full application inspection.
        What does this change most likely show?
      options:
      - A) The feature licence has expired
      - B) Inspection costs processing that caps throughput
      - C) The rule set was emptied during the change
      - D) The state table was cleared at the same time as the change
      answer: B
    - question: A rule allows the finance group's laptops to reach one payroll service, whatever address they
        use. What makes that decision possible?
      options:
      - A) Port mirroring to the payroll service
      - B) Network address translation on the edge
      - C) The firewall binding policy to authenticated identity
      - D) An address reservation on the DHCP server
      answer: C
- ordinal: 3
  title: Rule Design and Policy Management
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Write firewall rules that express default deny and least privilege for a stated service
  - Order and document a rule set so every permit has an owner, a reason and a review date
  - Identify shadowed, redundant and over-broad rules in a supplied rule set and propose removals
  topics:
  - Default deny and explicit, specific permits.
  - First-match rule order and how earlier permits shadow later ones.
  - Rule documentation, ownership and review dates.
  - Redundant, expired and over-broad permits in a rule set.
  - Logging a rule's matches before removing it.
  lab: >-
    Lab: On the medium-enterprise range, audit fw01's rule set against this policy: workstations may
    reach the server zone for domain services only, and only the management zone may administer any
    host. Evidence: each fw01 rule in order with its source, destination and ports; each rule marked
    "in policy" or "over-broad" with a one-sentence reason; the rule you would not remove before
    logging its matches. Pass: all rules recorded in order; every rule marked with a reason; one
    change proposed for each over-broad rule; one rule named that needs logged matches before removal.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [fw01]
      action: Open the rule set on fw01 and record every rule in order with its source, destination, ports
        and action.
    - hosts: [ws01, fs01]
      action: From ws01, open the file share on fs01 and record whether the connection succeeds, noting
        which rule carries it.
    - hosts: [fw01]
      action: Record the port list of the corp-to-servers rule that carried the share, and note which
        ports the file share on fs01 actually needs.
    - hosts: [fw01]
      action: Open the rule log on fw01 and record which rule the logged connection from the ws01
        file-share test matched.
    - hosts: [fw01]
      action: Mark each rule "in policy" or "over-broad" against the stated policy with a one-sentence
        reason, propose one change for each over-broad rule, and name the rule that needs logged
        matches before removal.
  refs:
  - nist-sp-800-41r1
  quiz:
    title: Quiz 3
    pass_threshold: 70
    questions:
    - question: A rule set permits web traffic to any server in line 1 and permits web traffic to one named
        server in line 3. What happens to web traffic sent to that server?
      options:
      - A) Line 3 decides, because it is more specific
      - B) The earlier general permit matches first, so line 3 never applies
      - C) Both rules log a match for the same packet, and both permits apply
      - D) The firewall asks an administrator which rule to apply
      answer: B
    - question: A new file service is installed and no firewall rule names it. Under a default-deny design,
        what happens to its traffic?
      options:
      - A) It is allowed until the next review
      - B) It is allowed inside its own zone only, until a rule names it
      - C) It is dropped and logged by the default action
      - D) It is allowed for domain members only
      answer: C
    - question: Which record best supports removing a permit rule at its next review?
      options:
      - A) A business justification, an owner and a review date
      - B) The name of the engineer who typed it
      - C) The creation timestamp alone
      - D) The interface it was entered on and the session that entered it
      answer: A
    - question: A rule allows the user zone every port to the server zone because one application needed two
        ports. What is the soundest finding?
      options:
      - A) The rule is efficient and should stay as written, since it carries the two ports the
        application needs and nothing more
      - B) The rule needs a longer review period, not a change
      - C) The server zone should be merged into the user zone
      - D) The permit is broader than the need and should be narrowed to the ports the application uses
      answer: D
    - question: An undocumented permit rule has no owner and no justification. What is the safest next step?
      options:
      - A) Delete it at once and watch for complaints
      - B) Log its matches for a review period first
      - C) Broaden it so neighbouring services are covered too
      - D) Copy it onto the second firewall for symmetry
      answer: B
- ordinal: 4
  title: Intrusion Detection and Prevention
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Distinguish signature-based, anomaly-based and behavioural detection by what each needs and finds
  - Position sensors so the traffic a policy cares about crosses an observation point
  - Tune a detection rule so a near miss stops alerting without losing the true match
  topics:
  - Signatures, anomalies and baselines of normal behaviour.
  - Sensor placement, observation points and visibility gaps.
  - Inline prevention versus passive detection and how each fails.
  - False positives, suppression and documented tuning.
  lab: >-
    Lab: On the medium-enterprise range, find which network traffic the SIEM on siem01 actually
    observes and where its blind spots are. Evidence: the log sources siem01 receives, each with its
    host; the result of searching the SIEM for one connection you generated between two workstations;
    one traffic path on the range that the search cannot see, with the observation point or log
    source it lacks. Pass: the log
    sources recorded as observed, not assumed; each source's host named; one visibility gap stated
    with the path or missing source that explains it; one sensor or log source proposed to close it.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 with the analyst account your instructor assigned and open the log search.
    - hosts: [siem01]
      action: List the log sources the SIEM receives and record each source with the host it comes from.
    - hosts: [ws01, ws02]
      action: From ws01, open a shared folder on ws02 to generate ordinary east-west traffic and note the
        time.
    - hosts: [siem01]
      action: Search the SIEM for records of that connection and record whether the search finds it, with
        the time you noted.
    - hosts: [siem01, fw01]
      action: Judge each recorded traffic path "observed in the SIEM" or "not observed", state which
        observation point or log source the unobserved path lacks, and propose one sensor placement
        or log source that would close the largest gap.
  refs:
  - nist-sp-800-94
  - sigma
  quiz:
    title: Quiz 4
    pass_threshold: 70
    questions:
    - question: An anomaly-based detector raises an alert for a weekly backup job that ran at double its
        usual volume. What does this alert most likely reflect?
      options:
      - A) A match against a stored signature
      - B) A failure of the sensor that saw it
      - C) Inline prevention engaging on the transfer in real time
      - D) Behaviour that fell outside the learned baseline
      answer: D
    - question: A network sensor watches only the link between the edge firewall and the internet. Which
        activity is it blind to?
      options:
      - A) Inbound scanning arriving from outside
      - B) Lateral movement between two internal servers
      - C) Outbound traffic leaving for the internet
      - D) Nothing, because placement does not change visibility
      answer: B
    - question: An intrusion prevention system is placed inline in front of a payment service. Which new
        operational risk does that placement create?
      options:
      - A) A filtering error can stop the payment service itself
      - B) The system can no longer read the payloads it sees
      - C) Its alerts arrive too late to act on
      - D) The deployment removes the need for a behaviour baseline
      answer: A
    - question: A detection rule fires nightly on the documented backup transfer. After confirming the
        schedule, what is the soundest action?
      options:
      - A) Disable the sensor that raises the alert
      - B) Delete the rule so the alert cannot return
      - C) Suppress that known pattern with a documented reason and a review date
      - D) Raise the alert threshold for every rule on the sensor so the noise stops everywhere
      answer: C
    - question: An intrusion uses a technique that no existing signature describes. What can signature-based
        detection do about it?
      options:
      - A) Detect it by comparing against the behaviour baseline
      - B) Detect it by inspecting the ports more closely
      - C) Detect it once a matching signature is deployed
      - D) Detect it at once, because signatures update themselves
      answer: C
  po:
    qsp_code: ALJQ
    po_code: PO_007
- ordinal: 5
  title: Network Access Control and Segmentation
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Explain how port-based access control authenticates a device before the network grants access
  - Design segmentation that contains a compromised workstation and name the enforcement points it uses
  - Apply zero trust decision and enforcement points to a stated network access decision
  topics:
  - Port-based authentication with 802.1X and supplicants.
  - Segmentation strategies and their enforcement points.
  - Policy decision points and policy enforcement points.
  - Continuous verification as context and risk change.
  - Lateral movement paths a flat network leaves open.
  lab: >-
    Lab: On the medium-enterprise range, find which lateral paths a workstation on the corporate zone
    already has and judge them against containment. Evidence: the result of a connection test from
    ws01 to fs01 and of one from ws01 to a dmz service outside the web and mail ports; the fw01 rules
    that permit or deny each; one proposed enforcement point that would contain a compromised
    workstation. Pass: each test recorded as allowed or refused as observed; each path tied to the
    rule or default action that decides it; one containment change proposed with its enforcement
    point named.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [ws01]
      action: Log on to ws01 with the account your instructor assigned and note the zone the workstation
        sits in.
    - hosts: [ws01, fs01]
      action: From ws01, open the file share on fs01 and record whether the connection succeeds, noting
        which zone fs01 sits in.
    - hosts: [ws01, web01]
      action: From ws01, try one service on web01 outside the web and mail ports and record whether the
        connection succeeds, is refused or times out.
    - hosts: [fw01]
      action: On fw01, record each rule that carries corporate zone traffic, with its destination zone and
        port list, and note which paths the default action denies.
    - hosts: [ws01]
      action: Mark each corporate-to-other-zone path "contained by a specific permit", "over-broad" or
        "denied", and propose one enforcement point that would contain a compromised workstation with
        least disruption to other zones.
  refs:
  - nist-sp-800-207
  - nist-sp-800-41r1
  quiz:
    title: Quiz 5
    pass_threshold: 70
    questions:
    - question: A switch port stays closed until the device attached to it authenticates. Which mechanism
        performs this?
      options:
      - A) DHCP snooping on the same switch
      - B) Port-based network access control on the port
      - C) VLAN tagging on the uplink
      - D) Dynamic address inspection on the router at the edge
      answer: B
    - question: A zero trust access request is evaluated and refused before any traffic is forwarded. Which
        component refused it?
      options:
      - A) The policy enforcement point
      - B) The resource itself
      - C) The policy decision point
      - D) The supplicant on the device
      answer: C
    - question: A workstation in the user zone is compromised. Which segmentation design most limits what it
        can reach next?
      options:
      - A) One flat switched network for every host
      - B) Least-privilege rules between user and server zones
      - C) A larger address range with fewer subnets in total
      - D) Encryption of all workstation traffic in transit
      answer: B
    - question: Why does a flat network make an intrusion worse once one host is compromised?
      options:
      - A) One compromised host can reach every other host on the same network
      - B) The network can no longer hand out addresses automatically to new hosts
      - C) Traffic slows as more hosts join the network
      - D) The network hides which zone each host belongs to
      answer: A
    - question: A user's laptop moves from the office network to an unmanaged home network during a session.
        Under continuous verification, what happens to the session's access?
      options:
      - A) It is re-evaluated against the new context and risk
      - B) It continues unchanged until the user logs out
      - C) It was granted once and permanently at login, and never revisited
      - D) It is decided by the access switch alone
      answer: A
- ordinal: 6
  title: Defensive Operations and Response
  content_type: reading
  duration_minutes: 60
  is_required: true
  pass_threshold: 70
  objectives:
  - Monitor network defences for coverage and confirm each control still sees the traffic it assumes
  - Select a containment action for a network intrusion, weighing evidence loss against adversary awareness
  - Feed what an incident revealed back into rule and detection tuning
  topics:
  - Control health, coverage and the traffic a control is assumed to see.
  - Containment options and their evidence trade-offs.
  - Blocking, sinkholing and rate limiting compared.
  - Post-incident tuning of rules and detections.
  lab: >-
    Lab: On the medium-enterprise range, review the network evidence the SIEM holds for the incident
    window your instructor names and choose containment for the outbound connection flagged in it.
    Evidence: the log types the window holds and the hosts each covers; the source and destination of
    the flagged connection and the fw01 rule or default action that carried it; what blocking,
    sinkholing and rate limiting each preserve and stop. Pass: the flagged connection recorded with
    source, destination and deciding rule; each containment option recorded with what it preserves
    and what it stops; one option recommended with its trade-off stated.
  lab_range:
    template: medium-enterprise
    steps:
    - hosts: [siem01]
      action: Log on to siem01 with the analyst account your instructor assigned and open the log search
        for the incident window your instructor names.
    - hosts: [siem01]
      action: Record which log types the incident window holds and which hosts each type covers, as
        observed in the log search.
    - hosts: [siem01]
      action: Find the outbound connection from ws01 your instructor flagged and record its source,
        destination and the fw01 rule or default action that carried it.
    - hosts: [fw01]
      action: On fw01, record what the appliance offers for blocking, redirecting and rate limiting
        outbound traffic, with one note per capability.
    - hosts: [siem01]
      action: Recommend one containment option for the flagged connection and state what it preserves,
        what it stops and what it tells the adversary.
  refs:
  - nist-sp-800-61r3
  - nist-sp-800-94
  quiz:
    title: Quiz 6
    pass_threshold: 70
    questions:
    - question: Analysts confirm an active command-and-control channel from one workstation, but its full
        scope is unknown. What does blocking it at once risk?
      options:
      - A) Destroying the disk evidence on the workstation
      - B) Alerting the adversary and ending visibility before the scope is known
      - C) Breaking the log pipeline that carries network event records to the SIEM
      - D) Nothing, because blocking is always the first step
      answer: B
    - question: A team redirects a malware family's destination domain to a host they control for
        observation. What is this technique called?
      options:
      - A) Sinkholing
      - B) Rate limiting
      - C) Alert suppression
      - D) Behaviour baselining
      answer: A
    - question: A team wants to confirm its network defences still work as assumed. Which question does
        control coverage monitoring answer?
      options:
      - A) How much bandwidth the edge firewall uses at its busiest peak hours
      - B) Whether each control still sees the traffic it is assumed to see
      - C) Who owns each rule in the rule set
      - D) What the licences for each control cost
      answer: B
    - question: Six months after an intrusion, what should drive the changes made to the rule set and
        detections?
      options:
      - A) The vendor's release notes for each product in the network stack
      - B) The alert volume measured over the period
      - C) What the incident revealed about detection and prevention gaps
      - D) The budget calendar for the next fiscal year
      answer: C
    - question: Which containment option stops suspicious outbound activity at once while also ending the
        visibility the team was using to measure its scope?
      options:
      - A) Immediate blocking, which stops the activity but ends the observation
      - B) Sinkholing, which contains the traffic while keeping observation
      - C) Rate limiting, which slows the activity without stopping it
      - D) Alert suppression, which silences the alert but not the activity
      answer: A
