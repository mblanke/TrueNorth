# Microsoft Visual C++ 2015-2026 Redistributable (14.x), x86 AND x64: a 64-bit Windows
# needs both for 32- and 64-bit programs. Replaces the community "vcredist140" wrapper,
# which downloads both from download.visualstudio.microsoft.com at install time.
#
# Also what makes `wireshark` offline-ready: the community wireshark package embeds its
# installer but depends on vcredist140, and this package (higher version, same id)
# satisfies that dependency from the depot.
#
# sha256: computed 2026-10-03; Microsoft puts the same hash in the download path.
# Update: take the new URLs and hashes from the community vcredist140 package's
# tools/data.ps1, or from https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist.
name: vcredist140
version: "14.51.36247"
revision: 1
title: Microsoft Visual C++ Redistributable 2015-2026 (TrueNorth offline)
authors: Microsoft
type: exe
silent_args: /install /quiet /norestart
# 1638: a newer version is already installed.
valid_exit_codes: [0, 1638, 1641, 3010]
