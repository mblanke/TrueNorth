# Verified reference library for authored course content.
#
# Every reference cited by any file in content/courses/ MUST appear here, and
# tests/api/test_course_content_ingest.py enforces that. This exists because the
# fleet-authored draft that seeded this content invented citations: it cited
# NISTIR 8286 as "Securing the Internet of Things" (it is "Integrating
# Cybersecurity and Enterprise Risk Management"), NIST SP 800-183 as "IoT Threat
# Landscape 2024" (it is "Networks of 'Things'", 2016), and OWASP IoT Top 10
# items as "T1/T9" (they are I1-I10; I9 is Insecure Default Settings).
#
# Each entry below was resolved against the publisher on the date in `verified`.
# Do NOT add an entry without opening the URL and confirming title and year.

verified: '2026-08-19'

