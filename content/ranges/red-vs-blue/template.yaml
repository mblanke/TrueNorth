# ─── DEPLOYMENT ───────────────────────────────────────────────────────
deployment:
  strategy: split_across_nodes

  node_assignment:
    coyote:
      vm_count: 19
      roles:
        - jump_host           # jump01
        - scoreboard          # score01
        - siem                # siem01
        - log_relay           # relay01
        - network_ids         # nids01
        - domain_controller   # dc01
        - certificate_authority  # ca01
        - blue_analyst        # blue01–05
        - red_c2              # red-c2-01
        - red_operator        # red-op01–03
        - red_phishing        # red-phish01
        - firewall            # fw01
        - ids_sensor          # ids01
      total_vcpu: 40
      total_ram_gb: 84

    acme:
      vm_count: 21
      roles:
        - web_server          # web01, web02
        - mail_gateway        # mx01
        - reverse_proxy       # rproxy01
        - vpn_gateway         # vpn01
        - domain_controller   # dc02
        - database_server     # db01
        - file_server         # fs01
        - mail_server         # exch01
        - backup_server       # bak01
        - web_application     # webapp01
        - workstation         # ws01–04, lnx01–02
        - firewall            # fw02
        - router              # rtr01
        - traffic_generator   # tgen01
        - honeypot            # honey01
      total_vcpu: 40
      total_ram_gb: 76

  totals:
    vms: 40
    vcpu: 80
    ram_gb: 160
    disk_gb: 1092

# ─── POLICIES ─────────────────────────────────────────────────────────
policies:
  egress: restricted
  east_west: segmented_by_vlan