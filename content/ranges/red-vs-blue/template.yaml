# ═══════════════════════════════════════════════════════════════════════════
#  TrueNorth Range Template — Red vs Blue Cyber Exercise
#  40 VMs · 80 vCPU · 160 GB RAM · ~1.1 TB disk
#  Designed for 2-node Proxmox cluster (coyote + acme)
# ═══════════════════════════════════════════════════════════════════════════
id: red-vs-blue
name: Red vs Blue Cyber Exercise
version: "2.0"
description: |
  Full Red vs Blue cyber exercise range. Blue Team defends a simulated
  enterprise network (AD, email, web, DB, SIEM) while Red Team operates
  from an isolated attack enclave. A neutral management zone provides
  scoring, C2 logging, and jump-box access for exercise control.
  40 VMs split across two Proxmox nodes with six isolated VLANs.
author: TrueNorth Range
difficulty: advanced
vm_count: 40

inputs:
  range_id: string
  cidr_mgmt:   "10.0.0.0/24"
  cidr_corp:   "10.10.0.0/24"
  cidr_dmz:    "10.20.0.0/24"
  cidr_server: "10.30.0.0/24"
  cidr_user:   "10.40.0.0/24"
  cidr_red:    "10.66.0.0/24"

outputs:
  jump_host_ip: string
  scoreboard_url: string
  siem_url: string

# ─── NETWORK ──────────────────────────────────────────────────────────
network:
  vlans:
    - id: 100
      name: management
      cidr: "10.0.0.0/24"
      description: "Exercise control — scoring, jump boxes, SIEM, IDS"
    - id: 200
      name: corporate_lan
      cidr: "10.10.0.0/24"
      description: "Corporate endpoints and user workstations"
    - id: 300
      name: dmz
      cidr: "10.20.0.0/24"
      description: "Internet-facing services — web, mail relay, VPN"
    - id: 400
      name: server_vlan
      cidr: "10.30.0.0/24"
      description: "Backend servers — AD, DB, file shares, Exchange, PKI"
    - id: 500
      name: blue_team
      cidr: "10.40.0.0/24"
      description: "Blue Team analyst workstations with forensic tools"
    - id: 666
      name: red_team
      cidr: "10.66.0.0/24"
      description: "Isolated Red Team attack enclave"

  firewall_rules:
    # ── Red Team access control ───────────────────────────
    - name: red-to-dmz
      src: red_team
      dst: dmz
      action: allow
      description: "Red can reach DMZ (simulated internet attack surface)"
    - name: red-to-corp-deny
      src: red_team
      dst: corporate_lan
      action: deny
      description: "Red must pivot through DMZ — no direct corp access"
    - name: red-to-server-deny
      src: red_team
      dst: server_vlan
      action: deny
      description: "Red must pivot — no direct server access"
    - name: red-to-mgmt-deny
      src: red_team
      dst: management
      action: deny
      description: "Red cannot reach scoring/SIEM"
    # ── Internal connectivity ─────────────────────────────
    - name: corp-to-server
      src: corporate_lan
      dst: server_vlan
      ports: [88, 135, 389, 445, 636, 1433, 3306]
      action: allow
      description: "Workstations reach AD, file, DB servers"
    - name: corp-to-dmz
      src: corporate_lan
      dst: dmz
      ports: [80, 443, 25, 587]
      action: allow
      description: "Corp reaches DMZ web/mail services"
    - name: dmz-to-server-limited
      src: dmz
      dst: server_vlan
      ports: [1433, 3306, 25, 587]
      action: allow
      description: "DMZ reaches DB + mail only (restricted ports)"
    # ── Blue Team / Management ────────────────────────────
    - name: blue-to-mgmt
      src: blue_team
      dst: management
      ports: [443, 514, 5601, 9200]
      action: allow
      description: "Blue analysts reach SIEM and scoreboard"
    - name: blue-to-server
      src: blue_team
      dst: server_vlan
      action: allow
      description: "Blue analysts access servers for investigation"
    - name: mgmt-to-all
      src: management
      dst: "*"
      action: allow
      description: "Management zone has full access for exercise control"

# ─── NODES (40 VMs) ──────────────────────────────────────────────────
nodes:

  # ════════════════════════════════════════════════════════════════════
  # MANAGEMENT ZONE — 5 VMs  (coyote)  12 vCPU · 30 GB
  # ════════════════════════════════════════════════════════════════════

  - id: jump01
    name: Jump Host
    role: jump_host
    os: ubuntu-2204
    vlan: management
    ip: "10.0.0.10"
    node: coyote
    specs: { cores: 2, memory_mb: 4096, disk_gb: 32 }
    services: [ssh, rdp_gateway]
    description: "Exercise controller jump box — RDP gateway to all zones"

  - id: score01
    name: Scoreboard
    role: scoreboard
    os: ubuntu-2204
    vlan: management
    ip: "10.0.0.20"
    node: coyote
    specs: { cores: 2, memory_mb: 4096, disk_gb: 32 }
    services: [http, https, scoring_engine]
    description: "Live scoreboard and scoring engine"

  - id: siem01
    name: SIEM
    role: siem
    os: ubuntu-2204
    vlan: management
    ip: "10.0.0.30"
    node: coyote
    specs: { cores: 4, memory_mb: 16384, disk_gb: 64 }
    services: [opensearch, opensearch_dashboards, syslog]
    description: "OpenSearch SIEM — centralized log collection and dashboards"

  - id: relay01
    name: Log Relay
    role: log_relay
    os: ubuntu-2204
    vlan: management
    ip: "10.0.0.40"
    node: coyote
    specs: { cores: 2, memory_mb: 2048, disk_gb: 16 }
    services: [rsyslog, filebeat]
    description: "Syslog relay / Filebeat forwarder to SIEM"

  - id: nids01
    name: Network IDS
    role: network_ids
    os: ubuntu-2204
    vlan: management
    ip: "10.0.0.50"
    node: coyote
    specs: { cores: 2, memory_mb: 4096, disk_gb: 32 }
    services: [suricata, zeek, evebox]
    description: "Network intrusion detection — Suricata + Zeek sensor"

  # ════════════════════════════════════════════════════════════════════
  # DMZ — 5 VMs  (acme)  10 vCPU · 10 GB
  # ════════════════════════════════════════════════════════════════════

  - id: web01
    name: Web Server 1
    role: web_server
    os: ubuntu-2204
    vlan: dmz
    ip: "10.20.0.10"
    node: acme
    specs: { cores: 2, memory_mb: 2048, disk_gb: 16 }
    services: [nginx, php, https]
    tags: [blue_defend]
    description: "Public-facing web server (primary)"

  - id: web02
    name: Web Server 2
    role: web_server
    os: ubuntu-2204
    vlan: dmz
    ip: "10.20.0.11"
    node: acme
    specs: { cores: 2, memory_mb: 2048, disk_gb: 16 }
    services: [apache, tomcat, https]
    tags: [blue_defend]
    description: "Public-facing web server (secondary)"

  - id: mx01
    name: Mail Gateway
    role: mail_gateway
    os: ubuntu-2204
    vlan: dmz
    ip: "10.20.0.30"
    node: acme
    specs: { cores: 2, memory_mb: 2048, disk_gb: 16 }
    services: [postfix, dovecot, spamassassin]
    tags: [blue_defend]
    description: "Inbound mail relay and spam filter"

  - id: rproxy01
    name: Reverse Proxy
    role: reverse_proxy
    os: ubuntu-2204
    vlan: dmz
    ip: "10.20.0.40"
    node: acme
    specs: { cores: 2, memory_mb: 2048, disk_gb: 16 }
    services: [haproxy, modsecurity, https]
    tags: [blue_defend]
    description: "Reverse proxy / WAF for backend services"

  - id: vpn01
    name: VPN Gateway
    role: vpn_gateway
    os: pfsense-2.7
    vlan: dmz
    ip: "10.20.0.50"
    node: acme
    specs: { cores: 2, memory_mb: 2048, disk_gb: 8 }
    services: [openvpn, ipsec]
    tags: [blue_defend]
    description: "VPN concentrator — remote access endpoint"

  # ════════════════════════════════════════════════════════════════════
  # SERVER VLAN — 8 VMs  (split)  16 vCPU · 44 GB
  # ════════════════════════════════════════════════════════════════════

  - id: dc01
    name: Primary Domain Controller
    role: domain_controller
    os: windows-server-2022
    vlan: server_vlan
    ip: "10.30.0.10"
    node: coyote
    specs: { cores: 2, memory_mb: 4096, disk_gb: 48 }
    services: [active_directory, dns, gpo, dhcp]
    tags: [blue_defend]
    ad_forest: corp.range.local
    fsmo_roles: [schema_master, domain_naming_master, pdc_emulator, rid_master, infrastructure_master]
    description: "Primary AD DC — all FSMO roles"

  - id: dc02
    name: Secondary Domain Controller
    role: domain_controller
    os: windows-server-2022
