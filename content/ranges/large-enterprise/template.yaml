id: large-enterprise
name: Large Enterprise Network
version: "1.0"
description: |
  A large corporate network with 50+ VMs spanning multiple Active Directory
  forests, DMZ, corporate LAN, server VLAN, security operations center,
  OT/SCADA segment, and cloud hybrid connectivity. Suitable for advanced
  exercises including APT simulations and purple team operations.
author: TrueNorth Range
difficulty: advanced
vm_count: 54

network:
  vlans:
    - id: 100
      name: dmz
      cidr: "10.50.100.0/24"
      description: "Internet-facing services: web, mail relay, external DNS"
    - id: 101
      name: corporate_lan
      cidr: "10.50.101.0/24"
      description: "End-user workstations, printers, and file services"
    - id: 102
      name: server_vlan
      cidr: "10.50.102.0/24"
      description: "Core enterprise applications and databases"
    - id: 103
      name: security_vlan
      cidr: "10.50.103.0/24"
      description: "Security operations tools and monitoring"
    - id: 104
      name: ot_scada
      cidr: "10.50.104.0/24"
      description: "Operational technology and industrial control systems"
    - id: 105
      name: management
      cidr: "10.50.105.0/24"
      description: "Out-of-band management and jump hosts"
    - id: 106
      name: ad_forest_b
      cidr: "10.50.106.0/24"
      description: "Secondary AD forest (subsidiary)"
    - id: 107
      name: cloud_hybrid
      cidr: "10.50.107.0/24"
      description: "Simulated cloud hybrid connectivity segment"

  firewall_rules:
    - name: dmz-to-server
      src: dmz
      dst: server_vlan
      ports: [443, 8443, 1433]
      action: allow
    - name: corp-to-server
      src: corporate_lan
      dst: server_vlan
      ports: [80, 443, 445, 1433, 389, 636]
      action: allow
    - name: corp-to-dmz
      src: corporate_lan
      dst: dmz
      action: deny
    - name: ot-isolation
      src: ot_scada
      dst: corporate_lan
      action: deny
    - name: security-monitor-all
      src: security_vlan
      dst: "*"
      action: allow
    - name: mgmt-to-all
      src: management
      dst: "*"
      ports: [22, 3389, 5985, 5986]
      action: allow

  trust_relationships:
    - source_forest: corp.truenorth.local
      target_forest: subsidiary.truenorth.local
      type: two-way
    - source_forest: corp.truenorth.local
      target_forest: partner.external.local
      type: one-way-incoming

nodes:
  # --- Management ---
  - id: jump01
    name: Jump Host
    role: jump_host
    os: windows-server-2022
    vlan: management
    ip: "10.50.105.10"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    services: [rdp, ssh]

  - id: ansible01
    name: Ansible Controller
    role: automation
    os: ubuntu-2204
    vlan: management
    ip: "10.50.105.20"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 40 }
    services: [ansible, ssh]

  # --- DMZ (VLAN 100) ---
  - id: web01
    name: External Web Server 1
    role: web_server
    os: ubuntu-2204
    vlan: dmz
    ip: "10.50.100.10"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 40 }
    services: [nginx, php, tls]

  - id: web02
    name: External Web Server 2
    role: web_server
    os: ubuntu-2204
    vlan: dmz
    ip: "10.50.100.11"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 40 }
    services: [apache, tomcat, tls]

  - id: mail-relay01
    name: Mail Relay
    role: mail_relay
    os: ubuntu-2204
    vlan: dmz
    ip: "10.50.100.20"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    services: [postfix, spamassassin]

  - id: dns-ext01
    name: External DNS
    role: dns_server
    os: ubuntu-2204
    vlan: dmz
    ip: "10.50.100.30"
    specs: { cores: 1, memory_mb: 2048, disk_gb: 20 }
    services: [bind9]

  - id: vpn01
    name: VPN Gateway
    role: vpn_gateway
    os: pfsense
    vlan: dmz
    ip: "10.50.100.40"
    specs: { cores: 2, memory_mb: 2048, disk_gb: 20 }
    services: [openvpn, ipsec]

  # --- Corporate LAN (VLAN 101) ---
  - id: dc01
    name: Primary Domain Controller
    role: domain_controller
    os: windows-server-2022
    vlan: corporate_lan
    ip: "10.50.101.10"
    specs: { cores: 4, memory_mb: 8192, disk_gb: 100 }
    services: [active_directory, dns, dhcp, gpo]
    ad_forest: corp.truenorth.local
    fsmo_roles: [schema_master, domain_naming_master, pdc_emulator, rid_master, infrastructure_master]

  - id: dc02
    name: Secondary Domain Controller
    role: domain_controller
    os: windows-server-2022
    vlan: corporate_lan
    ip: "10.50.101.11"
    specs: { cores: 4, memory_mb: 8192, disk_gb: 100 }
    services: [active_directory, dns]
    ad_forest: corp.truenorth.local

  - id: fs01
    name: File Server
    role: file_server
    os: windows-server-2022
    vlan: corporate_lan
    ip: "10.50.101.20"
    specs: { cores: 2, memory_mb: 8192, disk_gb: 500 }
    services: [smb, dfs, vshadow]

  - id: print01
    name: Print Server
    role: print_server
    os: windows-server-2022
    vlan: corporate_lan
    ip: "10.50.101.21"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    services: [print_spooler]

  - id: ws01
    name: Workstation 1 - Finance
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.100"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    user_profile: finance_analyst

  - id: ws02
    name: Workstation 2 - Finance
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.101"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    user_profile: finance_manager

  - id: ws03
    name: Workstation 3 - HR
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.102"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    user_profile: hr_specialist

  - id: ws04
    name: Workstation 4 - Engineering
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.103"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    user_profile: software_engineer

  - id: ws05
    name: Workstation 5 - Engineering
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.104"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
