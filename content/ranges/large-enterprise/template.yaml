    role: cloud_management
    os: ubuntu-2204
    vlan: cloud_hybrid
    ip: "10.50.107.30"
    specs: { cores: 2, memory_mb: 2048, disk_gb: 40 }
    services: [azure_arc_sim, log_analytics_agent]

  # --- Core Network ---
  - id: fw01
    name: Core Firewall
    role: firewall
    os: pfsense
    vlan: management
    ip: "10.50.105.1"
    specs: { cores: 4, memory_mb: 4096, disk_gb: 40 }
    services: [firewall, nat, vpn]
    interfaces:
      - vlan: dmz
        ip: "10.50.100.1"
      - vlan: corporate_lan
        ip: "10.50.101.1"
      - vlan: server_vlan
        ip: "10.50.102.1"
      - vlan: security_vlan
        ip: "10.50.103.1"
      - vlan: management
        ip: "10.50.105.1"
      - vlan: ad_forest_b
        ip: "10.50.106.1"
      - vlan: cloud_hybrid
        ip: "10.50.107.1"

  - id: ntp01
    name: NTP Server
    role: time_server
    os: ubuntu-2204
    vlan: management
    ip: "10.50.105.30"
    specs: { cores: 1, memory_mb: 1024, disk_gb: 10 }
    services: [chrony]

  - id: syslog01
    name: Syslog Collector
