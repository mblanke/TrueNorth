  - id: soar01
    name: SOAR Platform (TheHive)
    role: soar
    os: ubuntu-2204
    vlan: security_vlan
    ip: "10.50.103.50"
    specs: { cores: 4, memory_mb: 8192, disk_gb: 100 }
