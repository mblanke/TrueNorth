    ip: "10.50.101.105"
    specs: { cores: 2, memory_mb: 8192, disk_gb: 120 }
    user_profile: c_level_executive

  - id: ws07
    name: Workstation 7 - IT Admin
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.106"
    specs: { cores: 4, memory_mb: 16384, disk_gb: 120 }
    user_profile: it_administrator

  - id: ws08
    name: Workstation 8 - Marketing
    role: workstation
    os: windows-11
    vlan: corporate_lan
    ip: "10.50.101.107"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    user_profile: marketing_specialist

  # --- Server VLAN (VLAN 102) ---
  - id: exch01
    name: Exchange Server
    role: mail_server
    os: windows-server-2022
    vlan: server_vlan
    ip: "10.50.102.10"
    specs: { cores: 4, memory_mb: 16384, disk_gb: 200 }
    services: [exchange_2019, owa, smtp, imap]

  - id: sp01
    name: SharePoint Server
    role: collaboration
    os: windows-server-2022
    vlan: server_vlan
    ip: "10.50.102.20"
    specs: { cores: 4, memory_mb: 16384, disk_gb: 200 }
    services: [sharepoint_2019, iis]

  - id: sql01
    name: SQL Server Primary
    role: database
    os: windows-server-2022
    vlan: server_vlan
    ip: "10.50.102.30"
    specs: { cores: 8, memory_mb: 32768, disk_gb: 500 }
    services: [mssql_2022, ssrs]

  - id: sql02
    name: SQL Server Secondary
