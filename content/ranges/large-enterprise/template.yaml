  # --- Cloud Hybrid (VLAN 107) ---
  - id: aadconnect01
    name: Azure AD Connect Server
    role: hybrid_identity
    os: windows-server-2022
    vlan: cloud_hybrid
    ip: "10.50.107.10"
    specs: { cores: 2, memory_mb: 4096, disk_gb: 60 }
    services: [azure_ad_connect_sim, password_hash_sync]

  - id: appproxy01
    name: Application Proxy Connector
    role: app_proxy
    os: windows-server-2022
