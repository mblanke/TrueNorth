# ═══════════════════════════════════════════════════════════════════════════
#  TrueNorth Range Template — Colosseum
#  31 VMs · 66 vCPU · 227 GB RAM · ~4.3 TB disk (thin)
#  Sized for the vSphere lab (esx02–04); see docs/vm-build-sheet.md §3–§4.
#
#  Reproduces the Colosseum network diagram (07 Jan 2025) and Operators Manual
#  (docs/Coloseum/). Changes from the source, and why:
#    * Grey Space was 22.0.0.0/16 (public, DoD-owned space). Range subnets must be
#      private (tests/api/test_range_templates.py), so it is 10.22.0.0/16 here and
#      every 22.0.0.x host keeps its last octet (22.0.0.14 -> 10.22.0.14).
#    * OPFOR sits on its own 172.16.1.0/24 zone (the manual's layout); in the
#      diagram the OPFOR VMs were drawn in Grey Space with DHCP addresses.
#    * The OT hosts (PLC/HMI/Historian) were on the domain subnet; here they are
#      their own segment, 10.10.1.0/24, behind the same firewall, last octets kept.
#    * The CSTE edge router and the corp.ca transit (10.0.0.0/24) are not user
#      VMs; TrueNorth's edge firewall holds Grey Space as a zone and its WAN is
#      the depot uplink. The diagram's ANSIBLE host is replaced by the worker.
#    * FW Edge was OPNsense; the library's firewall image is pfSense.
#    * Windows servers were Server 2016; here Server 2022 (Historian: 2019).
#    * Caldera was a Windows VM; here Ubuntu (Caldera's supported platform).
#    * Four workstations (as drawn). The manual names a fifth user (Audrey Gill);
#      add wkstn-05 at 10.10.0.105 for +2 vCPU if wanted.
#
#  Images: only ubuntu-2404 (ubuntu-lts) is built on vSphere today. Every other
#  VM is marked "NOT BUILT" with what is missing (docs/deployment/vm-build-guide.md §1).
#
#  SPAN: the two TAPs are span_domain and span_dmz (promiscuous port groups). The
#  "mirror" rules below become vDS port-mirroring sessions that copy the domain and
#  DMZ VMs' traffic to the sensors' NICs on them (vsphere_infra.py, "Port
#  mirroring"; on-site checks in vmware-site-runbook.md §7.1). pfsense_config.py
#  skips them.
# ═══════════════════════════════════════════════════════════════════════════
id: colosseum
name: Colosseum
version: "1.0"
description: |
  Self-contained cyber operations range modelled on CSTE's Colosseum. Grey Space
  simulates the internet (web via ACE, webmail, social media, threat intel, the
  user-emulation C2). Blue Space is the corp.ca domain (DC, Exchange, file server,
  Windows Event Collector, four user-emulated workstations and a small OT
  segment), a DMZ web server, and a SOC (Security Onion with two sniffing
  interfaces, Arkime, Velociraptor, Carbon Black, DFIR-IRIS, Assemblyline and an
  analyst workstation). Red Space (OPFOR) holds a Cobalt Strike team server,
  Caldera, Kali and a Windows payload-build VM. One edge firewall joins them.
author: TrueNorth Range
difficulty: intermediate
vm_count: 31

# ─── NETWORK ──────────────────────────────────────────────────────────
network:
  vlans:
    - id: 300
      name: greyspace
      cidr: "10.22.0.0/16"
      description: "Grey Space - simulated internet services (was 22.0.0.0/16)"
    - id: 302
      name: dmz
      cidr: "172.16.0.0/24"
      description: "DMZ - public CMS web server"
    - id: 303
      name: soc
      cidr: "192.168.1.0/24"
      description: "Security Operations Centre - sensors, EDR, DFIR, analyst seat"
    - id: 304
      name: domain
      cidr: "10.10.0.0/24"
      description: "corp.ca - servers and workstations"
    - id: 305
      name: ot
      cidr: "10.10.1.0/24"
      description: "corp.ca OT segment - PLC, HMI, historian"
    - id: 306
      name: opfor
      cidr: "172.16.1.0/24"
      description: "Red Space - adversary infrastructure"
    - id: 314
      name: span_domain
      cidr: "10.250.4.0/24"
      description: "TAP on the domain zone (sniffing only, promiscuous port group)"
    - id: 312
      name: span_dmz
      cidr: "10.250.2.0/24"
      description: "TAP on the DMZ (sniffing only, promiscuous port group)"

  # Zone names only (pfsense_config.py). Anything not allowed here is pfSense's
  # default deny; DNS to the firewall and the depot are added per zone by the worker.
  # Rule names stay short: multi-port rules become a pfSense alias TN_P_<name>,
  # truncated to 31 characters, so names must be unique in their first 26.
  firewall_rules:
    # ── TAPs (vSphere port groups, not pf rules) ──────────
    - name: tap-domain
      src: domain
      dst: span_domain
      action: mirror
      note: "Domain TAP to Security Onion and Arkime"
    - name: tap-dmz
      src: dmz
      dst: span_dmz
      action: mirror
      note: "DMZ TAP to Security Onion and Arkime"
    # ── corp.ca outbound ("internet" is Grey Space + OPFOR) ──
    - name: domain-to-grey
      src: domain
      dst: greyspace
      action: allow
      note: "Users browse Grey Space; Exchange sends mail; UE agents reach the UE server"
    - name: domain-to-opfor
      src: domain
      dst: opfor
      action: allow
      note: "C2 callbacks reach Red Space (172.16.1.x is the tell)"
    - name: domain-to-dmz
      src: domain
      dst: dmz
      ports: [80, 443, 22]
      action: allow
      note: "Staff reach and administer the CMS"
    - name: domain-to-ot
      src: domain
      dst: ot
      ports: [443, 3389, 502]
      action: allow
      note: "Engineering access to HMI/historian and Modbus"
    - name: domain-to-soc-agents
      src: domain
      dst: soc
      ports: [443, 514, 1514, 1515, 5044, 8000]
      action: allow
      note: "Agents and log forwarding: Carbon Black, syslog, Wazuh, Beats, Velociraptor"
    # ── DMZ ───────────────────────────────────────────────
    - name: dmz-to-grey
      src: dmz
      dst: greyspace
      action: allow
    - name: dmz-to-opfor
      src: dmz
      dst: opfor
      action: allow
      note: "A compromised web server can call back"
    - name: dmz-to-domain-deny
      src: dmz
      dst: domain
      action: deny
      note: "DMZ never initiates into corp.ca"
    - name: dmz-to-soc-agents
      src: dmz
      dst: soc
      ports: [443, 514, 5044, 8000]
      action: allow
    # ── OT ────────────────────────────────────────────────
    - name: ot-to-soc-agents
      src: ot
      dst: soc
      ports: [443, 514, 5044, 8000]
      action: allow
    - name: ot-to-domain-deny
      src: ot
      dst: domain
      action: deny
      note: "OT does not initiate into IT"
    # ── Grey Space (the internet) ─────────────────────────
    - name: grey-to-dmz
      src: greyspace
      dst: dmz
      ports: [80, 443]
      action: allow
      note: "Public web traffic to the CMS"
    - name: grey-to-domain-smtp
      src: greyspace
      dst: domain
      ports: [25]
      action: allow
      note: "Inbound mail to Exchange (10.10.0.12)"
    - name: grey-to-opfor
      src: greyspace
      dst: opfor
      action: allow
      note: "ACE redirectors forward to the team server"
    # ── OPFOR ─────────────────────────────────────────────
    - name: opfor-to-grey
      src: opfor
      dst: greyspace
      action: allow
      note: "RainLoop, ACE redirectors, Kali repo"
    - name: opfor-to-dmz
      src: opfor
      dst: dmz
      action: allow
      note: "Attack surface"
    - name: opfor-to-domain-smtp
      src: opfor
      dst: domain
      ports: [25]
      action: allow
      note: "Direct phishing delivery to Exchange"
    - name: opfor-to-soc-deny
      src: opfor
      dst: soc
      action: deny
    # ── SOC ───────────────────────────────────────────────
    - name: soc-to-domain
      src: soc
      dst: domain
      action: allow
      note: "Agent push, investigation, response"
    - name: soc-to-dmz
      src: soc
      dst: dmz
      action: allow
    - name: soc-to-ot
      src: soc
      dst: ot
      action: allow
    - name: soc-to-grey
      src: soc
      dst: greyspace
      action: allow
      note: "OpenCTI and MISP live in Grey Space"

# ─── NODES (31 VMs) ──────────────────────────────────────────────────
nodes:

  # ════════════════════════════════════════════════════════════════════
  # PERIMETER — 1 VM  2 vCPU · 4 GB
  # ════════════════════════════════════════════════════════════════════

  # NOT BUILT: pfsense (no ISO on the datastore yet)
  - id: fw-edge
    name: FW Edge
    role: firewall
    os: pfsense
    vlan: domain
    ip: "10.10.0.1"
    edge: true
    specs: { cores: 2, memory_mb: 4096, disk_gb: 20 }
    services: [firewall, nat, dns_resolver]
    description: "Edge firewall joining Grey Space, DMZ, SOC, corp.ca, OT and OPFOR"
    interfaces:
      - vlan: greyspace
        ip: "10.22.0.1"
      - vlan: dmz
        ip: "172.16.0.1"
      - vlan: soc
        ip: "192.168.1.1"
      - vlan: domain
        ip: "10.10.0.1"
      - vlan: ot
        ip: "10.10.1.1"
      - vlan: opfor
        ip: "172.16.1.1"

