    blocks: ["06.transport-adapter"]
  - id: D04
    status: open
    question: What are the retention, expiry, correction and appeal policies for readiness evidence?
    blocks: ["01.retention", "01.official-record"]
  - id: D05
    status: open
    question: Which AI/physical actions may be preapproved and who is the named safety authority?
    blocks: ["04.effect-policy", "05.automated-effects"]
  - id: D06
    status: open
    question: What protocols and custody/reset obligations do TinyTown, vehicle and other physical assets expose?
    blocks: ["05.vendor-adapters"]
  - id: D07
    status: open
    question: What workload tiers, recovery objectives and network/storage assumptions define the 70,000-vCPU goal?
    blocks: ["07.capacity-proof"]

