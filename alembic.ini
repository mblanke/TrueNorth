[alembic]
# The live migration tree is under control-plane/api/ (12 revisions) -- that is what
# the API container carries and what the deployed database is stamped against. The
# 2-revision tree at ./alembic is an abandoned early scaffold. `make migrate` runs from
# the repo root, so pointing it here is what makes the documented command correct.
script_location = control-plane/api/alembic
prepend_sys_path = .
# Fallback only -- env.py overrides this from DATABASE_URL when set, which is how the
# containers run. The previous value (forge:forge@localhost/forge) was not the deployed
# database, so a bare `alembic upgrade head` pointed at nothing real.
sqlalchemy.url = postgresql+psycopg://truenorth:truenorth@localhost:5432/truenorth

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
