# ------------------------------------------------------------------
# Dependabot — Automated dependency updates
# ------------------------------------------------------------------
version: 2

registries: {}

updates:
  # Python (pip) — root pyproject.toml + service requirements
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(py):"
    groups:
      production-deps:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "ruff", "mypy", "bandit"]
      dev-deps:
        dependency-type: development
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /control-plane/api
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "python", "api"]
    commit-message:
      prefix: "deps(api):"

  - package-ecosystem: pip
    directory: /control-plane/worker
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "python", "worker"]
    commit-message:
      prefix: "deps(worker):"

  - package-ecosystem: pip
    directory: /ai-orchestrator
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "python", "ai"]
    commit-message:
      prefix: "deps(ai):"

  # npm — Angular frontend
  - package-ecosystem: npm
    directory: /control-plane/web
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript", "frontend"]
    commit-message:
      prefix: "deps(web):"
    groups:
      angular:
        patterns: ["@angular*", "@ngrx*"]
      material:
        patterns: ["@angular/material", "@angular/cdk"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(actions):"

  # Docker — base images
  - package-ecosystem: docker
    directory: /control-plane/api
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker):"

  - package-ecosystem: docker
    directory: /control-plane/worker
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /control-plane/web
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]

  - package-ecosystem: docker
    directory: /ai-orchestrator
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]