# ------------------------------------------------------------------
# TrueNorth Range — Deploy to Development
# ------------------------------------------------------------------
name: Deploy Dev

on:
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/truenorth
  COMPOSE_FILE: infra/platform/docker/compose.dev.yml

jobs:
  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        run: echo "tag=develop" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEV_DEPLOY_PATH || '/opt/truenorth' }}

            # Pull latest compose file
            git fetch origin develop
            git checkout develop
            git pull origin develop

            # Authenticate to registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images and restart
            export IMAGE_TAG="${{ steps.tags.outputs.tag }}"
            docker compose -f ${{ env.COMPOSE_FILE }} pull
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans

            # Run database migrations
            docker compose -f ${{ env.COMPOSE_FILE }} exec -T api \
              alembic upgrade head

            # Wait for services to stabilize
            sleep 10

      - name: Health check — API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            for i in $(seq 1 12); do
              status=$(curl -sf http://localhost:8080/health || echo "fail")
              if [ "$status" != "fail" ]; then
                echo "✓ API healthy"
                exit 0
              fi
              echo "Attempt $i/12 — waiting 5s..."
              sleep 5
            done
            echo "✗ API health check failed after 60s"
            exit 1

      - name: Health check — AI Orchestrator
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            for i in $(seq 1 12); do
              status=$(curl -sf http://localhost:6000/health || echo "fail")
              if [ "$status" != "fail" ]; then
                echo "✓ AI Orchestrator healthy"
                exit 0
              fi
              sleep 5
            done
            echo "✗ AI Orchestrator health check failed"
            exit 1

      - name: Health check — Web
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            curl -sf http://localhost:80 > /dev/null && echo "✓ Web healthy" || { echo "✗ Web unreachable"; exit 1; }

      - name: Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            echo "⚠ Dev deployment failed — rolling back"
            cd ${{ secrets.DEV_DEPLOY_PATH || '/opt/truenorth' }}
            docker compose -f ${{ env.COMPOSE_FILE }} down
            docker compose -f ${{ env.COMPOSE_FILE }} up -d