name: CI

# Third-party actions are pinned by commit SHA (comment: the release it is). Bump them
# deliberately, never to a release only days old; Trivy specifics: docs/release.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Same ruff as the DoD venv (scripts/dod.sh header); a newer one adds rules.
      - run: pip install "ruff==0.16.3"
      # The same ratchet as scripts/dod.sh: breakage rules always fail, other findings
      # may not rise above .dod-ruff-baseline.
      - run: bash scripts/ruff-gate.sh
        env:
          PY: python
      # Report-only until the 44-file reformat lands; then drop continue-on-error.
      - run: ruff format --check control-plane/ scenario-engine/ tools/ ai-orchestrator/
        continue-on-error: true

  test-python:
    runs-on: ubuntu-latest
    needs: lint-python
    # PostgreSQL for the tests whose claim SQLite cannot prove: row locks, partial unique
    # indexes under concurrency, the real migration chain (tests/conftest.py
    # postgres_engine). Without TEST_POSTGRES_ADMIN_URL they skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tn_ci
          POSTGRES_PASSWORD: tn_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tn_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      # OpenSearch for detection credit against real mapping and analysis
      # (tests/api/test_detection_opensearch.py; TEST_OPENSEARCH_URL).
      opensearch:
        image: opensearchproject/opensearch:2.13.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      # bubblewrap, so the Course Studio runner's Linux sandbox is tested end to end
      # (tests/arc2/test_arc2_confinement.py). Ubuntu 24.04 blocks unprivileged user
      # namespaces by default; allow them on this throwaway runner.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pytest tests/ --tb=short -q -rs --ignore=tests/integration --junitxml=build/test-python/junit.xml
        env:
          AUTH_DISABLED: "true"
          DATABASE_URL: "sqlite://"
          # tests/conftest.py overrides REDIS_URL with an unreachable address; no test
          # reaches a real broker except through TEST_REDIS_URL.
          REDIS_URL: "redis://localhost:6379/15"
          RATE_LIMIT_ENABLED: "false"
          TEST_POSTGRES_ADMIN_URL: "postgresql+psycopg://tn_ci:tn_ci@localhost:5432/postgres"
          TEST_OPENSEARCH_URL: "http://localhost:9200"
      # The PostgreSQL tests skip when TEST_POSTGRES_ADMIN_URL is unset (every such skip
      # names the variable), and pytest exits 0 when they do. Here the service is up and
      # the URL is set, so one such skip means the lane silently stopped proving what it
      # claims. Fail on any, and on there being no PostgreSQL test at all.
      - name: No PostgreSQL test skipped
        if: success() || failure()
        run: |
          python - build/test-python/junit.xml <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter("testcase"))
          pg_files = ("postgres", "migration_completeness", "migration_populated_upgrade")
          skipped, ran = [], 0
          for case in cases:
              skip = case.find("skipped")
              text = "" if skip is None else (skip.get("message", "") + (skip.text or ""))
              if skip is not None and "TEST_POSTGRES_ADMIN_URL" in text:
                  skipped.append(f'{case.get("classname")}::{case.get("name")}')
              elif skip is None and any(p in (case.get("classname") or "") for p in pg_files):
                  ran += 1
          print(f"{len(cases)} test cases; {ran} in PostgreSQL test modules ran; "
                f"{len(skipped)} skipped for want of TEST_POSTGRES_ADMIN_URL")
          for name in skipped:
              print(f"::error::skipped without PostgreSQL: {name}")
          if skipped or ran == 0:
              sys.exit(1)
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-python-junit
          path: build/test-python/junit.xml
          if-no-files-found: ignore

  # MOSA gates — same checks as scripts/dod.sh, so local green and CI green agree.
  # docs/adr/0002-interface-versioning.md, docs/adr/0003-mosa-ratchet.md
  mosa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r control-plane/api/requirements.txt ruff==0.16.3
      - name: Modularity ratchet
        run: python scripts/mosa_check.py && git diff --exit-code .dod-mosa-baseline
      - name: OpenAPI contract drift
        run: python scripts/export_openapi.py --check
      - name: Worker task contract drift
        run: python scripts/export_task_contracts.py --check
      - name: Worker table mirror drift
        run: python scripts/export_worker_tables.py --check

  # Supply chain evidence: SBOM (CycloneDX) + vulnerability reports, kept as artifacts.
  # Blocking: any known advisory in a Python service's pins or the web app's production
  # dependencies fails the build. The 2026-10-03 baseline (81 Python, 14 npm) was cleared
  # first. Both audits always run and the reports always upload, so a failure ships its
  # evidence. ADR 0003.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: SBOM (CycloneDX, whole repo)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2 (syft v1.51.1)
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: pip-audit
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit -r control-plane/api/requirements.txt -r control-plane/worker/requirements.txt \
            -r ai-orchestrator/requirements.txt \
            -r scenario-engine/requirements.txt \
            -f json -o pip-audit.json
      - name: npm audit
        if: success() || failure()
        working-directory: control-plane/web
        run: npm audit --omit=dev --json > ../../npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: supply-chain
          path: |
            sbom.cdx.json
            pip-audit.json
            npm-audit.json

  lint-angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
        working-directory: control-plane/web
      - run: npx ng lint
        working-directory: control-plane/web
      # Karma unit specs (src/**/*.spec.ts) in headless Chrome. The runner image ships
      # Google Chrome; karma-chrome-launcher finds it on PATH.
      - name: Unit tests (Karma, ChromeHeadless)
        run: npx ng test --watch=false --browsers=ChromeHeadless
        working-directory: control-plane/web

  build-angular:
    runs-on: ubuntu-latest
    needs: lint-angular
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
        working-directory: control-plane/web
      - name: Generated API types match docs/interfaces/openapi.json
        run: npm run check:api
        working-directory: control-plane/web
      - run: npx ng build --configuration production
        working-directory: control-plane/web

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-python, build-angular]
    strategy:
      matrix:
        service:
          - name: api
            context: control-plane/api
          - name: worker
            context: control-plane/worker
            build_contexts: scenario_engine=scenario-engine
          - name: web
            context: control-plane/web
          - name: scenario-engine
            context: scenario-engine
          - name: ai-orchestrator
            context: ai-orchestrator
    env:
      IMAGE: truenorth-range/${{ matrix.service.name }}:${{ github.sha }}
      # Same checksum-pinned Trivy as release.yml (docs/release.md "Pins").
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Built, not pushed; loaded into the runner's Docker so Trivy scans this exact image.
      # Images are published only by release.yml.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service.context }}
          build-contexts: ${{ matrix.service.build_contexts }}
          build-args: TN_VERSION=ci-${{ github.sha }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
      - name: Install Trivy (checksum-pinned)
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${tarball}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      # Report: fixable HIGH and CRITICAL, never fails. release.yml blocks on HIGH too.
      - name: Trivy report (HIGH/CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"
      # Gate: a fixable CRITICAL fails the PR.
      - name: Trivy gate (CRITICAL, fixable)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: helm lint infra/k8s/helm/truenorth-range

  # The realm file is imported by the dev stack and POSTed by the installer; neither
  # reports a parse failure loudly. Import it into the Keycloak image we pin.
  keycloak-realm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/check_keycloak_realm.sh

  # Integration lanes. Each one starts real services, and each one fails when no test
  # passed: until 2026-10-07 `integration` ran only on push to main, started postgres and
  # redis but no API, and tests/integration/conftest.py skipped every test when nothing
  # answered, so the job was green with zero tests run.

  # The dev stack built from this commit (compose.dev.yml + compose.itest.yml: mock
  # provisioner, AUTH_DISABLED, schema from `alembic upgrade head`) and tests/integration
  # against it. scripts/itest.sh is also `make itest`, so local and CI run the same steps.
  integration:
    runs-on: ubuntu-latest
    needs: lint-python
    timeout-minutes: 45
    env:
      PY: python
      ITEST_OUT: ${{ github.workspace }}/build/itest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      - name: Start the stack (build, migrate, wait for health)
        run: bash scripts/itest.sh up
      # INTEGRATION_REQUIRE_API=1 (set by the script) makes a missing API an error, and
      # scripts/junit_require_pass.py fails the step when zero tests passed.
      - name: Integration tests
        run: bash scripts/itest.sh test
      - name: Compose logs
        if: failure()
        run: bash scripts/itest.sh logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-junit
          path: build/itest/junit.xml
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: bash scripts/itest.sh down

  # Playwright against the same stack plus keycloak and the production web build on
  # http://localhost:14200 (web's own nginx serves the SPA and proxies /api and /auth).
  e2e:
    runs-on: ubuntu-latest
    needs: lint-python
    timeout-minutes: 45
    env:
      ITEST_WEB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Start the stack with keycloak + web
        run: bash scripts/itest.sh up
      # tests/e2e/package-lock.json pins Playwright (written by npm 10, as setup-node ships).
      - name: Install Playwright (chromium)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: tests/e2e
        run: npx playwright test --project=chromium
        env:
          CI: "true"
          BASE_URL: http://localhost:14200
      - name: Compose logs
        if: failure()
        run: bash scripts/itest.sh logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: bash scripts/itest.sh down

  # k6 smoke: every scenario in tests/load/scenarios at 1 VU for 30 s against the itest
  # stack (API on 127.0.0.1:18081, mock provisioner, AUTH_DISABLED). It proves the load
  # scripts still run against the current API and records each scenario's thresholds; it
  # is not a capacity test. NON-BLOCKING for now (continue-on-error): the scripts predate
  # the current API and some endpoints they call have moved. Thresholds and the plan to
  # make it blocking: tests/load/README.md "CI smoke".
  load-smoke:
    runs-on: ubuntu-latest
    needs: lint-python
    timeout-minutes: 40
    continue-on-error: true
    env:
      # grafana/k6 v1.8.1, by digest.
      K6_IMAGE: grafana/k6@sha256:23f2279054c3e01535455c4d92914a625df12aeb631ea0e3ea7a43f96bcbc843
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start the stack (build, migrate, wait for health)
        run: bash scripts/itest.sh up
      - name: k6 smoke (1 VU, 30 s per scenario)
        run: |
          mkdir -p build/k6 && chmod 777 build/k6
          rc=0
          printf '%-18s %s\n' scenario "k6 exit" > build/k6/summary.txt
          for path in tests/load/scenarios/*.js; do
            s=$(basename "$path" .js)
            echo "::group::k6 $s"
            code=0
            timeout 240 docker run --rm --network host \
              -v "$PWD/tests/load:/load:ro" -v "$PWD/build/k6:/out" \
              "$K6_IMAGE" run --quiet --vus 1 --duration 30s \
              -e BASE_URL=http://127.0.0.1:18081 -e WS_URL=ws://127.0.0.1:18081 \
              --summary-export "/out/$s.json" "/load/scenarios/$s.js" || code=$?
            echo "::endgroup::"
            printf '%-18s %s\n' "$s" "$code" >> build/k6/summary.txt
            if [[ $code -ne 0 ]]; then
              echo "::warning::k6 $s exited $code (99 = thresholds crossed)"
              rc=1
            fi
          done
          cat build/k6/summary.txt
          exit $rc
      - name: Compose logs
        if: failure()
        run: bash scripts/itest.sh logs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: k6-smoke
          path: build/k6
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: bash scripts/itest.sh down

  # ARC² releases published into a real, disposable Moodle (compose.moodle-test.yml) and
  # a student played through them: tests/integration/test_moodle_publish.py. The test
  # signs sync tickets with MOODLE_TEST_KEY; the Moodle trusts TN_PUBLIC_KEY, its public
  # half. A throwaway RSA pair is generated per run.
  moodle:
    runs-on: ubuntu-latest
    needs: lint-python
    timeout-minutes: 45
    env:
      MOODLE_TEST_URL: http://localhost:8093
      MOODLE_TEST_KEY: ${{ github.workspace }}/build/moodle/tool-private.pem
      MOODLE_TEST_CONTAINER: tn-moodle-test-moodle-1
      MOODLE_COMPOSE: docker compose -p tn-moodle-test -f infra/platform/docker/compose.moodle-test.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      - name: Throwaway tool key pair
        run: |
          mkdir -p build/moodle
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out build/moodle/tool-private.pem
          openssl pkey -in build/moodle/tool-private.pem -pubout -out build/moodle/tool-public.pem
      - name: Build the TrueNorth Moodle image
        run: docker build -t truenorth/moodle:5.2.3-tn-test infra/platform/moodle
      - name: Start Moodle and wait for the login page
        run: |
          TN_PUBLIC_KEY="$(cat build/moodle/tool-public.pem)" $MOODLE_COMPOSE up -d --wait
          # The first start installs Moodle; that takes minutes, not seconds.
          for _ in $(seq 1 180); do
            if curl -fsS -o /dev/null http://localhost:8093/login/index.php; then exit 0; fi
            sleep 5
          done
          echo "Moodle did not answer within 15 minutes" >&2
          exit 1
      - name: Moodle publish test
        run: |
          rc=0
          pytest tests/integration/test_moodle_publish.py -m integration -rs --tb=short \
            --junitxml=build/moodle/junit.xml || rc=$?
          python scripts/junit_require_pass.py build/moodle/junit.xml || rc=1
          exit $rc
        env:
          AUTH_DISABLED: "true"
          RATE_LIMIT_ENABLED: "false"
      - name: Moodle logs
        if: failure()
        run: TN_PUBLIC_KEY=unused $MOODLE_COMPOSE logs --no-color --tail=500
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: moodle-junit
          path: build/moodle/junit.xml
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: TN_PUBLIC_KEY=unused $MOODLE_COMPOSE down -v

  # govmomi's vCenter simulator (compose.vcsim.yml) for provisioner tests marked `vcsim`
  # (tests/integration/test_vsphere_sim.py: the vsphere_api provisioner end to end). As in
  # every other lane, nothing collected (exit 5) or nothing passed is a failure.
  vsphere-sim:
    runs-on: ubuntu-latest
    needs: lint-python
    timeout-minutes: 20
    env:
      VCSIM_COMPOSE: docker compose -p tn-vcsim -f infra/platform/docker/compose.vcsim.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      - name: Start vcsim
        run: |
          $VCSIM_COMPOSE up -d --wait
          for _ in $(seq 1 60); do
            if curl -kfsS -o /dev/null https://127.0.0.1:8989/about; then exit 0; fi
            sleep 2
          done
          echo "vcsim did not answer on :8989" >&2
          exit 1
      - name: vcsim tests
        run: |
          mkdir -p build/vcsim
          rc=0
          pytest tests/ -m vcsim -rs --tb=short --junitxml=build/vcsim/junit.xml || rc=$?
          python scripts/junit_require_pass.py build/vcsim/junit.xml || rc=1
          exit $rc
        env:
          AUTH_DISABLED: "true"
          DATABASE_URL: "sqlite://"
          RATE_LIMIT_ENABLED: "false"
          VSPHERE_URL: https://127.0.0.1:8989
          VSPHERE_USERNAME: user
          VSPHERE_PASSWORD: pass
          VSPHERE_VERIFY_SSL: "false"
          VSPHERE_DATACENTER: DC0
          VSPHERE_CLUSTER: DC0_C0
          VSPHERE_DATASTORE: LocalDS_0
          VSPHERE_NETWORK: VM Network
      - name: vcsim logs
        if: failure()
        run: $VCSIM_COMPOSE logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: $VCSIM_COMPOSE down -v

  # Greyspace (ADR 0007): build the T0 corpus, render the simulated-internet stack from
  # its manifest and run it under its own compose project. The script asserts DNS through
  # the root -> TLD -> authoritative chain, a BGP route learned between the two ISPs,
  # HTTP by name across both ISPs, the threat-actor stub, and the per-range overlay in
  # front of the read-only corpus; it tears the stack down on exit. Separate from the
  # `integration` job so the itest stack does not grow (the API side of Greyspace is
  # tests/integration/test_greyspace_flow.py there). Stdlib Python only.
  greyspace:
    runs-on: ubuntu-latest
    needs: lint-python
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ffmpeg (the T0 test-pattern video)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: T0 stack check (DNS, BGP, HTTP, threat stub, overlay)
        run: bash greyspace/scripts/check-t0.sh
        env:
          PY: python
          GS_PROJECT: gs-ci
