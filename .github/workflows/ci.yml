name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff mypy
      - run: ruff check control-plane/ scenario-engine/ tools/ ai-orchestrator/
      - run: ruff format --check control-plane/ scenario-engine/ tools/ ai-orchestrator/

  test-python:
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r control-plane/api/requirements.txt
          pip install -r control-plane/worker/requirements.txt
          pip install pytest pytest-asyncio httpx aiosmtplib
      - run: pytest tests/ --tb=short -q --ignore=tests/integration
        env:
          AUTH_DISABLED: "true"
          DATABASE_URL: "sqlite://"
          REDIS_URL: "redis://localhost:6379/15"
          RATE_LIMIT_ENABLED: "false"

  # MOSA gates — same checks as scripts/dod.sh, so local green and CI green agree.
  # docs/adr/0002-interface-versioning.md, docs/adr/0003-mosa-ratchet.md
  mosa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r control-plane/api/requirements.txt
      - name: Modularity ratchet
        run: python scripts/mosa_check.py && git diff --exit-code .dod-mosa-baseline
      - name: OpenAPI contract drift
        run: python scripts/export_openapi.py --check
      - name: Worker task contract drift
        run: python scripts/export_task_contracts.py --check

  # Supply chain evidence: SBOM (CycloneDX) + vulnerability reports, kept as artifacts.
  # Report-only for now: on 2026-10-03 pip-audit found 81 advisories in 10 packages and
  # npm audit 14, so a blocking job would fail every run until the upgrades land.
  # Make it blocking (drop continue-on-error) once those are cleared. ADR 0003.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: SBOM (CycloneDX, whole repo)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r control-plane/api/requirements.txt -r control-plane/worker/requirements.txt \
            -f json -o pip-audit.json
      - name: npm audit
        continue-on-error: true
        working-directory: control-plane/web
        run: npm audit --omit=dev --json > ../../npm-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            sbom.cdx.json
            pip-audit.json
            npm-audit.json

  lint-angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
        working-directory: control-plane/web
      - run: npx ng lint
        working-directory: control-plane/web

  build-angular:
    runs-on: ubuntu-latest
    needs: lint-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
        working-directory: control-plane/web
      - name: Generated API types match docs/interfaces/openapi.json
        run: npm run check:api
        working-directory: control-plane/web
      - run: npx ng build --configuration production
        working-directory: control-plane/web

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-python, build-angular]
    strategy:
      matrix:
        service:
          - name: api
            context: control-plane/api
          - name: worker
            context: control-plane/worker
          - name: web
            context: control-plane/web
          - name: scenario-engine
            context: scenario-engine
          - name: telemetry-pipeline
            context: telemetry-pipeline
          - name: ai-orchestrator
            context: ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: truenorth-range/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/k8s/helm/truenorth-range

  integration:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install -r control-plane/api/requirements.txt
          pip install -r control-plane/worker/requirements.txt
          pip install pytest pytest-asyncio httpx
      - run: pytest tests/integration/ --tb=short -q
        env:
          INTEGRATION_TEST: "1"
          DATABASE_URL: "postgresql+psycopg://forge:forge@localhost:5432/forge"
          REDIS_URL: "redis://localhost:6379/0"
          AUTH_DISABLED: "true"