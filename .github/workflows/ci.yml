name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Same ruff as the DoD venv (scripts/dod.sh header); a newer one adds rules.
      - run: pip install "ruff==0.16.3"
      # The same ratchet as scripts/dod.sh: breakage rules always fail, other findings
      # may not rise above .dod-ruff-baseline.
      - run: bash scripts/ruff-gate.sh
        env:
          PY: python
      # Blocking: the tree is formatted (ADR 0004) and scripts/dod.sh runs the same check.
      - run: ruff format --check control-plane/ scenario-engine/ tools/ ai-orchestrator/

  test-python:
    runs-on: ubuntu-latest
    needs: lint-python
    # PostgreSQL for the tests that need real locking and the real migration chain:
    # fresh install, populated upgrade/downgrade, concurrent range operations, wiki
    # saves and network reservations. Without it they skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tn_ci
          POSTGRES_PASSWORD: tn_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tn_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      # Only for tests that name it (TEST_REDIS_URL): the worker -> browser range events.
      # Port 6380, so REDIS_URL (6379) stays unreachable for everything else.
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      # bubblewrap, so the Course Studio runner's Linux sandbox is tested end to end
      # (tests/arc2/test_arc2_confinement.py). Ubuntu 24.04 blocks unprivileged user
      # namespaces by default; allow them on this throwaway runner.
      - run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pytest tests/ --tb=short -q --ignore=tests/integration
        env:
          AUTH_DISABLED: "true"
          DATABASE_URL: "sqlite://"
          REDIS_URL: "redis://localhost:6379/15"
          RATE_LIMIT_ENABLED: "false"
          TEST_POSTGRES_ADMIN_URL: "postgresql+psycopg://tn_ci:tn_ci@localhost:5432/postgres"
          TEST_REDIS_URL: "redis://localhost:6380/0"

  # MOSA gates — same checks as scripts/dod.sh, so local green and CI green agree.
  # docs/adr/0002-interface-versioning.md, docs/adr/0003-mosa-ratchet.md
  mosa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r control-plane/api/requirements.txt ruff==0.16.3
      - name: Modularity ratchet
        run: python scripts/mosa_check.py && git diff --exit-code .dod-mosa-baseline
      - name: OpenAPI contract drift
        run: python scripts/export_openapi.py --check
      - name: Worker task contract drift
        run: python scripts/export_task_contracts.py --check
      - name: Worker table mirror drift
        run: python scripts/export_worker_tables.py --check

  # Supply chain evidence: SBOM (CycloneDX) + vulnerability reports, kept as artifacts.
  # Blocking: any known advisory in a Python service's pins or the web app's production
  # dependencies fails the build. The 2026-10-03 baseline (81 Python, 14 npm) was cleared
  # first. Both audits always run and the reports always upload, so a failure ships its
  # evidence. ADR 0003.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: SBOM (CycloneDX, whole repo)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r control-plane/api/requirements.txt -r control-plane/worker/requirements.txt \
            -r ai-orchestrator/requirements.txt -r telemetry-pipeline/requirements.txt \
            -r scenario-engine/requirements.txt \
            -f json -o pip-audit.json
      - name: npm audit
        if: success() || failure()
        working-directory: control-plane/web
        run: npm audit --omit=dev --json > ../../npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain
          path: |
            sbom.cdx.json
            pip-audit.json
            npm-audit.json

  lint-angular:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
        working-directory: control-plane/web
      - run: npx ng lint
        working-directory: control-plane/web

  build-angular:
    runs-on: ubuntu-latest
    needs: lint-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json
      - run: npm ci
        working-directory: control-plane/web
      - name: Generated API types match docs/interfaces/openapi.json
        run: npm run check:api
        working-directory: control-plane/web
      - run: npx ng build --configuration production
        working-directory: control-plane/web

  build-docker:
    runs-on: ubuntu-latest
    needs: [test-python, build-angular]
    strategy:
      matrix:
        service:
          - name: api
            context: control-plane/api
          - name: worker
            context: control-plane/worker
            build_contexts: scenario_engine=scenario-engine
          - name: web
            context: control-plane/web
          - name: scenario-engine
            context: scenario-engine
          - name: telemetry-pipeline
            context: telemetry-pipeline
          - name: ai-orchestrator
            context: ai-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          build-contexts: ${{ matrix.service.build_contexts }}
          push: false
          tags: truenorth-range/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Trivy's release channel was compromised on 2026-03-19 (CVE-2026-33634): its action
  # tags were force-pushed to a credential stealer. So: pin the action by commit SHA,
  # pin Trivy itself, give the job read-only permissions, and expose no secrets to it.
  # Report-only for now (exit-code 0). No dependency CVE remains (Angular 21); the only
  # HIGH findings (2026-10-05) are DS-0002 on the three nginx images, which still run as
  # root (control-plane/web/Dockerfile, infra/platform/nginx/Dockerfile{,.dev}). Make
  # them non-root (unprivileged base or USER plus an unprivileged listen port), then set
  # exit-code "1".
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          skip-dirs: node_modules
          exit-code: "0"

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infra/k8s/helm/truenorth-range

  # The realm file is imported by the dev stack and POSTed by the installer; neither
  # reports a parse failure loudly. Import it into the Keycloak image we pin.
  keycloak-realm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_keycloak_realm.sh

  integration:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-test.txt
      - run: pytest tests/integration/ --tb=short -q
        env:
          INTEGRATION_TEST: "1"
          DATABASE_URL: "postgresql+psycopg://forge:forge@localhost:5432/forge"
          REDIS_URL: "redis://localhost:6379/0"
          AUTH_DISABLED: "true"