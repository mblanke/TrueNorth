[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truenorth-sdk"
version = "0.1.0"
description = "Python SDK for the TrueNorth Range platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]