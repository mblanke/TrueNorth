# EXEMPLAR - NOT FOR PUBLICATION. Reference copy for TAZ's course coder; do not edit.
# An instructor pack for the exemplar course (exemplar-arc2-c105.course.yaml), in the shape
# docs/interfaces/course-instructor-pack.schema.json requires and scripts/check_course.py checks.
# Condensed by hand from ARC2's own staff material for ARC2-C105: 04-artifacts/instructor/
# answer_key.md and facilitation.md in the C105 release bundle. Every answer letter below is the
# course's key; the notes say why the keyed option is right and what each distractor tests.
# Mentions of 'page N' point at ARC2 learner pages, which TAZ does not write: key your notes to
# the module's topics instead. This course is all-theory, so lab_setup is paper preparation;
# for a TAZ course it is what the instructor does on the range (see ARC2-STYLE.md).
course_code: ARC2-C105
audience: staff_only
overview: 'EXEMPLAR (not for publication). Foundations of Cybersecurity is a theory course of six 150-minute modules
  (900 minutes, 15 hours). Each module has the same split: 45 minutes contact, 40 reading, 45 practice on three
  case tasks, and a 20-minute assessment block (10 minutes quiz, 10 minutes banked toward one 60-minute written
  case analysis after Module 6). Each module teaches three objectives, practises each on a written case, and ends
  with a five-item quiz passed at 70 percent. Say ''student'' throughout and keep every description defensive and
  observable.'
timings:
- module: 1
  minutes: 150
  plan: '45 contact (about 9 per page), 40 reading, 45 practice (three cases, 15 each: 10 in pairs, 5 debrief),
    20 assessment (10 quiz, 10 banked)'
- module: 2
  minutes: 150
  plan: '45 contact (about 9 per page), 40 reading, 45 practice (three cases, 15 each: 10 in pairs, 5 debrief),
