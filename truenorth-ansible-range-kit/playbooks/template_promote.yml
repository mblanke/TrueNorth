---
# Promote a validated template (tag it in vCenter). Human approval required:
#   tools/range approve TEMPLATES --action promote
- name: Promote a TrueNorth template
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/common.yml
  vars:
    range_id: TEMPLATES
  module_defaults:
    group/community.vmware.vmware: &vcenter
      hostname: "{{ vcenter_hostname }}"
      username: "{{ vcenter_username }}"
      password: "{{ vcenter_password }}"
      port: "{{ vcenter_port | default(443) }}"
      validate_certs: "{{ (lookup('ansible.builtin.file', tn_root ~ '/config/site.yml') | from_yaml).site.validate_certs }}"
    group/vmware.vmware.vmware: *vcenter
  roles:
    - template_promote
