---
# Reset a TrueNorth range to its baseline snapshot and re-validate
- name: Reset a TrueNorth range to its baseline snapshot and re-validate
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/common.yml
  module_defaults:
    group/community.vmware.vmware: &vcenter
      hostname: "{{ vcenter_hostname }}"
      username: "{{ vcenter_username }}"
      password: "{{ vcenter_password }}"
      port: "{{ vcenter_port | default(443) }}"
      validate_certs: "{{ tn_validate_certs | default(true) }}"
    group/vmware.vmware.vmware: *vcenter
  vars:
    tn_action: reset
    tn_changes: true
    tn_snapshot_action: revert
  roles:
    - range_load
    - range_snapshot
    - range_validate
    - range_report
