# TrueNorth Range — Ansible Configuration
# =========================================
# Optimised for large-scale cyber-range provisioning (50+ VMs).

[defaults]
remote_user          = ubuntu
private_key_file     = ~/.ssh/truenorth
host_key_checking    = False
forks                = 50
timeout              = 30
gathering            = smart
fact_caching         = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600
retry_files_enabled  = False
stdout_callback      = json
callback_whitelist   = timer, json
interpreter_python   = auto_silent
roles_path           = roles

[inventory]
enable_plugins = yaml, ini, auto

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
control_path = /tmp/ansible-%%h-%%r

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False