---
- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: restart filebeat
  ansible.builtin.systemd:
    name: filebeat
    state: restarted

- name: restart rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    state: restarted

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started