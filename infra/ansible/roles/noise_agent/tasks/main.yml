---
# ============================================================
# TrueNorth Range — Background-noise agent (Linux)
# ============================================================
# Installs tn-noise as a systemd service. The token comes from the deploy task's
# per-host vars (noise_agent_token) and is written 0600 root-only; it is never logged.

- name: Require the controller URL and a token
  ansible.builtin.assert:
    that:
      - noise_controller_url is match('^https://')
      - noise_agent_token | default('') | length > 20
    fail_msg: "noise_controller_url must be https and noise_agent_token must be set"
    quiet: true

- name: Python 3 is present
  ansible.builtin.command: python3 --version
  changed_when: false

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ noise_agent_dir }}", mode: "0755" }
    - { path: "{{ noise_agent_conf_dir }}", mode: "0700" }

- name: Install the agent package
  ansible.builtin.copy:
    src: "{{ noise_agent_src }}"
    dest: "{{ noise_agent_dir }}/"
    owner: root
    group: root
    mode: "u=rwX,go=rX"
  notify: restart tn-noise

- name: Write the agent token
  ansible.builtin.copy:
    content: "{{ noise_agent_token }}\n"
    dest: "{{ noise_agent_conf_dir }}/token"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart tn-noise

- name: Install the controller CA bundle
  ansible.builtin.copy:
    src: "{{ noise_agent_ca_file }}"
    dest: "{{ noise_agent_conf_dir }}/ca.pem"
    owner: root
    group: root
    mode: "0644"
  when: noise_agent_ca_file | length > 0
  notify: restart tn-noise

- name: Install the systemd unit
  ansible.builtin.template:
    src: tn-noise.service.j2
    dest: /etc/systemd/system/tn-noise.service
    owner: root
    group: root
    mode: "0644"
  notify: restart tn-noise

- name: Enable and start tn-noise
  ansible.builtin.systemd:
    name: tn-noise
    enabled: true
    state: started
    daemon_reload: true
