---
# ============================================================
# TrueNorth Range — Security Tools Variables
# ============================================================

# ── SIEM / Wazuh ──────────────────────────────────────────
siem_type:            "wazuh"
wazuh_manager_host:   "{{ hostvars[groups['siem'][0]]['ansible_host'] | default('10.0.5.10') }}"
wazuh_manager_port:   1514
wazuh_api_port:       55000
wazuh_api_user:       "wazuh-admin"
wazuh_api_password:   "{{ vault_wazuh_api_password }}"

# ── OpenSearch ─────────────────────────────────────────────
opensearch_endpoint:  "{{ opensearch_url }}"
opensearch_user:      "admin"
opensearch_password:  "{{ vault_opensearch_password }}"
opensearch_index_prefix: "truenorth-{{ exercise_id }}"

# ── Suricata ───────────────────────────────────────────────
suricata_enabled: true
suricata_rules_url: "https://rules.emergingthreats.net/open/suricata/emerging.rules.tar.gz"
suricata_home_net: "[10.0.0.0/8]"

# ── Alert Thresholds ──────────────────────────────────────
alert_thresholds:
  critical_severity_min: 12
  high_severity_min:     8
  medium_severity_min:   4
  max_alerts_per_minute: 100
  escalation_after_minutes: 15

# ── Detection Rules ───────────────────────────────────────
custom_detection_rules:
  - name: "Lateral Movement via PsExec"
    level: "high"
    source: "sysmon"
    event_id: 1
    pattern: "psexec"
  - name: "Suspicious PowerShell Download"
    level: "critical"
    source: "powershell"
    pattern: "(Invoke-WebRequest|wget|curl|DownloadString)"
  - name: "Mimikatz Execution"
    level: "critical"
    source: "sysmon"
    event_id: 1
    pattern: "mimikatz"
  - name: "Pass-the-Hash Attempt"
    level: "high"
    source: "windows-security"
    event_id: 4624
    pattern: "LogonType.*3"