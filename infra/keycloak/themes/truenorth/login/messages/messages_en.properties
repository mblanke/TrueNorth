# Defaults for the TrueNorth login banner. The installer replaces them per site through the
# realm's localization (roles/tn_keycloak/tasks/banner.yml, from tn_login_banner_title,
# tn_login_banner_text and tn_login_banner_ack), which takes precedence over these.
# The wording is the owner's GoC-style notice; the accredited text for a site is the
# system owner's to supply (tn_login_banner_text). Java MessageFormat: '' for an apostrophe.
tnLoginBannerTitle=Notice to users
tnLoginBanner=This is a Government of Canada training system. Use is monitored and recorded. Unauthorized use is prohibited and may result in disciplinary or legal action. By continuing you consent to monitoring.
tnLoginBannerAck=I have read and accept this notice
tnLoginBannerSubmit=I acknowledge - Sign in
