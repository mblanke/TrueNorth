# TrueNorth login theme (NIST AC-8 banner): Keycloak 24's "keycloak" theme plus one
# stylesheet; login.ftl is the upstream file with the banner and acknowledgement added.
# Mounted read-only at /opt/keycloak/themes/truenorth (compose.prod.yml, compose.dev.yml);
# selected by the realm's loginTheme (realm-truenorth.json, tn_kc_realm_settings).
parent=keycloak
import=common/keycloak
styles=css/login.css css/tn-banner.css
