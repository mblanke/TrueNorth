# Values for the kind smoke test (infra/k8s/kind/smoke.sh, .github/workflows/helm-kind.yml).
# Production settings (TN_ENV=production, read-only roots, NetworkPolicies, the
# migration hook) with laptop-sized replicas and resources. Secrets are generated by
# the smoke script and passed with --set; images are built locally and `kind load`ed.
images:
  api: {repository: tn-local/api, tag: ci, pullPolicy: Never}
  worker: {repository: tn-local/worker, tag: ci, pullPolicy: Never}
  web: {repository: tn-local/web, tag: ci, pullPolicy: Never}
  scenarioEngine: {repository: tn-local/scenario-engine, tag: ci, pullPolicy: Never}
  aiOrchestrator: {repository: tn-local/ai-orchestrator, tag: ci, pullPolicy: Never}

version: v0.0.0-kind

config:
  database: {host: postgres}
  redis: {host: redis}
  # MinIO is not deployed in the smoke test: readiness does not depend on it, and the
  # API only checks that its credentials are set and not the defaults.
  minio: {endpoint: "http://minio.invalid:9000"}
  keycloak:
    url: http://keycloak.invalid:8080/auth
    audience: truenorth-api
    issuer: http://truenorth.kind.test/auth/realms/truenorth
  trustedProxyCidrs: 10.244.0.0/16
  provisionerBackend: mock

opensearch:
  url: http://opensearch:9200
  securityDisabled: true

ingress:
  host: truenorth.kind.test
  tls: {enabled: false}

# YAML anchor holder; the chart ignores this key.
_small: &small
  requests: {cpu: 20m, memory: 128Mi}
  limits: {cpu: "1", memory: 768Mi}

api:
  replicaCount: 1
  uvicornWorkers: 1
  autoscaling: {enabled: false}
  resources: *small
workerProvision: {replicaCount: 1, concurrency: 1, autoscaling: {enabled: false}, resources: *small}
workerScenario: {replicaCount: 1, concurrency: 1, autoscaling: {enabled: false}, resources: *small}
workerTelemetry: {replicaCount: 1, concurrency: 1, autoscaling: {enabled: false}, resources: *small}
beat: {resources: *small}
aiOrchestrator:
  replicaCount: 1
  resources: *small
  env:
    # Required with the openai backend; nothing answers here, and health does not ask.
    OPENAI_BASE_URL: http://llm.invalid:4000/v1
web:
  replicaCount: 1
  autoscaling: {enabled: false}
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
migration:
  resources: *small

# kind has no ingress-nginx namespace; the selector still renders and is enforced.
networkPolicy:
  enabled: true
