# Throwaway datastores for the kind smoke test (infra/k8s/kind/smoke.sh) — NOT for
# production: no persistence, single replicas, OpenSearch without its security plugin.
# The chart does not run datastores; production points config.* at real ones.
# Passwords come from the `tn-deps` Secret the smoke script creates. Keycloak imports the
# shipped realm (ConfigMap `tn-realm`, from infra/keycloak/realm-truenorth.json); the
# chart's keycloak-mfa hook then configures it for MFA, as an operator's Keycloak would be.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: {app: postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
          env:
            - {name: POSTGRES_USER, value: truenorth}
            - {name: POSTGRES_DB, value: truenorth}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tn-deps, key: DATABASE_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "truenorth", "-d", "truenorth"]}
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {app: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4.6-alpine@sha256:3b73847e72874be07e6657b129a94761662b79bc0f679273757d4218573b2a98
          command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$REDIS_PASSWORD\""]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: tn-deps, key: REDIS_PASSWORD}}
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]}
            periodSeconds: 3
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  labels: {app: opensearch}
spec:
  replicas: 1
  selector: {matchLabels: {app: opensearch}}
  template:
    metadata: {labels: {app: opensearch}}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.3@sha256:e96cc6ae1500a073d973c0906f30f7cf4d9c461f32f855f9242a2da933660cdd
          env:
            # single-node also skips the bootstrap checks (vm.max_map_count on the runner).
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits: {cpu: "1", memory: 1536Mi}
---
apiVersion: v1
kind: Service
metadata: {name: opensearch}
spec:
  selector: {app: opensearch}
  ports: [{port: 9200, targetPort: 9200}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels: {app: keycloak}
spec:
  replicas: 1
  selector: {matchLabels: {app: keycloak}}
  template:
    metadata: {labels: {app: keycloak}}
    spec:
      containers:
        - name: keycloak
          # Built by smoke.sh from keycloak.Dockerfile (FROM the pin compose.prod.yml uses)
          # with the Quarkus build done, so the pod never augments at start.
          image: tn-local/keycloak:ci
          imagePullPolicy: Never
          args: ["start", "--optimized", "--import-realm"]
          env:
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HOSTNAME_STRICT, value: "false"}
            - {name: KC_HOSTNAME_STRICT_HTTPS, value: "false"}
            - {name: KEYCLOAK_ADMIN, value: admin}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: tn-deps, key: KEYCLOAK_ADMIN_PASSWORD}}
          ports: [{containerPort: 8080}]
          # JVM start plus the realm import: seconds on a free CPU, minutes on a busy
          # 2-vCPU runner (150 s measured at 0.5 CPU). Nothing restarts it meanwhile: no
          # liveness probe, and readiness waits for the started probe.
          startupProbe:
            httpGet: {path: /auth/health/started, port: 8080}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /auth/realms/truenorth, port: 8080}
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 1536Mi}
      volumes:
        - name: realm
          configMap: {name: tn-realm}
---
apiVersion: v1
kind: Service
metadata: {name: keycloak}
spec:
  selector: {app: keycloak}
  ports: [{port: 8080, targetPort: 8080}]
