apiVersion: v2
name: truenorth-range
description: TrueNorth Range — Cyber Range Orchestration Platform
type: application
# Chart version: bump on any chart change. appVersion: the release the default image
# tags point at (images.*.tag defaults to v<appVersion>); installs should pin digests
# from that release's release-manifest.json instead (infra/k8s/README.md).
version: 1.0.0
appVersion: "1.0.0"
kubeVersion: ">=1.27.0-0"
keywords:
  - cyber-range
  - orchestration
  - security
  - training
home: https://github.com/mblanke/TrueNorth
sources:
  - https://github.com/mblanke/TrueNorth
maintainers:
  - name: TrueNorth Range Team
# No subchart dependencies. PostgreSQL, Redis, MinIO, OpenSearch and Keycloak are
# operator-provided (a managed service or an in-cluster operator) and configured under
# `config` and `secrets`. The Bitnami subcharts this chart used to declare could not be
# installed offline, pulled images Bitnami no longer publishes for free, and shipped
# `changeme` passwords.
