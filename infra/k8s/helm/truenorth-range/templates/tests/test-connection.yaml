apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "truenorth-range.fullname" . }}-test-connection"
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-api
      image: curlimages/curl:8.5.0
      command:
        - sh
        - -c
        - |
          echo "Testing API health endpoint..."
          curl -sf http://{{ include "truenorth-range.fullname" . }}-api:{{ .Values.api.service.port }}/health || exit 1
          echo ""
          echo "Testing AI Orchestrator health endpoint..."
          curl -sf http://{{ include "truenorth-range.fullname" . }}-ai-orchestrator:{{ .Values.aiOrchestrator.service.port }}/health || exit 1
          echo ""
          echo "Testing Web frontend..."
          curl -sf http://{{ include "truenorth-range.fullname" . }}-web:{{ .Values.web.service.port }}/ || exit 1
          echo ""
          echo "All health checks passed!"