{{- if .Values.ingress.enabled -}}
{{- /*
What browsers reach: the web app, the API under /api (and its WebSocket under /ws), and
Keycloak under /auth when it runs in this cluster. Nothing else: the AI orchestrator and
Flower are internal (networkpolicy.yaml), as on the compose edge.

Two Ingress objects because the API's needs a rewrite the web's must not get: the edge
nginx strips /api (infra/platform/nginx/conf.d/truenorth.conf, `rewrite ^/api/(.*) /$1`),
and the API serves its routes at /. Written for ingress-nginx (rewrite-target, use-regex);
another controller needs its equivalent of these two annotations.
*/ -}}
{{- $fullname := include "truenorth-range.fullname" . -}}
{{- $host := required "ingress.host is required" .Values.ingress.host -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.apiAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          # /api/<rest> -> /<rest>
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullname }}-api
                port:
                  number: {{ .Values.api.service.port }}
          # /ws/<rest> -> /ws/<rest> (the empty first group keeps $2 the whole path)
          - path: /()(ws/.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $fullname }}-api
                port:
                  number: {{ .Values.api.service.port }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- with .Values.ingress.keycloak }}
          {{- if .enabled }}
          # Keycloak in this cluster, serving under /auth (KC_HTTP_RELATIVE_PATH=/auth).
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ required "ingress.keycloak.serviceName is required when ingress.keycloak.enabled" .serviceName }}
                port:
                  number: {{ .servicePort }}
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
