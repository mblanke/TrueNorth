{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "truenorth-range.fullname" . }}
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API — /api prefix
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "truenorth-range.fullname" . }}-api
                port:
                  number: {{ .Values.api.service.port }}
          # AI Orchestrator — /ai prefix
          - path: /ai
            pathType: Prefix
            backend:
              service:
                name: {{ include "truenorth-range.fullname" . }}-ai-orchestrator
                port:
                  number: {{ .Values.aiOrchestrator.service.port }}
          # Flower — /flower prefix
          - path: /flower
            pathType: Prefix
            backend:
              service:
                name: {{ include "truenorth-range.fullname" . }}-flower
                port:
                  number: {{ .Values.flower.service.port }}
          # Web frontend — catch-all (must be last)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "truenorth-range.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}