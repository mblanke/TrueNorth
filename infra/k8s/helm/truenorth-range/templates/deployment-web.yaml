{{- if .Values.web.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenorth-range.fullname" . }}-web
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
      labels:
        {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "truenorth-range.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "truenorth-range.image" (dict "image" .Values.web.image "global" .Values.global "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- $kc := .Values.web.keycloak | default dict }}
          {{- $links := .Values.web.adminLinks | default dict }}
          # Read by docker/40-truenorth-runtime-config.sh into the SPA's runtime config.
          env:
            - name: TN_KEYCLOAK_URL
              value: {{ $kc.url | default "" | quote }}
            - name: TN_KEYCLOAK_REALM
              value: {{ $kc.realm | default "" | quote }}
            - name: TN_KEYCLOAK_CLIENT_ID
              value: {{ $kc.clientId | default "" | quote }}
            - name: TN_ADMIN_KEYCLOAK_URL
              value: {{ $links.keycloak | default "" | quote }}
            - name: TN_ADMIN_MINIO_URL
              value: {{ $links.minio | default "" | quote }}
            - name: TN_ADMIN_DASHBOARDS_URL
              value: {{ $links.dashboards | default "" | quote }}
            - name: TN_ADMIN_AI_URL
              value: {{ $links.ai | default "" | quote }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "truenorth-range.fullname" . }}-nginx
{{- end }}