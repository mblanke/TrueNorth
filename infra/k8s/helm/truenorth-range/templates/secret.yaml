{{- /*
Every secret the platform needs. No defaults: a missing value fails the render and names
the setting, and a known default ("changeme", "minioadmin", ...) or a too-short key is
refused, mirroring what app/settings.py refuses at start-up under TN_ENV=production.

secrets.existingSecret: bring your own Secret with the same keys (see values.yaml); the
chart then renders none of this and reads that one.
*/ -}}
{{- if not .Values.secrets.existingSecret -}}
{{- $weak := list "forge" "postgres" "password" "changeme" "change-me" "secret" "admin" "minioadmin" "truenorth" "redis" -}}
{{- $s := .Values.secrets -}}
{{- $need := dict
      "databasePassword" (dict "key" "DATABASE_PASSWORD" "min" 16)
      "redisPassword" (dict "key" "REDIS_PASSWORD" "min" 16)
      "minioAccessKey" (dict "key" "MINIO_ACCESS_KEY" "min" 3)
      "minioSecretKey" (dict "key" "MINIO_SECRET_KEY" "min" 16)
      "csrfSecret" (dict "key" "CSRF_SECRET" "min" 32)
      "secretsKey" (dict "key" "TN_SECRETS_KEY" "min" 32)
      "aiServiceToken" (dict "key" "AI_SERVICE_TOKEN" "min" 32)
      "metricsScrapeToken" (dict "key" "METRICS_SCRAPE_TOKEN" "min" 32)
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "truenorth-range.fullname" . }}-secret
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $spec := $need }}
  {{- $raw := get $s $name }}
  {{- if and $raw (not (kindIs "string" $raw)) }}
  {{- /* A hex value such as 1234e567 or all digits parses as a YAML number and comes
         back altered (1.234e+570): quote it. */}}
  {{- fail (printf "secrets.%s must be a quoted string (YAML read it as a %s)" $name (kindOf $raw)) }}
  {{- end }}
  {{- $v := required (printf "secrets.%s is required (%s), or set secrets.existingSecret" $name $spec.key) (get $s $name) | toString }}
  {{- /* `if $v`: `helm lint` turns a missing `required` into "" and carries on. */}}
  {{- if and $v (has (lower $v) $weak) }}
  {{- fail (printf "secrets.%s (%s) is a known default; generate one (openssl rand -hex 32)" $name $spec.key) }}
  {{- end }}
  {{- if and $v (lt (len $v) (int $spec.min)) }}
  {{- fail (printf "secrets.%s (%s) is shorter than %d characters" $name $spec.key (int $spec.min)) }}
  {{- end }}
  {{ $spec.key }}: {{ $v | b64enc | quote }}
  {{- end }}
  {{- if .Values.opensearch.securityDisabled }}
  OPENSEARCH_USER: ""
  OPENSEARCH_PASS: ""
  {{- else }}
  OPENSEARCH_USER: {{ required "opensearch.username is required (the OpenSearch security plugin is on)" .Values.opensearch.username | b64enc | quote }}
  OPENSEARCH_PASS: {{ required "secrets.opensearchPassword is required (the OpenSearch security plugin is on; opensearch.securityDisabled is a lab/dev override only)" $s.opensearchPassword | b64enc | quote }}
  {{- end }}
  {{- /* Optional: the Keycloak admin login for /ad-sync and the bootstrap admin
         (app/bootstrap_admin.py), and the confidential API client's secret. */}}
  {{- with $s.keycloakAdminPassword }}
  KEYCLOAK_ADMIN_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.keycloakClientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ . | b64enc | quote }}
  {{- end }}
  {{- if .Values.flower.enabled }}
  FLOWER_BASIC_AUTH: {{ required "secrets.flowerBasicAuth (user:password) is required when flower.enabled" $s.flowerBasicAuth | b64enc | quote }}
  {{- end }}
  {{- with $s.openaiApiKey }}
  OPENAI_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with $s.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- range $k, $v := $s.extraEnv }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
