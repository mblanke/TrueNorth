{{- if .Values.flower.enabled -}}
{{- /* Celery monitoring. Off by default and never on the ingress; its NetworkPolicy
       admits nothing, so reach it with `kubectl port-forward svc/<release>-flower 5555`.
       Runs from the worker image, as compose.prod.yml does. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenorth-range.fullname" . }}-flower
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "flower") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "flower") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "flower") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "truenorth-range.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "truenorth-range.podSecurityContext" (dict "root" . "uid" 10001) | nindent 8 }}
      {{- with .Values.flower.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.flower.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "truenorth-range.scratchVolumes" . | nindent 8 }}
      containers:
        - name: flower
          image: {{ include "truenorth-range.image" (dict "name" "worker" "root" .) }}
          imagePullPolicy: {{ include "truenorth-range.imagePullPolicy" (dict "name" "worker" "root" .) }}
          command:
            - sh
            - -c
            # Flower reads FLOWER_BASIC_AUTH from its environment; as --basic_auth it was a
            # process argument, readable by anyone who can list processes.
            - exec celery -A worker.celery_app flower --port=5555
          ports:
            - name: http
              containerPort: 5555
              protocol: TCP
          securityContext:
            {{- include "truenorth-range.containerSecurityContext" (dict "uid" 10001) | nindent 12 }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "truenorth-range.secretName" . }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: {{ include "truenorth-range.redisUrl" . | quote }}
            - name: FLOWER_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "truenorth-range.secretName" . }}
                  key: FLOWER_BASIC_AUTH
          volumeMounts:
            {{- include "truenorth-range.scratchVolumeMounts" . | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.flower.resources | nindent 12 }}
{{- end }}
