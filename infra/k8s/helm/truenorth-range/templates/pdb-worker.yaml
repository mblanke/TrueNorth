{{- /* Worker PodDisruptionBudgets: one pod per queue group at a time. A drained worker
       gets terminationGracePeriodSeconds to finish its task (Celery warm shutdown). */ -}}
{{- range $c := list (dict "key" "workerProvision" "component" "worker-provision") (dict "key" "workerScenario" "component" "worker-scenario") (dict "key" "workerTelemetry" "component" "worker-telemetry") }}
{{- $v := index $.Values $c.key }}
{{- if and $v.enabled $v.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "truenorth-range.fullname" $ }}-{{ $c.component }}
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" $ "component" $c.component) | nindent 4 }}
spec:
  maxUnavailable: {{ $v.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" $ "component" $c.component) | nindent 6 }}
{{- end }}
{{- end }}
