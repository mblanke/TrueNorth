spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "worker-scenario") | nindent 6 }}
{{- end }}
---
{{- if .Values.workerTelemetry.enabled -}}
apiVersion: policy/v1
