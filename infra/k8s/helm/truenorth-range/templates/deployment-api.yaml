{{- if .Values.api.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenorth-range.fullname" . }}-api
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "truenorth-range.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "truenorth-range.podSecurityContext" (dict "root" . "uid" 10001) | nindent 8 }}
      {{- if .Values.api.podAntiAffinity }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "api") | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- else if .Values.api.affinity }}
      affinity:
        {{- toYaml .Values.api.affinity | nindent 8 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Migrations are not run here: see job-migrate.yaml (a pre-install/pre-upgrade hook).
      # The scenario engine is a library the api reads from SCENARIO_ENGINE_DIR (it is
      # not a service); its image is the source, copied into an emptyDir at start.
      initContainers:
        - name: scenario-engine
          image: {{ include "truenorth-range.image" (dict "name" "scenarioEngine" "root" .) }}
          imagePullPolicy: {{ include "truenorth-range.imagePullPolicy" (dict "name" "scenarioEngine" "root" .) }}
          command: ["sh", "-c", "cp -R /app/. /opt/scenario-engine/"]
          securityContext:
            {{- include "truenorth-range.containerSecurityContext" (dict "uid" 10001) | nindent 12 }}
          volumeMounts:
            - name: scenario-engine
              mountPath: /opt/scenario-engine
          resources:
            {{- toYaml .Values.api.initResources | nindent 12 }}
      volumes:
        {{- include "truenorth-range.scratchVolumes" . | nindent 8 }}
        - name: scenario-engine
          emptyDir:
            sizeLimit: 64Mi
        {{- with (include "truenorth-range.opensearchCaVolumes" .) }}
        {{- . | trim | nindent 8 }}
        {{- end }}
      containers:
        - name: api
          image: {{ include "truenorth-range.image" (dict "name" "api" "root" .) }}
          imagePullPolicy: {{ include "truenorth-range.imagePullPolicy" (dict "name" "api" "root" .) }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- include "truenorth-range.containerSecurityContext" (dict "uid" 10001) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "truenorth-range.fullname" . }}-config
            - secretRef:
                name: {{ include "truenorth-range.secretName" . }}
          env:
            - name: DATABASE_URL
              value: {{ include "truenorth-range.databaseUrl" . | quote }}
            - name: REDIS_URL
              value: {{ include "truenorth-range.redisUrl" . | quote }}
            - name: UVICORN_WORKERS
              value: {{ .Values.api.uvicornWorkers | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "truenorth-range.scratchVolumeMounts" . | nindent 12 }}
            - name: scenario-engine
              mountPath: /opt/scenario-engine
              readOnly: true
            {{- with (include "truenorth-range.opensearchCaVolumeMounts" .) }}
            {{- . | trim | nindent 12 }}
            {{- end }}
          # Liveness touches no dependency (a database outage must not restart every
          # api pod); readiness is 503 until the database, Redis and OpenSearch answer.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
