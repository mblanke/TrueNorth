apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "truenorth-range.fullname" . }}-config
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
data:
  DATABASE_HOST: {{ .Values.config.databaseHost | default (printf "%s-postgresql" (include "truenorth-range.fullname" .)) | quote }}
  DATABASE_PORT: {{ .Values.config.databasePort | quote }}
  DATABASE_NAME: {{ .Values.config.databaseName | quote }}
  DATABASE_USER: {{ .Values.config.databaseUser | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | default (printf "%s-redis-master" (include "truenorth-range.fullname" .)) | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  REDIS_DB: {{ .Values.config.redisDB | quote }}
  OPENSEARCH_URL: {{ .Values.config.opensearchUrl | quote }}
  MINIO_ENDPOINT: {{ include "truenorth-range.minioEndpoint" . | quote }}
  MINIO_PORT: {{ .Values.config.minioPort | quote }}
  MINIO_BUCKET: {{ .Values.config.minioBucket | quote }}
  MINIO_USE_SSL: {{ .Values.config.minioUseSSL | quote }}
  KEYCLOAK_URL: {{ include "truenorth-range.keycloakUrl" . | quote }}
  KEYCLOAK_REALM: {{ .Values.config.keycloakRealm | quote }}
  OLLAMA_NODES: {{ .Values.aiOrchestrator.ollamaNodes | quote }}
  PROVISIONER_BACKEND: {{ .Values.config.provisionerBackend | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}