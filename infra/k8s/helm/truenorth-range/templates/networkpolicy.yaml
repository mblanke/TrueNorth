{{- if .Values.networkPolicy.enabled -}}
{{- $np := .Values.networkPolicy -}}
{{- $egress := $np.egress -}}
# Ingress is restricted for every component. Egress is restricted only with
# networkPolicy.egress.enabled: the datastores, Keycloak, OpenSearch, vCenter and the
# model endpoint live outside the chart at addresses only the operator knows, so the
# allowed destinations are theirs to list (networkPolicy.egress.to).
# ---------------------------------------------------------------------------
# API Network Policy
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "truenorth-range.fullname" . }}-api
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
  egress:
    {{- include "truenorth-range.egressRules" . | nindent 4 }}
    {{- end }}
  ingress:
    # The ingress controller, and this release's own pods (workers, the helm test).
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressControllerNamespaceSelector | nindent 12 }}
        - podSelector:
            matchLabels:
              {{- include "truenorth-range.selectorLabels" . | nindent 14 }}
        {{- with $np.metricsNamespaceSelector }}
        # Prometheus (GET /metrics also needs METRICS_SCRAPE_TOKEN).
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
---
# ---------------------------------------------------------------------------
# Worker Network Policy (provision, scenario, telemetry)
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "truenorth-range.fullname" . }}-workers
  labels:
    {{- include "truenorth-range.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "truenorth-range.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - worker-provision
          - worker-scenario
          - worker-telemetry
          - beat
          - migrate
  # Nothing connects to a worker, beat or the migration Job: no ingress rule, so all
  # inbound traffic is denied.
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
  egress:
    {{- include "truenorth-range.egressRules" . | nindent 4 }}
    {{- end }}
---
# ---------------------------------------------------------------------------
# AI Orchestrator Network Policy
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "truenorth-range.fullname" . }}-ai-orchestrator
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "ai-orchestrator") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "ai-orchestrator") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
  egress:
    {{- include "truenorth-range.egressRules" . | nindent 4 }}
    {{- end }}
  ingress:
    # Only the api and the Celery workers call the orchestrator (with AI_SERVICE_TOKEN).
    # Not the ingress controller: it is not published.
    - from:
        - podSelector:
            matchLabels:
              {{- include "truenorth-range.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - worker-provision
                  - worker-scenario
                  - worker-telemetry
      ports:
        - protocol: TCP
          port: 6000
---
# ---------------------------------------------------------------------------
# Web (frontend) Network Policy
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "truenorth-range.fullname" . }}-web
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
  egress:
    {{- include "truenorth-range.egressRules" . | nindent 4 }}
    {{- end }}
  ingress:
    # The ingress controller, and this release's own pods (the helm test).
    - from:
        - namespaceSelector:
            {{- toYaml $np.ingressControllerNamespaceSelector | nindent 12 }}
        - podSelector:
            matchLabels:
              {{- include "truenorth-range.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080  # the pod's port (unprivileged nginx); the Service still listens on 80
{{- if .Values.flower.enabled }}
---
# ---------------------------------------------------------------------------
# Flower: no ingress rule, so nothing in the cluster reaches it. kubectl port-forward
# (through the kubelet) still works for an operator.
# ---------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "truenorth-range.fullname" . }}-flower
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "flower") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "flower") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egress.enabled }}
    - Egress
  egress:
    {{- include "truenorth-range.egressRules" . | nindent 4 }}
    {{- end }}
{{- end }}
{{- end }}