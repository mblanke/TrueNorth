{{- if .Values.aiOrchestrator.enabled -}}
{{- $secret := include "truenorth-range.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenorth-range.fullname" . }}-ai-orchestrator
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "ai-orchestrator") | nindent 4 }}
spec:
  replicas: {{ .Values.aiOrchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "ai-orchestrator") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "ai-orchestrator") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "truenorth-range.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "truenorth-range.podSecurityContext" (dict "root" . "uid" 10001) | nindent 8 }}
      {{- with .Values.aiOrchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiOrchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aiOrchestrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- include "truenorth-range.scratchVolumes" . | nindent 8 }}
      containers:
        - name: ai-orchestrator
          image: {{ include "truenorth-range.image" (dict "name" "aiOrchestrator" "root" .) }}
          imagePullPolicy: {{ include "truenorth-range.imagePullPolicy" (dict "name" "aiOrchestrator" "root" .) }}
          ports:
            - name: http
              containerPort: 6000
              protocol: TCP
          securityContext:
            {{- include "truenorth-range.containerSecurityContext" (dict "uid" 10001) | nindent 12 }}
          # Only what the orchestrator uses, not the platform's whole Secret.
          env:
            - name: TN_ENV
              value: {{ .Values.config.tnEnv | quote }}
            - name: TN_VERSION
              value: {{ .Values.version | default (printf "v%s" .Chart.AppVersion) | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # Every route but /health needs it; production refuses to start without one.
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: AI_SERVICE_TOKEN
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: {{ include "truenorth-range.redisUrlForDb" (dict "root" . "db" .Values.aiOrchestrator.redisDb) | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: ANTHROPIC_API_KEY
                  optional: true
            {{- if and (eq (toString .Values.aiOrchestrator.env.AI_MODEL_BACKEND) "openai") (not .Values.aiOrchestrator.env.OPENAI_BASE_URL) }}
            {{- fail "aiOrchestrator.env.OPENAI_BASE_URL is required with AI_MODEL_BACKEND=openai (the site's LiteLLM endpoint, e.g. http://<host>:4000/v1); there is no default" }}
            {{- end }}
            {{- range $k, $v := .Values.aiOrchestrator.env }}
            {{- if ne (toString $v) "" }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.aiOrchestrator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "truenorth-range.scratchVolumeMounts" . | nindent 12 }}
          # The orchestrator has one public route, /health (app/main.py PUBLIC_PATHS).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- $res := deepCopy .Values.aiOrchestrator.resources }}
          {{- if .Values.aiOrchestrator.gpu.enabled }}
          {{- /* A GPU is requested as a limit; Kubernetes sets the request equal. */}}
          {{- $_ := set $res.limits .Values.aiOrchestrator.gpu.resourceKey (.Values.aiOrchestrator.gpu.resourceValue | toString) }}
          {{- end }}
          resources:
            {{- toYaml $res | nindent 12 }}
{{- end }}
