{{- if .Values.flower.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "truenorth-range.fullname" . }}-flower
  labels:
    {{- include "truenorth-range.componentLabels" (dict "context" . "component" "flower") | nindent 4 }}
spec:
  # Never exposed: ClusterIP only, no ingress path (reach it with kubectl port-forward).
  type: ClusterIP
  ports:
    - port: {{ .Values.flower.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "truenorth-range.componentSelectorLabels" (dict "context" . "component" "flower") | nindent 4 }}
{{- end }}