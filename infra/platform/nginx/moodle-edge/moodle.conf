# =============================================================================
# TrueNorth Range — Moodle edge (moodle-edge in compose.moodle-prod.yml)
# =============================================================================
# This directory is /etc/nginx/conf.d of the Moodle edge, whose nginx.conf is the
# platform edge's own (../nginx.conf), so this file is http context. The TLS parameters
# and the header maps are the platform edge's files, mounted under /etc/nginx/tn/
# rather than copied, so the two edges cannot drift apart.
#
# https://<DOMAIN>:<MOODLE_PUBLIC_PORT>/ -> moodle:8080. Moodle answers only on its
# wwwroot (https://<DOMAIN>:<port>), so the Host header goes through as the browser
# sent it, port included, and X-Forwarded-Proto says https (Moodle runs with sslproxy).
# No X-Forwarded-Port: the image takes the public port from MOODLE_PUBLIC_PORT
# (hooks/99-public-port.sh), the same for browsers and for the API's internal calls.
# =============================================================================

include /etc/nginx/tn/ssl-params.conf;
include /etc/nginx/tn/edge-access.conf;

upstream moodle_backend {
    server moodle:8080;
    keepalive 16;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/truenorth.crt;
    ssl_certificate_key /etc/nginx/ssl/truenorth.key;

    # Moodle sends its own CSP and X-Frame-Options; the fallbacks apply only when it does
    # not, and HSTS, nosniff and the rest are the platform's (snippets/).
    include /etc/nginx/snippets/security-headers-upstream.conf;

    # Moodle's own upload limit (the image's client_max_body_size and post_max_size).
    client_max_body_size 50M;
    client_body_timeout  120s;

    location / {
        proxy_pass http://moodle_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID      $req_id;
        # Publishing a course with questions, a restore or a backup takes a while.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# The container's healthcheck, on loopback only.
server {
    listen 127.0.0.1:8081;
    server_name _;
    location = /health {
        access_log off;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
