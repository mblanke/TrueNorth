# =============================================================================
# TrueNorth Range — Main Nginx Configuration
# Production-grade reverse proxy
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── JSON structured logging ──────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_id":"$request_id"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # ── Core settings ────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Client limits ────────────────────────────────────────────────────────
    client_max_body_size  50M;
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/html
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ── Real IP from trusted proxies ─────────────────────────────────────────
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.1/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_zone:10m        rate=100r/s;
    limit_req_zone $binary_remote_addr zone=provision_zone:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m       rate=20r/s;

    # ── Connection limiting ──────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn conn_per_ip 100;

    # ── Request ID for tracing ───────────────────────────────────────────────
    map $http_x_request_id $request_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # ── Include virtual hosts / upstreams ────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}