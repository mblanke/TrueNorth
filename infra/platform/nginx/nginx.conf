# =============================================================================
# TrueNorth Range — Main Nginx Configuration
# Production-grade reverse proxy
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # cmi5 launch URLs carry the session's one-time fetch secret in their query (fetch=...),
    # and a page opened from one sends it on as its Referer: neither is ever logged.
    map $request $tn_request_logged {
        "~^(?<tn_a>.*[?&]fetch=)[^& ]*(?<tn_b>.*)$" "${tn_a}<redacted>${tn_b}";
        default $request;
    }
    map $http_referer $tn_referer_logged {
        "~^(?<tn_ra>.*[?&]fetch=)[^&]*(?<tn_rb>.*)$" "${tn_ra}<redacted>${tn_rb}";
        default $http_referer;
    }
    # ... and a cmi5 module page refers nowhere at all (security-headers-common.conf).
    map $request_uri $tn_referrer_policy {
        "~^/au/" "no-referrer";
        default  "strict-origin-when-cross-origin";
    }

    # ── JSON structured logging ──────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$tn_request_logged",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$tn_referer_logged",'
            '"http_user_agent":"$http_user_agent",'
            '"request_id":"$req_id"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    # ── Core settings ────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Client limits ────────────────────────────────────────────────────────
    # 1m by default. conf.d/truenorth.conf raises it where a body is expected: 10M on
    # /api/ (the API's own JSON cap) and 50M only on the multipart upload routes.
    client_max_body_size  1m;
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # ── Upstream timeouts (defaults; long-running locations override) ────────
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ── Real IP from trusted proxies ─────────────────────────────────────────
    # This nginx is the edge: only a load balancer in front of it may name the client.
    # It trusted every RFC 1918 address, so any on-premises client (they all are) could
    # send X-Forwarded-For and become whoever it liked here and, through the forwarded
    # header, at the API. Add your load balancer's address if there is one.
    set_real_ip_from  127.0.0.1/32;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Rate limiting zones ──────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_zone:10m        rate=100r/s;
    limit_req_zone $binary_remote_addr zone=provision_zone:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m       rate=20r/s;
    # Keycloak's token endpoint (password and refresh grants): the brute-force target.
    limit_req_zone $binary_remote_addr zone=token_zone:10m      rate=5r/s;
    # Calendar feeds: clients poll every few minutes; the token is in the path.
    limit_req_zone $binary_remote_addr zone=feed_zone:10m       rate=1r/s;
    # Noise agents. Many agents can share one NATed range address, hence the headroom.
    limit_req_zone $binary_remote_addr zone=noise_agent_zone:10m rate=20r/s;
    # 429 tells a client to back off; nginx's default 503 reads as an outage.
    limit_req_status 429;

    # ── Connection limiting ──────────────────────────────────────────────────
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_conn conn_per_ip 100;

    # ── Request ID for tracing ───────────────────────────────────────────────
    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # ── Include virtual hosts / upstreams ────────────────────────────────────
    # conf.d/*.conf is http context. Fragments included inside a server or location
    # live in /etc/nginx/snippets/ so this glob does not load them a second time.
    include /etc/nginx/conf.d/*.conf;
}