# =============================================================================
# TrueNorth Range — Main HTTPS Server Block
# =============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Catch-all. This was `truenorth.local *.truenorth.local`, which matched no
    # deployed hostname — and `.local` is mDNS, which the deployment standard
    # forbids. This is the only 443 server block, so serving whatever ${DOMAIN}
    # resolves to is both correct and one less thing to template at install time.
    server_name _;

    # ── SSL Configuration ────────────────────────────────────────────────────
    # Protocols, ciphers, session cache and OCSP stapling: conf.d/ssl-params.conf,
    # loaded once at http level.
    ssl_certificate     /etc/nginx/ssl/truenorth.crt;
    ssl_certificate_key /etc/nginx/ssl/truenorth.key;

    # ── Security headers ─────────────────────────────────────────────────────
    # The SPA policy is the server default. nginx drops inherited add_header lines in
    # any location that declares its own, so every location below that adds a header
    # includes a snippets/security-headers*.conf file instead of a bare add_header
    # (tests/contracts/test_edge_nginx.py).
    include /etc/nginx/snippets/security-headers.conf;

    # ── Root / error pages ───────────────────────────────────────────────────
    root /usr/share/nginx/html;

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        # An upload that fails upstream lands here with its body still unread; the
        # 1m default would turn the 502 into a misleading 413.
        client_max_body_size 50M;
    }

    # ── Health endpoint (no rate limit, no auth) ─────────────────────────────
    location = /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets ───────────────────────────────────────────────────────
    # Cache-Control comes from web's nginx ("immutable" for hashed bundles). No SPA
    # fallback here: a missing chunk is a 404, not index.html. The paths of the other
    # back-ends are excluded: this regex used to capture every /api/ and /auth/ URL
    # ending in .js, .css, .png ... (Keycloak's login theme, ticket attachments) and
    # send it to the SPA.
    location ~* ^/(?!api/|auth/|ai/|flower/|ws/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Design previews: framed by the SPA, inline scripts, CSP sandbox ─────
    location ^~ /assets/previews/ {
        include /etc/nginx/snippets/security-headers-preview.conf;
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
    }

    # ── Web Frontend (SPA) ──────────────────────────────────────────────────
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        # SPA fallback — let the frontend router handle 404s
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # Regex locations are tried in the order written and win over the plain prefix
    # locations /api/ and /auth/, so each carves its path out with its own rules.

    # ── Prometheus metrics: internal scrape only (api:8080/metrics), never public ──
    location ~ ^/api/(v1/)?metrics/?$ {
        return 404;
    }

    # ── API operator surfaces: management networks only, 404 elsewhere ──────
    # Interactive docs and the schema map every route; /health/deep reports the
    # versions and reachability of every dependency. Case-insensitive so a
    # case-folding hop behind this one cannot be used to slip past it.
    location ~* ^/api/(v1/)?(docs|redoc|openapi\.json|health/deep)(/|$) {
        include /etc/nginx/snippets/management-only.conf;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # ── Calendar feed: bearer token in the path (ADR 0004), so never logged ──
    location ~ ^/api/(v1/)?schedule/feed/ {
        access_log off;
        limit_req zone=feed_zone burst=10 nodelay;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # ── cmi5 fetch URL: a one-time secret in the path (docs/cmi5.md) ────────
    location ~ ^/api/(v1/)?cmi5/fetch/ {
        access_log off;
        limit_req zone=token_zone burst=10 nodelay;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # ── Noise agents' control channel: allowlisted networks, own rate ───────
    location ~ ^/api/(v1/)?noise/agent/ {
        if ($tn_noise_agent_client != 1) {
            return 403;
        }
        limit_req zone=noise_agent_zone burst=100 nodelay;
        client_max_body_size 1m;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # ── Multipart uploads: the only API routes allowed bodies over 10M ──────
    # Every multipart/form-data operation in docs/interfaces/openapi.json must match
    # this pattern (tests/contracts/test_edge_nginx.py), or it is capped at 10M here.
    location ~ ^/api/(v1/)?(collective-exercises/[^/]+/(mesl|objectives)/import|course-releases|courses/import-(course-content|programme)|curricula/[^/]+/documents|golden-images/import-catalogue|qsp/import-(competency-)?crosswalk|ranges/[^/]+/(description/import|documents)|threat-intel/feeds/[^/]+/upload|tickets/[^/]+/attachments|users/import-csv)/?$ {
        limit_req zone=api_zone burst=50 nodelay;
        client_max_body_size 50M;
        client_body_timeout  120s;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # ── API Backend ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        # The API's own cap on a non-multipart body (InputSanitizationMiddleware).
        client_max_body_size 10M;

        # Strip /api/ prefix → forward as /
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # No CORS here. The SPA calls /api/ on its own origin, so it needs none, and
        # the API's CORSMiddleware owns the allowlist (CORS_ORIGINS). This block used to
        # echo any Origin back with Allow-Credentials: true, which let every site make
        # credentialed calls, and its add_header lines silently dropped HSTS and the
        # rest of the server-level headers on every API response.
        include /etc/nginx/snippets/security-headers-upstream.conf;
    }

    # ── WebSocket endpoint ──────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # ── AI Orchestrator: management networks only ───────────────────────────
    # The SPA never calls this; the API does, over the internal network
    # (AI_ORCHESTRATOR_URL). Kept for operators reaching its /docs from a management
    # network; 404 to everyone else.
    location /ai/ {
        include /etc/nginx/snippets/management-only.conf;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        limit_req zone=provision_zone burst=20 nodelay;
        client_max_body_size 10M;

        rewrite ^/ai/(.*) /$1 break;

        proxy_pass http://ai_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Keycloak operator surfaces: management networks only ────────────────
    # The admin console and its REST API (/auth/admin), the master realm (where the
    # Keycloak administrators log in) and Keycloak's own metrics/health. Matched
    # case-insensitively and also when followed by ";": Keycloak's HTTP layer drops
    # ";matrix" parameters that nginx keeps in the path it matches.
    location ~* "^/auth/(admin|realms/master|metrics|health)([/;]|$)" {
        include /etc/nginx/snippets/management-only.conf;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        limit_req zone=auth_zone burst=30 nodelay;
        client_max_body_size 10M;  # realm and client imports
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    # ── Keycloak token endpoint: its own, tighter rate ──────────────────────
    location ~ ^/auth/realms/[^/]+/protocol/openid-connect/token/?$ {
        limit_req zone=token_zone burst=20 nodelay;
        client_max_body_size 64k;
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    # ── Keycloak / Auth ─────────────────────────────────────────────────────
    location /auth/ {
        limit_req zone=auth_zone burst=30 nodelay;
        # Keycloak's pages carry their own CSP and X-Frame-Options; the SPA policy
        # would break the login theme's inline scripts.
        include /etc/nginx/snippets/security-headers-upstream.conf;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    # ── Flower (Celery monitoring): management networks only ───────────────
    # Was allow 10/8, 172.16/12, 192.168/16: every on-premises client, students too.
    location /flower/ {
        include /etc/nginx/snippets/management-only.conf;
        include /etc/nginx/snippets/security-headers-upstream.conf;

        proxy_pass http://flower_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # ── Grafana (requires compose.monitoring.yml overlay) ──────────────────
    # location /grafana/ {
    #     proxy_pass http://grafana_backend;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    # }
}

# ── WebSocket upgrade map (must be in http context, loaded via include) ──────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}