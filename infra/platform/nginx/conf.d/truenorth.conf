# =============================================================================
# TrueNorth Range — Main HTTPS Server Block
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name truenorth.local *.truenorth.local;

    # ── SSL Configuration ────────────────────────────────────────────────────
    include /etc/nginx/conf.d/ssl-params.conf;
    ssl_certificate     /etc/nginx/ssl/truenorth.crt;
    ssl_certificate_key /etc/nginx/ssl/truenorth.key;

    # ── Security Headers (all responses) ─────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                        always;
    add_header X-Frame-Options           "DENY"                           always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: ws:; frame-ancestors 'none';" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Root / error pages ───────────────────────────────────────────────────
    root /usr/share/nginx/html;

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Health endpoint (no rate limit, no auth) ─────────────────────────────
    location = /health {
        proxy_pass http://api_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Static assets (long cache) ──────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        proxy_pass http://web_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # ── Web Frontend (SPA) ──────────────────────────────────────────────────
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # SPA fallback — let the frontend router handle 404s
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # ── API Backend ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;

        # Strip /api/ prefix → forward as /
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # CORS headers for API routes
        add_header Access-Control-Allow-Origin      "$http_origin"       always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Request-ID" always;
        add_header Access-Control-Allow-Credentials "true"               always;
        add_header Access-Control-Max-Age           "86400"              always;

        # Preflight
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # ── WebSocket endpoint ──────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering     off;
    }

    # ── AI Orchestrator ─────────────────────────────────────────────────────
    location /ai/ {
        limit_req zone=provision_zone burst=20 nodelay;

        rewrite ^/ai/(.*) /$1 break;

        proxy_pass http://ai_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Keycloak / Auth ─────────────────────────────────────────────────────
    location /auth/ {
        limit_req zone=auth_zone burst=30 nodelay;

        proxy_pass http://keycloak_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_buffer_size        128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size  256k;
    }

    # ── Flower (Celery monitoring) — restricted ─────────────────────────────
    location /flower/ {
        # IP restriction: internal networks only
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://flower_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # ── Grafana ─────────────────────────────────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafana_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Grafana WebSocket for live dashboards
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── WebSocket upgrade map (must be in http context, loaded via include) ──────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}