# =============================================================================
# TrueNorth Range — SSL Hardening Parameters
# Mozilla Modern compatibility (TLS 1.2 + 1.3)
# https://ssl-config.mozilla.org/
# =============================================================================

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Modern cipher suite — prioritise AEAD ciphers
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305';

# DH parameters (generate with: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 4096)
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# SSL session caching
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling
ssl_stapling        on;
ssl_stapling_verify on;
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

# HSTS — 2-year max-age
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;