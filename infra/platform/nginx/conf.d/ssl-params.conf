# =============================================================================
# TrueNorth Range — TLS parameters (http context)
# Mozilla "intermediate" (TLS 1.2 + 1.3), https://ssl-config.mozilla.org/
#
# Loaded once at http level by the `include conf.d/*.conf` in nginx.conf and inherited
# by every server. (It used to be included by the 443 server too, which loaded it twice.)
# HSTS is not set here: an add_header at http level is dropped by any server or
# location that declares its own, so it lives with the other security headers in
# snippets/security-headers-common.conf.
# =============================================================================

ssl_protocols TLSv1.2 TLSv1.3;
# TLS 1.3 suites are not configurable here and are all AEAD. For 1.2 the client picks
# from this list: every entry is ECDHE + AEAD. The DHE suites were dropped: without an
# ssl_dhparam nginx never offered them, and they would only add a slow handshake.
ssl_prefer_server_ciphers off;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
ssl_ecdh_curve X25519:prime256v1:secp384r1;

# SSL session caching
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP stapling. Takes effect only when the certificate names an OCSP responder (an
# AD CS CA with an Online Responder does; a self-signed certificate does not, and
# nginx then logs a warning and serves without a staple). To verify the staple, mount
# the issuing CA chain and set:
#   ssl_trusted_certificate /etc/nginx/ssl/ca-chain.crt;
ssl_stapling        on;
ssl_stapling_verify on;
# Docker's embedded DNS, which forwards to the host's resolvers (on-premises AD DNS).
# This was 8.8.8.8: unreachable on an isolated network, and a leak of OCSP lookups
# to a third party on a connected one. Outside Docker, set your site resolver here.
resolver 127.0.0.11 valid=300s ipv6=off;
resolver_timeout 5s;
