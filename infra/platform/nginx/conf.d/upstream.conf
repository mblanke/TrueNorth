# =============================================================================
# TrueNorth Range — Upstream Definitions
# =============================================================================

upstream api_backend {
    least_conn;
    server api:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream ai_backend {
    least_conn;
    server ai-orchestrator:6000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream web_frontend {
    server web:80;
    keepalive 16;
}

upstream flower_backend {
    server flower:5555;
}

upstream grafana_backend {
    server grafana:3000;
}

upstream keycloak_backend {
    server keycloak:8080;
}