# =============================================================================
# TrueNorth Range — edge access maps (http context)
# =============================================================================

# Both lists are checked as "!= 1", so anything not listed, including an empty value
# when an operator's replacement file has no `default`, is refused.

# Operator surfaces (snippets/management-only.conf). Default deny; the list is
# snippets/management-cidrs.conf, empty as shipped.
geo $tn_management_client {
    default 0;
    include /etc/nginx/snippets/management-cidrs.conf;
}

# Noise-agent control channel, /api/noise/agent/. The default lives in the include
# (`default 1;` as shipped, i.e. allow all); see snippets/noise-agent-cidrs.conf.
geo $tn_noise_agent_client {
    include /etc/nginx/snippets/noise-agent-cidrs.conf;
}

# Header fallbacks for proxied back-ends (snippets/security-headers-upstream.conf):
# empty, so nothing is added, when the upstream set its own value.
map $upstream_http_content_security_policy $tn_csp_fallback {
    volatile;
    ""      "frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
    default "";
}

map $upstream_http_x_frame_options $tn_xfo_fallback {
    volatile;
    ""      "SAMEORIGIN";
    default "";
}
