# =============================================================================
# Security headers for locations proxied to the API, Keycloak and the other
# back-ends, which set their own Content-Security-Policy and X-Frame-Options per
# response (the API's AAR page, Keycloak's login theme). The SPA policy would break
# those pages, so it is not imposed here: the upstream's value passes through, and
# $tn_csp_fallback / $tn_xfo_fallback (conf.d/edge-access.conf) supply one only when
# the upstream sent none. An empty add_header value adds nothing.
# =============================================================================

include /etc/nginx/snippets/security-headers-common.conf;

add_header X-Frame-Options         $tn_xfo_fallback always;
add_header Content-Security-Policy $tn_csp_fallback always;
