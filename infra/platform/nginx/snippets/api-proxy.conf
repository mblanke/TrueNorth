# =============================================================================
# Proxy to the API with the /api prefix stripped: the same settings as
# `location /api/` in conf.d/truenorth.conf, for the regex locations that carve paths
# out of it with their own limits. Timeouts and body size are set per location.
# =============================================================================

rewrite ^/api/(.*) /$1 break;
proxy_pass http://api_backend;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwrite, never append: the API believes this header from us (TRUSTED_PROXY_CIDRS).
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $req_id;

proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_buffering off;
