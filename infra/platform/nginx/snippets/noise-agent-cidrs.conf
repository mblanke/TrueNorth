# =============================================================================
# Networks noise agents may call /api/noise/agent/ from: the edge equivalent of the
# API's NOISE_AGENT_CIDRS. Body of a `geo` block; one `<CIDR> 1;` per line. Anyone
# else gets 403 at the edge.
#
# DEFAULT: ALLOW ALL (the `default 1;` below), so an upgrade does not cut off agents
# that are already deployed. Agents should reach the API over the management network
# only, so replace that line with that network, e.g.
#
#   10.255.0.0/24   1;
#
# (with no `default` line, every address not listed is refused) and set
# NOISE_AGENT_CIDRS on the API to the same value: the API check still applies
# when a request reaches it some other way. Mount a replacement at
# /etc/nginx/snippets/noise-agent-cidrs.conf and reload nginx to change it without a
# rebuild.
# =============================================================================

default 1;
