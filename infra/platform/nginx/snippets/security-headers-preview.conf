# =============================================================================
# Security headers for /assets/previews/: static design mock-ups that the SPA frames
# (features/learning-preview). They run inline scripts, which the SPA policy forbids,
# so they get their own policy that allows inline script and in exchange puts them in
# a CSP sandbox: an opaque origin with no access to the SPA's storage or tokens. The
# SPA's <iframe sandbox="allow-scripts"> does the same; this makes it hold when the
# file is opened directly.
# =============================================================================

include /etc/nginx/snippets/security-headers-common.conf;

proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;

add_header X-Frame-Options         "SAMEORIGIN" always;
add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;
