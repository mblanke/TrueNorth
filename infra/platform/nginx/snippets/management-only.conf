# =============================================================================
# Answer 404 unless the client is on a management network
# (snippets/management-cidrs.conf). Include first in any location that exposes an
# operator surface: API docs and deep health, the Keycloak admin console and master
# realm, the AI orchestrator, Flower. 404 rather than 403, so a scan from a training
# network cannot tell which of them exist.
# =============================================================================

if ($tn_management_client != 1) {
    return 404;
}
