# =============================================================================
# Security headers for the Angular SPA's documents (server default).
#
# Content-Security-Policy, directive by directive:
#   script-src  'self' only: no 'unsafe-eval' and no 'unsafe-inline'. The production
#               bundle has two eval sites, neither on a path the app runs: echarts'
#               JSON.parse fallback (only without a JSON global) and lottie-web's
#               After Effects expressions (src/assets/lottie/*.json carry none).
#               Two hashes:
#                 - "this.media='all'", the onload handler Angular's critical-CSS
#                   inliner puts on the stylesheet <link> in index.html. Allowed with
#                   'unsafe-hashes' for that exact handler and nothing else; without it
#                   the stylesheet stays media=print and the app renders unstyled.
#                 - the one-line script in assets/silent-check-sso.html, keycloak-js's
#                   silent SSO target.
#               tests/contracts/test_edge_nginx.py recomputes both hashes, so editing
#               that page without updating this policy fails CI.
#   style-src   keeps 'unsafe-inline': Angular emits component styles as inline <style>
#               and Material sets style attributes. Removing it needs autoCsp/nonces.
#   connect-src same origin, plus wss:// to this host for the API's WebSocket channel.
#   frame-src / frame-ancestors 'self': the SPA frames its own pages (silent SSO,
#               design previews); nothing else may frame it.
#
# Keycloak: the runtime config points keycloak-js at /auth, same origin, so it needs
# nothing here. If TN_KEYCLOAK_URL is set to an absolute URL on another origin, add
# that origin to connect-src and frame-src.
# =============================================================================

include /etc/nginx/snippets/security-headers-common.conf;

proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;

add_header X-Frame-Options         "SAMEORIGIN" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=' 'sha256-0zZPgsifJ8h8aM+gmSxkrfNtAGUZb7ItVug6/j1UR5g='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; frame-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
