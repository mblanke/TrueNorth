# =============================================================================
# Security headers every response gets, whatever served it.
#
# nginx inherits add_header from the enclosing block only when a block declares none of
# its own. A location that adds even one header (Cache-Control, say) silently drops all
# of these. So no location here uses a bare add_header: each includes one of
#   security-headers.conf           the SPA's documents (strict CSP)
#   security-headers-upstream.conf  the API and Keycloak, which send their own CSP
#   security-headers-preview.conf   the sandboxed design previews
# all of which include this file. tests/contracts/test_edge_nginx.py enforces it.
#
# The upstream's copies are hidden first so a response never carries two values.
# proxy_hide_header follows the same inheritance rule as add_header, which is one more
# reason the whole set travels together in these snippets.
# =============================================================================

proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-XSS-Protection;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff"                                        always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"                always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"       always;
# The XSS auditor is gone from every current browser, and "1; mode=block" could be
# abused for cross-site leaks where it survived. "0" is the current recommendation.
add_header X-XSS-Protection          "0"                                              always;
