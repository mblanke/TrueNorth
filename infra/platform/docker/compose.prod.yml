# TrueNorth Range — Production Docker Compose
# Designed for 1,200+ users / 70,000 VMs with full observability
# Usage: docker compose -f compose.prod.yml --env-file .env.production up -d
# Prerequisites: .env.production configured, SSL certs at /etc/ssl/truenorth/
#
# Deployed by digest, never built on the target. The TrueNorth images are
# ${TN_IMAGE_<SERVICE>}: image@sha256 refs the installer renders from the release's
# release-manifest.json (docs/release.md, install/README.md "Images"). To build from a
# checkout instead, add compose.build.yml (it adds the `build:` sections back):
#   TN_IMAGE_API=truenorth-api:local ... docker compose -f compose.prod.yml -f compose.build.yml build
# Third-party images are pinned by digest too; the tag beside it is for the reader.
#
# Every service is hardened with x-hardened (read-only root filesystem, no capabilities,
# no privilege escalation) unless its block says why not; writable paths are tmpfs or
# volumes. tests/contracts/test_runtime_hardening.py holds these rules.

# The installer interface this file speaks: the env variables it requires, the paths it
# mounts, the services the installer orders. Equal to install/COMPAT; the installer
# refuses to deploy a checkout whose value differs (roles/tn_app_source), so an installer
# cannot drive an app it does not understand. Bump BOTH in the change that breaks it
# (tests/contracts/test_installer_v1.py).
x-truenorth-installer-compat: 1

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # ================================================================
  #  DATA STORES
  # ================================================================
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: always
    <<: *hardened
    # The entrypoint starts as root, fixes the data directory's owner, then drops to
    # postgres (gosu): these are what that needs, and nothing else.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Consumed by postgres-init/10-create-databases.sh to give Keycloak and the
      # LRS their own databases instead of sharing the application's.
      KEYCLOAK_DB: ${KEYCLOAK_DB:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      LRS_DB: ${LRS_DB:-lrs}
      LRS_DB_USER: ${LRS_DB_USER:-lrs}
      LRS_DB_PASSWORD: ${LRS_DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Runs only on first initialisation of the data directory.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c max_connections=1000
        -c shared_buffers=4GB
        -c effective_cache_size=8GB
        -c work_mem=64MB
        -c maintenance_work_mem=1GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=64MB
        -c default_statistics_target=500
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c min_wal_size=2GB
        -c max_wal_size=8GB
        -c max_worker_processes=16
        -c max_parallel_workers_per_gather=8
        -c max_parallel_workers=16
        -c max_parallel_maintenance_workers=8
        -c huge_pages=try
        -c wal_compression=on
        -c logging_collector=on
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_lock_waits=on
        -c track_io_timing=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 12G
        reservations:
          cpus: "4"
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  pgbouncer:
    # 1.22.0 was never published (only -pN builds are); this is the tag dev runs.
    image: edoburu/pgbouncer:v1.25.1-p0@sha256:4a8371e79d6627e74f553d0aaa8e4c5ace20e30034fb296e569b71c89c99e108
    restart: always
    <<: *hardened
    # The entrypoint writes pgbouncer.ini and userlist.txt from the environment.
    tmpfs:
      - /etc/pgbouncer:uid=70,gid=70,mode=0700
      - /tmp
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 4000
      DEFAULT_POOL_SIZE: 200
      MIN_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 50
      RESERVE_POOL_TIMEOUT: 3
      SERVER_RESET_QUERY: DISCARD ALL
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: always
    <<: *hardened
    # Root entrypoint: chown the data directory, then drop to redis.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    tmpfs:
      - /tmp
    # Redis is the Celery BROKER (queued tasks, unacked deliveries) and result backend,
    # not a cache. noeviction: at maxmemory a write is refused (the sender sees the error
    # and RedisHighMemory fires) instead of a queued provision or teardown being evicted
    # silently, which allkeys-lru did. tests/contracts/test_runtime_hardening.py
    #
    # The password is never a process argument (`--requirepass <pw>` showed it to anyone
    # who could list processes): the shell writes it to a config file on the tmpfs, owned
    # by redis and 0600, and the image's entrypoint (which drops to redis) starts
    # redis-server with that file. "$$REDIS_PASSWORD" reaches sh unexpanded.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # redis-cli reads the password from here (the healthcheck), not from -a.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass "%s"\n' "$$REDIS_PASSWORD" > /tmp/redis-auth.conf &&
        chown redis:redis /tmp/redis-auth.conf &&
        exec docker-entrypoint.sh redis-server /tmp/redis-auth.conf
        --maxmemory ${REDIS_MAXMEMORY:-2gb}
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --save 60 10000
        --tcp-backlog 511
        --timeout 300
        --tcp-keepalive 60
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "1"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  minio:
    # Same image as compose.dev.yml: minio/minio is gone from Docker Hub (MinIO stopped
    # publishing community images), so `:latest` failed every fresh pull.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: always
    <<: *hardened
    # Runs as root, but its data directory is owned by uid 1000 (roles/tn_base) and holds
    # files an older install wrote as root: it needs to read and write past ownership.
    cap_add: [DAC_OVERRIDE, FOWNER]
    tmpfs:
      - /tmp
      - /root/.minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN}/minio
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  # ================================================================
  #  SEARCH / TELEMETRY
  # ================================================================
  opensearch:
    image: opensearchproject/opensearch:2.13.0@sha256:2e954ff0e8c9d0f4868b4818150b3aecc92fbb0cc4a24d00dace38ada227291d
    restart: always
    <<: *hardened
    # Writes its keystore into config/ (beside the read-only certificate mounts) at
    # every start, so the root filesystem stays writable. Verified 2026-10-08: read-only
    # fails with "opensearch.keystore.tmp: Read-only file system". No capabilities needed.
    read_only: false
    environment:
      - cluster.name=tn-production
      - node.name=os-node-1
      - discovery.type=single-node
      # One node holds no replica: with the default (1) every index the plugins create
      # (ISM config/history, job-scheduler lock) stays yellow and /health/deep "degraded".
      - cluster.default_number_of_replicas=0
      - plugins.index_state_management.history.number_of_replicas=0
      # Security plugin ON: TLS on HTTP and transport with the installer's internal CA
      # (OPENSEARCH_CERTS_DIR: ca.pem, node.pem, node-key.pem, admin*.pem), and basic
      # auth against internal_users.yml (OPENSEARCH_INTERNAL_USERS: bcrypt hashes of the
      # installer-generated passwords). Never the demo certificates or demo users.
      # OPENSEARCH_DISABLE_SECURITY=true is a lab/dev override only (install/README.md,
      # "OpenSearch"): plain http, no auth; the clients' OPENSEARCH_URL/USER must follow.
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-false}
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - plugins.security.ssl.transport.pemcert_filepath=certs/node.pem
      - plugins.security.ssl.transport.pemkey_filepath=certs/node-key.pem
      - plugins.security.ssl.transport.pemtrustedcas_filepath=certs/ca.pem
      - plugins.security.ssl.transport.enforce_hostname_verification=false
      - plugins.security.ssl.http.enabled=true
      - plugins.security.ssl.http.pemcert_filepath=certs/node.pem
      - plugins.security.ssl.http.pemkey_filepath=certs/node-key.pem
      - plugins.security.ssl.http.pemtrustedcas_filepath=certs/ca.pem
      # The security index is created from the mounted config on first start; later
      # changes (a password rotation) go through securityadmin.sh with the admin cert.
      - plugins.security.allow_default_init_securityindex=true
      # Single-RDN DNs: an -E list setting splits on commas (install/roles/tn_tls/tasks/opensearch.yml).
      - plugins.security.nodes_dn=CN=opensearch
      - plugins.security.authcz.admin_dn=CN=tn-opensearch-admin
      # For the healthcheck only.
      - OPENSEARCH_USER=${OPENSEARCH_USER-admin}
      - OPENSEARCH_PASS=${OPENSEARCH_PASS:-}
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-4g} -Xmx${OPENSEARCH_HEAP:-4g}
      - bootstrap.memory_lock=true
      # Filesystem snapshot repositories may live only here: the os-snapshots bind
      # ($TN_DATA_ROOT/opensearch-snapshots). The installer registers tn_snapshots in it
      # (telemetry.pipelines.bootstrap) and scripts/backup/backup.sh snapshots into it.
      - path.repo=/usr/share/opensearch/snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data:/usr/share/opensearch/data
      - os-snapshots:/usr/share/opensearch/snapshots
      - ${OPENSEARCH_CERTS_DIR:-./opensearch/certs}:/usr/share/opensearch/config/certs:ro
      - ${OPENSEARCH_INTERNAL_USERS:-./opensearch/internal_users.yml}:/usr/share/opensearch/config/opensearch-security/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$DISABLE_SECURITY_PLUGIN\" = true ]; then curl -sf http://localhost:9200/_cluster/health; else curl -sf --cacert config/certs/ca.pem -u \"$$OPENSEARCH_USER:$$OPENSEARCH_PASS\" https://localhost:9200/_cluster/health; fi >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 10G
        reservations:
          cpus: "2"
          memory: 8G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0@sha256:d8f4442da4d0cb44865a5eab01c9eb9f00769e2d5f053d21e3ff3c64a50fc6ec
    restart: always
    <<: *hardened
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /usr/share/opensearch-dashboards/data:uid=1000,gid=1000
    environment:
      - OPENSEARCH_HOSTS=["${OPENSEARCH_URL:-https://opensearch:9200}"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-false}
      # The reserved kibanaserver account (internal_users.yml), its own password.
      - OPENSEARCH_USERNAME=kibanaserver
      - OPENSEARCH_PASSWORD=${OPENSEARCH_DASHBOARDS_PASS:-}
      - OPENSEARCH_SSL_VERIFICATIONMODE=full
      - OPENSEARCH_SSL_CERTIFICATEAUTHORITIES=["/usr/share/opensearch-dashboards/config/certs/ca.pem"]
    volumes:
      - ${OPENSEARCH_CERTS_DIR:-./opensearch/certs}/ca.pem:/usr/share/opensearch-dashboards/config/certs/ca.pem:ro
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      # 401: up, behind the security plugin's login.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '^(200|401)$$' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  # ================================================================
  #  AUTH
  # ================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    restart: always
    <<: *hardened
    # `start` runs the Quarkus build into /opt/keycloak on first boot (below), so the
    # root filesystem stays writable here. Still no capabilities, no privilege escalation.
    read_only: false
    # NOTE: `start --optimized` requires a prior `kc.sh build`, because KC_DB is a
    # build-time option. The stock image has never been built, so --optimized makes
    # Keycloak refuse to boot. Plain `start` performs the build on first run.
    command: start
    environment:
      KC_DB: postgres
      # Keycloak gets its OWN database. Sharing ${POSTGRES_DB} puts ~90 Keycloak
      # tables beside TrueNorth's 68, and `alembic revision --autogenerate` then
      # proposes dropping every one of them.
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${DOMAIN}
      KC_HOSTNAME_PATH: /auth
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Trusts the AD CS root CA (corp-TN-DC01-CA) so LDAPS federation to
      # corp.tnrange.lab validates. Without it the bind fails: PKIX path building failed.
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/truststores
    # Loopback only, for the installer's Admin REST calls (install/roles/tn_keycloak),
    # which must not depend on nginx and TLS being right first. Users reach Keycloak
    # through nginx (/auth/).
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8180}:8080"
    volumes:
      - ${TRUSTSTORE_PATH:-./truststores}:/opt/keycloak/conf/truststores:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the image. `Connection: close` plus grep reading the socket itself:
      # `cat <&3` waited for a keep-alive connection to close and always hit the timeout,
      # so Keycloak never became healthy and the api (which waits for it) never started.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend
      - tn-frontend

  # ================================================================
  #  CONTROL PLANE API
  # ================================================================
  api:
    image: ${TN_IMAGE_API:?set TN_IMAGE_API to the api image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs:
      - /tmp
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # Seals stored credentials (app/secretbox.py); the workers need the same value.
      TN_SECRETS_KEY: ${TN_SECRETS_KEY:?set TN_SECRETS_KEY (see .env.production.example)}
      # Production fail-fast (app/settings.py): the API refuses to start, naming every
      # missing or unsafe setting (CSRF_SECRET, KEYCLOAK_AUDIENCE, default passwords...).
      TN_ENV: ${TN_ENV:-production}
      TN_VERSION: ${TN_VERSION:-}
      # Bearer token for the AI orchestrator (api, workers and the orchestrator share it).
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # Peers whose X-Forwarded-For is believed (app/client_address.py): nginx, on the
      # compose bridge networks (Docker's 172.16.0.0/12 pool). The api publishes no port.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.0/8,172.16.0.0/12}
      # GET /metrics needs `Authorization: Bearer <token>` (Prometheus sends it).
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      # Public origin of the calendar-feed URLs (app/scheduler/feed.py).
      SCHEDULER_FEED_BASE_URL: ${SCHEDULER_FEED_BASE_URL:-https://${DOMAIN}}
      # TLS + basic auth (the security plugin); the CA is mounted below. The lab
      # override (OPENSEARCH_DISABLE_SECURITY=true) sets an http URL and an empty user.
      OPENSEARCH_URL: ${OPENSEARCH_URL:-https://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER-admin}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS:-}
      OPENSEARCH_VERIFY_SSL: ${OPENSEARCH_VERIFY_SSL:-/etc/truenorth/opensearch-ca.pem}
      # Keycloak serves under /auth (KC_HTTP_RELATIVE_PATH). Without it the JWKS URL
      # 404s and every authenticated request fails.
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-truenorth}
      # /ad-sync calls Keycloak's Admin API as this confidential service-account client
      # (client credentials) in the truenorth realm, which holds only the realm-management
      # roles it needs (install/roles/tn_keycloak). Never the master-realm admin: the API
      # is not given KEYCLOAK_ADMIN_USER/PASSWORD (the installer's one-shot
      # app.bootstrap_admin run gets them itself).
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      # Public URLs LTI 1.3 platforms are given (tool launch) and sent back to.
      LTI_TOOL_BASE_URL: ${LTI_TOOL_BASE_URL:-https://${DOMAIN}/api}
      LTI_WEB_BASE_URL: ${LTI_WEB_BASE_URL:-https://${DOMAIN}}
      # Empty = off. See docs/identity.md before setting either.
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-}
      # The realm's PUBLIC issuer (https://<DOMAIN>/auth/realms/<realm>: Keycloak stamps
      # iss from KC_HOSTNAME + /auth, not from KEYCLOAK_URL). Required in production: a
      # token from another realm or host must not be accepted (the installer renders it).
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:?set KEYCLOAK_ISSUER to https://<DOMAIN>/auth/realms/<realm>}
      AUTH_DISABLED: "false"
      # Valid values come from worker/provisioners/__init__.py: mock, vsphere_api, and the
      # experimental proxmox_api, hyperv (refused unless EXPERIMENTAL_PROVISIONERS=true).
      # "proxmox" is NOT a registry key — it raised ValueError at first provision.
      # vSphere is "vsphere_api", not "vsphere". Required: a production stack that
      # silently fell back to `mock` reported every range built while building nothing.
      PROVISIONER_BACKEND: ${PROVISIONER_BACKEND:?set PROVISIONER_BACKEND explicitly (vsphere_api; mock only for a lab)}
      EXPERIMENTAL_PROVISIONERS: ${EXPERIMENTAL_PROVISIONERS:-false}
      # The API image is built from control-plane/api alone; the scenario engine
      # is read from this bind mount. Missing here, every engine call failed.
      SCENARIO_ENGINE_DIR: /opt/scenario-engine
      # Learning record store — see the `lrs` service.
      LMS_BACKEND: ${LMS_BACKEND:-xapi_lrs}
      LRS_URL: ${LRS_URL:-http://lrs:8080}
      LRS_AUTH: ${LRS_AUTH}
      # xAPI identity and IRIs (app/xapi.py, docs/xapi-conformance.md): the actor is
      # account {homePage: XAPI_ACCOUNT_HOMEPAGE, name: users.id}; TrueNorth-minted IRIs
      # live under XAPI_IRI_BASE. Fix both before data exists: IRIs compare as strings.
      XAPI_ACCOUNT_HOMEPAGE: ${XAPI_ACCOUNT_HOMEPAGE:-https://${DOMAIN}}
      XAPI_IRI_BASE: ${XAPI_IRI_BASE:-https://${DOMAIN}/xapi}
      XAPI_DEFAULT_LANGUAGE: ${XAPI_DEFAULT_LANGUAGE:-en}
      # cmi5 AU traffic's own LRS credential, so the LRS can tell what an AU wrote from what
      # TrueNorth wrote (docs/cmi5.md). Unset: cmi5 launching answers 503.
      CMI5_LRS_AUTH: ${CMI5_LRS_AUTH:-}
      SEARCH_BACKEND: ${SEARCH_BACKEND:-opensearch}
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:6000
      # Schema ownership belongs to Alembic. The installer sets these false so the
      # lifespan's create_all()/dev-seed cannot race migrations or mint a
      # hardcoded admin@truenorth.local in production.
      DB_AUTO_CREATE: ${DB_AUTO_CREATE:-false}
      SEED_DEV_DATA: ${SEED_DEV_DATA:-false}
      # AD-federated identity: consumed by registration prefill and role suggestion.
      LDAP_SERVER: ${LDAP_SERVER}
      LDAP_PORT: ${LDAP_PORT:-636}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      KEYCLOAK_LDAP_COMPONENT_ID: ${KEYCLOAK_LDAP_COMPONENT_ID}
      REGISTRATION_GROUP_ROLE_MAP: ${REGISTRATION_GROUP_ROLE_MAP}
      REGISTRATION_ALLOWED_GROUPS: ${REGISTRATION_ALLOWED_GROUPS}
      REGISTRATION_DEFAULT_TENANT_SLUG: ${REGISTRATION_DEFAULT_TENANT_SLUG:-default}
      REGISTRATION_DEFAULT_PROGRESSION: ${REGISTRATION_DEFAULT_PROGRESSION}
      CSRF_SECRET: ${CSRF_SECRET}
      CORS_ORIGINS: https://${DOMAIN}
      DB_POOL_SIZE: "50"
      DB_MAX_OVERFLOW: "100"
      DB_POOL_TIMEOUT: "15"
      DB_STATEMENT_TIMEOUT_MS: "30000"
      UVICORN_WORKERS: "4"
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One JSON object per line (app/log_format.py), for a log shipper.
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # ARC² Course Studio (/api/arc2), optional: off unless the installer enables it
      # (tn_arc2_enabled; install/roles/tn_arc2, docs/arc2-course-studio.md "Deployment").
      # On, the runs directory the host's runner works in is mounted below and the api
      # joins its group (group_add) to read runs and write _queue/ and _studio/.
      ARC2_STUDIO_ENABLED: ${ARC2_STUDIO_ENABLED:-false}
      ARC2_RUNS_DIR: /srv/arc2/runs
    volumes:
      # Matches SCENARIO_ENGINE_DIR above. The engine is not part of the api
      # build context, so without this mount it is simply absent at runtime.
      - ../../../scenario-engine:/opt/scenario-engine:ro
      # content/catalogue and content/mitre (GET /software-catalogue, ATT&CK id checks) are
      # in the image at /app/content (control-plane/api/Dockerfile), as under Helm.
      # The internal CA OpenSearch's certificate chains to (OPENSEARCH_VERIFY_SSL).
      - ${OPENSEARCH_CERTS_DIR:-./opensearch/certs}/ca.pem:/etc/truenorth/opensearch-ca.pem:ro
      # ARC² runs: the host directory (ARC2_RUNS_HOST_DIR) when the Studio is on; otherwise
      # an empty volume of its own, so no host path is mounted.
      - ${ARC2_RUNS_HOST_DIR:-arc2-runs-unused}:/srv/arc2/runs
    # The runs directory's group (ARC2_RUNS_GID) when the Studio is on; otherwise the
    # image's own group (app), which adds nothing.
    group_add:
      - ${ARC2_RUNS_GID:-app}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Readiness: 503 until the database, Redis and OpenSearch answer (app/health.py).
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend
      - tn-frontend

  # ================================================================
  #  CELERY WORKERS
  # ================================================================
  worker-provision:
    image: ${TN_IMAGE_WORKER:?set TN_IMAGE_WORKER to the worker image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs: &worker-tmpfs
      - /tmp
      # HOME: ansible-playbook (noise agents) keeps ~/.ansible here.
      - /home/app:uid=10001,gid=10001,mode=0700
    # SIGTERM is a warm shutdown: running tasks finish first. Above the longest hard time
    # limit this queue runs (range tasks, worker/fencing.py TASK_TIME_LIMIT = 3500 s), so a
    # deploy does not SIGKILL a build halfway through.
    stop_grace_period: 3600s
    command: >
      celery -A worker.celery_app worker
        -Q provision,destroy
        -c 8
        --loglevel=${LOG_LEVEL:-info}
        -n provision@%h
        --max-tasks-per-child=1000
        --without-heartbeat
    environment: &worker-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Unseals the hypervisor login the API stored (worker/secretbox.py). Same value as the api.
      TN_SECRETS_KEY: ${TN_SECRETS_KEY:?set TN_SECRETS_KEY (see .env.production.example)}
      TN_ENV: ${TN_ENV:-production}
      TN_VERSION: ${TN_VERSION:-}
      # The workers call the AI orchestrator too (worker/ai_client.py).
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      # TLS + basic auth (the security plugin); the CA is mounted below. The lab
      # override (OPENSEARCH_DISABLE_SECURITY=true) sets an http URL and an empty user.
      OPENSEARCH_URL: ${OPENSEARCH_URL:-https://opensearch:9200}
      OPENSEARCH_USER: ${OPENSEARCH_USER-admin}
      OPENSEARCH_PASS: ${OPENSEARCH_PASS:-}
      OPENSEARCH_VERIFY_SSL: ${OPENSEARCH_VERIFY_SSL:-/etc/truenorth/opensearch-ca.pem}
      # See the api service: "proxmox" is not a registry key. vSphere is "vsphere_api".
      PROVISIONER_BACKEND: ${PROVISIONER_BACKEND:?set PROVISIONER_BACKEND explicitly (vsphere_api; mock only for a lab)}
      EXPERIMENTAL_PROVISIONERS: ${EXPERIMENTAL_PROVISIONERS:-false}
      CELERY_WORKER: "true"
      # Every task without its own limits (worker/celery_app.py). Hard must stay below the
      # broker's visibility timeout (3600 s); the worker refuses to start otherwise.
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-1800}
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-1900}
      PROXMOX_API_URL: ${PROXMOX_API_URL:-}
      PROXMOX_TOKEN: ${PROXMOX_TOKEN:-}
      # vsphere_api.py reads these at MODULE IMPORT, so they must be present in the
      # worker environment at start. A hypervisor_connections row written later
      # cannot override the module-level constants.
      VSPHERE_URL: ${VSPHERE_URL:-}
      VSPHERE_USERNAME: ${VSPHERE_USERNAME:-}
      VSPHERE_PASSWORD: ${VSPHERE_PASSWORD:-}
      VSPHERE_DATACENTER: ${VSPHERE_DATACENTER:-}
      VSPHERE_CLUSTER: ${VSPHERE_CLUSTER:-}
      VSPHERE_DATASTORE: ${VSPHERE_DATASTORE:-}
      VSPHERE_NETWORK: ${VSPHERE_NETWORK:-}
      # Verify vCenter's certificate unless the operator says otherwise (the installer
      # renders tn_vsphere_verify_ssl from the inventory).
      VSPHERE_VERIFY_SSL: ${VSPHERE_VERIFY_SSL:-true}
      # Range isolation (vsphere_api.py): per-range port groups on reserved VLANs. The
      # fallbacks are the provisioner's own defaults; an empty value would override them.
      VSPHERE_CONTENT_LIBRARY: ${VSPHERE_CONTENT_LIBRARY:-}
      VSPHERE_MGMT_NETWORK: ${VSPHERE_MGMT_NETWORK:-dPG-TN-MGMT}
      VSPHERE_RANGE_SWITCH_MODE: ${VSPHERE_RANGE_SWITCH_MODE:-vds}
      VSPHERE_RANGE_DVS: ${VSPHERE_RANGE_DVS:-vDS-10G}
      VSPHERE_VLAN_POOL: ${VSPHERE_VLAN_POOL:-100-199}
      VSPHERE_ALLOCATION_DOMAIN: ${VSPHERE_ALLOCATION_DOMAIN:-vsphere}
      VSPHERE_PLACEMENT: ${VSPHERE_PLACEMENT:-spread}
      VSPHERE_RESOURCE_POOL: ${VSPHERE_RESOURCE_POOL:-}
      VSPHERE_EXCLUDE_HOSTS: ${VSPHERE_EXCLUDE_HOSTS:-}
      VSPHERE_RANGE_UPLINK_NETWORK: ${VSPHERE_RANGE_UPLINK_NETWORK:-}
      VSPHERE_RANGE_UPLINK_POOL: ${VSPHERE_RANGE_UPLINK_POOL:-}
      VSPHERE_RANGE_UPLINK_GATEWAY: ${VSPHERE_RANGE_UPLINK_GATEWAY:-}
      VSPHERE_RANGE_UPLINK_PREFIX: ${VSPHERE_RANGE_UPLINK_PREFIX:-24}
      VSPHERE_RANGE_VSWITCH: ${VSPHERE_RANGE_VSWITCH:-vSwitch1}
      VSPHERE_RANGE_FOLDER: ${VSPHERE_RANGE_FOLDER:-truenorth/ranges}
      VSPHERE_MAX_VCPU_PER_THREAD: ${VSPHERE_MAX_VCPU_PER_THREAD:-4}
      VSPHERE_CONCURRENCY: ${VSPHERE_CONCURRENCY:-4}
      VSPHERE_TOOLS_TIMEOUT: ${VSPHERE_TOOLS_TIMEOUT:-120}
      VSPHERE_SNAPSHOT_TIMEOUT: ${VSPHERE_SNAPSHOT_TIMEOUT:-1800}
      VSPHERE_PROVISION_BUDGET: ${VSPHERE_PROVISION_BUDGET:-3300}
      VSPHERE_NOISE_NETWORK: ${VSPHERE_NOISE_NETWORK:-TN-Noise-Mgmt}
      LAB_PORT_GROUPS: ${LAB_PORT_GROUPS:-}
      # Deploy-time software from TN-DEPOT01 (install/lab/README.md). Empty feed/proxy
      # fall back to Nexus on TN_DEPOT_URL; the apt/dnf proxy should be set explicitly.
      TN_DEPOT_URL: ${TN_DEPOT_URL:-}
      TN_DEPOT_CHOCO_FEED: ${TN_DEPOT_CHOCO_FEED:-}
      TN_DEPOT_APT_PROXY: ${TN_DEPOT_APT_PROXY:-}
      TN_DEPOT_PORTS: ${TN_DEPOT_PORTS:-8081,3142}
      TN_SOFTWARE_INSTALL_TIMEOUT: ${TN_SOFTWARE_INSTALL_TIMEOUT:-1800}
      # Per VM, its Windows Server roles (features, reboots, forest promotion).
      VSPHERE_ROLE_TIMEOUT: ${VSPHERE_ROLE_TIMEOUT:-1800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json} # worker/celery_app.py: JSON lines
    volumes:
      # The software catalogue (software_catalogue.py) is in the image at /app/content.
      - ${OPENSEARCH_CERTS_DIR:-./opensearch/certs}/ca.pem:/etc/truenorth/opensearch-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping -d provision@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend
      - tn-egress # vCenter (VSPHERE_URL) is off-host; tn-backend is internal

  worker-scenario:
    image: ${TN_IMAGE_WORKER:?set TN_IMAGE_WORKER to the worker image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs: *worker-tmpfs
    # Above CELERY_TASK_TIME_LIMIT (default 1900 s): a warm shutdown lets tasks finish.
    stop_grace_period: 2000s
    command: >
      celery -A worker.celery_app worker
        -Q scenario,default
        -c 12
        --loglevel=${LOG_LEVEL:-info}
        -n scenario@%h
        --max-tasks-per-child=1000
        --without-heartbeat
    environment: *worker-env
    volumes:
      - ${OPENSEARCH_CERTS_DIR:-./opensearch/certs}/ca.pem:/etc/truenorth/opensearch-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping -d scenario@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  worker-telemetry:
    image: ${TN_IMAGE_WORKER:?set TN_IMAGE_WORKER to the worker image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs: *worker-tmpfs
    stop_grace_period: 2000s # above CELERY_TASK_TIME_LIMIT, as worker-scenario
    command: >
      celery -A worker.celery_app worker
        -Q telemetry
        -c 6
        --loglevel=${LOG_LEVEL:-info}
        -n telemetry@%h
        --max-tasks-per-child=2000
        --without-heartbeat
    environment: *worker-env
    volumes:
      - ${OPENSEARCH_CERTS_DIR:-./opensearch/certs}/ca.pem:/etc/truenorth/opensearch-ca.pem:ro
      # The ATT&CK catalogue (attack_catalogue.py) is in the image at /app/content.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping -d telemetry@$$HOSTNAME 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  # Sends the periodic tasks in worker/celery_app.py's beat_schedule (health_check_ranges,
  # collect_range_metrics). Without it they never ran. EXACTLY ONE: a second beat sends
  # every entry twice, so never scale it (`--scale beat=2`) or run another elsewhere.
  # The schedule state is only "when did each interval last fire": tmpfs is enough.
  beat:
    image: ${TN_IMAGE_WORKER:?set TN_IMAGE_WORKER to the worker image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs: *worker-tmpfs
    command: >
      celery -A worker.celery_app beat
        --loglevel=${LOG_LEVEL:-info}
        --schedule=/tmp/celerybeat-schedule
        --pidfile=
    environment: *worker-env
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  flower:
    image: ${TN_IMAGE_WORKER:?set TN_IMAGE_WORKER to the worker image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs:
      - /tmp
    # The broker URL and the login are environment settings (Flower reads FLOWER_<OPTION>),
    # not --broker_api/--basic_auth arguments: process arguments are world-readable.
    command: >
      celery -A worker.celery_app flower
        --port=5555
        --persistent=True
        --db=/data/flower.db
    volumes:
      - flower-data:/data
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FLOWER_BROKER_API: redis://:${REDIS_PASSWORD}@redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_USER:?set FLOWER_USER}:${FLOWER_PASSWORD:?set FLOWER_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # The image has python but no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555/healthcheck', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend
      - tn-monitoring

  # ================================================================
  #  AI ORCHESTRATOR
  # ================================================================
  ai-orchestrator:
    image: ${TN_IMAGE_AI_ORCHESTRATOR:?set TN_IMAGE_AI_ORCHESTRATOR to the ai-orchestrator image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    tmpfs:
      - /tmp
    environment:
      # OpenAI-compatible backend pointed at the site's LiteLLM router (air-gapped from
      # external providers). Both required, no defaults: the installer renders them from
      # tn_ai_base_url and vault_openai_api_key. The key may be EMPTY (set but blank) only
      # for an unauthenticated endpoint on a closed network.
      AI_MODEL_BACKEND: ${AI_MODEL_BACKEND:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?set OPENAI_BASE_URL to the LiteLLM endpoint, e.g. http://<host>:4000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY?set OPENAI_API_KEY (empty only for an unauthenticated endpoint)}
      OPENAI_DEFAULT_MODEL: ${OPENAI_DEFAULT_MODEL:-agent}
      OPENAI_TIMEOUT_S: ${OPENAI_TIMEOUT_S:-600}
      # Per-capability LiteLLM aliases. Set to "forge" once Qwen 112B is deployed.
      AI_HEAVY_MODEL: ${AI_HEAVY_MODEL:-agent}
      AI_GENERAL_MODEL: ${AI_GENERAL_MODEL:-agent}
      AI_CODE_MODEL: ${AI_CODE_MODEL:-coder-fast}
      AI_EMBED_BACKEND: ${AI_EMBED_BACKEND:-openai}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-embed}
      MAX_LLM_CONCURRENCY: ${MAX_LLM_CONCURRENCY:-4}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # Every route but /health needs this bearer token; TN_ENV=production refuses to
      # start without one (>= 32 characters).
      TN_ENV: ${TN_ENV:-production}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      # python:3.11-slim has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "2"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend
      - tn-egress # the LiteLLM router is off-host; tn-backend is internal
    # Reaches the host's LiteLLM router via OPENAI_BASE_URL (host LAN IP).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ================================================================
  #  WEB FRONTEND (Angular SPA behind nginx)
  # ================================================================
  # Required: nginx/conf.d/upstream.conf declares `upstream web_frontend
  # { server web:8080; }`. Without this service nginx aborts at config load with
  # "host not found in upstream" and the entire stack fails to start.
  web:
    image: ${TN_IMAGE_WEB:?set TN_IMAGE_WEB to the web image@sha256 from release-manifest.json (install/README.md)}
    restart: always
    <<: *hardened
    # Runs as the image's nginx user (uid 101): its pid file and the runtime config.json
    # go to /tmp, its proxy/client temp files to /var/cache/nginx.
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
    environment:
      # Written to the SPA's assets/config.json at start-up
      # (control-plane/web/docker/40-truenorth-runtime-config.sh). Keycloak is served
      # under https://${DOMAIN}/auth (KC_HTTP_RELATIVE_PATH above), so the relative
      # default is right unless Keycloak moves to its own host.
      TN_KEYCLOAK_URL: "${TN_KEYCLOAK_URL:-/auth}"
      TN_KEYCLOAK_REALM: "${KEYCLOAK_REALM:-truenorth}"
      # Admin > Services cards. Keycloak defaults to <TN_KEYCLOAK_URL>/admin/; MinIO and
      # OpenSearch Dashboards are not published by this file, so their cards stay
      # hidden unless an operator exposes them and sets these.
      TN_ADMIN_MINIO_URL: "${TN_ADMIN_MINIO_URL:-}"
      TN_ADMIN_DASHBOARDS_URL: "${TN_ADMIN_DASHBOARDS_URL:-}"
      TN_ADMIN_AI_URL: "${TN_ADMIN_AI_URL:-}"
      # Learning > LMS previews: the Moodle address when no Moodle platform is
      # registered under Integrations. Unset: no link.
      TN_MOODLE_URL: "${TN_MOODLE_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: with a read-only root the image's entrypoint cannot add
      # its IPv6 listener, and busybox wget tries ::1 first.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-frontend

  # Telemetry is indexed per range (`range-<id>`) by the API (POST
  # /telemetry/{range_id}/events) and the worker-telemetry Celery queue. The
  # old telemetry-pipeline service (Redis stream -> truenorth-telemetry-*) was
  # removed: nothing wrote its stream and nothing read its indices.

  # ================================================================
  #  LEARNING RECORD STORE (xAPI)
  # ================================================================
  # Required: lms/__init__.py defaults LMS_BACKEND to "xapi_lrs", so without
  # this service every xAPI statement fails against an unset LRS_URL. Learner
  # progress tracking depends on it.
  lrs:
    # v0.9.9 is what :latest resolved to on 2026-10-03. amd64-only image.
    image: yetanalytics/lrsql:v0.9.9@sha256:d0054b96ebbb41b10b371e815e326918b70f0d1788e8d24afc60af465b8f41cd
    restart: always
    <<: *hardened
    tmpfs:
      - /tmp
      - /lrsql/logs # its rolling file log; the same lines go to stdout
    command: /lrsql/bin/run_postgres.sh
    environment:
      LRSQL_DB_TYPE: postgresql
      LRSQL_DB_HOST: postgres
      LRSQL_DB_PORT: "5432"
      LRSQL_DB_NAME: ${LRS_DB:-lrs}
      LRSQL_DB_USER: ${LRS_DB_USER:-lrs}
      LRSQL_DB_PASSWORD: ${LRS_DB_PASSWORD}
      LRSQL_ADMIN_USER_DEFAULT: ${LRS_ADMIN_USER}
      LRSQL_ADMIN_PASS_DEFAULT: ${LRS_ADMIN_PASSWORD}
      LRSQL_API_KEY_DEFAULT: ${LRS_API_KEY}
      LRSQL_API_SECRET_DEFAULT: ${LRS_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-backend

  # ================================================================
  #  NGINX REVERSE PROXY
  # ================================================================
  # The stock image, pinned, with the edge configuration (infra/platform/nginx, the same
  # files its Dockerfile copies) mounted read-only from the app source at the release's
  # commit. Nothing is built on the target, and the mounted conf.d replaces the stock
  # default.conf as the Dockerfile's `rm` did.
  nginx:
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: always
    <<: *hardened
    # The master binds 80/443 and starts its workers as the nginx user; it creates the
    # temp directories under /var/cache/nginx and hands them to that user, and writes its
    # logs into $TN_DATA_ROOT/logs, which the install user owns (DAC_OVERRIDE).
    cap_add: [NET_BIND_SERVICE, CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - ${SSL_CERT_PATH:-/etc/ssl/truenorth}:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      # upstream.conf resolves `web:8080` at config load; without this nginx
      # can start before the name exists and abort on "host not found".
      web:
        condition: service_healthy
      # The same for its other upstreams (ai_backend, flower_backend).
      ai-orchestrator:
        condition: service_healthy
      flower:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-frontend
      - tn-backend

  # ================================================================
  #  MONITORING STACK
  # ================================================================
  prometheus:
    image: prom/prometheus:v2.51.0@sha256:5ccad477d0057e62a7cd1981ffcc43785ac10c5a35522dc207466ff7e7ec845f
    container_name: tn-prometheus
    restart: always
    <<: *hardened
    depends_on:
      - alertmanager
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # metrics_scrape_token + ai_service_token (prometheus.yml); the installer writes them.
      - ${PROMETHEUS_SECRETS_DIR:-./monitoring/prometheus/secrets-dev}:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring
      - tn-backend

  # Routes the alerts in monitoring/prometheus/alerts.yml. The default config
  # (monitoring/alertmanager/alertmanager.yml) sends them NOWHERE (a null receiver):
  # set a webhook (install/README.md "Alerting") or nobody is told when a rule fires.
  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: tn-alertmanager
    restart: always
    <<: *hardened
    volumes:
      # alertmanager.yml (null receiver) or alertmanager.webhook.yml (ALERTMANAGER_CONFIG).
      - ./monitoring/alertmanager/${ALERTMANAGER_CONFIG:-alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      # webhook_url (read with url_file, so the URL and any token in it stay out of the
      # environment). The installer writes it; secrets-dev/ holds a placeholder.
      - ${ALERTMANAGER_SECRETS_DIR:-./monitoring/alertmanager/secrets-dev}:/etc/alertmanager/secrets:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://${DOMAIN}/alertmanager/"
      - "--web.route-prefix=/"
      # Single instance: no gossip mesh to listen for.
      - "--cluster.listen-address="
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring
      - tn-egress # the webhook receiver is off-host; tn-monitoring is internal

  grafana:
    image: grafana/grafana:10.4.0@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    container_name: tn-grafana
    restart: always
    <<: *hardened
    tmpfs:
      - /tmp
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5s"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring
      - tn-frontend

  node-exporter:
    image: prom/node-exporter:v1.7.0@sha256:4cb2b9019f1757be8482419002cb7afe028fdba35d47958829e4cfeaf6246d80
    container_name: tn-node-exporter
    restart: always
    <<: *hardened
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    container_name: tn-cadvisor
    restart: always
    # The one exception to x-hardened's cap_drop: cAdvisor reads every container's
    # cgroups and /dev/kmsg and runs privileged, which grants all capabilities anyway.
    # Read-only root and no privilege escalation still apply.
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    container_name: tn-postgres-exporter
    restart: always
    <<: *hardened
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring
      - tn-backend

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0@sha256:2e42c98f2c53aaf3ce205e746ff8bfa25d39e30d8b4f401ce0ad2740836bb817
    container_name: tn-redis-exporter
    restart: always
    <<: *hardened
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    # The image is the static binary alone (no shell, no wget), so no in-container probe
    # can run: a wget check was "unhealthy" forever and stopped the install's
    # `up --wait`. Prometheus scrapes it, so a dead exporter is up{job="redis"} == 0.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - tn-monitoring
      - tn-backend

# ================================================================
#  VOLUMES
# ================================================================
# Data volumes bind to ${TN_DATA_ROOT} (default /srv/truenorth) rather than
# living in /var/lib/docker/volumes. A plain `driver: local` volume ignores the
# provisioned data disk entirely and fills the root filesystem instead — on this
# lab that is a 500 GB disk sitting unused while / fills up. The directories must
# exist and be owned correctly before `up`; the installer's tn_config role does that.
volumes:
  pg-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TN_DATA_ROOT:-/srv/truenorth}/postgres
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TN_DATA_ROOT:-/srv/truenorth}/redis
  minio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TN_DATA_ROOT:-/srv/truenorth}/minio
  os-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TN_DATA_ROOT:-/srv/truenorth}/opensearch
  # OpenSearch snapshot repository (path.repo). Beside the data, not inside it.
  os-snapshots:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TN_DATA_ROOT:-/srv/truenorth}/opensearch-snapshots
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local
  flower-data:
    driver: local
  nginx-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${TN_DATA_ROOT:-/srv/truenorth}/logs
  # The api's /srv/arc2/runs while ARC² Course Studio is off (ARC2_RUNS_HOST_DIR unset):
  # empty and unused. On, the api mounts the runner's host directory there instead.
  arc2-runs-unused:
    driver: local

# ================================================================
#  NETWORKS
# ================================================================
networks:
  tn-frontend:
    name: tn-frontend
    driver: bridge
  # Outbound only, for the services that must leave the host: worker-provision
  # (vCenter) and ai-orchestrator (the LLM endpoint). Nothing publishes a port on it.
  # tn-backend stays internal so the datastores have no route out.
  tn-egress:
    name: tn-egress
    driver: bridge
  tn-backend:
    name: tn-backend
    driver: bridge
    internal: true
  tn-monitoring:
    name: tn-monitoring
    driver: bridge
    internal: true