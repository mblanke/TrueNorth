# TrueNorth Range — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

# Firing rules go to Alertmanager (compose.prod.yml `alertmanager`), which routes them
# (monitoring/alertmanager/). Without this block the rules fired into nothing.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ── Control-Plane API (FastAPI) ──────────────────────────────
  # Bearer tokens from files (Prometheus does not expand env vars): the api's
  # METRICS_SCRAPE_TOKEN and the orchestrator's AI_SERVICE_TOKEN. The installer writes
  # them to PROMETHEUS_SECRETS_DIR; secrets-dev/ holds placeholders for stacks that set
  # neither token (both services then leave /metrics open).
  - job_name: "truenorth-api"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_scrape_token
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: control-plane-api

  # ── AI Orchestrator ──────────────────────────────────────────
  - job_name: "ai-orchestrator"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/ai_service_token
    static_configs:
      - targets: ["ai-orchestrator:6000"]
        labels:
          service: ai-orchestrator

  # ── Celery Flower (Celery metrics) ──────────────────────────
  - job_name: "celery-flower"
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: celery

  # ── Node Exporter (host) ─────────────────────────────────────
  - job_name: "node-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: infrastructure

  # ── cAdvisor (container) ─────────────────────────────────────
  - job_name: "cadvisor"
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: infrastructure

  # ── Postgres Exporter ────────────────────────────────────────
  - job_name: "postgres-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: database

  # ── Redis Exporter ───────────────────────────────────────────
  - job_name: "redis-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: cache

  # ── PgBouncer ────────────────────────────────────────────────
  - job_name: "pgbouncer"
    metrics_path: /metrics
    static_configs:
      - targets: ["pgbouncer:6432"]
        labels:
          service: database