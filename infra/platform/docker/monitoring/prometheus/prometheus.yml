# TrueNorth Range — Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # ── Control-Plane API (FastAPI) ──────────────────────────────
  - job_name: "truenorth-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: control-plane-api

  # ── AI Orchestrator ──────────────────────────────────────────
  - job_name: "ai-orchestrator"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-orchestrator:6000"]
        labels:
          service: ai-orchestrator

  # ── Celery Flower (Celery metrics) ──────────────────────────
  - job_name: "celery-flower"
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
        labels:
          service: celery

  # ── Node Exporter (host) ─────────────────────────────────────
  - job_name: "node-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: infrastructure

  # ── cAdvisor (container) ─────────────────────────────────────
  - job_name: "cadvisor"
    metrics_path: /metrics
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: infrastructure

  # ── Postgres Exporter ────────────────────────────────────────
  - job_name: "postgres-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: database

  # ── Redis Exporter ───────────────────────────────────────────
  - job_name: "redis-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: cache

  # ── PgBouncer ────────────────────────────────────────────────
  - job_name: "pgbouncer"
    metrics_path: /metrics
    static_configs:
      - targets: ["pgbouncer:6432"]
        labels:
          service: database