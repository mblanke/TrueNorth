# TrueNorth Range — Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: TrueNorth Range
    orgId: 1
    folder: TrueNorth Range
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false