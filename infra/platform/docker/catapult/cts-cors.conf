# CORS in front of CATAPULT's CTS (compose.catapult.yml), for one origin: TrueNorth's SPA in
# the itest stack. The CTS proxies an AU's fetch URL and LRS calls with CORS turned off, on
# the assumption that content shares its origin; TrueNorth's AU runtime does not. Bodies and
# statuses pass through untouched; only CORS headers are added (and the LRS's own, which
# name the wrong origin, are hidden).
map $http_origin $tn_cors_origin {
    "http://localhost:14200" $http_origin;
    default "";
}

server {
    listen 8080;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $tn_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Experience-API-Version, If-Match, If-None-Match" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        set $cts cts:3399;
        proxy_pass http://$cts;
        # The CTS builds the AU's fetch and endpoint URLs from the Host it was called on.
        proxy_set_header Host $http_host;
        # Same-origin content sends no Origin on a GET; given one, CATAPULT's player answers
        # its LRS proxy with a non-JSON refusal and the CTS fails with a 500 parsing it. CORS
        # is this shim's job, so the Origin stops here.
        proxy_set_header Origin "";
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        add_header Access-Control-Allow-Origin $tn_cors_origin always;
        add_header Access-Control-Expose-Headers "ETag, X-Experience-API-Version" always;
    }
}
