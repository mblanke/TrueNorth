input {
  beats {
    port => 5044
  }
  udp {
    port => 5514
    codec => plain
    type => syslog
  }
}

filter {
  if [type] == "syslog" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    }
    date { match => ["syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"] }
  }
  if [event][module] == "sysmon" {
    mutate { add_tag => ["sysmon"] }
  }
}

output {
  # A range's events go to its own index family (range-<id>-<date>), which is what
  # detection credit searches and what stamps truenorth.ingested_at (ADR 0005).
  if [range_id] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "range-%{[range_id]}-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "truenorth-range-%{+YYYY.MM.dd}"
    }
  }
}
