# Optional Moodle instance for LTI 1.3 end-to-end testing.
#
# Usage:
#   docker compose -f compose.dev.yml -f compose.moodle.yml up -d moodle moodle-db
#   (add compose.windows-ports.yml on Windows hosts as usual)
#
# Moodle UI: http://localhost:8083  (admin / TrueNorth-Moodle1)
#
# LTI wiring (Site administration -> Plugins -> External tool -> Manage tools):
#   Tool URL:            http://host.docker.internal:8081/lti/launch
#   Initiate login URL:  http://host.docker.internal:8081/lti/login
#   JWKS URL:            http://host.docker.internal:8081/lti/jwks
#   Deep linking URL:    http://host.docker.internal:8081/lti/launch
# Then register Moodle in TrueNorth (POST /api/integrations/platforms) with
# the issuer/client/deployment values Moodle shows after activation, plus:
#   lti_auth_login_url:  http://localhost:8083/mod/lti/auth.php
#   lti_token_url:       http://localhost:8083/mod/lti/token.php
#   lti_jwks_url:        http://localhost:8083/mod/lti/certs.php
services:
  moodle-db:
    image: postgres:16
    environment:
      POSTGRES_DB: moodle
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
    volumes:
      - moodle-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodle -d moodle"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    # Maintained, multi-architecture Moodle image. Bitnami removed its versioned
    # community images in 2025, making the former bitnami/moodle:4.4 reference
    # impossible to pull on a clean machine.
    image: ghcr.io/erseco/alpine-moodle:v5.2.3
    depends_on:
      moodle-db:
        condition: service_healthy
    environment:
      DB_TYPE: pgsql
      DB_HOST: moodle-db
      DB_PORT: "5432"
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: TrueNorth-Moodle1
      # The image's CLI bootstrap expands this value as one shell argument.
      MOODLE_SITENAME: TrueNorth_LTI_Test
      SITE_URL: http://localhost:8083
    ports:
      - "8083:8080"
    volumes:
      - moodle-data:/var/www/html
      - moodle-moodledata:/var/www/moodledata
      - ../nginx/moodle-public-port.sh:/docker-entrypoint-init.d/99-public-port.sh:ro

volumes:
  moodle-db-data:
  moodle-data:
  moodle-moodledata:
