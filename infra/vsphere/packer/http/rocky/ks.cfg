# TrueNorth Range — Rocky Linux 10 kickstart (vSphere).
# Delivered on a CD labelled OEMDRV (cd_files + cd_label="OEMDRV"); Anaconda auto-detects
# ks.cfg on an OEMDRV volume. The boot arg inst.ks=hd:LABEL=OEMDRV:/ks.cfg makes it explicit.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --hostname=rocky

# Disk
clearpart --all --initlabel
autopart --type=lvm
bootloader --location=mbr

# Accounts (build-time; cloud-init/guest customization resets on clone)
rootpw --lock
user --name=rocky --password=rocky --plaintext --groups=wheel
firewall --enabled --ssh
selinux --enforcing
firstboot --disable
reboot

%packages
@^minimal-environment
openssh-server
open-vm-tools
cloud-init
curl
wget
git
net-tools
%end

%post --log=/root/ks-post.log
echo "rocky ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/rocky
chmod 0440 /etc/sudoers.d/rocky
systemctl enable sshd
systemctl enable vmtoolsd
%end
