[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
stdout_callback = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = False
interpreter_python = auto_silent
# One host — parallelism buys nothing and makes the output harder to read.
forks = 5
# Secrets live in inventory/group_vars/all/vault.yml. Point this at a password
# file, or pass --ask-vault-pass.
# vault_password_file = ~/.truenorth-vault-pass

[privilege_escalation]
# Not blanket-enabled: tnadmin is in the docker group, so only tn_base (packages,
# sysctl) and tn_tls (writing to /usr/local/share/ca-certificates) escalate, and
# they say so per task.
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
