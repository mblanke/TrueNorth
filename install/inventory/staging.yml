---
# TrueNorth Range — staging inventory (tn-staging, 192.168.1.240).
#
#   ansible-playbook -i inventory/staging.yml site.yml -K --ask-vault-pass \
#     -e tn_release_version=v1.0.0-rc1
#
# Same group_vars as the TN lab (inventory/group_vars/all/ sits beside this file); only
# what differs is here. This host cannot reach TN-DC01, so AD/LDAPS is off: Keycloak gets
# local TN-* groups and a local bootstrap administrator (install/README.md "Without
# Active Directory"). Images come from a signed release, by digest, as in production;
# pass the tag with -e tn_release_version.
all:
  children:
    platform:
      hosts:
        tn-staging:
          ansible_host: 192.168.1.240
          ansible_user: soadmin
          tn_domain_fqdn: tn-staging.corp.tnrange.lab
          tn_ldap_enabled: false
          # Nothing resolves tn-staging.corp.tnrange.lab for the host itself (no AD DNS).
          tn_manage_etc_hosts: true
          tn_image_source: release
          # Ubuntu 24.04, so 00-docker installs and holds the pinned Docker
          # (tn_install_docker defaults true). If an earlier hand install left a
          # docker.list for Docker's repository, it stops and names the file: remove it,
          # or set tn_install_docker: false here to keep the Docker already there.
          # No vCenter on this network: a simulated, read-only one (tools/vcenter-sim) on
          # this host, started by playbooks/lab-vcenter-sim.yml, so the hypervisor
          # dashboards have an inventory. vault_vsphere_password: any non-placeholder.
          tn_vcenter_host: 192.168.1.240
          tn_vcenter_port: 8989
          tn_vcenter_user: staging@vsphere.local
          tn_vsphere_datacenter: DC0
          tn_vsphere_cluster: DC0_C0
          tn_vsphere_datastore: LocalDS_0
          tn_vsphere_mgmt_network: VM Network
          # Open WebUI's OpenAI-compatible API is under /api (key: Settings > Account >
          # API keys, into vault_openai_api_key). Its model ids are what /api/models lists.
          tn_ai_base_url: https://ai.guapo613.beer/api
          # Router models that never leave the home lab (no hosted fallback): qwen2.5 14b on
          # wile + roadrunner, and mxbai-embed-large.
          tn_ai_default_model: sovereign-chat
          tn_ai_embed_model: sovereign-embed
          tn_tls_mode: selfsigned
          # A local Keycloak account, created by 60-keycloak (no AD here).
          tn_bootstrap_admin_upn: tnadmin@tn-staging.local
          # A populated staging: the shipped curriculum, published, plus the demo layer.
          tn_load_shipped_content: true
          tn_publish_shipped_content: true
          tn_load_shipped_demo: true
          # Staging attests its secrets are escrowed elsewhere (they are generated on the
          # host and are disposable). A platform Students use sets tn_backup_escrow_pubkey.
          tn_backup_escrow: out-of-band
          # Staging disk is small: keep the free-space floor low, and the backups capped.
          tn_min_free_gb: 40
          tn_backup_min_free_gb: 5
          tn_backup_max_total_gb: 30
          # vcsim serves a self-signed certificate.
          tn_vsphere_verify_ssl: false
          # Staging is a test host: the ARC² runner accepts the outline and preview gates
          # itself (accepted_by "auto (test host)"; the Studio marks such runs TEST CONTENT).
          # Only matters once tn_arc2_enabled is on.
          tn_arc2_auto_accept: true
