---
# TrueNorth Range — staging inventory (tn-staging, 192.168.1.240).
#
#   ansible-playbook -i inventory/staging.yml site.yml -K --ask-vault-pass \
#     -e tn_release_version=v1.0.0-rc1
#
# Same group_vars as the TN lab (inventory/group_vars/all/ sits beside this file); only
# what differs is here. AD/LDAPS is off by default: Keycloak gets local TN-* groups and a
# local bootstrap administrator (install/README.md "Without Active Directory"). The M2
# block below points it at the owner's Windows DC when AD is being qualified. Images come from a signed release, by digest, as in production;
# pass the tag with -e tn_release_version.
all:
  children:
    platform:
      hosts:
        tn-staging:
          ansible_host: 192.168.1.240
          ansible_user: soadmin
          tn_domain_fqdn: tn-staging.corp.tnrange.lab
          # ── AD qualification (plan M2) against the owner's Windows AD DS / AD CS DC on
          # this LAN, TN-DC01 (192.168.1.224), through the normal tn_ldap_* path
          # (install/README.md "AD on staging"). OFF until the M2 run: the coordinator sets
          # tn_ldap_enabled true and uncomments the three DC lines below. Everything else
          # (corp.tnrange.lab, OU=TrueNorth with Users/Groups/ServiceAccounts, the six TN-*
          # groups, the bind DN) is group_vars' TN-DC01 layout, which that DC mirrors.
          # Before turning it on:
          #   * vault_ldap_bind_password in the vault (preflight refuses CHANGE_ME or empty),
          #     and the enterprise root CA corp-TN-DC01-CA at install/files/corp-root-ca.cer
          #     (40-tls installs it and proves an LDAPS bind before Keycloak is touched; the
          #     DC's LDAPS certificate must name tn-dc01.corp.tnrange.lab);
          #   * DNS: this host will resolve EVERYTHING through TN-DC01 (roles/tn_base's
          #     resolver drop-in). TN-DC01 forwards to 192.168.1.21 and 192.168.1.1 and
          #     holds the A record tn-staging -> 192.168.1.240 and the PTRs (preflight asks
          #     it for tn_domain_fqdn and stops without one).
          # tn_keycloak_local_admin keeps tnadmin@tn-staging.local a LOCAL account beside
          # AD: the way back in if the DC, the bind or LDAPS fails. Keep it true here.
          tn_ldap_enabled: false
          tn_keycloak_local_admin: true
          # tn_dc_host: tn-dc01.corp.tnrange.lab
          # tn_dc_ip: 192.168.1.224
          # tn_dns_servers: ["192.168.1.224"]
          # Nothing resolves tn-staging.corp.tnrange.lab for the host itself (no AD DNS).
          tn_manage_etc_hosts: true
          tn_image_source: release
          # Ubuntu 24.04, so 00-docker installs and holds the pinned Docker
          # (tn_install_docker defaults true). If an earlier hand install left a
          # docker.list for Docker's repository, it stops and names the file: remove it,
          # or set tn_install_docker: false here to keep the Docker already there.
          # No vCenter on this network: a simulated, read-only one (tools/vcenter-sim) on
          # this host, started by playbooks/lab-vcenter-sim.yml, so the hypervisor
          # dashboards have an inventory. vault_vsphere_password: any non-placeholder.
          tn_vcenter_host: 192.168.1.240
          tn_vcenter_port: 8989
          tn_vcenter_user: staging@vsphere.local
          tn_vsphere_datacenter: DC0
          tn_vsphere_cluster: DC0_C0
          tn_vsphere_datastore: LocalDS_0
          tn_vsphere_mgmt_network: VM Network
          # Open WebUI's OpenAI-compatible API is under /api (key: Settings > Account >
          # API keys, into vault_openai_api_key). Its model ids are what /api/models lists.
          tn_ai_base_url: https://ai.guapo613.beer/api
          # Router models that never leave the home lab (no hosted fallback): qwen2.5 14b on
          # wile + roadrunner, and mxbai-embed-large.
          tn_ai_default_model: sovereign-chat
          tn_ai_embed_model: sovereign-embed
          tn_tls_mode: selfsigned
          # A local Keycloak account, created by 60-keycloak (no AD here).
          tn_bootstrap_admin_upn: tnadmin@tn-staging.local
          # A populated staging: the shipped curriculum, published, plus the demo layer.
          tn_load_shipped_content: true
          tn_publish_shipped_content: true
          tn_load_shipped_demo: true
          # Owner decision (2026-10-12): the shipped demo staff skip MFA on this test host
          # only. Honoured only with TN_TEST_HOST (ARC² auto-accept below); audited per use.
          # Every other privileged account, the bootstrap admin included, enrols TOTP.
          tn_mfa_demo_exempt: true
          # ARC² Course Studio on the operator's Claude subscription
          # (vault_arc2_claude_oauth_token, from `claude setup-token`; no pay-per-use key).
          tn_arc2_enabled: true
          # Moodle (TrueNorth-branded, LTI 1.3) at https://tn-staging.corp.tnrange.lab:8443.
          tn_moodle_enabled: true
          # Staging attests its secrets are escrowed elsewhere (they are generated on the
          # host and are disposable). A platform Students use sets tn_backup_escrow_pubkey.
          tn_backup_escrow: out-of-band
          # Staging disk is small: keep the free-space floor low, and the backups capped.
          tn_min_free_gb: 40
          tn_backup_min_free_gb: 5
          tn_backup_max_total_gb: 30
          # vcsim serves a self-signed certificate.
          tn_vsphere_verify_ssl: false
          # VMware Tools never runs in a vcsim VM: record guest IPs, do not fail ranges on them.
          tn_vsphere_guest_ip_check: "off"
          # Its own MAC slice, apart from the work install's (hosts.yml), should both ever
          # share a vCenter.
          tn_vsphere_mac_pool: "00:50:56:3e:00:00-00:50:56:3e:ff:ff"
          # Staging is a test host: the ARC² runner accepts the outline and preview gates
          # itself (accepted_by "auto (test host)"; the Studio marks such runs TEST CONTENT).
          # Only matters once tn_arc2_enabled is on.
          tn_arc2_auto_accept: true
          # Claude subscription first; the home-lab router's local model (atl-coder, qwen3.6
          # 35B on wile/roadrunner) when the subscription is unavailable. The router is
          # tailnet-only HTTPS on atlas (Tailscale Serve :4443); its key is
          # vault_arc2_local_token, limited to atl-coder (no cost, nothing leaves home).
          tn_arc2_mode: subscription_with_local_fallback
          tn_arc2_local_url: https://atlas.tail8d54ec.ts.net:4443
          tn_arc2_local_model: atl-coder
          # Alerts by email (install/README.md "Alerting"). OFF until the SMTP details are
          # known: alerts go nowhere and 99-validate warns so. To turn on, set this true,
          # uncomment the three below, put vault_alert_smtp_username /
          # vault_alert_smtp_password in the vault (preflight refuses CHANGE_ME), then:
          # ansible-playbook -i inventory/staging.yml playbooks/alert-test.yml
          tn_alert_email_enabled: false
          # tn_alert_email_to: <the operator's inbox>
          # tn_alert_email_from: <an address the relay lets this host send as>
          # tn_alert_smtp_host: <the SMTP relay>   (tn_alert_smtp_port: 587, STARTTLS)
