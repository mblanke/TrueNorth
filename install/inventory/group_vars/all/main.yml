---
# TrueNorth Range — installer variables (non-secret).
#
# Secrets live in inventory/group_vars/all/vault.yml, encrypted with
# ansible-vault. See vault.yml.example for the required keys.

# ── Where the application comes from ──────────────────────────────────
# THIS IS THE BLOCKER RECORDED THROUGHOUT THE DEPLOYMENT REPO
# ("TrueNorth app Git URL — required at M4 install"). Now answered.
tn_app_source_mode: git # git | local | tarball
# mblanke/TrueNorth is public: no credentials on the host. (The old default,
# git.guapo613.beer/soadmin/truenorth, has no `main` branch.) TN-MGMT01 needs HTTPS out
# to github.com for this; preflight checks it. Without it, use `local` mode.
tn_app_git_repo: "https://github.com/mblanke/TrueNorth.git"
# Pin a commit SHA. A branch name makes re-runs non-deterministic: the same playbook
# would deploy different code on different days. 083aeb7 is main on 2026-10-05.
tn_app_git_version: "083aeb750bbf8ff1c25c6efb0ac03489e708af99"
tn_app_local_path: "" # air-gapped: rsync a checkout from the control node
tn_app_tarball: "" # air-gapped: a release archive

# ── Which images run (deploy by digest; install/README.md "Images") ────
# release: the images a release published, by digest, from its release-manifest.json
#          (checked against the release's SHA256SUMS). Nothing is built on the target, and
#          in git mode the app source is fetched at the manifest's git_sha.
# build:   compose.build.yml builds local tags from the checkout. Lab only: what runs is
#          then not what release.yml scanned.
tn_image_source: release # release | build
# The release tag, e.g. v1.2.3 (docs/release.md). Required with tn_image_source=release.
tn_release_version: ""
tn_release_repo: mblanke/TrueNorth
# A directory ON THE CONTROL NODE holding release-manifest.json and SHA256SUMS (from
# `gh release download <tag> -p release-manifest.json -p SHA256SUMS`). Empty: both are
# downloaded from the GitHub release into tn_release_cache_dir.
tn_release_dir: ""
tn_release_cache_dir: "{{ inventory_dir }}/../.cache/releases"
# Air-gapped: a directory ON THE CONTROL NODE of `docker save` tarballs (*.tar), one per
# image, made as install/README.md "Air-gapped installs" says. Loaded on the target
# instead of pulled; every image must then resolve by its digest, or the install stops.
tn_image_archive_dir: ""

# ── Paths on the platform host ────────────────────────────────────────
tn_data_root: /srv/truenorth
tn_app_dir: "{{ tn_data_root }}/app"
tn_config_dir: "{{ tn_data_root }}/config"
tn_tls_dir: "{{ tn_data_root }}/tls"
tn_state_dir: "{{ tn_data_root }}/state"
# The env file lives OUTSIDE the checkout on purpose:
# infra/platform/docker/.env.production was a git-tracked path, so rendering
# real secrets there would commit them on the next `git add -A`.
tn_env_file: "{{ tn_config_dir }}/.env.production"
tn_compose_file: "{{ tn_app_dir }}/infra/platform/docker/compose.prod.yml"

# Peers whose X-Forwarded-For the API believes (TRUSTED_PROXY_CIDRS): loopback and the
# Docker bridge pool the compose networks (and so nginx) are allocated from. Narrow it
# to the tn-frontend/tn-backend subnets if this host has other Docker networks.
tn_trusted_proxy_cidrs: "127.0.0.0/8,172.16.0.0/12"

# ── OpenSearch ────────────────────────────────────────────────────────
# Security plugin on: roles/tn_tls makes an internal CA, the node and admin
# certificates, and internal_users.yml (bcrypt hashes of the generated passwords).
tn_opensearch_certs_dir: "{{ tn_tls_dir }}/opensearch" # mounted into the opensearch container
tn_opensearch_ca_dir: "{{ tn_tls_dir }}/opensearch-ca" # the CA key: never mounted
tn_opensearch_internal_users: "{{ tn_config_dir }}/opensearch/internal_users.yml"
# LAB/DEV OVERRIDE ONLY. true = no security plugin: no auth, plain http on tn-backend.
# Never on a platform students use (install/README.md, "OpenSearch").
tn_opensearch_disable_security: false

# ── Identity: Active Directory on TN-DC01 ─────────────────────────────
tn_domain: corp.tnrange.lab
tn_dc_host: tn-dc01.corp.tnrange.lab
tn_dc_ip: 10.30.30.10
# TN-MGMT01 must resolve corp.tnrange.lab through AD's DNS on TN-DC01 (which forwards
# everything else). It was built pointing at the router, 192.168.1.1, which knows nothing
# of the domain. roles/tn_base sets this through a systemd-resolved drop-in, which Docker
# also reads, so Keycloak's LDAPS federation resolves the DC too.
tn_dns_servers: ["{{ tn_dc_ip }}"]
tn_ldap_port: 636
tn_ldap_base_dn: "DC=corp,DC=tnrange,DC=lab"
tn_ldap_users_dn: "OU=Users,OU=TrueNorth,DC=corp,DC=tnrange,DC=lab"
tn_ldap_groups_dn: "OU=Groups,OU=TrueNorth,DC=corp,DC=tnrange,DC=lab"
tn_ldap_bind_dn: "CN=TrueNorth Keycloak Bind,OU=ServiceAccounts,OU=TrueNorth,DC=corp,DC=tnrange,DC=lab"
tn_files_dir: "{{ inventory_dir }}/../files"
# Copied from the deployment repo's certs/. Anchored on inventory_dir because
# Ansible resolves a bare `files/` against the PLAYBOOK directory, which here
# is install/playbooks/, not install/.
tn_root_ca_file: "{{ tn_files_dir }}/corp-root-ca.cer"

# The service hostname the platform is reached on.
tn_domain_fqdn: tn-mgmt01.corp.tnrange.lab

# ── Keycloak ──────────────────────────────────────────────────────────
tn_keycloak_realm: truenorth
tn_keycloak_base: "https://{{ tn_domain_fqdn }}/auth"
# Tokens are checked against this issuer (KEYCLOAK_ISSUER in the API).
tn_keycloak_issuer: "{{ tn_keycloak_base }}/realms/{{ tn_keycloak_realm }}"
# Keycloak's port on the host's loopback only, for the installer's Admin REST calls
# (compose.prod.yml publishes 127.0.0.1:KEYCLOAK_ADMIN_PORT).
tn_keycloak_admin_port: 8180
tn_keycloak_web_client: truenorth-web
tn_keycloak_api_client: truenorth-api
# AD security groups. These are the groups the Keycloak group mapper exposes as
# the `groups` claim, which registration reads to suggest a role.
tn_ad_groups:
  - TN-Platform-Admins
  - TN-Range-Operators
  - TN-Instructors
  - TN-Content-Authors
  - TN-Students
  - TN-Observers

# ── Registration / onboarding policy ──────────────────────────────────
tn_registration_allowed_groups: "{{ tn_ad_groups | join(',') }}"
tn_registration_group_role_map:
  TN-Platform-Admins: admin
  TN-Range-Operators: range_ops
  TN-Instructors: instructor
  TN-Content-Authors: instructor
  TN-Students: student
  TN-Observers: observer
tn_tenant_name: "TrueNorth Range"
tn_tenant_slug: default
# Developmental progression a newly approved trainee is enrolled on (DP1 -> DP2).
tn_default_progression: DP1
# The named AD account that becomes the first admin. Without this nobody can
# drain the approval queue and the install completes into a dead end.
tn_bootstrap_admin_upn: ""

# ── vSphere ───────────────────────────────────────────────────────────
# NOTE: vsphere_api, NOT "vsphere" — the registry keys in
# worker/provisioners/__init__.py are mock | proxmox_api | vsphere_api |
# hyperv | terraform | terraform_{proxmox,vsphere,hyperv}.
tn_provisioner_backend: vsphere_api
tn_vcenter_host: 192.168.1.10
tn_vcenter_user: "svc-truenorth@vsphere.local"
tn_vsphere_datacenter: DC-Lab
tn_vsphere_cluster: CL-Lab
# Only used with tn_vsphere_placement: cluster; otherwise each host's local datastore.
tn_vsphere_datastore: esx04-local
# Fallback for a range VM with no VLAN (single-NIC smoke test only). Empty: such a
# VM fails. It must never be the management network: the provisioner refuses range
# VMs on tn_vsphere_mgmt_network (it was dPG-TN-MGMT here).
tn_vsphere_network: ""
# Range VMs are refused on these networks (comma-separated).
tn_vsphere_mgmt_network: dPG-TN-MGMT
# Rendered as VSPHERE_VERIFY_SSL (compose.prod.yml defaults to true). Kept false here,
# as before, for this lab; set true once vCenter's certificate chains to a CA the worker
# image trusts. A production site should not run with false.
tn_vsphere_verify_ssl: false
# Empty: clone the inventory VM templates (tmpl-*). Set once a Content Library exists.
tn_vsphere_content_library: ""
tn_vsphere_concurrency: 4
tn_vsphere_tools_timeout: 120
tn_vsphere_snapshot_timeout: 1800
# Range networks: per-range port groups on VLANs reserved for ranges, trunked on vDS-10G.
tn_vsphere_range_switch_mode: vds
tn_vsphere_range_dvs: vDS-10G
tn_vsphere_range_vswitch: vSwitch1
tn_vsphere_vlan_pool: "100-199"
# spread | per-range-host | cluster. Hosts have 16 threads, so a big range must spread.
tn_vsphere_placement: spread
tn_vsphere_range_folder: truenorth/ranges
tn_vsphere_max_vcpu_per_thread: 4
# esx01 runs the VCSA: keep range VMs off it.
tn_vsphere_exclude_hosts:
  - esx01.truenorth.lab
# Depot uplink (install/lab/README.md). Empty network: ranges stay fully isolated and
# node `services` are not installed. Set to dPG-TN-SVC (and tn_depot_url) once that
# port group, TN-DEPOT01 and the pfSense template's WAN rules exist.
tn_vsphere_range_uplink_network: ""
tn_vsphere_range_uplink_pool: "10.30.32.100-10.30.32.199"
tn_vsphere_range_uplink_gateway: 10.30.32.1
tn_vsphere_range_uplink_prefix: 24
# No new provisioning work after this many seconds (Celery visibility timeout is 3600).
tn_vsphere_provision_budget: 3300
# TN-DEPOT01 as range guests see it, e.g. http://10.30.32.10. Empty: no depot installs.
tn_depot_url: ""
# Empty feed: <tn_depot_url>:8081/repository/chocolatey/. The apt/dnf forward proxy
# must be set when the depot is (http://10.30.32.10:3142): empty falls back to
# tn_depot_url, port 80, where nothing listens.
tn_depot_choco_feed: ""
tn_depot_apt_proxy: ""
tn_software_install_timeout: 1800
# Report rather than fail when the provisioning role is unassigned — see
# roles/tn_vsphere. Flip to true once the role has been granted.
tn_fail_on_missing_vsphere_privs: false

# ── AI ────────────────────────────────────────────────────────────────
tn_ai_base_url: "http://133.1.14.240:4000/v1"

# ── TLS ───────────────────────────────────────────────────────────────
# provided  — you issue the cert from AD CS out of band and drop the pair in
#             install/files/tls/ as truenorth.crt / truenorth.key
# selfsigned — generated here; fine for lab bring-up, not for a real cohort
#
# There is deliberately no `adcs` mode: nothing on TN-DC01 today (no WinRM
# listener, no CES/CEP web enrolment) lets Ansible drive certreq. Claiming
# otherwise would be a mode that never works.
# Self-signed for the first bring-up (2026-10-05); switch to `provided` once the AD CS
# certificate is in install/files/tls/, then re-run playbooks/40-tls.yml.
tn_tls_mode: selfsigned

# ── Preflight thresholds ──────────────────────────────────────────────
tn_min_free_gb: 200
tn_min_docker_version: "24.0.0"
tn_min_compose_version: "2.20.0"

# ── Behaviour switches ────────────────────────────────────────────────
# Demo content ("ACME Corp", "Wayne Enterprises") has no place in a range that
# will hold CAF curriculum. Opt in deliberately.
tn_seed_demo_data: false
# `alembic stamp` papers over a schema that was created by create_all() instead
# of by migrations. Never do it silently.
tn_allow_alembic_stamp: false
# Assert discovery results in 99-validate. False on a first install, when
# nothing has been discovered yet.
tn_expect_discovered: false
