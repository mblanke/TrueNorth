---
# TrueNorth Range — installer variables (non-secret).
#
# Secrets live in inventory/group_vars/all/vault.yml, encrypted with
# ansible-vault. See vault.yml.example for the required keys.

# ── Where the application comes from ──────────────────────────────────
# THIS IS THE BLOCKER RECORDED THROUGHOUT THE DEPLOYMENT REPO
# ("TrueNorth app Git URL — required at M4 install"). Now answered.
tn_app_source_mode: git # git | local | tarball
# mblanke/TrueNorth is public: no credentials on the host. (The old default,
# git.guapo613.beer/soadmin/truenorth, has no `main` branch.) TN-MGMT01 needs HTTPS out
# to github.com for this; preflight checks it. Without it, use `local` mode.
tn_app_git_repo: "https://github.com/mblanke/TrueNorth.git"
# Empty (the default): the commit THIS INSTALLER is checked out at, so the installer and
# the app it deploys are always the same revision (roles/tn_release resolves it on the
# control node). In release mode the manifest's git_sha replaces it. Set a SHA only to
# deploy something else deliberately; a branch name makes re-runs non-deterministic.
# Either way the app's compose.prod.yml must carry this installer's compatibility level
# (install/COMPAT), and a commit older than the one already deployed is refused unless
# -e tn_allow_downgrade=true (docs/runbooks/upgrade.md, "Rollback").
tn_app_git_version: ""
tn_allow_downgrade: false
tn_app_local_path: "" # air-gapped: rsync a checkout from the control node
tn_app_tarball: "" # air-gapped: a source archive of the release's commit (control node)
# One of these is required with a tarball: its SHA-256, or a SHA256SUMS file listing it.
tn_app_tarball_sha256: ""
tn_app_tarball_sums: ""

# ── Which images run (deploy by digest; install/README.md "Images") ────
# release: the images a release published, by digest, from its release-manifest.json
#          (checked against the release's SHA256SUMS). Nothing is built on the target, and
#          in git mode the app source is fetched at the manifest's git_sha.
# build:   compose.build.yml builds local tags from the checkout. Lab only: what runs is
#          then not what release.yml scanned.
tn_image_source: release # release | build
# The release tag, e.g. v1.2.3 (docs/release.md). Required with tn_image_source=release.
tn_release_version: ""
tn_release_repo: mblanke/TrueNorth
# A directory ON THE CONTROL NODE holding release-manifest.json and SHA256SUMS (from
# `gh release download <tag> -p release-manifest.json -p SHA256SUMS`). Empty: both are
# downloaded from the GitHub release into tn_release_cache_dir.
tn_release_dir: ""
tn_release_cache_dir: "{{ inventory_dir }}/../.cache/releases"
# Air-gapped: a directory ON THE CONTROL NODE of `docker save` tarballs (*.tar), one per
# image, made as install/README.md "Air-gapped installs" says. Loaded on the target
# instead of pulled; every image must then resolve by its digest, or the install stops.
tn_image_archive_dir: ""

# ── Paths on the platform host ────────────────────────────────────────
tn_data_root: /srv/truenorth
tn_app_dir: "{{ tn_data_root }}/app"
tn_config_dir: "{{ tn_data_root }}/config"
tn_tls_dir: "{{ tn_data_root }}/tls"
tn_state_dir: "{{ tn_data_root }}/state"
# The env file lives OUTSIDE the checkout on purpose:
# infra/platform/docker/.env.production was a git-tracked path, so rendering
# real secrets there would commit them on the next `git add -A`.
tn_env_file: "{{ tn_config_dir }}/.env.production"
tn_compose_file: "{{ tn_app_dir }}/infra/platform/docker/compose.prod.yml"

# Peers whose X-Forwarded-For the API believes (TRUSTED_PROXY_CIDRS): loopback and the
# Docker bridge pool the compose networks (and so nginx) are allocated from. Narrow it
# to the tn-frontend/tn-backend subnets if this host has other Docker networks.
tn_trusted_proxy_cidrs: "127.0.0.0/8,172.16.0.0/12"

# ── OpenSearch ────────────────────────────────────────────────────────
# Security plugin on: roles/tn_tls makes an internal CA, the node and admin
# certificates, and internal_users.yml (bcrypt hashes of the generated passwords).
tn_opensearch_certs_dir: "{{ tn_tls_dir }}/opensearch" # mounted into the opensearch container
tn_opensearch_ca_dir: "{{ tn_tls_dir }}/opensearch-ca" # the CA key: never mounted
tn_opensearch_internal_users: "{{ tn_config_dir }}/opensearch/internal_users.yml"
# LAB/DEV OVERRIDE ONLY. true = no security plugin: no auth, plain http on tn-backend.
# Never on a platform students use (install/README.md, "OpenSearch").
tn_opensearch_disable_security: false
# Telemetry backups: a filesystem snapshot repository at {{ tn_data_root }}/opensearch-snapshots
# (path.repo in compose.prod.yml), registered by 70-telemetry and snapshotted by the nightly
# backup. Empty = no snapshot repository: telemetry is then not backed up.
tn_opensearch_snapshot_repo: tn_snapshots
# How many of the newest backup snapshots it keeps (0 = all). Each pins the indices it holds, so a long
# tail keeps telemetry the 90-day ISM policy already deleted. Older backups then restore
# without telemetry (restore.sh says so before it stops anything).
tn_opensearch_snapshot_keep: 14

# ── Identity: Active Directory on TN-DC01 ─────────────────────────────
# AD/LDAPS integration (resolver drop-in, LDAPS bind, Keycloak federation, the AD import
# check). Off by default: a site without TN-DC01 gets local Keycloak groups and a local
# bootstrap administrator instead (install/README.md "Without Active Directory").
# inventory/hosts.yml turns it on for TN-MGMT01.
tn_ldap_enabled: false
tn_domain: corp.tnrange.lab
tn_dc_host: tn-dc01.corp.tnrange.lab
tn_dc_ip: 10.30.30.10
# TN-MGMT01 must resolve corp.tnrange.lab through AD's DNS on TN-DC01 (which forwards
# everything else). It was built pointing at the router, 192.168.1.1, which knows nothing
# of the domain. roles/tn_base sets this through a systemd-resolved drop-in, which Docker
# also reads, so Keycloak's LDAPS federation resolves the DC too.
tn_dns_servers: ["{{ tn_dc_ip }}"]
tn_ldap_port: 636
tn_ldap_base_dn: "DC=corp,DC=tnrange,DC=lab"
tn_ldap_users_dn: "OU=Users,OU=TrueNorth,DC=corp,DC=tnrange,DC=lab"
tn_ldap_groups_dn: "OU=Groups,OU=TrueNorth,DC=corp,DC=tnrange,DC=lab"
tn_ldap_bind_dn: "CN=TrueNorth Keycloak Bind,OU=ServiceAccounts,OU=TrueNorth,DC=corp,DC=tnrange,DC=lab"
# The bind password the LDAPS check (40-tls) and the Keycloak federation (60-keycloak)
# use. Always the vault's; one name so both read the same value.
tn_ldap_bind_password: "{{ vault_ldap_bind_password | default('') }}"
# With AD: keep the bootstrap administrator (tn_bootstrap_admin_upn) a LOCAL Keycloak
# account too, in TN-Platform-Admins, with its generated password. The recovery path when
# the directory, the bind account or LDAPS fails, and what staging keeps while AD is
# being qualified (install/README.md "AD on staging"). The UPN must then be outside
# tn_domain (preflight checks), so it never names an AD account. Without AD the local
# administrator is always created and this does nothing.
tn_keycloak_local_admin: false
tn_files_dir: "{{ inventory_dir }}/../files"
# Copied from the deployment repo's certs/. Anchored on inventory_dir because
# Ansible resolves a bare `files/` against the PLAYBOOK directory, which here
# is install/playbooks/, not install/.
tn_root_ca_file: "{{ tn_files_dir }}/corp-root-ca.cer"

# The service hostname the platform is reached on.
tn_domain_fqdn: tn-mgmt01.corp.tnrange.lab
# Stable identity and data classification of this independent deployment. Change these per
# enclave; never copy a classified deployment's keys, database or secrets with the values.
tn_enclave_id: unclass-training
tn_classification_level: unclassified # unclassified | secret | top_secret

# ── LTI 1.3 ───────────────────────────────────────────────────────────
# The public URLs learning platforms are given: the API as browsers reach it (the edge
# strips /api, so <tool base>/lti/launch is the API's /lti/launch) and the web app. One
# source for the api's LTI_TOOL_BASE_URL / LTI_WEB_BASE_URL (tn_config) and the Moodle
# node's tool registration (tn_moodle_tool_url), so GET /integrations/lti/tool-config,
# Moodle's registered tool and the routes agree.
tn_lti_tool_base_url: "https://{{ tn_domain_fqdn }}/api"
tn_lti_web_base_url: "https://{{ tn_domain_fqdn }}"

# ── xAPI and cmi5 (docs/xapi-conformance.md, docs/cmi5.md) ────────────
# The xAPI actor's homePage and the root of TrueNorth's activity IRIs. Every statement
# carries them and the LRS compares them as strings: fix them before the first cohort
# and never change them afterwards. The defaults are what the api used before the
# installer rendered them (compose.prod.yml's https://${DOMAIN}), so upgrades keep them.
tn_xapi_account_homepage: "https://{{ tn_domain_fqdn }}"
tn_xapi_iri_base: "https://{{ tn_domain_fqdn }}/xapi"
# TrueNorth as a cmi5 LMS for its released courses. true: 50-stack-up mints the AU's own
# LRS credential (CMI5_LRS_AUTH) once and keeps it, 99-validate fails without it, and
# 95-smoke-test proves launches do not answer 503. vault_cmi5_lrs_auth supplies one
# instead (base64 key:secret of a credential this LRS already has). false: no credential
# is rendered and every cmi5 launch answers 503 (fail closed).
tn_cmi5_enabled: true
# The AU runtime and the API as Students' browsers reach them (the api's own defaults:
# the web app's URL, and that + /api).
tn_cmi5_web_base_url: "{{ tn_lti_web_base_url }}"
tn_cmi5_api_base_url: "{{ tn_cmi5_web_base_url }}/api"

# ── Keycloak ──────────────────────────────────────────────────────────
tn_keycloak_realm: truenorth
tn_keycloak_base: "https://{{ tn_domain_fqdn }}/auth"
# Tokens are checked against this issuer (KEYCLOAK_ISSUER in the API).
tn_keycloak_issuer: "{{ tn_keycloak_base }}/realms/{{ tn_keycloak_realm }}"
# Keycloak's port on the host's loopback only, for the installer's Admin REST calls
# (compose.prod.yml publishes 127.0.0.1:KEYCLOAK_ADMIN_PORT).
tn_keycloak_admin_port: 8180
tn_keycloak_web_client: truenorth-web
tn_keycloak_api_client: truenorth-api
# The API's own confidential service account for Keycloak's Admin API (/ad-sync): client
# credentials, holding only the realm-management roles the API calls need
# (roles/tn_keycloak). The master-realm admin is never in the API's environment.
tn_keycloak_api_admin_client: truenorth-api-admin
# The service hostname must resolve on the platform host itself (the seed and smoke
# checks call https://<tn_domain_fqdn>/ from there). true: pin it to 127.0.0.1 in
# /etc/hosts, for a site whose DNS does not know the name yet.
tn_manage_etc_hosts: false
# AD security groups. These are the groups the Keycloak group mapper exposes as
# the `groups` claim, which registration reads to suggest a role.
tn_ad_groups:
  - TN-Platform-Admins
  - TN-Range-Operators
  - TN-Instructors
  - TN-Content-Authors
  - TN-Students
  - TN-Observers

# ── Registration / onboarding policy ──────────────────────────────────
tn_registration_allowed_groups: "{{ tn_ad_groups | join(',') }}"
tn_registration_group_role_map:
  TN-Platform-Admins: admin
  TN-Range-Operators: range_ops
  TN-Instructors: instructor
  TN-Content-Authors: instructor
  TN-Students: student
  TN-Observers: observer
# Auth zone (Admin > Auth zones) whose clearance and network rules apply at
# registration. Empty: none. There is no default zone; name one explicitly.
tn_registration_auth_zone: ""

# ── Login banner (NIST AC-8; docs/security.md) ────────────────────────
# Shown above the Keycloak sign-in form; the form cannot be submitted until the
# acknowledgement box is ticked. The default is the owner's GoC-style notice; the
# accredited wording for a site is the system owner's to supply. Changing it needs only
# a re-run of 60-keycloak (no rebuild, no restart). LTI-launched Students sign in
# through Moodle, not Keycloak, and do not see it (no Moodle banner, by decision).
tn_login_banner_title: Notice to users
tn_login_banner_text: >-
  This is a Government of Canada training system. Use is monitored and recorded.
  Unauthorized use is prohibited and may result in disciplinary or legal action.
  By continuing you consent to monitoring.
tn_login_banner_ack: I have read and accept this notice

# ── Audit log integrity (ADR 0011; docs/security.md "Audit Logging") ──
# The signed daily export of audit_logs is written here by worker-scenario (uid 10001),
# copied and verified by every backup. Never pruned by TrueNorth.
tn_audit_archive_path: "{{ tn_data_root }}/audit-archive"
# Days audit rows stay in the database before the retention job deletes them (each day
# only after its export verifies). Never below 30; 0 keeps them forever.
tn_audit_hot_retention_days: 90

# ── Multi-factor sign-in (docs/identity.md "MFA") ─────────────────────
# Roles that must sign in with a second factor (OTP). The API enforces it per request
# from the database role (TN_MFA_ROLES); 60-keycloak makes the realm ask for it from the
# Keycloak groups those roles map to (tn_registration_group_role_map). Production refuses
# to start without all four. Students (and LTI-launched Students) are exempt.
tn_mfa_roles: [admin, instructor, range_ops, observer]
# Test hosts only: the shipped demo staff (instructor.demo / observer.demo) sign in
# without a second factor. Honoured only on a test host (TN_TEST_HOST, which the
# installer sets only with tn_arc2_enabled + tn_arc2_auto_accept) that also loads the
# shipped demo (tn_load_shipped_demo). The API ignores it anywhere else, refuses to
# start with it in production without TN_TEST_HOST, and audits each use.
tn_mfa_demo_exempt: false
tn_mfa_demo_exempt_effective: >-
  {{ (tn_mfa_demo_exempt | bool) and (tn_load_shipped_demo | bool)
     and (tn_arc2_enabled | default(false) | bool) and (tn_arc2_auto_accept | default(false) | bool) }}
# Without AD: the local, non-privileged account 95-smoke-test signs in as (TN-Observers,
# never registered in TrueNorth). Its password is the persisted secret smoke_user_password.
tn_smoke_local_user: "tn-smoke@{{ tn_domain_fqdn }}"
tn_tenant_name: "TrueNorth Range"
tn_tenant_slug: default
# Developmental progression a newly approved trainee is enrolled on (DP1 -> DP2).
tn_default_progression: DP1
# The named AD account that becomes the first admin. Without this nobody can
# drain the approval queue and the install completes into a dead end.
tn_bootstrap_admin_upn: ""

# ── vSphere ───────────────────────────────────────────────────────────
# NOTE: vsphere_api, NOT "vsphere" — the registry keys in
# worker/provisioners/__init__.py are mock | vsphere_api | proxmox_api | hyperv.
# proxmox_api and hyperv are experimental: preflight, the API and the workers refuse
# them unless tn_experimental_provisioners is true (EXPERIMENTAL_PROVISIONERS).
tn_provisioner_backend: vsphere_api
tn_experimental_provisioners: false
# Whether this site has a vCenter. False with the mock provisioner (an install test with
# no hypervisor): preflight skips the vCenter checks and 90-vsphere does nothing, and
# vault_vsphere_password may stay a placeholder. Ranges are then simulated, not built.
tn_uses_vcenter: "{{ 'vsphere' in tn_provisioner_backend }}"
tn_vcenter_host: 192.168.1.10
# 443 for a real vCenter. A simulator (playbooks/lab-vcenter-sim.yml) listens on 8989.
tn_vcenter_port: 443
tn_vcenter_address: "{{ tn_vcenter_host }}{{ '' if tn_vcenter_port | int == 443 else ':' ~ tn_vcenter_port }}"
tn_vcenter_user: "svc-truenorth@vsphere.local"
tn_vsphere_datacenter: DC-Lab
tn_vsphere_cluster: CL-Lab
# Only used with tn_vsphere_placement: cluster; otherwise each host's local datastore.
tn_vsphere_datastore: esx04-local
# Fallback for a range VM with no VLAN (single-NIC smoke test only). Empty: such a
# VM fails. It must never be the management network: the provisioner refuses range
# VMs on tn_vsphere_mgmt_network (it was dPG-TN-MGMT here).
tn_vsphere_network: ""
# Range VMs are refused on these networks (comma-separated).
tn_vsphere_mgmt_network: dPG-TN-MGMT
# Rendered as VSPHERE_VERIFY_SSL. Verify vCenter's certificate. A lab whose vCenter
# still serves the VMCA's self-signed chain overrides this per host (inventory/hosts.yml
# says why); a production site never does.
tn_vsphere_verify_ssl: true
# 80-seed registers this vCenter as a hypervisor connection of the bootstrap
# administrator's tenant (scripts/register_vcenter_inprocess.py), so /infrastructure and
# the acceptance suite's provisioners check see it after an install. Idempotent: an
# existing connection with this host is reused (username/datacenter/verify_ssl kept in
# step), never duplicated. Only with tn_uses_vcenter and a tn_vcenter_host. A failed
# connection test warns, it does not fail the install. install/README.md "Infrastructure
# page: the installer registers its vCenter".
tn_register_vcenter_connection: true
tn_vcenter_connection_name: Range vCenter
# The connection's password is set from vault_vsphere_password when it is created, and
# then left alone: an operator may rotate it on the Infrastructure page. After rotating
# vault_vsphere_password, re-run 80-seed with -e tn_vcenter_connection_update_password=true.
tn_vcenter_connection_update_password: false
# Rendered as INFRA_DISCOVERY_SECONDS. The api rediscovers every active hypervisor
# connection this often, so the Infrastructure page's hosts, VM counts and load gauges
# stay current without anyone pressing Discover. 0 turns the schedule off (figures then
# change only on Refresh now / Discover). install/README.md "Infrastructure page".
tn_infra_discovery_seconds: 300
# Rendered as RANGE_CERT_RETENTION_MONTHS. Range Certification Records of earlier builds
# (archived; a range's current record is never purged) are deleted this many months after
# they were opened, each with an audit row; export them first. 0 keeps them forever.
tn_range_cert_retention_months: 12
# Empty: clone the inventory VM templates (tmpl-*). Set once a Content Library exists.
tn_vsphere_content_library: ""
tn_vsphere_concurrency: 4
tn_vsphere_tools_timeout: 120
# Readiness: how long (s) after power-on each Linux/Windows range VM has to show its planned
# IPs in VMware Tools before the range is failed; "off" only for a simulator without Tools.
tn_vsphere_guest_ip_timeout: 600
tn_vsphere_guest_ip_check: require
# Windows guest customization (Sysprep, #255). GRACE: a check the build's budget left running
# fails this long (s) after its readiness window ended, even with vCenter unreachable. SKEW:
# a Sysprep success that ended up to this long (s) before the power-on request still counts
# (vCenter and worker clocks disagree, e.g. NTP down); an older one is the template's leftover.
tn_vsphere_customization_grace: 900
tn_vsphere_customization_skew: 300
# Golden-image pinning (ADR 0013 §2): every range VM clones its image's PROMOTED build (an
# admin promotes one on the Golden Images page). Transition only: "true" lets images that are
# `built` but have no promoted build through, cloning their plain template with a loud
# warning; a comma list of catalogue ids (ubuntu-lts) lets only those through. It switches
# off per image: an image with a promoted build always clones that build. Default: off.
tn_template_allow_unpromoted: "false"
# Range NIC MACs come from this slice of VMware's manual range (00:50:56:00:00:00-
# 00:50:56:3f:ff:ff), reserved per NIC. EACH TrueNorth install on a shared vCenter needs its
# OWN, non-overlapping slice (two installs on one slice hand out the same MACs). Empty: the
# whole TrueNorth default, 00:50:56:3c:00:00-00:50:56:3f:ff:ff. Set per install (hosts.yml).
tn_vsphere_mac_pool: ""
tn_vsphere_snapshot_timeout: 1800
# Range networks: per-range port groups on VLANs reserved for ranges, trunked on vDS-10G.
tn_vsphere_range_switch_mode: vds
tn_vsphere_range_dvs: vDS-10G
tn_vsphere_range_vswitch: vSwitch1
tn_vsphere_vlan_pool: "100-199"
# VLANs never handed to a range, even inside the pool: the site's own (management 30,
# build 31, depot uplink 32 at the work site). Comma list of ids/ranges; "" = none. Before
# each allocation the worker also reads every port group on tn_vsphere_range_dvs live and
# keeps off any VLAN something else carries (range certification S1).
tn_vsphere_reserved_vlans: "30-32"
# Site networks no range template subnet may overlap: refused when a template is validated
# or saved, and again at provision. The work site's management, build and depot-uplink /24s.
tn_range_reserved_cidrs:
  - 10.30.30.0/24
  - 10.30.31.0/24
  - 10.30.32.0/24
# Isolation evidence per zone (range certification S4, ADR 0013 §4). Once a range is ready,
# one VM in every range network probes these site addresses through VMware guest operations
# (as the least-privileged account the range declares on it); each must be proven
# unreachable. host:port (TCP and ICMP), a bare host (ICMP only), [v6-address]:port for IPv6.
# warn records the verdict on the certification record; enforce also fails a range that is
# not proven isolated. It stays warn until the network team signs off the model (#238).
tn_range_isolation_check: warn
tn_range_isolation_probe_targets:
  - 10.30.30.1:443    # management gateway
  - 10.30.30.10:53    # site DNS
  - 192.168.1.10:443  # vCenter
  - 10.30.30.30:22    # TN-DEPOT01 management address
  - 10.30.30.20:443   # TN-MGMT01
# Permitted exceptions: each MUST connect from every zone; every other port of the same
# hosts (tn_range_isolation_closed_ports) and ICMP to them must not.
tn_range_isolation_exceptions:
  - 10.30.32.10:8081  # TN-DEPOT01 range NIC, Nexus
  - 10.30.32.10:3142  # TN-DEPOT01 range NIC, apt-cacher-ng
tn_range_isolation_closed_ports: [22, 80, 443, 8080]
# A name that must not resolve from inside a range (answers inside the range, or in the
# simulated internet 198.18.0.0/15 that Greyspace serves, do not count as resolving).
tn_range_isolation_external_name: example.com
# spread | per-range-host | cluster. Hosts have 16 threads, so a big range must spread.
tn_vsphere_placement: spread
tn_vsphere_range_folder: TrueNorth/Ranges  # <range-name>-<id8> per range; the old truenorth/ranges is still found (vcenter-organize.sh moves it)
tn_vsphere_max_vcpu_per_thread: 4
# esx01 runs the VCSA: keep range VMs off it.
tn_vsphere_exclude_hosts:
  - esx01.truenorth.lab
# Range uplink: the network each range's edge firewall gets its WAN NIC on, where it
# reaches TN-DEPOT01 (install/lab/README.md, "Ranges reach the depot"; #214). Empty
# network: ranges stay fully isolated and node `services` are not installed.
# TODO(site): set it LAST, to the port group TN-DEPOT01's third NIC is on (planned:
# dPG-TN-SVC, VLAN 32; install/lab/work-site tn_depot_range_portgroup), once that port
# group and its UniFi rules exist and `build-phase.sh depot` has passed. It must never be
# dPG-TN-MGMT or dPG-TN-BUILD (the provisioner refuses tn_vsphere_mgmt_network).
tn_vsphere_range_uplink_network: ""
tn_vsphere_range_uplink_pool: "10.30.32.100-10.30.32.199"
tn_vsphere_range_uplink_gateway: 10.30.32.1
tn_vsphere_range_uplink_prefix: 24
# No new provisioning work after this many seconds (Celery visibility timeout is 3600).
tn_vsphere_provision_budget: 3300
# TN-DEPOT01 as range guests see it: its third NIC, on the range uplink network (#214).
# Scheme and IP address only, no port and no path: the worker derives the Chocolatey feed
# as <tn_depot_url>:8081/repository/chocolatey/ when tn_depot_choco_feed is empty, and the
# range firewalls' TN_DEPOT alias is this URL's host (VyOS needs an IP address). Unused
# while tn_vsphere_range_uplink_network is empty. Empty: no depot installs.
tn_depot_url: "http://10.30.32.10"
# Set explicitly so nothing depends on a derived default. The apt/dnf forward proxy must be
# set: empty falls back to tn_depot_url, port 80, where nothing listens.
tn_depot_choco_feed: "http://10.30.32.10:8081/repository/chocolatey/"
tn_depot_apt_proxy: "http://10.30.32.10:3142"
# TCP ports of the depot each range firewall lets its zones reach through the WAN (Nexus,
# apt-cacher-ng); everything else out of the WAN is blocked. TN-DEPOT01's own firewall
# admits exactly these on its range NIC.
tn_depot_ports: "8081,3142"
tn_software_install_timeout: 1800
# IGNORED since ADR 0013 (no site-wide range password); preflight says so when it is set.
tn_range_default_password: "{{ vault_range_default_password | default('') }}"
# The golden templates' generic build login (ADR 0012 §5, limited by ADR 0013 §3 to the
# template's construction): the same values as Packer's lab.auto.pkrvars.hcl
# (windows_admin_password, ssh_username / ssh_password). No range VM keeps it: every range
# gets its own generated password for each of these logins. The worker uses the passwords
# only to prove, per built VM, that they no longer log in; the API gets the user name only.
# Empty: that check records "inconclusive".
tn_template_windows_admin_password: "{{ vault_template_windows_admin_password | default('') }}"
tn_template_linux_user: ubuntu
tn_template_linux_password: "{{ vault_template_linux_password | default('') }}"
# ADR 0013 §3 template-login check: enforce (default) or warn.
tn_range_template_login_check: enforce
# Deploy-time setup of the Exchange 2019 / SharePoint (2019, SE) / MECM role images
# (vmware-site-runbook.md §7.3): the product key for the SharePoint version the site's
# ranges use, currently SharePoint Server 2019 (a mismatched key fails setup, status 13;
# empty: left staged), and how long a product setup may take (it carries on in the guest).
tn_sharepoint_product_key: "{{ vault_sharepoint_product_key | default('') }}"
tn_vsphere_role_setup_timeout: 7200
# Report rather than fail when the provisioning role is unassigned — see
# roles/tn_vsphere. Flip to true once the role has been granted.
tn_fail_on_missing_vsphere_privs: false

# ── AI ────────────────────────────────────────────────────────────────
# true (default): this host has an AI endpoint, and preflight stops without tn_ai_base_url.
# false: install without AI (no AI server yet). No endpoint or key is rendered, the AI
# orchestrator reports ai_configured=false, AI features show "not configured" and answer 503,
# 99-validate reports "AI: disabled". ARC² then needs its own model (preflight checks).
# Turning it on later: install/README.md "AI (optional)".
tn_ai_enabled: true
# The OpenAI-compatible endpoint (LiteLLM) the AI orchestrator calls, e.g.
# http://<litellm-host>:4000/v1. REQUIRED with tn_ai_enabled: there is no default, and
# preflight stops without it. Its key is vault_openai_api_key (empty only for an
# unauthenticated endpoint).
tn_ai_base_url: ""
# The model ids the endpoint serves (its /models list). The defaults are LiteLLM aliases;
# another server (Open WebUI, vLLM, Ollama) names its models differently.
tn_ai_default_model: agent
tn_ai_embed_model: embed
# The orchestrator's per-task models (AI_HEAVY_MODEL: courses, quizzes, exercises, AARs,
# scenarios; AI_GENERAL_MODEL: general; AI_CODE_MODEL: detection rules). Each defaults to
# tn_ai_default_model, so one model id is enough for an endpoint with one chat model. Before
# v1.2.0 they were not rendered and compose's agent/agent/coder-fast applied whatever
# tn_ai_default_model said (staging, rc7: 400 from a router without those). 99-validate
# fails when the endpoint's /models lists none of these ids.
tn_ai_heavy_model: "{{ tn_ai_default_model }}"
tn_ai_general_model: "{{ tn_ai_default_model }}"
tn_ai_code_model: "{{ tn_ai_default_model }}"
# 80-seed registers this endpoint as the AI backend "Platform AI"
# (scripts/register_ai_backend_inprocess.py), with a model route for each id above, so the
# AI settings page is not empty after an install. Idempotent: an existing backend with this
# name (or base URL) is reused, its base URL kept in step, never duplicated. Only with
# tn_ai_enabled and a tn_ai_base_url. An unreachable endpoint warns, it does not fail the
# install. install/README.md "AI (optional)".
tn_register_ai_backend: true
tn_ai_backend_name: Platform AI
# The backend's key is set from vault_openai_api_key when it is created, and then left
# alone: an operator may rotate it on the AI page. After rotating vault_openai_api_key,
# re-run 80-seed with -e tn_ai_backend_update_key=true.
tn_ai_backend_update_key: false

# ── ARC² Course Studio (optional; install/README.md "ARC² Course Studio (optional)") ──
# Off by default. true: playbooks/55-arc2.yml installs the course-authoring runner on this
# host (a dedicated tn-arc2 account, a bubblewrap sandbox per job, Node and Claude Code at
# the versions below, a hardened systemd service) and the api serves /api/arc2 from the
# runs directory it shares with the runner. Needs exactly one of vault_arc2_claude_oauth_token
# (a Claude subscription) or vault_arc2_anthropic_api_key (vault.yml.example), and HTTPS
# out to the model endpoint. Course requests and generated content go to that endpoint:
# read docs/arc2-course-studio.md "Deployment" before turning it on where CUI is held.
tn_arc2_enabled: false
tn_arc2_runs_dir: "{{ tn_data_root }}/arc2/runs"
# The runs directory's group id; the api container joins it (compose group_add). Must be
# free on the host, or already be tn-arc2-runs (preflight checks).
tn_arc2_runs_gid: 10010
# Claude Code, exactly. Bump with roles/tn_arc2/files/claude-code/package*.json (README).
tn_arc2_claude_code_version: "2.1.286"
# Node.js, only to install Claude Code. Bump with tn_arc2_node_sha256 (roles/tn_arc2).
tn_arc2_node_version: "24.21.0"
# Empty: api.anthropic.com. Or an Anthropic-compatible gateway, https on port 443 only
# (Claude Code reads ANTHROPIC_BASE_URL; the jobs' egress proxy tunnels 443 to this host).
tn_arc2_anthropic_base_url: ""
# Which model runs a job (the runner's ARC2_MODE; docs/arc2-course-studio.md §13):
#   subscription                      Claude, with exactly one credential below (the default)
#   local                             only the Anthropic-compatible gateway at tn_arc2_local_url
#                                     (a LiteLLM router exposing /v1/messages, say): jobs never
#                                     reach api.anthropic.com; needs url, model and
#                                     vault_arc2_local_token, and no Anthropic credential
#   subscription_with_local_fallback  Claude; a step Claude cannot run at all (signed out,
#                                     usage limit, overloaded) is re-run on the gateway; needs both
#   local_with_subscription_fallback  the reverse: the gateway runs every step; a step it cannot
#                                     run at all (unreachable, 5xx, overloaded, auth failure) is
#                                     re-run on Claude; needs both (url, model, token and exactly
#                                     one Claude credential); egress allows both hosts
tn_arc2_mode: subscription
# The gateway, https on any port (https://host[:port][/path]; never http), and the model id
# it serves. The jobs' egress proxy allows exactly that host:port, and 55-arc2 lets the
# runner reach exactly the addresses the host resolves to, even inside tn_arc2_ip_deny
# (a tailnet's 100.64.0.0/10, a private LAN); the rest of those ranges stays denied.
tn_arc2_local_url: ""
tn_arc2_local_model: ""
# TEST HOSTS ONLY. true: when a job stops at the outline gate, or at the preview gate with
# QA passing, the runner accepts it itself (ARC2_AUTO_ACCEPT_GATES), so a course is built end
# to end without a reviewer. Recorded as accepted_by "auto (test host)", and the Studio marks
# such runs "TEST CONTENT". Never past a failure, a STOP or a QA takeover.
tn_arc2_auto_accept: false
# Free space preflight requires when ARC² is on: for runs on tn_data_root's disk, and for
# /opt/truenorth-arc2 (Node, Claude Code, the venv: about 1.5 GB) on the root disk.
tn_arc2_min_free_gb: 5
tn_arc2_min_free_system_gb: 3
# Air-gapped mirrors (empty: the public registries; the Node mirror is tn_arc2_node_mirror).
tn_arc2_pip_index_url: ""
tn_arc2_npm_registry: ""

# ── TLS ───────────────────────────────────────────────────────────────
# provided  — you issue the cert from AD CS out of band and drop the pair in
#             install/files/tls/ as truenorth.crt / truenorth.key
# selfsigned — generated here; fine for lab bring-up, not for a real cohort
#
# There is deliberately no `adcs` mode: nothing on TN-DC01 today (no WinRM
# listener, no CES/CEP web enrolment) lets Ansible drive certreq. Claiming
# otherwise would be a mode that never works.
# Self-signed for the first bring-up (2026-10-05); switch to `provided` once the AD CS
# certificate is in install/files/tls/, then re-run playbooks/40-tls.yml.
tn_tls_mode: selfsigned

# ── Container runtime (roles/tn_docker, playbooks/00-docker.yml) ──────
# true: the installer installs Docker Engine from Docker's apt repository (key checked
# against its pinned fingerprint) at the versions below, holds the packages so
# unattended-upgrades cannot move them, writes /etc/docker/daemon.json, installs chrony
# and adds ansible_user to the docker group. false: the role does nothing; Docker must
# already be installed and preflight's version floor still applies. Default: true only
# on Ubuntu 24.04, the platform OS. Set false on a host whose Docker you manage yourself,
# or air-gapped with no reachable Docker apt mirror (install/README.md "Prerequisites").
tn_install_docker: "{{ ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '24.04' }}"
# Upstream versions, as Docker's noble repository names them without the epoch and the
# "-1~ubuntu.24.04~noble" suffix. To bump: list what the repository has
#   apt-cache madison docker-ce docker-compose-plugin containerd.io docker-buildx-plugin
# set the new versions here, re-run playbooks/00-docker.yml (it moves the held packages
# and re-holds them; the daemon restarts, and so does the stack), then the whole
# site.yml. Checked 2026-10-08: the newest stable in noble.
tn_docker_version: "29.9.0" # docker-ce and docker-ce-cli
tn_compose_version: "5.6.0" # docker-compose-plugin
tn_containerd_version: "2.3.6" # containerd.io
tn_buildx_version: "0.38.0" # docker-buildx-plugin
# Write the log rotation and containerd image store keys into /etc/docker/daemon.json,
# merged over whatever else the file holds (the previous file is kept as a backup).
# false: leave daemon.json alone; then enable the containerd image store yourself for
# air-gapped installs.
tn_docker_manage_daemon_json: true

# ── Preflight thresholds ──────────────────────────────────────────────
tn_min_free_gb: 200
tn_min_docker_version: "24.0.0"
# 2.24: scripts/backup/drill.sh uses the compose `!reset` tag.
tn_min_compose_version: "2.24.0"

# ── Backups (scripts/backup; docs/runbooks/backup-restore.md) ─────────
# The secrets escrow is REQUIRED; the install stops without one of:
#   tn_backup_escrow_pubkey: an RSA public key (PEM) ON THE CONTROL NODE. Each backup
#     encrypts the env file and /srv/truenorth/config/secrets/ to it. Keep the private key
#     offline (scripts/backup/restore-secrets.sh needs it).
#   tn_backup_escrow: out-of-band — you attest the secrets are escrowed elsewhere (the
#     vault, a safe); backups then hold no secrets at all.
tn_backup_escrow_pubkey: ""
tn_backup_escrow: ""
# Backups never fill the disk: a backup does not start with less than this free, and the
# oldest are pruned (never the newest) while all backups together exceed the cap.
tn_backup_min_free_gb: 20
tn_backup_max_total_gb: 200
# Upgrades (50-stack-up): a backup before migrating, and what happens to in-flight
# Celery tasks when the workers stop. drain: wait for them (worker-provision can take up
# to an hour while a range builds). abandon: stop after 60 s; interrupted ranges must be
# torn down and rebuilt (docs/runbooks/upgrade.md).
tn_pre_upgrade_backup: true
tn_upgrade_inflight: drain # drain | abandon

# ── Email (SMTP; install/README.md "Email (SMTP)") ─────────────────────
# The relay the API sends its mail through: roll-call onboarding emails, class reminders,
# seat-forfeit notices and calendar invites (control-plane/api/app/notifications/smtp.py).
# Rendered into the env file as SMTP_*. Optional: with tn_smtp_host empty nothing is sent,
# the mail is only logged, and admins see an "Email is not configured" banner. Any relay
# works: an internal Exchange or Postfix, a smarthost, a hosted service.
# Set once: alert email (tn_alert_*, below) defaults to these same settings.
tn_smtp_host: "" # e.g. smtp.corp.example; empty: email off
# 587 with starttls is the usual submission port; 465 with tls; 25 with starttls or none.
tn_smtp_port: 587
# starttls: plain connect, then STARTTLS (refused if the relay does not offer it).
# tls: TLS from the first byte (implicit TLS, usually port 465).
# none: no encryption (an internal relay that offers neither; credentials then cross the
# wire in clear, so use it only without tn_smtp_username).
tn_smtp_security: starttls # starttls | tls | none
# The account to sign in as. Empty: no authentication (a relay that accepts mail from
# this host by address). Its password is vault_smtp_password (vault.yml); set both or
# neither. Preflight checks it.
tn_smtp_username: ""
# The sender every message carries. Required with tn_smtp_host; the relay must let this
# host send as it. Preflight checks it looks like an address.
tn_smtp_from_address: "" # e.g. truenorth@corp.example

# ── Alert delivery by email (install/README.md "Alerting"; docs/operations.md) ──
# false (the default): Alertmanager routes every alert to a null receiver, or to the
# webhook if vault_alertmanager_webhook_url is set, and 99-validate warns that alerts are
# NOT delivered. true: 30-config renders an email receiver
# ({{ tn_config_dir }}/alertmanager/alertmanager.email.yml). Criticals are mailed at once
# and hourly while firing; warnings are batched; resolutions are mailed too. Preflight
# refuses an empty recipient, sender or relay, and a CHANGE_ME in the SMTP credentials
# (vault_alert_smtp_username / vault_alert_smtp_password, by default the app's
# tn_smtp_username / vault_smtp_password; leave both empty for a relay that takes
# unauthenticated mail from this host). Prove delivery with
# playbooks/alert-test.yml (tag tn-alert-test).
tn_alert_email_enabled: false
tn_alert_email_to: "" # one address, or several separated by commas
# The sender, relay and credentials default to the app's tn_smtp_* above, so a site sets
# them once. Override any of them here (or in the host's inventory) to send alerts
# through another relay.
tn_alert_email_from: "{{ tn_smtp_from_address }}"
tn_alert_smtp_host: "{{ tn_smtp_host }}"
tn_alert_smtp_port: "{{ tn_smtp_port }}"
# STARTTLS is required unless tn_smtp_security is none (Alertmanager refuses to send if
# the relay does not offer it). On port 465 Alertmanager speaks implicit TLS instead.
tn_alert_smtp_require_tls: "{{ tn_smtp_security | default('starttls') != 'none' }}"
# The credentials Alertmanager signs in with: vault_alert_smtp_username /
# vault_alert_smtp_password when the vault sets them (an override, whatever the vault
# file is called), else the app's tn_smtp_username / vault_smtp_password. The password
# falls back only with the username, so a half-set override is caught by preflight.
tn_alert_smtp_username: "{{ vault_alert_smtp_username | default(tn_smtp_username | default('')) }}"
tn_alert_smtp_password: >-
  {{ vault_alert_smtp_password | default(vault_smtp_password | default('')
     if vault_alert_smtp_username is not defined else '') }}

# ── Moodle (optional; install/README.md "Moodle (optional)") ──────────
# true: 85-moodle runs TrueNorth's Moodle for tn_tenant_slug at
# https://<tn_domain_fqdn>:<tn_moodle_port>, registers it as the tenant's Moodle platform
# and backs it up nightly. false: nothing Moodle is installed or touched. The rest of its
# settings: roles/tn_moodle/defaults/main.yml.
tn_moodle_enabled: false
tn_moodle_node: default
tn_moodle_port: 8443
tn_moodle_compose_file: "{{ tn_app_dir }}/infra/platform/docker/compose.moodle-prod.yml"
tn_moodle_env_file: "{{ tn_config_dir }}/moodle-{{ tn_moodle_node }}.env"

# ── Logs ──────────────────────────────────────────────────────────────
# /srv/truenorth/logs (nginx, backup.log) is rotated by logrotate (roles/tn_base).
tn_logrotate_days: 14

# ── Behaviour switches ────────────────────────────────────────────────
# Demo content ("ACME Corp", "Wayne Enterprises") has no place in a range that
# will hold CAF curriculum. Opt in deliberately.
tn_seed_demo_data: false
# The shipped content/ (curriculum, VM catalogue, range templates, scenarios, Sigma rules),
# loaded through the API by 80-seed. Off: a site loads its own. Imports are drafts unless
# tn_publish_shipped_content. tn_load_shipped_demo adds demo people and demo
# ranges/exercises (not provisioned); without AD each demo person also gets a local
# Keycloak account with a generated password (config/secrets/demo_*_password). For
# staging and demo hosts only: never turn it on where Students train.
tn_load_shipped_content: false
tn_publish_shipped_content: false
tn_load_shipped_demo: false
# The shipped demo people: the same emails and roles as DEMO_PEOPLE in
# scripts/load_content.py (tests/contracts/test_installer_demo_signin.py keeps them in
# step). `group` is the local Keycloak group (a tn_ad_groups entry), `secret` the
# tn_demo_secrets entry holding the password.
tn_demo_people:
  - { email: instructor.demo@truenorth.test, first_name: Demo, last_name: Instructor,
      group: TN-Instructors, secret: demo_instructor_password }
  - { email: trainee1.demo@truenorth.test, first_name: Demo, last_name: Trainee 1,
      group: TN-Students, secret: demo_trainee1_password }
  - { email: trainee2.demo@truenorth.test, first_name: Demo, last_name: Trainee 2,
      group: TN-Students, secret: demo_trainee2_password }
  - { email: trainee3.demo@truenorth.test, first_name: Demo, last_name: Trainee 3,
      group: TN-Students, secret: demo_trainee3_password }
  - { email: observer.demo@truenorth.test, first_name: Demo, last_name: Observer,
      group: TN-Observers, secret: demo_observer_password }
# `alembic stamp` papers over a schema that was created by create_all() instead
# of by migrations. Never do it silently.
tn_allow_alembic_stamp: false
# Assert discovery results in 99-validate. False on a first install, when
# nothing has been discovered yet.
tn_expect_discovered: false
