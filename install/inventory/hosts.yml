---
# TrueNorth Range — platform inventory
#
# One host. The TrueNorth application runs as a Docker Compose stack on the
# management VM; the ESXi/vCenter layer beneath it is built by the PowerCLI
# tooling in the deployment repo, not from here.
#
# Ansible is used because TN-MGMT01 is Ubuntu — a proper Ansible target. ESXi is
# not: it has no package manager and no Python, which is why the hypervisor layer
# is driven through the vSphere API instead.
all:
  children:
    platform:
      hosts:
        tn-mgmt01:
          ansible_host: 10.30.30.20
          ansible_user: tnadmin
          # Override with -e or host_vars if your key lives elsewhere.
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_lab"
