---
# Reference data and the bootstrap administrator.
#
# app/seed.py's four seeders already run inside the API lifespan on every start
# — but inside a try/except that only WARNS (main.py). A seed failure is
# therefore invisible unless something checks, which is what this role does.
#
# scripts/seed_data.py is a different thing entirely: it creates demo fiction
# ("ACME Corp", "Wayne Enterprises"). That has no place in a range that will
# hold CAF curriculum, so it is opt-in.

# Counted in the database: the API routes need a token, and a 401 proved only that nginx
# answered (the check used to accept it, so an empty table passed).
- name: Seed — load the secret map
  ansible.builtin.include_role:
    name: tn_config
    tasks_from: secrets

- name: Seed — count the reference data
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      exec -T postgres psql -U {{ vault_postgres_user | default('forge') }}
      -d {{ vault_postgres_db | default('forge') }} -v ON_ERROR_STOP=1 -tAc
      "SELECT count(*) FROM {{ item.table }}"
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_seed_checks
  changed_when: false
  failed_when: false
  loop:
    - { table: nations, what: "nations" }
    - { table: auth_zone_policies, what: "auth zones" }
  loop_control:
    label: "{{ item.what }}"

- name: Seed — reference data is present
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | trim | int) > 0
    fail_msg: >-
      {{ item.item.what }} ({{ item.item.table }}): {{ item.stdout | default('') | trim or item.stderr | default('') }}.
      The API's startup seeders only WARN on failure (app/main.py): read
      `docker compose logs api` for "seed", fix it, and restart the api.
    success_msg: "{{ item.item.what }}: {{ item.stdout | trim }} rows"
  loop: "{{ tn_seed_checks.results }}"
  loop_control:
    label: "{{ item.item.what }}"

# ── The chicken and egg ───────────────────────────────────────────────
# Only an approver can create a trainee, so somebody has to be an admin first.
# _seed_dev_data's hardcoded admin@truenorth.local must NOT exist in production
# (SEED_DEV_DATA=false switches it off), which leaves exactly this gap.
- name: Seed — a bootstrap administrator must be nominated
  ansible.builtin.assert:
    that: tn_bootstrap_admin_upn | length > 0
    fail_msg: |
      tn_bootstrap_admin_upn is empty.

      Registration requires an approver, and production has no seeded admin
      (SEED_DEV_DATA=false, deliberately). Without this the install finishes
      with an approval queue nobody can drain, and the first real trainee is
      stuck at /registration-pending forever.

      Set it to the UPN of a named AD account, e.g.:
        tn_bootstrap_admin_upn: "maj.smith@corp.tnrange.lab"

- name: Seed — create the tenant and bootstrap admin
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      run --rm --no-deps --entrypoint ""
      -e TN_TENANT_NAME={{ tn_tenant_name | quote }}
      -e TN_TENANT_SLUG={{ tn_tenant_slug }}
      -e TN_BOOTSTRAP_ADMIN_UPN={{ tn_bootstrap_admin_upn }}
      -e KEYCLOAK_ADMIN_USER -e KEYCLOAK_ADMIN_PASSWORD
      api python -m app.bootstrap_admin
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  # Passed through from this environment (`-e NAME` with no value), so the password is
  # never on a command line and the task's output can be shown when it fails.
  # The master admin reaches this one-shot container only; the api service never has it.
  environment:
    KEYCLOAK_ADMIN_USER: "{{ vault_keycloak_admin_user | default('admin') }}"
    KEYCLOAK_ADMIN_PASSWORD: "{{ tn_secrets['keycloak_admin_password'] }}"
  register: tn_bootstrap
  # app.bootstrap_admin logs to stderr.
  changed_when: "'created' in (tn_bootstrap.stdout ~ tn_bootstrap.stderr)"

- name: Seed — report bootstrap result
  ansible.builtin.debug:
    msg: "{{ (tn_bootstrap.stdout_lines + tn_bootstrap.stderr_lines) | default(['(no output)'], true) }}"

# ── The platform tenant (PLATFORM_TENANT_ID; #273, #318) ──────────────
# Which tenant is the operator's is decided ONCE and never re-picked by slug (review of
# #322): a tenant's slug can be renamed and taken by another tenant, and its admin would
# then become the platform administrator on the next upgrade.
#   1. tn_platform_tenant_id, when set, always wins.
#   2. Otherwise the id recorded in state/platform_tenant_id (written once, never replaced).
#   3. Otherwise, on the first run only, the id of the tenant on tn_tenant_slug, which is
#      then recorded.
# On every later run the recorded id must still be a tenant, and the slug must not name a
# different one; either stops the install with how to resolve it. roles/tn_config renders
# the same id into the env file on every run, and app.bootstrap_admin finds the tenant by it.
- name: Seed — is a platform tenant already recorded
  ansible.builtin.slurp:
    src: "{{ tn_state_dir }}/platform_tenant_id"
  register: tn_platform_tenant_recorded
  failed_when: false

- name: Seed — the recorded platform tenant
  ansible.builtin.set_fact:
    tn_recorded_platform_tenant: >-
      {{ (tn_platform_tenant_recorded.content | b64decode | trim | lower)
         if tn_platform_tenant_recorded.content is defined else '' }}

- name: Seed — the recorded platform tenant is an id
  ansible.builtin.assert:
    that: tn_recorded_platform_tenant is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
    fail_msg: >-
      {{ tn_state_dir }}/platform_tenant_id does not hold a tenant id. Put the operator's tenant
      id in it, or set tn_platform_tenant_id.
    quiet: true
  when: tn_recorded_platform_tenant | length > 0

- name: Seed — the tenant on the bootstrap slug
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      exec -T postgres psql -U {{ vault_postgres_user | default('forge') }}
      -d {{ vault_postgres_db | default('forge') }} -v ON_ERROR_STOP=1 -tAc
      "SELECT id FROM tenants WHERE slug = '{{ tn_tenant_slug | regex_replace("'", "''") }}'"
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_slug_tenant
  changed_when: false
  when: not ansible_check_mode

- name: Seed — the explicit or recorded platform tenant still exists
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      exec -T postgres psql -U {{ vault_postgres_user | default('forge') }}
      -d {{ vault_postgres_db | default('forge') }} -v ON_ERROR_STOP=1 -tAc
      "SELECT count(*) FROM tenants WHERE id =
      '{{ (tn_platform_tenant_id | default('') | string | trim | lower) or tn_recorded_platform_tenant }}'"
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_platform_tenant_rows
  changed_when: false
  when:
    - not ansible_check_mode
    - (tn_platform_tenant_id | default('') | string | trim | length > 0) or tn_recorded_platform_tenant | length > 0

- name: Seed — the recorded platform tenant still exists
  ansible.builtin.assert:
    that: tn_platform_tenant_rows.stdout | trim == '1'
    fail_msg: >-
      The platform tenant {{ (tn_platform_tenant_id | default('') | string | trim | lower) or tn_recorded_platform_tenant }}
      is not a tenant in this database. If it was restored from another site, set
      tn_platform_tenant_id to the operator's tenant id (or fix {{ tn_state_dir }}/platform_tenant_id).
      Nothing was changed.
    quiet: true
  when:
    - not ansible_check_mode
    - (tn_platform_tenant_id | default('') | string | trim | length > 0) or tn_recorded_platform_tenant | length > 0

- name: Seed — on the first run the bootstrap tenant is the platform tenant
  ansible.builtin.assert:
    that: tn_slug_tenant.stdout | trim is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
    fail_msg: >-
      No tenant with slug {{ tn_tenant_slug }} after app.bootstrap_admin
      ({{ tn_slug_tenant.stdout | default('') | trim or tn_slug_tenant.stderr | default('') | trim }}):
      PLATFORM_TENANT_ID cannot default to it. Read the bootstrap output above.
    quiet: true
  when:
    - not ansible_check_mode
    - tn_platform_tenant_id | default('') | string | trim | length == 0
    - tn_recorded_platform_tenant | length == 0

- name: Seed — the platform tenant
  ansible.builtin.set_fact:
    tn_platform_tenant_effective: >-
      {{ (tn_platform_tenant_id | default('') | string | trim | lower)
         or tn_recorded_platform_tenant
         or ((tn_slug_tenant.stdout | default('') | trim) if not ansible_check_mode else '') }}

# A different tenant on the slug is exactly the capture the review found: stop, do not
# follow it. (No tenant on the slug is fine: the platform administrator renamed it.)
- name: Seed — the slug does not name another tenant
  ansible.builtin.assert:
    that: >-
      not ((tn_slug_tenant.stdout | default('') | trim) | length > 0
           and (tn_slug_tenant.stdout | default('') | trim) != tn_platform_tenant_effective)
    fail_msg: >-
      Tenant slug {{ tn_tenant_slug }} now belongs to {{ tn_slug_tenant.stdout | default('') | trim }},
      but the platform tenant is {{ tn_platform_tenant_effective }}. Someone renamed a tenant's slug.
      The platform tenant is NOT changed. Find out who, give the slug back (or set tn_tenant_slug
      to the platform tenant's current slug), or set tn_platform_tenant_id to the id you mean.
    quiet: true
  when: not ansible_check_mode

# Never replaced: the first run's id stays (force: false), whatever the slug is later.
- name: Seed — record the platform tenant
  ansible.builtin.copy:
    dest: "{{ tn_state_dir }}/platform_tenant_id"
    content: "{{ tn_platform_tenant_effective }}"
    mode: "0644"
    force: false
  when:
    - not ansible_check_mode
    - tn_platform_tenant_id | default('') | string | trim | length == 0
    - tn_recorded_platform_tenant | length == 0

# Patched in for this run (as roles/tn_keycloak does the LDAP component id); 30-config
# renders the same line from the state file from now on.
- name: Seed — put the platform tenant in the environment
  ansible.builtin.lineinfile:
    path: "{{ tn_env_file }}"
    regexp: "^PLATFORM_TENANT_ID="
    line: "PLATFORM_TENANT_ID={{ tn_platform_tenant_effective }}"
    mode: "0600"
  when: not ansible_check_mode

# Only the api reads PLATFORM_TENANT_ID. Always applied: compose recreates the api only when
# its configuration differs, so a run that recorded the id but stopped before this step is
# caught up by the next one.
- name: Seed — the api runs with the platform tenant
  community.docker.docker_compose_v2:
    project_src: "{{ tn_app_dir }}/infra/platform/docker"
    files: [compose.prod.yml]
    env_files: ["{{ tn_env_file }}"]
    services: [api]
    dependencies: false
    state: present
    build: never
    pull: never
    wait: true
    wait_timeout: 300

# The shipped curriculum, VM catalogue, range templates, scenarios and detection rules
# (content/), loaded through the API as the bootstrap administrator
# (scripts/load_content_inprocess.py: no token or password, the API's own validation).
# Off by default: a site loads its own content. Imports are drafts unless
# tn_publish_shipped_content; staging and demo hosts turn both on.
- name: Seed — load the shipped content
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      run --rm --no-deps -T -w /app -e PYTHONPATH=/app
      -v {{ tn_app_dir }}:/srcapp:ro --entrypoint python
      api /srcapp/scripts/load_content_inprocess.py
      --admin {{ tn_bootstrap_admin_upn | quote }}
      {{ '--publish' if tn_publish_shipped_content | bool else '' }}
      {{ '--demo' if tn_load_shipped_demo | bool else '' }}
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_shipped_content
  changed_when: "'  ok   ' in tn_shipped_content.stdout or 'published now' in tn_shipped_content.stdout"
  when: tn_load_shipped_content | bool

- name: Seed — shipped content result
  ansible.builtin.debug:
    msg: "{{ tn_shipped_content.stdout_lines | select('search', '^(\\S|  (ok|FAIL)|  \\w+: )') | list }}"
  when: tn_load_shipped_content | bool

# The worker's vCenter (VSPHERE_* in the env file), registered through the API as a
# hypervisor connection of the bootstrap administrator's tenant, so /infrastructure is not
# empty after an install (TN-MGMT01, 2026-10-15). scripts/register_vcenter_inprocess.py:
# idempotent, in-process as the administrator like the content loader. The password goes
# to `docker compose` in its environment and on to the container by name (-e NAME, no
# value): never in argv, so never in `ps` or this log; no_log hides the task's arguments.
# The script never prints it; the next task shows its output and fails only if the
# connection could not be registered (a failed connection test is a warning).
- name: Seed — register the vCenter as a hypervisor connection
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '-f', tn_compose_file, '--env-file', tn_env_file,
          'run', '--rm', '--no-deps', '-T', '-w', '/app', '-e', 'PYTHONPATH=/app',
          '-e', 'TN_VCENTER_PASSWORD',
          '-v', tn_app_dir ~ ':/srcapp:ro', '--entrypoint', 'python',
          'api', '/srcapp/scripts/register_vcenter_inprocess.py',
          '--admin', tn_bootstrap_admin_upn, '--name', tn_vcenter_connection_name,
          '--host', tn_vcenter_host, '--port', tn_vcenter_port | string,
          '--username', tn_vcenter_user, '--datacenter', tn_vsphere_datacenter | default('')]
         + ([] if tn_vsphere_verify_ssl | default(true) | bool else ['--insecure'])
         + (['--update-password'] if (tn_vcenter_connection_update_password | default(false) | bool)
            and (vault_vsphere_password | default('') | length > 0) else []) }}
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  environment:
    TN_VCENTER_PASSWORD: "{{ vault_vsphere_password | default('') }}"
  register: tn_vcenter_conn
  changed_when: "'connection: created' in tn_vcenter_conn.stdout or 'connection: updated' in tn_vcenter_conn.stdout"
  failed_when: false
  no_log: true
  when: >-
    (tn_register_vcenter_connection | default(true) | bool)
    and (tn_uses_vcenter | default(true) | bool)
    and (tn_vcenter_host | default('') | length > 0)

- name: Seed — vCenter connection result
  ansible.builtin.debug:
    msg: "{{ (tn_vcenter_conn.stdout_lines + tn_vcenter_conn.stderr_lines[-5:]) | default(['(no output)'], true) }}"
  when: >-
    (tn_register_vcenter_connection | default(true) | bool)
    and (tn_uses_vcenter | default(true) | bool)
    and (tn_vcenter_host | default('') | length > 0)

- name: Seed — the vCenter connection is registered
  ansible.builtin.assert:
    that: tn_vcenter_conn.rc == 0
    fail_msg: >-
      The vCenter was not registered as a hypervisor connection (exit {{ tn_vcenter_conn.rc }}; output above).
      Exit 2: tn_bootstrap_admin_upn is not a TrueNorth user. Exit 1: the API refused it, or
      vault_vsphere_password is empty. Fix and re-run playbooks/80-seed.yml, or add it on the
      Infrastructure page and set tn_register_vcenter_connection: false.
    success_msg: "vCenter connection: registered (a failed test above is a warning only)"
  when: >-
    (tn_register_vcenter_connection | default(true) | bool)
    and (tn_uses_vcenter | default(true) | bool)
    and (tn_vcenter_host | default('') | length > 0)

# The AI orchestrator's endpoint (OPENAI_* in the env file), registered through the API as
# the AI backend with a route per configured model id, so the AI settings page is not
# empty after an install (TN-MGMT01, 2026-10-15). scripts/register_ai_backend_inprocess.py:
# idempotent, in-process as the administrator, like the vCenter above. The key goes to
# `docker compose` in its environment and on to the container by name (-e NAME, no value):
# never in argv, so never in `ps` or this log; no_log hides the task's arguments. The
# install fails only if the backend could not be registered (an unreachable endpoint warns).
- name: Seed — register the AI endpoint as an AI backend
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'compose', '-f', tn_compose_file, '--env-file', tn_env_file,
          'run', '--rm', '--no-deps', '-T', '-w', '/app', '-e', 'PYTHONPATH=/app',
          '-e', 'TN_AI_API_KEY',
          '-v', tn_app_dir ~ ':/srcapp:ro', '--entrypoint', 'python',
          'api', '/srcapp/scripts/register_ai_backend_inprocess.py',
          '--admin', tn_bootstrap_admin_upn, '--name', tn_ai_backend_name | default('Platform AI'),
          '--base-url', tn_ai_base_url,
          '--models', ([tn_ai_default_model,
                        tn_ai_heavy_model | default(tn_ai_default_model),
                        tn_ai_general_model | default(tn_ai_default_model),
                        tn_ai_code_model | default(tn_ai_default_model)] | unique | join(','))]
         + (['--update-key'] if (tn_ai_backend_update_key | default(false) | bool)
            and (vault_openai_api_key | default('') | length > 0) else []) }}
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  environment:
    TN_AI_API_KEY: "{{ vault_openai_api_key | default('') }}"
  register: tn_ai_backend_reg
  changed_when: "'backend: created' in tn_ai_backend_reg.stdout or 'backend: updated' in tn_ai_backend_reg.stdout or 'route: added' in tn_ai_backend_reg.stdout"
  failed_when: false
  no_log: true
  when: >-
    (tn_register_ai_backend | default(true) | bool)
    and (tn_ai_enabled | default(true) | bool)
    and (tn_ai_base_url | default('') | length > 0)

- name: Seed — AI backend result
  ansible.builtin.debug:
    msg: "{{ (tn_ai_backend_reg.stdout_lines + tn_ai_backend_reg.stderr_lines[-5:]) | default(['(no output)'], true) }}"
  when: >-
    (tn_register_ai_backend | default(true) | bool)
    and (tn_ai_enabled | default(true) | bool)
    and (tn_ai_base_url | default('') | length > 0)

- name: Seed — the AI backend is registered
  ansible.builtin.assert:
    that: tn_ai_backend_reg.rc == 0
    fail_msg: >-
      The AI endpoint was not registered as an AI backend (exit {{ tn_ai_backend_reg.rc }}; output above).
      Exit 2: tn_bootstrap_admin_upn is not a TrueNorth user. Exit 1: the API refused it.
      Fix and re-run playbooks/80-seed.yml, or add it on the AI page and set
      tn_register_ai_backend: false.
    success_msg: "AI backend: registered (an unreachable endpoint above is a warning only)"
  when: >-
    (tn_register_ai_backend | default(true) | bool)
    and (tn_ai_enabled | default(true) | bool)
    and (tn_ai_base_url | default('') | length > 0)

# The loader's demo people are roster rows only. Without AD, 60-keycloak gave each a local
# account (roles/tn_keycloak/tasks/demo_accounts.yml); this points each row at its
# account's subject, as app.bootstrap_admin does for the administrator, so they can sign
# in. Their roles stay the loader's. The Keycloak master admin is passed through the
# environment, never on a command line; the demo passwords never reach this task.
- name: Seed — link the demo people to their sign-in accounts
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      run --rm --no-deps --entrypoint ""
      -e TN_DEMO_EMAILS={{ tn_demo_people | map(attribute='email') | join(',') | quote }}
      -e KEYCLOAK_ADMIN_USER -e KEYCLOAK_ADMIN_PASSWORD
      api python -m app.link_demo_accounts
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  environment:
    KEYCLOAK_ADMIN_USER: "{{ vault_keycloak_admin_user | default('admin') }}"
    KEYCLOAK_ADMIN_PASSWORD: "{{ tn_secrets['keycloak_admin_password'] }}"
  register: tn_demo_link
  # app.link_demo_accounts logs to stderr.
  changed_when: "'linked ' in (tn_demo_link.stdout ~ tn_demo_link.stderr)"
  when: tn_load_shipped_content | bool and tn_load_shipped_demo | bool and not tn_ldap_enabled | bool

- name: Seed — demo sign-in result
  ansible.builtin.debug:
    msg: >-
      {{ (tn_demo_link.stdout_lines + tn_demo_link.stderr_lines) | default(['(no output)'], true)
         + ['Demo passwords: ' ~ tn_config_dir ~ '/secrets/demo_*_password (mode 0600)'] }}
  when: tn_load_shipped_content | bool and tn_load_shipped_demo | bool and not tn_ldap_enabled | bool

- name: Seed — optional demo content
  ansible.builtin.debug:
    msg: >-
      Demo data NOT seeded (tn_seed_demo_data=false). scripts/seed_data.py
      creates fictional tenants; enable it only for a throwaway demo.
  when: not (tn_seed_demo_data | bool)
