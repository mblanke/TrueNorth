---
# Keycloak realm, AD federation, and the claim contract.
#
# THIS ROLE IS THE JOIN BETWEEN THE TWO HALVES OF THIS WORK. The registration
# flow reads AD identity out of the access token. If the mappers below are
# missing, the token carries no `groups` claim, `identity.suggest_role()` has
# nothing to read, every registration arrives with no suggestion, and group-based
# eligibility silently permits everyone. The API is not broken in any way you
# can see — it just quietly loses half its input.
#
# The Admin REST API is used rather than infra/keycloak/setup-realm.sh, which
# invokes ${KEYCLOAK_HOME}/bin/kcadm.sh — a path that only exists INSIDE the
# container — and which is not idempotent for the partial updates needed here.

- name: Keycloak — load the secret map
  ansible.builtin.include_role:
    name: tn_config
    tasks_from: secrets

- name: Keycloak — admin token
  ansible.builtin.include_tasks: admin_token.yml

# ── Realm ─────────────────────────────────────────────────────────────
- name: Keycloak — does the realm exist?
  ansible.builtin.uri:
    url: "{{ tn_kc_internal }}/admin/realms/{{ tn_keycloak_realm }}"
    headers: "{{ tn_kc_headers }}"
    status_code: [200, 404]
  register: tn_kc_realm

# Read on the TARGET: the checkout lives there, not on the control node (a `file`
# lookup would read the control node's disk).
- name: Keycloak — read the realm definition
  ansible.builtin.slurp:
    src: "{{ tn_app_dir }}/infra/keycloak/realm-truenorth.json"
  register: tn_kc_realm_file
  when: tn_kc_realm.status == 404

# Imported without its sample users, and with this deployment's client settings and
# secret already in place, so there is no moment when admin/admin or the placeholder
# secret exists. The same settings are enforced below on every run.
- name: Keycloak — import the realm definition, without its development defaults
  vars:
    _doc: "{{ tn_kc_realm_file.content | b64decode | from_json }}"
    _clients: >-
      {%- set out = [] -%}
      {%- for c in _doc.clients | default([]) -%}
        {%- set extra = tn_kc_client_settings[c.clientId] | default({}) -%}
        {%- if c.clientId == tn_keycloak_api_client -%}
          {%- set extra = extra | combine({'secret': tn_secrets['keycloak_api_client_secret']}) -%}
        {%- elif c.clientId == tn_kc_smoke_client -%}
          {%- set extra = extra | combine({'secret': tn_secrets['keycloak_smoke_client_secret']}) -%}
        {%- endif -%}
        {%- set _ = out.append(c | combine(extra)) -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.uri:
    url: "{{ tn_kc_internal }}/admin/realms"
    method: POST
    headers: "{{ tn_kc_headers }}"
    body: >-
      {{ _doc | dict2items | rejectattr('key', 'in', ['users', 'clients']) | items2dict
         | combine({'clients': _clients}) }}
    body_format: json
    status_code: [201, 409]
  when: tn_kc_realm.status == 404
  no_log: true

# Only the fields we own are updated on re-run. A full PUT of the realm file
# would wipe the federation component created below, every time. And only when one of
# them differs, so a clean re-run reports no change.
- name: Keycloak — read the realm's current settings
  ansible.builtin.uri:
    url: "{{ tn_kc_internal }}/admin/realms/{{ tn_keycloak_realm }}"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_realm_now

- name: Keycloak — update realm token/session/password settings
  vars:
    _want: "{{ {'enabled': true, 'sslRequired': 'external'} | combine(tn_kc_realm_settings) }}"
  ansible.builtin.uri:
    url: "{{ tn_kc_internal }}/admin/realms/{{ tn_keycloak_realm }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body: "{{ {'realm': tn_keycloak_realm} | combine(_want) }}"
    body_format: json
    status_code: [204]
  when: tn_kc_realm_now.json | combine(_want) != tn_kc_realm_now.json
  changed_when: true

# ── Clients: this deployment's URLs and secrets, every run ────────────
# An install whose realm predates the smoke client gets it here (disabled), and every
# install gets the API's Admin API service account (truenorth-api-admin).
- name: Keycloak — do the installer-made clients exist?
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients?clientId={{ item.client }}"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_made_existing
  loop:
    - { client: "{{ tn_kc_smoke_client }}", name: TrueNorth installer smoke test, secret: keycloak_smoke_client_secret }
    - { client: "{{ tn_keycloak_api_admin_client }}", name: TrueNorth API (Admin API service account),
        secret: keycloak_api_admin_client_secret }
  loop_control:
    label: "{{ item.client }}"

- name: Keycloak — create them
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients"
    method: POST
    headers: "{{ tn_kc_headers }}"
    body: >-
      {{ {'clientId': item.item.client, 'protocol': 'openid-connect', 'name': item.item.name,
          'secret': tn_secrets[item.item.secret]}
         | combine(tn_kc_client_settings[item.item.client]) }}
    body_format: json
    status_code: [201, 409]
  loop: "{{ tn_kc_made_existing.results }}"
  loop_control:
    label: "{{ item.item.client }}"
  when: item.json | length == 0
  changed_when: true
  no_log: true

# The api client stays at index 1, the smoke client at 3, the API admin client at 4: the
# secret and service-account tasks below read them from there.
- name: Keycloak — read the clients
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients?clientId={{ item }}"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_clients
  loop:
    - "{{ tn_keycloak_web_client }}"
    - "{{ tn_keycloak_api_client }}"
    - truenorth-cli
    - "{{ tn_kc_smoke_client }}"
    - "{{ tn_keycloak_api_admin_client }}"
  loop_control:
    label: "{{ item }}"

# Every field tn_kc_client_settings names (URLs, grants, PKCE, enabled), when any differs.
- name: Keycloak — set the clients' redirect URIs, web origins and post-logout URIs
  vars:
    _want: "{{ tn_kc_client_settings[item.item] | default({}) }}"
    _have: "{{ item.json[0] }}"
    _scalars: "{{ _want | dict2items | rejectattr('key', 'in', ['redirectUris', 'webOrigins', 'attributes']) | items2dict }}"
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ _have.id }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body: "{{ {'clientId': _have.clientId} | combine(_want) }}"
    body_format: json
    status_code: [204]
  loop: "{{ tn_kc_clients.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - item.json | length > 0
    - (_want.redirectUris | default(_have.redirectUris)) | sort != (_have.redirectUris | default([])) | sort
      or (_want.webOrigins | default(_have.webOrigins)) | sort != (_have.webOrigins | default([])) | sort
      or (_have.attributes | default({})) | combine(_want.attributes | default({})) != (_have.attributes | default({}))
      or _have | combine(_scalars) != _have
  changed_when: true

- name: Keycloak — read the api client's secret
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[1].json[0].id }}/client-secret"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_api_secret
  no_log: true

- name: Keycloak — replace the api client's secret (the realm file ships a placeholder)
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[1].json[0].id }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body:
      clientId: "{{ tn_keycloak_api_client }}"
      secret: "{{ tn_secrets['keycloak_api_client_secret'] }}"
    body_format: json
    status_code: [204]
  when: tn_kc_api_secret.json.value | default('') != tn_secrets['keycloak_api_client_secret']
  changed_when: true
  no_log: true

- name: Keycloak — read the smoke-test client's secret
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[3].json[0].id }}/client-secret"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_smoke_secret
  no_log: true

- name: Keycloak — set the smoke-test client's secret
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[3].json[0].id }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body:
      clientId: "{{ tn_kc_smoke_client }}"
      secret: "{{ tn_secrets['keycloak_smoke_client_secret'] }}"
    body_format: json
    status_code: [204]
  when: tn_kc_smoke_secret.json.value | default('') != tn_secrets['keycloak_smoke_client_secret']
  changed_when: true
  no_log: true

# ── The API's Admin API service account (least privilege) ─────────────
# The API used to call the Admin API as the MASTER realm's admin: a compromised API was a
# compromised identity provider. It now uses this client's service account, which holds
# only tn_kc_api_admin_roles of realm-management in this realm.
- name: Keycloak — read the API admin client's secret
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[4].json[0].id }}/client-secret"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_api_admin_secret
  no_log: true

- name: Keycloak — set the API admin client's secret
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[4].json[0].id }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body:
      clientId: "{{ tn_keycloak_api_admin_client }}"
      secret: "{{ tn_secrets['keycloak_api_admin_client_secret'] }}"
    body_format: json
    status_code: [204]
  when: tn_kc_api_admin_secret.json.value | default('') != tn_secrets['keycloak_api_admin_client_secret']
  changed_when: true
  no_log: true

- name: Keycloak — the API admin client's service-account user
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ tn_kc_clients.results[4].json[0].id }}/service-account-user"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_api_sa

- name: Keycloak — the realm-management client
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients?clientId=realm-management"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_rm

- name: Keycloak — realm-management roles the service account holds, and can hold
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_kc_api_sa.json.id }}/role-mappings/clients/{{ tn_kc_rm.json[0].id }}{{ item }}"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_sa_roles
  loop: ["", "/available"]

- name: Keycloak — grant the roles the API needs
  vars:
    _have: "{{ tn_kc_sa_roles.results[0].json | map(attribute='name') | list }}"
    _grant: >-
      {{ tn_kc_sa_roles.results[1].json | selectattr('name', 'in', tn_kc_api_admin_roles)
         | rejectattr('name', 'in', _have) | list }}
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_kc_api_sa.json.id }}/role-mappings/clients/{{ tn_kc_rm.json[0].id }}"
    method: POST
    headers: "{{ tn_kc_headers }}"
    body: "{{ _grant }}"
    body_format: json
    status_code: [204]
  when: _grant | length > 0
  changed_when: true

- name: Keycloak — revoke any other realm-management role (least privilege)
  vars:
    _extra: "{{ tn_kc_sa_roles.results[0].json | rejectattr('name', 'in', tn_kc_api_admin_roles) | list }}"
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_kc_api_sa.json.id }}/role-mappings/clients/{{ tn_kc_rm.json[0].id }}"
    method: DELETE
    headers: "{{ tn_kc_headers }}"
    body: "{{ _extra }}"
    body_format: json
    status_code: [204]
  when: _extra | length > 0
  changed_when: true

- name: Keycloak — the service account holds exactly the API's roles
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_kc_api_sa.json.id }}/role-mappings/clients/{{ tn_kc_rm.json[0].id }}/composite"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_sa_effective

- name: Keycloak — report the API's Admin API privileges
  ansible.builtin.assert:
    that: tn_kc_api_admin_roles | difference(tn_kc_sa_effective.json | map(attribute='name') | list) | length == 0
    fail_msg: "service account of {{ tn_keycloak_api_admin_client }} lacks {{ tn_kc_api_admin_roles }}"
    success_msg: >-
      {{ tn_keycloak_api_admin_client }} service account: realm-management
      {{ tn_kc_sa_effective.json | map(attribute='name') | sort | join(', ') }} (the master admin is not in the API's env)

- name: Keycloak — look for the development realm's sample users
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users?username={{ item | urlencode }}&exact=true"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_kc_samples
  loop: "{{ tn_kc_sample_users }}"

- name: Keycloak — remove them (admin/admin must not exist here)
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ item.json[0].id }}"
    method: DELETE
    headers: "{{ tn_kc_headers }}"
    status_code: [204]
  loop: "{{ tn_kc_samples.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.json | length > 0 and not item.json[0].federationLink | default(false)
  changed_when: true

# ── Local groups and a local bootstrap administrator ──────────────────
# Without AD this is the whole identity. With AD, tn_keycloak_local_admin keeps the
# bootstrap administrator a LOCAL account as well: the recovery path when the directory
# is down or the federation is misconfigured (local_identity.yml).
#
# BEFORE the federation, on purpose: once a directory is federated, Keycloak refuses to
# create a local user whose email an AD account already has ("User exists with same
# email", measured against the CI `ad` lane's Samba DC), so the recovery account must
# exist first. An install that federated earlier keeps the one it has.
- name: Keycloak — local identity (no AD, or AD with a local recovery administrator)
  ansible.builtin.include_tasks: local_identity.yml
  when: not tn_ldap_enabled | bool or tn_keycloak_local_admin | bool

# Staging and demo hosts only (tn_load_shipped_demo is off in group_vars).
- name: Keycloak — the shipped demo people's sign-in accounts
  ansible.builtin.include_tasks: demo_accounts.yml
  when: not tn_ldap_enabled | bool and tn_load_shipped_demo | bool and tn_load_shipped_content | bool

# ── LDAP user federation (tn_ldap_enabled) ────────────────────────────
- name: Keycloak — AD user federation
  ansible.builtin.include_tasks: ldap_federation.yml
  when: tn_ldap_enabled | bool

# ── The claim contract ────────────────────────────────────────────────
- name: Keycloak — the truenorth-identity client scope
  ansible.builtin.include_tasks: identity_scope.yml

- name: Keycloak — attach the identity scope as a default scope
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/clients/{{ item.json[0].id }}/default-client-scopes/{{ tn_kc_scope_id }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    status_code: [204, 409]
  loop: "{{ tn_kc_clients.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.json | length > 0

# ── Sync, then prove it worked (tn_ldap_enabled) ──────────────────────
- name: Keycloak — AD sync and import check
  ansible.builtin.include_tasks: ldap_sync.yml
  when: tn_ldap_enabled | bool

- name: Keycloak — record the AD federation component id
  when: tn_ldap_enabled | bool
  block:
    # The API needs this to drive /ad-sync. Recorded in the state directory, which
    # roles/tn_config renders into the env file on every run (so re-runs agree), and
    # patched into the env file now for this run.
    - name: Keycloak — record the component id
      ansible.builtin.copy:
        dest: "{{ tn_state_dir }}/keycloak_ldap_component_id"
        content: "{{ tn_keycloak_ldap_component_id }}"
        mode: "0644"

    - name: Keycloak — put the component id in the environment
      ansible.builtin.lineinfile:
        path: "{{ tn_env_file }}"
        regexp: "^KEYCLOAK_LDAP_COMPONENT_ID="
        line: "KEYCLOAK_LDAP_COMPONENT_ID={{ tn_keycloak_ldap_component_id }}"
        mode: "0600"
      notify: Recreate the API with the new environment
