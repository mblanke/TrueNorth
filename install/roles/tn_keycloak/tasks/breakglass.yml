---
# Break-glass: reset one user's second factor (docs/runbooks/break-glass.md).
#
#   ansible-playbook playbooks/breakglass-reset-mfa.yml -K --ask-vault-pass \
#     -e tn_breakglass_user=<upn> -e tn_breakglass_reason="lost phone, ticket 1234"
#
# Never weakens MFA: it deletes the user's OTP/WebAuthn credentials, makes CONFIGURE_TOTP
# a required action and signs the user out everywhere, so the next sign-in enrols a new
# authenticator. It never touches the realm, the flow or its binding. It uses the master
# realm admin on the host's loopback port (nginx answers 404 for /auth/admin), so it needs
# an SSH login to the host. Keycloak records an admin event (enabled by tasks/mfa.yml).
#
# The TrueNorth audit row (action mfa_reset, reason, operator) is written FIRST: if it
# cannot be written, nothing is changed, unless -e tn_breakglass_no_audit=true, which is
# announced loudly and leaves only Keycloak's admin event as the record.
#
# Until the user re-enrols, anyone holding their password could enrol an authenticator
# of their own. For a local account the reset therefore also requires a new password
# (UPDATE_PASSWORD) unless -e tn_breakglass_reset_password=false; an AD account's
# password is AD's: reset it there in the same step.

- name: Break-glass — a user and a reason were given
  ansible.builtin.assert:
    that:
      - tn_breakglass_user | default('') | trim | length > 0
      - tn_breakglass_reason | default('') | trim | length > 0
    fail_msg: >-
      -e tn_breakglass_user=<upn> -e tn_breakglass_reason="<why>" are both required.
      The reason is recorded in TrueNorth's audit log.
    quiet: true

- name: Break-glass — who is running it
  ansible.builtin.set_fact:
    tn_breakglass_operator: >-
      {{ lookup('ansible.builtin.env', 'SUDO_USER') | default('', true)
         or lookup('ansible.builtin.env', 'USER') | default('unknown', true) }}

- name: Break-glass — load the secret map
  ansible.builtin.include_role:
    name: tn_config
    tasks_from: secrets

- name: Break-glass — admin token (loopback)
  ansible.builtin.include_tasks: admin_token.yml

- name: Break-glass — find the user
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users?username={{ tn_breakglass_user | trim | urlencode }}&exact=true"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_bg_user
  no_log: true

- name: Break-glass — the user exists
  ansible.builtin.assert:
    that: tn_bg_user.json | length == 1
    fail_msg: "No Keycloak user {{ tn_breakglass_user }} in realm {{ tn_keycloak_realm }}."
    quiet: true

# ── 1. The audit row, before anything changes ─────────────────────────
- name: Break-glass — record it in TrueNorth's audit log (first)
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - "{{ tn_compose_file }}"
      - --env-file
      - "{{ tn_env_file }}"
      - run
      - --rm
      - --no-deps
      - -T
      - -w
      - /app
      - -e
      - PYTHONPATH=/app
      - -v
      - "{{ tn_app_dir }}:/srcapp:ro"
      - --entrypoint
      - python
      - api
      - /srcapp/scripts/audit_note_inprocess.py
      - --action
      - mfa_reset
      - --subject
      - "{{ tn_breakglass_user | trim }}"
      - --reason
      - "{{ tn_breakglass_reason | trim }}"
      - --operator
      - "{{ tn_breakglass_operator | trim }}"
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_bg_audit
  changed_when: tn_bg_audit.rc == 0
  failed_when: false

- name: Break-glass — no audit row, no reset (unless overridden)
  ansible.builtin.assert:
    that: tn_bg_audit.rc == 0 or (tn_breakglass_no_audit | default(false) | bool)
    fail_msg: >-
      The TrueNorth audit row could not be written ({{ tn_bg_audit.stderr | default('') | trim | truncate(300) }}),
      so nothing was changed. Fix the API/database, or re-run with -e tn_breakglass_no_audit=true
      to reset anyway with Keycloak's admin event as the only record.
    quiet: true

- name: Break-glass — WARNING, resetting WITHOUT a TrueNorth audit row
  ansible.builtin.debug:
    msg:
      - "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
      - "tn_breakglass_no_audit=true: {{ tn_breakglass_user }} is reset with NO TrueNorth audit row."
      - "Operator {{ tn_breakglass_operator }}, reason: {{ tn_breakglass_reason }}."
      - "Record this in the incident log; Keycloak's admin events are the only system record."
      - "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
  when: tn_bg_audit.rc != 0

# ── 2. The reset ──────────────────────────────────────────────────────
- name: Break-glass — the user's credentials
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_bg_user.json[0].id }}/credentials"
    headers: "{{ tn_kc_headers }}"
    status_code: 200
  register: tn_bg_creds
  no_log: true

- name: Break-glass — delete the second-factor credentials (OTP, WebAuthn)
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_bg_user.json[0].id }}/credentials/{{ item.id }}"
    method: DELETE
    headers: "{{ tn_kc_headers }}"
    status_code: [204]
  loop: "{{ tn_bg_creds.json | selectattr('type', 'in', ['otp', 'webauthn', 'webauthn-passwordless']) | list }}"
  loop_control:
    label: "{{ item.type }} {{ item.userLabel | default('') }}"
  changed_when: true
  no_log: true

# A local account gets a fresh temporary password, so the old one (which may be what
# leaked) cannot be used to enrol someone else's authenticator; Keycloak makes the user
# replace it at the next sign-in. It is written for the operator to hand over out of band,
# root-only, never printed. An AD account cannot (READ_ONLY federation): reset it in AD.
- name: Break-glass — a temporary password for a local account
  ansible.builtin.set_fact:
    tn_bg_temp_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars=['ascii_letters', 'digits']) }}"
  when: tn_bg_user.json[0].federationLink is not defined and tn_breakglass_reset_password | default(true) | bool
  no_log: true

# Written FIRST: if the file cannot be written, Keycloak is not changed, so a failure
# never leaves the user with a password nobody knows. Root-owned 0600.
- name: Break-glass — write it for the operator (root-only, before Keycloak is changed)
  ansible.builtin.copy:
    dest: "{{ tn_state_dir }}/breakglass-{{ tn_breakglass_user | trim | regex_replace('[^A-Za-z0-9@._-]', '_') }}.password"
    content: "{{ tn_bg_temp_password }}\n"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: tn_bg_temp_password is defined
  no_log: true

- name: Break-glass — set it as a temporary password (the user must change it)
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_bg_user.json[0].id }}/reset-password"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body: {type: password, value: "{{ tn_bg_temp_password }}", temporary: true}
    body_format: json
    status_code: [204]
  when: tn_bg_temp_password is defined
  changed_when: true
  no_log: true

- name: Break-glass — require enrolment (and, for a local account, a new password)
  vars:
    _local: "{{ tn_bg_user.json[0].federationLink is not defined }}"
    _pw: >-
      {{ ['UPDATE_PASSWORD'] if (tn_bg_user.json[0].federationLink is not defined
         and tn_breakglass_reset_password | default(true) | bool) else [] }}
    _actions: "{{ (tn_bg_user.json[0].requiredActions | default([]) + ['CONFIGURE_TOTP'] + _pw) | unique }}"
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_bg_user.json[0].id }}"
    method: PUT
    headers: "{{ tn_kc_headers }}"
    body: {requiredActions: "{{ _actions }}"}
    body_format: json
    status_code: [204]
  changed_when: true
  no_log: true

- name: Break-glass — sign the user out everywhere
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}/users/{{ tn_bg_user.json[0].id }}/logout"
    method: POST
    headers: "{{ tn_kc_headers }}"
    status_code: [204]
  changed_when: true
  no_log: true

- name: Break-glass — done
  ansible.builtin.debug:
    msg: >-
      {{ tn_breakglass_user }}: {{ tn_bg_creds.json | selectattr('type', 'in', ['otp', 'webauthn', 'webauthn-passwordless']) | list | length }}
      second-factor credential(s) removed, signed out, enrolment required at the next sign-in
      {{ ('(and a new password: the temporary one is in ' ~ tn_state_dir ~ '/breakglass-*.password, '
          ~ 'root-owned 0600; hand it over out of band, then DELETE the file: sudo rm it)')
         if tn_bg_temp_password is defined
         else '(AD account: reset its password in AD now; until it re-enrols, anyone with the password could enrol)' }}.
      {{ tn_bg_audit.stdout | default('') }}
