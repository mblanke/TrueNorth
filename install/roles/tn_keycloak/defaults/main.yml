---
# Keycloak is reached on the host's loopback (compose.prod.yml publishes
# 127.0.0.1:KEYCLOAK_ADMIN_PORT), not via nginx: going through the public URL would
# depend on nginx and TLS being right first, making a TLS problem look like an identity
# problem.
tn_kc_internal: "http://127.0.0.1:{{ tn_keycloak_admin_port }}/auth"
tn_kc_realm_url: "{{ tn_kc_internal }}/admin/realms/{{ tn_keycloak_realm }}"
tn_kc_components_url: "{{ tn_kc_realm_url }}/components"
tn_kc_provider_type: org.keycloak.storage.UserStorageProvider
tn_kc_mapper_type: org.keycloak.storage.ldap.mappers.LDAPStorageMapper

# Token, session and password rules, enforced on every run (an install that imported the
# realm before these existed gets them too). The same values as
# infra/keycloak/realm-truenorth.json; tests/contracts/test_keycloak_hardening.py keeps
# the two in step.
tn_kc_realm_settings:
  accessTokenLifespan: 300 # 5 min; the SPA refreshes silently
  accessTokenLifespanForImplicitFlow: 300
  ssoSessionIdleTimeout: 1800 # 30 min idle signs a browser out
  ssoSessionMaxLifespan: 36000 # 10 h: one training day, then sign in again
  offlineSessionIdleTimeout: 604800 # 7 d
  offlineSessionMaxLifespanEnabled: true
  offlineSessionMaxLifespan: 604800 # 7 d, however often it is used
  # Local accounts only: AD-federated users' passwords are AD's (READ_ONLY federation).
  passwordPolicy: "length(12) and notUsername(undefined) and passwordHistory(5)"
  # The AC-8 login banner: the truenorth theme (infra/keycloak/themes/truenorth), its
  # text set per site by tasks/banner.yml. English only until R1.5 (French).
  loginTheme: truenorth
  internationalizationEnabled: true
  supportedLocales: [en]
  defaultLocale: en

# The smoke test's own confidential client (roles/tn_smoke): the only one with the
# password grant. Created disabled; 95-smoke-test enables it for its one token request
# and disables it again, so the password grant is off whenever no smoke test is running.
tn_kc_smoke_client: truenorth-smoke

# What this deployment's clients must say, enforced on every run (not only at import).
# infra/keycloak/realm-truenorth.json is a development realm: its web client knows only
# localhost and example hosts, and the api client's secret is CHANGE_ME_IN_PRODUCTION.
tn_kc_client_settings:
  # This host only: the realm file's dev/itest/example origins are replaced. Other
  # attributes stay: Keycloak sets only the attributes sent.
  truenorth-web:
    redirectUris: ["https://{{ tn_domain_fqdn }}/*"]
    webOrigins: ["https://{{ tn_domain_fqdn }}"]
    directAccessGrantsEnabled: false
    attributes:
      post.logout.redirect.uris: "https://{{ tn_domain_fqdn }}/*"
      pkce.code.challenge.method: S256
  # No password grant: users sign in through the SPA (authorization code + PKCE).
  truenorth-api:
    redirectUris: []
    webOrigins: []
    directAccessGrantsEnabled: false
    attributes:
      access.token.lifespan: "300"
  # Device flow only; the out-of-band redirect (urn:ietf:wg:oauth:2.0:oob) is gone.
  truenorth-cli:
    redirectUris: []
    webOrigins: []
    directAccessGrantsEnabled: false
    attributes:
      pkce.code.challenge.method: S256
  truenorth-smoke:
    enabled: false
    publicClient: false
    standardFlowEnabled: false
    directAccessGrantsEnabled: true
    redirectUris: []
    webOrigins: []
  # The API's Admin API identity (KEYCLOAK_ADMIN_CLIENT_ID): client credentials only, no
  # user-facing flow. Its service account gets exactly tn_kc_api_admin_roles.
  truenorth-api-admin:
    enabled: true
    publicClient: false
    serviceAccountsEnabled: true
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    redirectUris: []
    webOrigins: []

# What app/routers/ad_sync.py calls, and nothing more:
#   GET  /admin/realms/<realm>/components/<id>          -> view-realm
#   POST /admin/realms/<realm>/user-storage/<id>/sync   -> manage-users
# Any other realm-management role found on the service account is removed.
tn_kc_api_admin_roles: [view-realm, manage-users]

# Without AD (tn_ldap_enabled false): the bootstrap administrator is a local Keycloak
# account in this group (its `groups` claim then satisfies the smoke test's claim check).
tn_kc_local_admin_group: TN-Platform-Admins

# The development realm's sample accounts (admin@truenorth.local / admin and friends).
# Never imported here, and removed if an earlier install imported them.
tn_kc_sample_users:
  - admin@truenorth.local
  - instructor@truenorth.local
  - trainee@truenorth.local

# AD user federation. editMode READ_ONLY on purpose: Active Directory is the
# system of record for identity, and TrueNorth never writes back to it.
tn_kc_ldap_body:
  name: corp-ad
  providerId: ldap
  providerType: org.keycloak.storage.UserStorageProvider
  config:
    enabled: ["true"]
    vendor: ["ad"]
    editMode: ["READ_ONLY"]
    importEnabled: ["true"]
    syncRegistrations: ["false"]
    connectionUrl: ["ldaps://{{ tn_dc_host }}:{{ tn_ldap_port }}"]
    bindDn: ["{{ tn_ldap_bind_dn }}"]
    bindCredential: ["{{ tn_ldap_bind_password }}"]
    usersDn: ["{{ tn_ldap_users_dn }}"]
    usernameLDAPAttribute: ["sAMAccountName"]
    rdnLDAPAttribute: ["cn"]
    uuidLDAPAttribute: ["objectGUID"]
    userObjectClasses: ["person, organizationalPerson, user"]
    searchScope: ["2"]
    # The AD CS root CA is mounted into the Keycloak truststore by roles/tn_tls.
    useTruststoreSpi: ["always"]
    startTls: ["false"]
    pagination: ["true"]
    # Milliseconds. Without them a sign-in hangs on an unreachable DC (measured: over 60 s,
    # until the client gave up, with the CI `ad` lane's DC stopped) instead of failing.
    connectionTimeout: ["5000"]
    readTimeout: ["10000"]
    batchSizeForSync: ["1000"]
    fullSyncPeriod: ["3600"]
    changedSyncPeriod: ["300"]
    trustEmail: ["true"]
    cachePolicy: ["DEFAULT"]

# Exactly the TN-* groups, by DN, directly in tn_ldap_groups_dn: a same-named group in a
# sub-OU (or anywhere else the bind account can read) is never imported or matched, and
# the mapper's sync count is the TN-* groups AD really has (ldap_sync.yml checks it).
tn_kc_ldap_groups_filter: >-
  (|{% for g in tn_ad_groups %}(distinguishedName=CN={{ g }},{{ tn_ldap_groups_dn }}){% endfor %})

# Sub-mappers on the federation component. Reconciled on every run (ldap_federation.yml):
# an existing mapper whose config differs from this is updated in place.
tn_kc_ldap_mappers:
  - name: ad-groups
    providerId: group-ldap-mapper
    providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
    parentId: "{{ tn_keycloak_ldap_component_id }}"
    config:
      groups.dn: ["{{ tn_ldap_groups_dn }}"]
      group.name.ldap.attribute: ["cn"]
      group.object.classes: ["group"]
      membership.ldap.attribute: ["member"]
      membership.attribute.type: ["DN"]
      membership.user.ldap.attribute: ["sAMAccountName"]
      mode: ["READ_ONLY"]
      user.roles.retrieve.strategy: ["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"]
      preserve.group.inheritance: ["false"]
      drop.non.existing.groups.during.sync: ["false"]
      groups.ldap.filter: ["{{ tn_kc_ldap_groups_filter }}"]

  # objectGUID is binary; without is.binary.attribute the value arrives mangled.
  - name: ad-object-guid
    providerId: user-attribute-ldap-mapper
    providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
    parentId: "{{ tn_keycloak_ldap_component_id }}"
    config:
      ldap.attribute: ["objectGUID"]
      user.model.attribute: ["adObjectGuid"]
      is.binary.attribute: ["true"]
      read.only: ["true"]
      always.read.value.from.ldap: ["true"]

  - name: ad-distinguished-name
    providerId: user-attribute-ldap-mapper
    providerType: org.keycloak.storage.ldap.mappers.LDAPStorageMapper
    parentId: "{{ tn_keycloak_ldap_component_id }}"
    config:
      ldap.attribute: ["distinguishedName"]
      user.model.attribute: ["adDistinguishedName"]
      read.only: ["true"]
      always.read.value.from.ldap: ["true"]

# The claim contract the registration flow depends on. email / given_name /
# family_name come from the built-in profile+email scopes.
tn_kc_protocol_mappers:
  # WITHOUT THIS the access token has no `groups` claim, and role suggestion
  # and group-based registration eligibility both silently do nothing.
  - name: groups
    protocol: openid-connect
    protocolMapper: oidc-group-membership-mapper
    config:
      claim.name: "groups"
      full.path: "false"
      access.token.claim: "true"
      id.token.claim: "true"
      userinfo.token.claim: "true"

  - name: ad_object_guid
    protocol: openid-connect
    protocolMapper: oidc-usermodel-attribute-mapper
    config:
      user.attribute: "adObjectGuid"
      claim.name: "ad_object_guid"
      jsonType.label: "String"
      access.token.claim: "true"
      id.token.claim: "true"

  - name: ad_distinguished_name
    protocol: openid-connect
    protocolMapper: oidc-usermodel-attribute-mapper
    config:
      user.attribute: "adDistinguishedName"
      claim.name: "ad_distinguished_name"
      jsonType.label: "String"
      access.token.claim: "true"
      id.token.claim: "true"

  # amr: how the user signed in ("pwd", "otp"), from each authenticator's reference value
  # in the tn-browser flow (scripts/keycloak_mfa.py). The API's MFA rule reads it
  # (app/mfa_policy.py); scripts/check_keycloak_mfa.py adds the same mapper in CI.
  - name: amr
    protocol: openid-connect
    protocolMapper: oidc-amr-mapper
    config:
      access.token.claim: "true"
      id.token.claim: "true"

  # Puts the API client in the access token's `aud`. The API (TN_ENV=production) only
  # accepts tokens whose aud includes KEYCLOAK_AUDIENCE, which the installer sets to
  # this client: without the mapper every user would be locked out (docs/identity.md).
  - name: truenorth-api-audience
    protocol: openid-connect
    protocolMapper: oidc-audience-mapper
    config:
      included.client.audience: "{{ tn_keycloak_api_client }}"
      access.token.claim: "true"
      id.token.claim: "false"

# ── Multi-factor sign-in (tasks/mfa.yml, scripts/keycloak_mfa.py) ─────
# The Keycloak groups whose TrueNorth role is in tn_mfa_roles: derived, never a second
# hand-kept list. They get the realm role tn-mfa-required, which the tn-browser flow
# turns into an OTP prompt (enrolment on first sign-in).
tn_kc_mfa_groups: >-
  {{ tn_registration_group_role_map | dict2items | selectattr('value', 'in', tn_mfa_roles)
     | map(attribute='key') | list }}
# Test hosts only (tn_mfa_demo_exempt_effective): the shipped demo staff hold
# tn-mfa-exempt. Empty everywhere else, which strips the role from anyone holding it.
tn_kc_mfa_exempt_users: >-
  {{ (tn_demo_people | selectattr('group', 'in', tn_kc_mfa_groups) | map(attribute='email') | list)
     if tn_mfa_demo_exempt_effective | bool else [] }}
tn_kc_mfa_spec: "{{ tn_app_dir }}/install/roles/tn_keycloak/files/mfa-spec.json"

# ── Login banner (tasks/banner.yml) ───────────────────────────────────
# Realm localization overrides for the truenorth theme's banner messages, from the site's
# wording (group_vars tn_login_banner_*). Java MessageFormat: a quote is doubled and a
# brace quoted, so any text renders as written. The master realm (break-glass console,
# loopback only) shows the same banner.
tn_kc_banner_realms: ["{{ tn_keycloak_realm }}", master]
tn_kc_banner_messages:
  tnLoginBannerTitle: >-
    {{ tn_login_banner_title | replace("'", "''") | replace('{', "'{'") | replace('}', "'}'") }}
  tnLoginBanner: >-
    {{ tn_login_banner_text | trim | replace("'", "''") | replace('{', "'{'") | replace('}', "'}'") }}
  tnLoginBannerAck: >-
    {{ tn_login_banner_ack | replace("'", "''") | replace('{', "'{'") | replace('}', "'}'") }}
