---
# TLS material.
#
# Two things happen here and they are easy to conflate:
#   1. The certificate nginx SERVES to browsers.
#   2. The CA that Keycloak TRUSTS when it binds to AD over LDAPS.
# The second is the one people forget, and its absence surfaces much later as
# "PKIX path building failed" during user federation.

# The deployment repo exports the CA as a .cer, which AD CS writes as DER as often as
# PEM. update-ca-certificates and Keycloak's truststore both read PEM only and skip
# anything else without a word, so it is normalised to PEM first.
- name: TLS — stage the AD CS root CA as supplied
  ansible.builtin.copy:
    src: "{{ tn_root_ca_file }}"
    dest: "{{ tn_tls_dir }}/corp-root-ca.supplied"
    mode: "0644"

- name: TLS — install the AD CS root CA (PEM) in the host trust store
  community.crypto.x509_certificate_convert:
    src_path: "{{ tn_tls_dir }}/corp-root-ca.supplied"
    dest: /usr/local/share/ca-certificates/corp-root-ca.crt
    format: pem
    mode: "0644"
  become: true
  notify: Refresh host CA bundle

# The bundle must be rebuilt before anything below tries to validate a
# certificate signed by this CA, so flush rather than waiting for the play end.
- name: TLS — flush handlers so the CA bundle is current
  ansible.builtin.meta: flush_handlers

# Keycloak 24 (Quarkus) reads a directory of PEM certificates. No keytool, no
# JKS, no password to manage.
- name: TLS — place the root CA (PEM) in Keycloak's truststore directory
  community.crypto.x509_certificate_convert:
    src_path: "{{ tn_tls_dir }}/corp-root-ca.supplied"
    dest: "{{ tn_tls_dir }}/truststores/corp-root-ca.pem"
    format: pem
    mode: "0644"
  notify: Restart Keycloak if running

# Preflight could only probe the port: ldapsearch (tn_base) and this CA did not exist
# yet. This proves the TLS handshake against the CA Keycloak will use AND that the bind
# account works, the two things that otherwise surface as a federation failure in 60.
- name: TLS — real LDAPS bind as the Keycloak service account
  ansible.builtin.command:
    argv:
      - ldapsearch
      - -x
      - -LLL
      - -H
      - "ldaps://{{ tn_dc_host }}:{{ tn_ldap_port }}"
      - -D
      - "{{ tn_ldap_bind_dn }}"
      - -w
      - "{{ vault_ldap_bind_password }}"
      - -b
      - "{{ tn_ldap_base_dn }}"
      - -s
      - base
      - "(objectClass=*)"
      - dn
  environment:
    LDAPTLS_CACERT: "{{ tn_tls_dir }}/truststores/corp-root-ca.pem"
    LDAPTLS_REQCERT: demand
  register: tn_ldap_bind
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: TLS — assert the LDAPS bind succeeded
  ansible.builtin.assert:
    that: tn_ldap_bind.rc == 0
    fail_msg: >-
      LDAPS bind to {{ tn_dc_host }} failed (rc={{ tn_ldap_bind.rc }}). rc 255 is
      usually TLS: is {{ tn_root_ca_file }} the CA that issued the DC's certificate,
      and does the certificate name {{ tn_dc_host }}? rc 49 is the credentials: check
      vault_ldap_bind_password and that the account is not locked out.
    success_msg: "LDAPS bind OK as {{ tn_ldap_bind_dn | regex_search('^CN=[^,]+') }}"

- name: TLS — check for an operator-supplied certificate pair
  ansible.builtin.stat:
    path: "{{ tn_files_dir }}/tls/{{ item }}"
  delegate_to: localhost
  become: false
  register: tn_supplied
  loop: [truenorth.crt, truenorth.key]
  loop_control:
    label: "{{ item }}"

- name: TLS — require the pair in `provided` mode
  ansible.builtin.assert:
    that: tn_supplied.results | map(attribute='stat.exists') | select | list | length == 2
    fail_msg: |
      tn_tls_mode=provided but install/files/tls/ does not contain both
      truenorth.crt and truenorth.key.

      Issue the certificate from the AD CS CA (corp-TN-DC01-CA) for
      {{ tn_domain_fqdn }} and drop the pair there.

      The filenames are not arbitrary: nginx/conf.d/truenorth.conf reads
      /etc/nginx/ssl/truenorth.crt and truenorth.key. (The comment in
      .env.production.example once promised fullchain.pem/privkey.pem, which
      nginx never reads.)

      For a lab bring-up without a CA, use -e tn_tls_mode=selfsigned.
  when: tn_tls_mode == 'provided'

- name: TLS — install the supplied certificate pair
  ansible.builtin.copy:
    src: "{{ tn_files_dir }}/tls/{{ item.name }}"
    dest: "{{ tn_tls_dir }}/{{ item.name }}"
    mode: "{{ item.mode }}"
  notify: Reload nginx if running
  loop:
    - { name: truenorth.crt, mode: "0644" }
    - { name: truenorth.key, mode: "0600" }
  loop_control:
    label: "{{ item.name }}"
  when: tn_tls_mode == 'provided'

# ── Self-signed fallback ──────────────────────────────────────────────
- name: TLS — self-signed private key
  community.crypto.openssl_privatekey:
    path: "{{ tn_tls_dir }}/truenorth.key"
    size: 2048
    mode: "0600"
  when: tn_tls_mode == 'selfsigned'

- name: TLS — self-signed CSR
  community.crypto.openssl_csr:
    path: "{{ tn_tls_dir }}/truenorth.csr"
    privatekey_path: "{{ tn_tls_dir }}/truenorth.key"
    common_name: "{{ tn_domain_fqdn }}"
    subject_alt_name:
      - "DNS:{{ tn_domain_fqdn }}"
      - "DNS:{{ inventory_hostname }}"
      - "IP:{{ ansible_host }}"
    mode: "0644"
  when: tn_tls_mode == 'selfsigned'

- name: TLS — self-signed certificate
  community.crypto.x509_certificate:
    path: "{{ tn_tls_dir }}/truenorth.crt"
    privatekey_path: "{{ tn_tls_dir }}/truenorth.key"
    csr_path: "{{ tn_tls_dir }}/truenorth.csr"
    provider: selfsigned
    selfsigned_not_after: "+825d"
    mode: "0644"
  when: tn_tls_mode == 'selfsigned'
  notify: Reload nginx if running

- name: TLS — warn that a self-signed certificate is in use
  ansible.builtin.debug:
    msg: >-
      Serving a SELF-SIGNED certificate. Browsers will warn, and any client that
      validates the chain (including the Keycloak admin API calls this installer
      makes) needs it trusted explicitly. Fine for bring-up; issue a real
      certificate from corp-TN-DC01-CA before a cohort uses this.
  when: tn_tls_mode == 'selfsigned'
