---
- name: Refresh host CA bundle
  ansible.builtin.command: update-ca-certificates
  become: true
  changed_when: true

# On a first install the stack is not up yet (50 starts it with the new files); on a
# re-run these make a changed certificate or CA take effect.
- name: Reload nginx if running
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      cd {{ tn_app_dir }}/infra/platform/docker
      dc() { docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} "$@"; }
      if [ -n "$(dc ps -q nginx 2>/dev/null)" ]; then dc exec -T nginx nginx -s reload; fi
  changed_when: true

- name: Restart Keycloak if running
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      cd {{ tn_app_dir }}/infra/platform/docker
      dc() { docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} "$@"; }
      if [ -n "$(dc ps -q keycloak 2>/dev/null)" ]; then dc restart keycloak; fi
  changed_when: true
