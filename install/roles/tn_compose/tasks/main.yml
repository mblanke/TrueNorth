---
# Bring the stack up, in two phases.
#
# The phasing is not cosmetic. app/main.py's lifespan calls
# Base.metadata.create_all() on every API start, in every uvicorn worker. On a
# fresh database whichever worker wins creates all 68 tables from the ORM, and a
# later `alembic upgrade head` then starts from base and dies on DuplicateTable.
#
# So: datastores first, migrate (roles/tn_migrate), then everything else. By the
# time the API starts, every table exists and create_all is a no-op.
#
# The installer also sets DB_AUTO_CREATE=false, which removes the hazard rather
# than sequencing around it — the phasing is belt and braces.

- name: Compose — validate the production file resolves
  ansible.builtin.command:
    cmd: docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} config --quiet
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  changed_when: false
  register: tn_compose_config
  failed_when: tn_compose_config.rc != 0

# Images first: the migration below runs in the api image, and must be the NEW release's
# image, or an upgrade applies the old migrations and the new ones land only after the
# new code is already running. compose.prod.yml names every image by digest (the
# TrueNorth ones from release-manifest.json, roles/tn_release), so what is pulled is
# exactly what release.yml scanned. Nothing is built on the target unless
# tn_image_source=build (lab only). The env file (tn_config, run first by 50-stack-up)
# carries the TN_IMAGE_* refs.
- name: Compose — log in to GHCR (private release images only)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ vault_ghcr_username }}"
    password: "{{ vault_ghcr_token }}"
  when:
    - tn_image_source == 'release'
    - tn_image_archive_dir | length == 0
    - vault_ghcr_token | default('') | length > 0
  no_log: true

# Air-gapped: `docker save` tarballs from the control node (install/README.md
# "Air-gapped installs"). Loaded only when a tarball changed; the digest check below
# decides whether they were the right ones.
- name: Compose — load image archives (air-gapped)
  when: tn_image_archive_dir | length > 0
  block:
    - name: Compose — find the image archives
      ansible.builtin.find:
        paths: "{{ tn_image_archive_dir }}"
        patterns: ["*.tar"]
      delegate_to: localhost
      become: false
      register: tn_archives

    - name: Compose — there are some
      ansible.builtin.assert:
        that: tn_archives.files | length > 0
        fail_msg: "tn_image_archive_dir={{ tn_image_archive_dir }} holds no *.tar image archives"
        quiet: true

    - name: Compose — image archive directory
      ansible.builtin.file:
        path: "{{ tn_data_root }}/images"
        state: directory
        mode: "0750"

    - name: Compose — copy the image archives
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ tn_data_root }}/images/{{ item.path | basename }}"
        mode: "0640"
      loop: "{{ tn_archives.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: tn_archive_copy

    - name: Compose — docker load the ones that changed
      ansible.builtin.command:
        argv: [docker, load, --input, "{{ item.dest }}"]
      loop: "{{ tn_archive_copy.results | selectattr('changed') | list }}"
      loop_control:
        label: "{{ item.dest | basename }}"
      changed_when: true

- name: Compose — pull every image by digest
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      dc() { docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} "$@"; }
      missing=0
      for img in $(dc config --images | sort -u); do
        docker image inspect "$img" >/dev/null 2>&1 || missing=1
      done
      [ "$missing" = 0 ] && exit 0
      dc pull --quiet
      echo IMAGES_PULLED
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_pull
  changed_when: "'IMAGES_PULLED' in tn_pull.stdout"
  when:
    - tn_image_source == 'release'
    - tn_image_archive_dir | length == 0

# Lab only: what runs is then not what release.yml scanned. The images take the local
# tags tn_release rendered into TN_IMAGE_*. Reports a change only when an image id changed.
- name: Compose — build the application images (tn_image_source=build)
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      dc() { docker compose -f {{ tn_compose_file }} -f compose.build.yml --env-file {{ tn_env_file }} "$@"; }
      ids() {
        for img in $(dc config --images | sort -u); do
          docker image inspect --format '{{ "{{" }}.Id{{ "}}" }}' "$img" 2>/dev/null || echo "missing:$img"
        done
      }
      before=$(ids)
      dc build --quiet
      [ "$before" = "$(ids)" ] || echo IMAGES_CHANGED
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_build
  changed_when: "'IMAGES_CHANGED' in tn_build.stdout"
  when: tn_image_source == 'build'

# The gate: every image the stack runs is on this host, and every one named by digest
# resolves to that digest. An air-gapped archive that lost its digests (docker's classic
# image store does not keep them through save/load) stops here, not at `up`.
- name: Compose — every image is present at the digest compose names
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      dc() { docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} "$@"; }
      bad=""
      for img in $(dc config --images | sort -u); do
        if ! docker image inspect "$img" >/dev/null 2>&1; then
          bad="$bad missing:$img"
        elif [[ "$img" == *@sha256:* ]]; then
          want="${img%%@*}"; want="${want%:*}@${img##*@}"
          docker image inspect --format '{{ "{{" }}json .RepoDigests{{ "}}" }}' "$img" | grep -qF "\"$want\"" \
            || bad="$bad digest:$img"
        fi
      done
      echo "${bad:-ok}"
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_images_present
  changed_when: false
  failed_when: tn_images_present.rc != 0 or tn_images_present.stdout | trim != 'ok'

# ── Upgrade: back up, then stop the old code before the schema changes ──
# An upgrade is a running stack whose database is behind the new release's migrations.
# Before alembic touches it: a backup (the rollback point; -e tn_pre_upgrade_backup=false
# to skip), and the api, workers, beat and flower stopped, so no OLD code ever runs on the
# NEW schema. tn_migrate then migrates and phase 2 starts the new code.
- name: Compose — is a stack already running here?
  ansible.builtin.command:
    cmd: docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} ps -q --status running postgres
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_pg_running
  changed_when: false
  check_mode: false

- name: Compose — upgrade check
  when: tn_pg_running.stdout | trim | length > 0
  block:
    - name: Compose — the database's revision
      ansible.builtin.command:
        cmd: >-
          docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
          exec -T postgres psql -U {{ vault_postgres_user | default('forge') }}
          -d {{ vault_postgres_db | default('forge') }} -tAc
          "SELECT version_num FROM alembic_version"
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      register: tn_db_rev
      changed_when: false
      failed_when: false
      check_mode: false

    # `alembic heads` and `history` read the migration scripts only; they do not connect.
    - name: Compose — the new release's migration heads and history
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ tn_compose_file }}"
          - --env-file
          - "{{ tn_env_file }}"
          - run
          - --rm
          - --no-deps
          - --entrypoint
          - ""
          - api
          - sh
          - -c
          - alembic -c alembic.ini heads && echo ---HISTORY--- && alembic -c alembic.ini history
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      register: tn_code_revs
      changed_when: false
      check_mode: false

    - name: Compose — classify
      vars:
        _heads_out: "{{ tn_code_revs.stdout.split('---HISTORY---')[0] }}"
        _history: "{{ tn_code_revs.stdout.split('---HISTORY---')[1] | default('') }}"
        _rev: "{{ tn_db_rev.stdout | trim }}"
      ansible.builtin.set_fact:
        tn_code_heads: "{{ _heads_out | regex_findall('^(\\w+)', multiline=True) }}"
        tn_db_rev_known: "{{ _rev | length == 0 or (_rev in _history) }}"
        tn_is_upgrade: >-
          {{ tn_db_rev.rc == 0 and (_rev | length > 0)
             and _rev not in (_heads_out | regex_findall('^(\\w+)', multiline=True)) }}

    # Checked here, before anything is stopped: an older release on a newer schema.
    # -e tn_allow_downgrade=true is the deliberate code rollback (schema kept), which
    # docs/runbooks/upgrade.md allows only when the rollback rehearsal passed.
    - name: Compose — refuse a database newer than this release
      ansible.builtin.assert:
        that: tn_db_rev_known | bool or tn_allow_downgrade | bool
        fail_msg: >-
          The database is at revision {{ tn_db_rev.stdout | trim }}, which this release's
          migrations do not contain: it was migrated by a NEWER TrueNorth. Nothing was
          stopped. Rolling back is deliberate: restore the pre-upgrade backup, or (code
          rollback, schema kept) -e tn_allow_downgrade=true (docs/runbooks/upgrade.md "Roll back").
        quiet: true

    - name: Compose — report
      ansible.builtin.debug:
        msg: >-
          {{ ('UPGRADE: database at ' ~ (tn_db_rev.stdout | trim) ~ ', release head '
              ~ (tn_code_heads | join(',')) ~ '. '
              ~ ('Backing up first, then ' if tn_pre_upgrade_backup | bool else 'NO pre-upgrade backup (tn_pre_upgrade_backup=false), then ')
              ~ 'stopping the application services (in-flight tasks: ' ~ tn_upgrade_inflight ~ ').')
             if tn_is_upgrade | bool else 'Schema is at the release head: no migration, nothing stopped.' }}

- name: Compose — prepare the upgrade
  when:
    - tn_is_upgrade | default(false) | bool
    - not ansible_check_mode
  block:
    - name: Compose — the in-flight policy is one we know
      ansible.builtin.assert:
        that: tn_upgrade_inflight in ['drain', 'abandon']
        fail_msg: "tn_upgrade_inflight must be drain or abandon (got {{ tn_upgrade_inflight }})"
        quiet: true

    # backup.sh needs postgres and minio up, which they are: this is the old stack.
    - name: Compose — pre-upgrade backup (the rollback point)
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          set -a; . {{ tn_config_dir }}/backup.env; set +a
          BACKUP_ROOT="$BACKUP_DIR" BACKUP_DIR="$BACKUP_DIR/pre-upgrade" BACKUP_RETENTION_DAYS=0 \
            {{ tn_app_dir }}/scripts/backup/backup.sh
      register: tn_pre_backup
      changed_when: true
      # 5: the data, files and secrets are backed up and only the OpenSearch telemetry
      # snapshot failed. On the first upgrade to a release that adds snapshots it always
      # does: the old OpenSearch has no path.repo and 70-telemetry has not registered the
      # repository yet. The rollback point is intact, so warn and go on.
      failed_when: tn_pre_backup.rc not in [0, 5]
      when: tn_pre_upgrade_backup | bool

    - name: Compose — pre-upgrade backup without a telemetry snapshot
      ansible.builtin.debug:
        msg: >-
          The pre-upgrade backup holds the databases, object storage and secrets, but no
          OpenSearch telemetry snapshot ({{ (tn_pre_backup.stderr | default('')) | regex_search('snapshot[^\n]*') | default('see the backup log', true) }}).
          Expected on the first upgrade to snapshot support; 70-telemetry registers the
          repository and the nightly backup snapshots telemetry from then on.
      when:
        - tn_pre_upgrade_backup | bool
        - tn_pre_backup.rc | default(0) == 5

    - name: Compose — tasks running on the workers now
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} exec -T worker-provision \
            celery -A worker.celery_app inspect active --json 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(sum(len(v or []) for v in d.values()))' \
            || echo unknown
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      register: tn_inflight
      changed_when: false

    - name: Compose — in-flight work
      ansible.builtin.debug:
        msg: >-
          {{ tn_inflight.stdout | trim }} task(s) running on the workers.
          {{ 'drain: waiting for them to finish (worker-provision allows up to 3600 s for a range build).'
             if tn_upgrade_inflight == 'drain' else
             'ABANDON: workers get 60 s, then running tasks are killed. Interrupted ranges must be '
             ~ 'torn down and rebuilt; their tasks are redelivered after the broker visibility '
             ~ 'timeout (3600 s) unless purged (docs/runbooks/upgrade.md).' }}

    # Old code must not run on the new schema: everything that talks to the database
    # stops before alembic and starts again (as the new release) in tn_migrate's phase 2.
    - name: Compose — stop the application services
      ansible.builtin.command:
        argv: >-
          {{ ['docker', 'compose', '-f', tn_compose_file, '--env-file', tn_env_file, 'stop']
             + (['--timeout', '60'] if tn_upgrade_inflight == 'abandon' else [])
             + ['api', 'web', 'nginx', 'worker-provision', 'worker-scenario', 'worker-telemetry', 'beat', 'flower'] }}
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      changed_when: true

- name: Compose — phase 1, datastores only
  community.docker.docker_compose_v2:
    project_src: "{{ tn_app_dir }}/infra/platform/docker"
    files: [compose.prod.yml]
    env_files: ["{{ tn_env_file }}"]
    services: [postgres, pgbouncer, redis]
    state: present
    pull: never # present and digest-checked above
    wait: true
    wait_timeout: 300

- name: Compose — wait for postgres to accept connections
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
      exec -T postgres pg_isready -U {{ vault_postgres_user | default('forge') }}
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_pg_ready
  until: tn_pg_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false
