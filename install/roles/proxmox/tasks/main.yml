---
- name: Add Proxmox no-subscription repo
  apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription"
    state: present
  when: proxmox_no_subscription_repo | default(true)

- name: Remove enterprise repo
  file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent
  when: not (proxmox_enterprise_repo | default(false))

- name: Install Proxmox VE
  apt:
    name:
      - proxmox-ve
      - postfix
      - open-iscsi
    state: present
    update_cache: true

- name: Create Proxmox cluster
  command: "pvecm create {{ proxmox_cluster_name }}"
  args:
    creates: /etc/pve/corosync.conf
  when: inventory_hostname == groups['hypervisors'][0]

- name: Join Proxmox cluster
  command: "pvecm add {{ hostvars[groups['hypervisors'][0]].ansible_host }}"
  args:
    creates: /etc/pve/corosync.conf
  when: inventory_hostname != groups['hypervisors'][0]
