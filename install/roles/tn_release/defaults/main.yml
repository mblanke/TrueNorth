---
# The release-manifest.json services compose.prod.yml runs, and the env variable each
# image ref is rendered into. The release also publishes scenario-engine; compose does
# not run it (the api mounts the engine from the app source at the same commit).
tn_release_services:
  api: TN_IMAGE_API
  worker: TN_IMAGE_WORKER
  web: TN_IMAGE_WEB
  ai-orchestrator: TN_IMAGE_AI_ORCHESTRATOR

# ── Release signature (docs/release.md "Verifying a release") ─────────
# release.yml signs release-manifest.json with cosign keyless (GitHub OIDC). The installer
# trusts the manifest only if its Sigstore bundle verifies against THIS identity: the
# release workflow of this repository, run for exactly the tag being installed.
tn_release_verify_signature: true
tn_release_cert_identity: >-
  https://github.com/{{ tn_release_repo }}/.github/workflows/release.yml@refs/tags/{{ tn_release_version }}
tn_release_cert_oidc_issuer: https://token.actions.githubusercontent.com
# Air-gapped: a Sigstore trusted_root.json on the control node (docs/release.md). Empty:
# cosign uses the public-good TUF root (needs HTTPS to tuf-repo-cdn.sigstore.dev).
tn_release_trusted_root: ""

# cosign on the control node: a path to an existing binary, or empty to download the
# pinned release below into tn_release_cache_dir and check it against these SHA-256s.
# Pin source: cosign_checksums.txt of v3.1.3, verified 2026-10-08 with
#   cosign verify-blob --bundle cosign_checksums.txt.sigstore.json
#     --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com
#     --certificate-oidc-issuer https://accounts.google.com
tn_cosign_path: ""
tn_cosign_version: v3.1.3
tn_cosign_sha256:
  linux-amd64: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
  linux-arm64: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
  darwin-amd64: 2347488e5d5b25336644024dfeca5601b190e91197a71a917bda44744aff106c
  darwin-arm64: 5cf948c2f4dfe59687bdd0b8523709067383e03982cc543475c8a7dc70e92a76
