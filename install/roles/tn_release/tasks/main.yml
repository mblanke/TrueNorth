---
# Which application images this install runs: deploy by digest.
#
#   release (default): release-manifest.json of tn_release_version (docs/release.md),
#     checked against the release's SHA256SUMS, names each service's image@sha256. The
#     env file gets those refs (TN_IMAGE_*), the target pulls (or loads) exactly them, and
#     in git mode the app source is fetched at the manifest's git_sha: the compose file and
#     the migrations that match the images.
#   build: compose.build.yml builds local tags from the checkout. Lab only.
#
# Sets tn_images (service -> ref), tn_deployed_version, and in release mode
# tn_release_git_sha. Included by 20-fetch-app and by tn_config, so every play that
# renders the env file or starts the stack agrees on the images.

- name: Release — the image source is one we know
  ansible.builtin.assert:
    that: tn_image_source in ['release', 'build']
    fail_msg: "tn_image_source must be release or build (got {{ tn_image_source }})"
    quiet: true

# tn_app_git_version empty (the default): deploy the commit this installer is checked out
# at. A pinned SHA in the inventory went stale silently (it was 336 commits behind the
# installer that deployed it); this cannot. Release mode replaces it with git_sha below.
- name: Release — default the app version to this installer's own commit
  when: tn_app_git_version | default('') | length == 0
  block:
    - name: Release — the installer's commit  # noqa command-instead-of-module
      ansible.builtin.command:
        argv: [git, -C, "{{ inventory_dir }}/..", rev-parse, HEAD]
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      check_mode: false
      register: tn_installer_commit

    - name: Release — does the installer checkout have uncommitted changes?  # noqa command-instead-of-module
      ansible.builtin.command:
        argv: [git, -C, "{{ inventory_dir }}/..", status, --porcelain, --untracked-files=no]
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false
      check_mode: false
      register: tn_installer_dirty

    - name: Release — use it
      ansible.builtin.set_fact:
        tn_app_git_version: "{{ tn_installer_commit.stdout | trim }}"

    - name: Release — warn about local edits the target will not get
      ansible.builtin.debug:
        msg: >-
          WARNING: the installer checkout has uncommitted changes. The app is deployed at
          {{ tn_app_git_version[:12] }} as committed (git mode fetches it from
          {{ tn_app_git_repo }}): local edits are not deployed, and the commit must be pushed.
      when: tn_installer_dirty.stdout | trim | length > 0

- name: Release — build mode runs local tags (lab only)
  ansible.builtin.set_fact:
    tn_images: >-
      {{ dict(tn_release_services.keys() | zip(tn_release_services.keys()
              | map('regex_replace', '^(.*)$', 'truenorth-\1:local'))) }}
    tn_deployed_version: "{{ tn_app_git_version }}"
  when: tn_image_source == 'build'

- name: Release — read the manifest and deploy by digest
  when: tn_image_source == 'release'
  block:
    - name: Release — a release is pinned
      ansible.builtin.assert:
        that: tn_release_version | length > 0
        fail_msg: |
          tn_image_source is release, but tn_release_version is empty. Set it to the
          release tag to install (e.g. -e tn_release_version=v1.2.3; docs/release.md).

          Until the first release exists, a lab can build from the checkout instead:
            -e tn_image_source=build
        quiet: true

    - name: Release — where the release files are, on the control node
      ansible.builtin.set_fact:
        tn_release_files: >-
          {{ tn_release_dir if tn_release_dir | length > 0
             else tn_release_cache_dir ~ '/' ~ tn_release_version }}

    - name: Release — download directory
      ansible.builtin.file:
        path: "{{ tn_release_files }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      when: tn_release_dir | length == 0

    # Fetched once per version (a published release's assets never change).
    - name: Release — download the manifest, its checksums and its signature bundle
      ansible.builtin.get_url:
        url: "https://github.com/{{ tn_release_repo }}/releases/download/{{ tn_release_version }}/{{ item }}"
        dest: "{{ tn_release_files }}/{{ item }}"
        mode: "0644"
      loop: [release-manifest.json, SHA256SUMS, release-manifest.json.sigstore.json]
      delegate_to: localhost
      become: false
      run_once: true
      when: tn_release_dir | length == 0

    # ── Signature: the manifest is trusted only if the release workflow signed it ──
    # A SHA256SUMS beside the manifest proves only that the two came together; whoever can
    # replace one can replace both. The Sigstore bundle (certificate + signature +
    # transparency-log proof) ties the manifest to release.yml of tn_release_repo, run for
    # this tag, through GitHub's OIDC identity.
    - name: Release — verify the manifest's signature
      when: tn_release_verify_signature | bool
      delegate_to: localhost
      become: false
      run_once: true
      block:
        - name: Release — cosign platform
          ansible.builtin.set_fact:
            tn_cosign_platform: >-
              {{ (lookup('ansible.builtin.pipe', 'uname -s') | lower) ~ '-'
                 ~ (lookup('ansible.builtin.pipe', 'uname -m')
                    | replace('x86_64', 'amd64') | replace('aarch64', 'arm64')) }}

        - name: Release — a pinned cosign exists for this control node
          ansible.builtin.assert:
            that: tn_cosign_path | length > 0 or tn_cosign_platform in tn_cosign_sha256
            fail_msg: >-
              No pinned cosign for {{ tn_cosign_platform }}. Install cosign
              {{ tn_cosign_version }} yourself (verify it) and pass -e tn_cosign_path=/path/to/cosign.
            quiet: true

        - name: Release — cosign cache directory
          ansible.builtin.file:
            path: "{{ tn_release_cache_dir }}"
            state: directory
            mode: "0755"
          when: tn_cosign_path | length == 0

        - name: Release — download the pinned cosign, checked against its SHA-256
          ansible.builtin.get_url:
            url: "https://github.com/sigstore/cosign/releases/download/{{ tn_cosign_version }}/cosign-{{ tn_cosign_platform }}"
            dest: "{{ tn_release_cache_dir }}/cosign-{{ tn_cosign_version }}-{{ tn_cosign_platform }}"
            checksum: "sha256:{{ tn_cosign_sha256[tn_cosign_platform] }}"
            mode: "0755"
          when: tn_cosign_path | length == 0

        - name: Release — cosign verify-blob against the release workflow's identity
          ansible.builtin.command:
            argv: >-
              {{ [tn_cosign_path or (tn_release_cache_dir ~ '/cosign-' ~ tn_cosign_version ~ '-' ~ tn_cosign_platform),
                  'verify-blob',
                  '--bundle', tn_release_files ~ '/release-manifest.json.sigstore.json',
                  '--certificate-identity', tn_release_cert_identity,
                  '--certificate-oidc-issuer', tn_release_cert_oidc_issuer]
                 + (['--trusted-root', tn_release_trusted_root, '--offline=true']
                    if tn_release_trusted_root | length > 0 else [])
                 + [tn_release_files ~ '/release-manifest.json'] }}
          register: tn_release_sig
          changed_when: false
          check_mode: false
          failed_when: false

        - name: Release — the signature verified
          ansible.builtin.assert:
            that: tn_release_sig.rc == 0
            fail_msg: |
              release-manifest.json of {{ tn_release_version }} does NOT verify as signed by
              {{ tn_release_cert_identity }}
              (issuer {{ tn_release_cert_oidc_issuer }}). Do not install it.
              cosign said: {{ (tn_release_sig.stderr | default('')) | trim }}
            success_msg: "release-manifest.json signed by {{ tn_release_cert_identity }}"

    - name: Release — SIGNATURE CHECK SKIPPED
      ansible.builtin.debug:
        msg: >-
          WARNING: tn_release_verify_signature=false. The manifest is trusted on its
          SHA256SUMS alone, which proves nothing about who published it. Releases before
          signing existed only.
      when: not (tn_release_verify_signature | bool)

    - name: Release — checksum the manifest
      ansible.builtin.stat:
        path: "{{ tn_release_files }}/release-manifest.json"
        checksum_algorithm: sha256
      delegate_to: localhost
      become: false
      register: tn_release_stat

    - name: Release — the manifest is the one SHA256SUMS lists
      ansible.builtin.assert:
        that:
          - tn_release_stat.stat.exists
          - (tn_release_stat.stat.checksum ~ '  release-manifest.json')
            in lookup('ansible.builtin.file', tn_release_files ~ '/SHA256SUMS').splitlines()
        fail_msg: >-
          {{ tn_release_files }}/release-manifest.json is missing or does not match the
          release's SHA256SUMS. Download both from the same release
          (gh release download {{ tn_release_version }} -R {{ tn_release_repo }}
          -p release-manifest.json -p SHA256SUMS) and do not edit them.
        quiet: true

    - name: Release — parse it
      ansible.builtin.set_fact:
        tn_release_manifest: "{{ lookup('ansible.builtin.file', tn_release_files ~ '/release-manifest.json') | from_json }}"

    - name: Release — it describes the release asked for
      ansible.builtin.assert:
        that:
          - tn_release_manifest.schema_version | default(0) == 1
          - tn_release_manifest.version | default('') == tn_release_version
          - tn_release_manifest.git_sha | default('') is match('^[0-9a-f]{40}$')
        fail_msg: >-
          release-manifest.json says schema_version={{ tn_release_manifest.schema_version | default('?') }},
          version={{ tn_release_manifest.version | default('?') }}; this installer reads
          schema 1 of {{ tn_release_version }}.
        quiet: true

    - name: Release — every service is pinned by digest
      vars:
        _img: "{{ tn_release_manifest.images[item] | default({}) }}"
      ansible.builtin.assert:
        that:
          - _img.ref | default('') is match('^[^@\s]+@sha256:[0-9a-f]{64}$')
          - _img.ref | default('') == (_img.image | default('')) ~ '@' ~ (_img.digest | default(''))
        fail_msg: "release-manifest.json: images.{{ item }} has no image@sha256 ref ({{ _img }})"
        quiet: true
      loop: "{{ tn_release_services.keys() | list }}"

    - name: Release — the images, the commit and the version
      ansible.builtin.set_fact:
        tn_images: >-
          {{ dict(tn_release_services.keys()
                  | zip(tn_release_services.keys() | map('extract', tn_release_manifest.images) | map(attribute='ref'))) }}
        tn_release_git_sha: "{{ tn_release_manifest.git_sha }}"
        tn_deployed_version: "{{ tn_release_version }}"

    # The compose file and migrations must be the ones these images were built with.
    # (-e tn_app_git_version wins over this; tn_app_source then refuses the mismatch.)
    - name: Release — fetch the app source at the release's commit
      ansible.builtin.set_fact:
        tn_app_git_version: "{{ tn_release_git_sha }}"
      when: tn_app_source_mode == 'git'

- name: Release — report
  ansible.builtin.debug:
    msg: "{{ tn_image_source }} {{ tn_deployed_version }}: {{ tn_images }}"
