---
# Render the production environment file.
#
# Two rules drive this role:
#
#  1. Secrets are generated ONCE, on the target, and persisted. Regenerating
#     POSTGRES_PASSWORD on the second run would lock you out of your own
#     database — an installer that is not idempotent about secrets is worse than
#     one that is not idempotent at all.
#
#  2. The env file is written OUTSIDE the checkout, so no secret can be swept into a
#     commit. (infra/platform/docker/.env.production was once tracked; it is now
#     git-ignored, but the checkout is still no place for secrets.)

- name: Config — load the secret map
  ansible.builtin.include_tasks: secrets.yml

# The TN_IMAGE_* refs (release-manifest.json, or local build tags) and TN_VERSION.
- name: Config — which images
  ansible.builtin.include_role:
    name: tn_release
    public: true

# Written by roles/tn_keycloak once the AD federation component exists. Rendered from
# here so every re-run writes the same env file (a later play patching the file would
# be undone by the next run of this one).
- name: Config — read the recorded Keycloak LDAP component id
  ansible.builtin.slurp:
    src: "{{ tn_state_dir }}/keycloak_ldap_component_id"
  register: tn_kc_component_state
  failed_when: false

- name: Config — use it
  ansible.builtin.set_fact:
    tn_keycloak_ldap_component_id: "{{ tn_kc_component_state.content | b64decode | trim }}"
  when: tn_kc_component_state.content is defined

- name: Config — render .env.production
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ tn_env_file }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  no_log: true

# Prometheus reads bearer tokens from files (monitoring/prometheus/prometheus.yml).
# It runs as nobody (65534); handing a file to another uid needs root.
- name: Config — Prometheus scrape-token directory
  ansible.builtin.file:
    path: "{{ tn_config_dir }}/prometheus"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0750"
  become: true

- name: Config — Prometheus scrape tokens
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/prometheus/{{ item }}"
    content: "{{ tn_secrets[item] }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  loop: [metrics_scrape_token, ai_service_token]
  become: true
  no_log: true

# Alertmanager reads the webhook URL from a file (url_file), never the environment.
# nobody (65534) runs it; handing a file to another uid needs root.
- name: Config — Alertmanager secret directory
  ansible.builtin.file:
    path: "{{ tn_config_dir }}/alertmanager"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0750"
  become: true

- name: Config — Alertmanager webhook URL
  become: true
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/alertmanager/webhook_url"
    content: "{{ vault_alertmanager_webhook_url | default('') }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true

- name: Config — ALERTS GO NOWHERE
  ansible.builtin.debug:
    msg: >-
      WARNING: vault_alertmanager_webhook_url is empty, so Alertmanager routes every alert
      to a null receiver: the 19 Prometheus rules fire and nobody is told. Set it in the
      vault and re-run playbooks/30-config.yml and 50-stack-up.yml (install/README.md
      "Alerting").
  when: vault_alertmanager_webhook_url | default('') | length == 0

# ── Backups ───────────────────────────────────────────────────────────
# Every backup escrows the env file and config/secrets/ (TN_SECRETS_KEY, every database
# and identity password), encrypted to the escrow key, or the operator attests in writing
# that they are escrowed elsewhere. A backup without either restores data nobody can
# decrypt or log in to, so the install stops here rather than schedule one.
- name: Config — a backup escrow is configured
  ansible.builtin.assert:
    that: >-
      (tn_backup_escrow_pubkey | default('') | length > 0)
      or (tn_backup_escrow | default('') == 'out-of-band')
    fail_msg: >-
      No backup escrow: set tn_backup_escrow_pubkey (an RSA public key on the control node)
      or tn_backup_escrow: out-of-band in the inventory (00-preflight says how to make a key;
      docs/runbooks/backup-restore.md).
    quiet: true

- name: Config — install the escrow public key
  ansible.builtin.copy:
    src: "{{ tn_backup_escrow_pubkey }}"
    dest: "{{ tn_config_dir }}/backup-escrow.pub"
    mode: "0644"
  when: tn_backup_escrow_pubkey | default('') | length > 0

# compose.prod.yml binds its named volumes to $TN_DATA_ROOT/... . Docker reads
# that at `up` time from the env file, so it must be present there too.
- name: Config — render the backup environment
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/backup.env"
    mode: "0640"
    content: |
      # Sourced by scripts/backup/*.sh. Those default COMPOSE_FILE to a root
      # docker-compose.yml that has never existed in this repository, so every
      # `docker compose` call inside them failed silently until this was set.
      COMPOSE_FILE={{ tn_compose_file }}
      ENV_FILE={{ tn_env_file }}
      BACKUP_DIR={{ tn_data_root }}/backups
      RETENTION_DAYS=30
      # Escrowed with the env file, encrypted (restore-secrets.sh writes them back).
      SECRETS_DIR={{ tn_config_dir }}/secrets
      {% if tn_backup_escrow_pubkey | default('') | length > 0 %}
      BACKUP_ESCROW_PUBKEY={{ tn_config_dir }}/backup-escrow.pub
      {% else %}
      BACKUP_ESCROW=out-of-band
      {% endif %}
      # Never fill the disk: refuse to start below this, prune oldest above the cap.
      BACKUP_MIN_FREE_GB={{ tn_backup_min_free_gb }}
      BACKUP_MAX_TOTAL_GB={{ tn_backup_max_total_gb }}
      # OpenSearch snapshots (only with OPENSEARCH_SNAPSHOT_REPO) verify the internal CA.
      OPENSEARCH_SNAPSHOT_CACERT=config/certs/ca.pem
      {% if tn_opensearch_snapshot_repo | default('') | length > 0 %}
      # Telemetry: a snapshot per backup into the repository 70-telemetry registered
      # ({{ tn_data_root }}/opensearch-snapshots); the oldest beyond KEEP are deleted.
      OPENSEARCH_SNAPSHOT_REPO={{ tn_opensearch_snapshot_repo }}
      OPENSEARCH_SNAPSHOT_KEEP={{ tn_opensearch_snapshot_keep | default(14) }}
      {% endif %}
      {% if tn_opensearch_disable_security | bool %}
      # tn_opensearch_disable_security: the node answers plain http, without auth.
      OPENSEARCH_URL=http://localhost:9200
      {% endif %}

- name: Config — nightly backup timer
  ansible.builtin.cron:
    name: truenorth-backup
    minute: "17"
    hour: "2"
    job: >-
      set -a; . {{ tn_config_dir }}/backup.env; set +a;
      {{ tn_app_dir }}/scripts/backup/cron-backup.sh
      >> {{ tn_data_root }}/logs/backup.log 2>&1
    state: present
