---
# Render the production environment file.
#
# Two rules drive this role:
#
#  1. Secrets are generated ONCE, on the target, and persisted. Regenerating
#     POSTGRES_PASSWORD on the second run would lock you out of your own
#     database — an installer that is not idempotent about secrets is worse than
#     one that is not idempotent at all.
#
#  2. The env file is written OUTSIDE the checkout, so no secret can be swept into a
#     commit. (infra/platform/docker/.env.production was once tracked; it is now
#     git-ignored, but the checkout is still no place for secrets.)

- name: Config — load the secret map
  ansible.builtin.include_tasks: secrets.yml

# Written by roles/tn_keycloak once the AD federation component exists. Rendered from
# here so every re-run writes the same env file (a later play patching the file would
# be undone by the next run of this one).
- name: Config — read the recorded Keycloak LDAP component id
  ansible.builtin.slurp:
    src: "{{ tn_state_dir }}/keycloak_ldap_component_id"
  register: tn_kc_component_state
  failed_when: false

- name: Config — use it
  ansible.builtin.set_fact:
    tn_keycloak_ldap_component_id: "{{ tn_kc_component_state.content | b64decode | trim }}"
  when: tn_kc_component_state.content is defined

- name: Config — render .env.production
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ tn_env_file }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  no_log: true

# Prometheus reads bearer tokens from files (monitoring/prometheus/prometheus.yml).
# It runs as nobody (65534).
- name: Config — Prometheus scrape-token directory
  ansible.builtin.file:
    path: "{{ tn_config_dir }}/prometheus"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0750"

- name: Config — Prometheus scrape tokens
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/prometheus/{{ item }}"
    content: "{{ tn_secrets[item] }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  loop: [metrics_scrape_token, ai_service_token]
  no_log: true

# compose.prod.yml binds its named volumes to $TN_DATA_ROOT/... . Docker reads
# that at `up` time from the env file, so it must be present there too.
- name: Config — render the backup environment
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/backup.env"
    mode: "0640"
    content: |
      # Sourced by scripts/backup/*.sh. Those default COMPOSE_FILE to a root
      # docker-compose.yml that has never existed in this repository, so every
      # `docker compose` call inside them failed silently until this was set.
      COMPOSE_FILE={{ tn_compose_file }}
      ENV_FILE={{ tn_env_file }}
      BACKUP_DIR={{ tn_data_root }}/backups
      RETENTION_DAYS=30

- name: Config — nightly backup timer
  ansible.builtin.cron:
    name: truenorth-backup
    minute: "17"
    hour: "2"
    job: >-
      set -a; . {{ tn_config_dir }}/backup.env; set +a;
      {{ tn_app_dir }}/scripts/backup/cron-backup.sh
      >> {{ tn_data_root }}/logs/backup.log 2>&1
    state: present
