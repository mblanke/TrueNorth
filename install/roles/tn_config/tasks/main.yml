---
# Render the production environment file.
#
# Two rules drive this role:
#
#  1. Secrets are generated ONCE, on the target, and persisted. Regenerating
#     POSTGRES_PASSWORD on the second run would lock you out of your own
#     database — an installer that is not idempotent about secrets is worse than
#     one that is not idempotent at all.
#
#  2. The env file is written OUTSIDE the checkout, so no secret can be swept into a
#     commit. (infra/platform/docker/.env.production was once tracked; it is now
#     git-ignored, but the checkout is still no place for secrets.)

- name: Config — load the secret map
  ansible.builtin.include_tasks: secrets.yml

# The TN_IMAGE_* refs (release-manifest.json, or local build tags) and TN_VERSION.
- name: Config — which images
  ansible.builtin.include_role:
    name: tn_release
    public: true

# Its own task file: roles/tn_cmi5 renders it again once it has minted the cmi5 AU
# credential (which needs the LRS running, so it cannot exist yet on a first install).
- name: Config — render .env.production
  ansible.builtin.include_tasks: env.yml

# Prometheus reads bearer tokens from files (monitoring/prometheus/prometheus.yml).
# It runs as nobody (65534); handing a file to another uid needs root.
- name: Config — Prometheus scrape-token directory
  ansible.builtin.file:
    path: "{{ tn_config_dir }}/prometheus"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0750"
  become: true

- name: Config — Prometheus scrape tokens
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/prometheus/{{ item }}"
    content: "{{ tn_secrets[item] }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  loop: [metrics_scrape_token, ai_service_token]
  become: true
  no_log: true

# Alertmanager reads the webhook URL from a file (url_file), never the environment.
# nobody (65534) runs it; handing a file to another uid needs root.
- name: Config — Alertmanager secret directory
  ansible.builtin.file:
    path: "{{ tn_config_dir }}/alertmanager"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0750"
  become: true

- name: Config — Alertmanager webhook URL
  become: true
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/alertmanager/webhook_url"
    content: "{{ vault_alertmanager_webhook_url | default('') }}"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true

# ── Alert delivery by email (tn_alert_email_enabled; preflight checked the settings) ──
# The config is rendered here, not shipped in the checkout: recipient, sender and relay
# are per site. The SMTP password goes to its own 0600 file (smtp_auth_password_file).
# Off, both files are removed and the env file selects the shipped config again.
# 30-config can run without 00-preflight: a config with no relay would crash-loop Alertmanager.
- name: Config — alert email settings are usable
  ansible.builtin.assert:
    that:
      - tn_alert_email_to | default('') | string | trim | length > 0
      - tn_alert_email_from | default('') | string | trim | length > 0
      - tn_alert_smtp_host | default('') | string | trim | length > 0
      - vault_alert_smtp_username | default('') | string is not search('CHANGE_ME')
      - vault_alert_smtp_password | default('') | string is not search('CHANGE_ME')
    fail_msg: >-
      tn_alert_email_enabled is true but its settings are incomplete or still CHANGE_ME:
      run playbooks/00-preflight.yml, which names what is missing (install/README.md "Alerting").
    quiet: true
  when: tn_alert_email_enabled | default(false) | bool

- name: Config — the app's compose file can mount a rendered Alertmanager config
  ansible.builtin.command:
    argv: [grep, -q, ALERTMANAGER_CONFIG_DIR, "{{ tn_compose_file }}"]
  register: tn_alertmanager_config_dir_support
  changed_when: false
  failed_when: tn_alertmanager_config_dir_support.rc != 0
  when: tn_alert_email_enabled | default(false) | bool

- name: Config — Alertmanager SMTP password
  become: true
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/alertmanager/smtp_password"
    content: "{{ vault_alert_smtp_password | string | trim }}"
    owner: "65534"
    group: "65534"
    mode: "0600"
  no_log: true
  notify: Restart Alertmanager
  when:
    - tn_alert_email_enabled | default(false) | bool
    - vault_alert_smtp_username | default('') | string | trim | length > 0

- name: Config — Alertmanager email receiver
  become: true
  ansible.builtin.template:
    src: alertmanager.email.yml.j2
    dest: "{{ tn_config_dir }}/alertmanager/alertmanager.email.yml"
    owner: "65534"
    group: "65534"
    mode: "0400"
  no_log: true
  notify: Restart Alertmanager
  when: tn_alert_email_enabled | default(false) | bool

- name: Config — no alert email files while it is off (or without SMTP auth)
  become: true
  ansible.builtin.file:
    path: "{{ tn_config_dir }}/alertmanager/{{ item }}"
    state: absent
  loop: >-
    {{ (['alertmanager.email.yml'] if not tn_alert_email_enabled | default(false) | bool else [])
       + (['smtp_password'] if not (tn_alert_email_enabled | default(false) | bool
                                    and vault_alert_smtp_username | default('') | string | trim | length > 0)
          else []) }}

- name: Config — ALERTS GO NOWHERE
  ansible.builtin.debug:
    msg: >-
      WARNING: alert delivery is off (tn_alert_email_enabled is false and
      vault_alertmanager_webhook_url is empty), so Alertmanager routes every alert to a null
      receiver: the Prometheus rules fire and nobody is told. Set tn_alert_email_enabled
      and its settings, then re-run playbooks/30-config.yml and 50-stack-up.yml
      (install/README.md "Alerting").
  when:
    - not tn_alert_email_enabled | default(false) | bool
    - vault_alertmanager_webhook_url | default('') | length == 0

# ── Backups ───────────────────────────────────────────────────────────
# Every backup escrows the env file and config/secrets/ (TN_SECRETS_KEY, every database
# and identity password), encrypted to the escrow key, or the operator attests in writing
# that they are escrowed elsewhere. A backup without either restores data nobody can
# decrypt or log in to, so the install stops here rather than schedule one.
- name: Config — a backup escrow is configured
  ansible.builtin.assert:
    that: >-
      (tn_backup_escrow_pubkey | default('') | length > 0)
      or (tn_backup_escrow | default('') == 'out-of-band')
    fail_msg: >-
      No backup escrow: set tn_backup_escrow_pubkey (an RSA public key on the control node)
      or tn_backup_escrow: out-of-band in the inventory (00-preflight says how to make a key;
      docs/runbooks/backup-restore.md).
    quiet: true

- name: Config — install the escrow public key
  ansible.builtin.copy:
    src: "{{ tn_backup_escrow_pubkey }}"
    dest: "{{ tn_config_dir }}/backup-escrow.pub"
    mode: "0644"
  when: tn_backup_escrow_pubkey | default('') | length > 0

# compose.prod.yml binds its named volumes to $TN_DATA_ROOT/... . Docker reads
# that at `up` time from the env file, so it must be present there too.
- name: Config — render the backup environment
  ansible.builtin.copy:
    dest: "{{ tn_config_dir }}/backup.env"
    mode: "0640"
    content: |
      # Sourced by scripts/backup/*.sh. Those default COMPOSE_FILE to a root
      # docker-compose.yml that has never existed in this repository, so every
      # `docker compose` call inside them failed silently until this was set.
      COMPOSE_FILE={{ tn_compose_file }}
      ENV_FILE={{ tn_env_file }}
      BACKUP_DIR={{ tn_data_root }}/backups
      RETENTION_DAYS=30
      # Escrowed with the env file, encrypted (restore-secrets.sh writes them back).
      SECRETS_DIR={{ tn_config_dir }}/secrets
      {% if tn_backup_escrow_pubkey | default('') | length > 0 %}
      BACKUP_ESCROW_PUBKEY={{ tn_config_dir }}/backup-escrow.pub
      {% else %}
      BACKUP_ESCROW=out-of-band
      {% endif %}
      # Never fill the disk: refuse to start below this, prune oldest above the cap.
      BACKUP_MIN_FREE_GB={{ tn_backup_min_free_gb }}
      BACKUP_MAX_TOTAL_GB={{ tn_backup_max_total_gb }}
      # OpenSearch snapshots (only with OPENSEARCH_SNAPSHOT_REPO) verify the internal CA.
      OPENSEARCH_SNAPSHOT_CACERT=config/certs/ca.pem
      {% if tn_opensearch_snapshot_repo | default('') | length > 0 %}
      # Telemetry: a snapshot per backup into the repository 70-telemetry registered
      # ({{ tn_data_root }}/opensearch-snapshots); the oldest beyond KEEP are deleted.
      OPENSEARCH_SNAPSHOT_REPO={{ tn_opensearch_snapshot_repo }}
      OPENSEARCH_SNAPSHOT_KEEP={{ tn_opensearch_snapshot_keep | default(14) }}
      {% endif %}
      {% if tn_opensearch_disable_security | bool %}
      # tn_opensearch_disable_security: the node answers plain http, without auth.
      OPENSEARCH_URL=http://localhost:9200
      {% endif %}
      {% if tn_moodle_enabled | default(false) | bool %}
      # Moodle (roles/tn_moodle): its database is dumped with the others; this adds its
      # moodledata, and stops and restores it with the platform (restore.sh).
      MOODLE_COMPOSE_FILE={{ tn_moodle_compose_file }}
      MOODLE_ENV_FILE={{ tn_moodle_env_file }}
      {% endif %}
      # The signed audit export archive (ADR 0011): copied into every backup and verified
      # (exit 6 when a signature or hash does not verify); restored by restore.sh.
      AUDIT_ARCHIVE_PATH={{ tn_audit_archive_path }}
      # Prometheus textfile metrics (node_exporter, compose.prod.yml): backup.sh writes
      # truenorth_backup.prom, scripts/monitoring/host-probes.sh truenorth_probes.prom.
      METRICS_DIR={{ tn_data_root }}/metrics
      {% if tn_arc2_enabled | default(false) | bool %}
      # host-probes.sh: the ARC² runner's unit (Arc2RunnerDown). backup.sh records its state.
      ARC2_RUNNER_UNIT=truenorth-arc2-runner
      # ARC² Course Studio runs (tn-arc2:tn-arc2-runs): archived by backup.sh as root through
      # a throwaway container; restore.sh refuses while the runner is active.
      ARC2_RUNS_DIR={{ tn_arc2_runs_dir }}
      {% endif %}

# tn_base makes it too; here as well because 30-config is re-run on its own.
- name: Config — node_exporter's textfile directory
  ansible.builtin.file:
    path: "{{ tn_data_root }}/metrics"
    state: directory
    mode: "0755"

# BackupStale measures from the last good backup. Seeded once with the install time, so a
# host whose nightly backup never runs alerts after 26 h instead of never.
- name: Config — seed the backup metric
  ansible.builtin.copy:
    dest: "{{ tn_data_root }}/metrics/truenorth_backup.prom"
    mode: "0644"
    force: false
    content: |
      # HELP truenorth_backup_last_success_timestamp_seconds Seeded at install; backup.sh rewrites this file.
      # TYPE truenorth_backup_last_success_timestamp_seconds gauge
      truenorth_backup_last_success_timestamp_seconds {{ ansible_facts['date_time']['epoch'] }}

- name: Config — host probes for Prometheus (OpenSearch health, Moodle, ARC² runner)
  ansible.builtin.cron:
    name: truenorth-host-probes
    minute: "*"
    job: >-
      set -a; . {{ tn_config_dir }}/backup.env; set +a;
      {{ tn_app_dir }}/scripts/monitoring/host-probes.sh
      >> {{ tn_data_root }}/logs/host-probes.log 2>&1
    state: present

- name: Config — nightly backup timer
  ansible.builtin.cron:
    name: truenorth-backup
    minute: "17"
    hour: "2"
    job: >-
      set -a; . {{ tn_config_dir }}/backup.env; set +a;
      {{ tn_app_dir }}/scripts/backup/cron-backup.sh
      >> {{ tn_data_root }}/logs/backup.log 2>&1
    state: present
