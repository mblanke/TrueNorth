---
# Render .env.production from the secret map (tasks/secrets.yml) and what earlier stages
# recorded on the target. Every re-run writes the same file: values a later stage creates
# (the Keycloak LDAP component, the cmi5 AU credential) are read back from the target here
# rather than patched into the file, which the next run of 30-config would undo.
#
# Included by tasks/main.yml, and by roles/tn_cmi5 after it mints the AU credential:
#   - ansible.builtin.include_role: {name: tn_config, tasks_from: env}

# Written by roles/tn_keycloak once the AD federation component exists.
- name: Config — read the recorded Keycloak LDAP component id
  ansible.builtin.slurp:
    src: "{{ tn_state_dir }}/keycloak_ldap_component_id"
  register: tn_kc_component_state
  failed_when: false

- name: Config — use it
  ansible.builtin.set_fact:
    tn_keycloak_ldap_component_id: "{{ tn_kc_component_state.content | b64decode | trim }}"
  when: tn_kc_component_state.content is defined

# CMI5_LRS_AUTH (docs/cmi5.md): minted on the LRS by roles/tn_cmi5 (50-stack-up) and
# persisted as config/secrets/cmi5_lrs_auth. Absent until then: the first render has
# none, and cmi5 launches answer 503 until tn_cmi5 renders this file again.
- name: Config — read the persisted cmi5 AU credential
  ansible.builtin.slurp:
    src: "{{ tn_config_dir }}/secrets/cmi5_lrs_auth"
  register: tn_cmi5_lrs_auth_file
  failed_when: false
  no_log: true

- name: Config — use it
  ansible.builtin.set_fact:
    tn_cmi5_lrs_auth: >-
      {{ (tn_cmi5_lrs_auth_file.content | b64decode | trim)
         if tn_cmi5_lrs_auth_file.content is defined else '' }}
  no_log: true

# PLATFORM_TENANT_ID: tn_platform_tenant_id, else the bootstrap tenant's id, recorded by
# roles/tn_seed once 80-seed has created it. Absent on a first install's first render.
- name: Config — read the recorded platform tenant id
  ansible.builtin.slurp:
    src: "{{ tn_state_dir }}/platform_tenant_id"
  register: tn_platform_tenant_state
  failed_when: false
  when: tn_platform_tenant_id | default('') | string | trim | length == 0

- name: Config — the platform tenant
  ansible.builtin.set_fact:
    tn_platform_tenant_id_effective: >-
      {{ (tn_platform_tenant_id | default('') | string | trim)
         or ((tn_platform_tenant_state.content | b64decode | trim)
             if tn_platform_tenant_state.content is defined else '') }}

# SITE_TIMEZONE: tn_site_timezone, else the host's zone, else UTC.
- name: Config — the host's time zone
  ansible.builtin.command:
    argv: [timedatectl, show, --property=Timezone, --value]
  register: tn_host_timezone
  changed_when: false
  failed_when: false
  check_mode: false
  when: tn_site_timezone | default('') | string | trim | length == 0

- name: Config — the site time zone
  ansible.builtin.set_fact:
    tn_site_timezone_effective: >-
      {{ (tn_site_timezone | default('') | string | trim)
         or ((tn_host_timezone.stdout | default('') | trim)
             if (tn_host_timezone.rc | default(1)) == 0
                and (tn_host_timezone.stdout | default('') | trim) is match('^[A-Za-z][A-Za-z0-9_+/-]*$')
             else '')
         or 'UTC' }}

- name: Config — render .env.production
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ tn_env_file }}"
    mode: "0600"
    owner: "{{ ansible_user }}"
  register: tn_env_render
  no_log: true
