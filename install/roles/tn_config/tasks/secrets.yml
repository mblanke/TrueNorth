---
# The effective secret map (tn_secrets). Every secret is persisted on the target under
# {{ tn_config_dir }}/secrets/<name>: the vault's value when it sets one, otherwise one
# generated here once. Its own task file so every play that needs a secret (stack-up,
# Keycloak, smoke) loads it without re-rendering the env file:
#   - ansible.builtin.include_role: {name: tn_config, tasks_from: secrets}
#
# Per secret (the vault value arrives on stdin, never on a command line):
#   vault empty, file empty or missing  -> generate                      GENERATED
#   vault set,   file empty or missing  -> write the vault's value       WRITTEN
#   vault set,   file differs           -> first_start: refuse            DRIFT
#                                          otherwise: the vault wins       UPDATED
# An empty file counts as missing (a `creates:` guard once kept a zero-byte secret
# forever, and the stack then ran with an empty password).
#
# tn_secret_list (defaults/main.yml) is tn_generated_secrets, plus the demo people's
# passwords only where tn_load_shipped_demo is on.

- name: Config — persist every secret (generate any the vault leaves empty)
  ansible.builtin.shell:
    executable: /bin/bash # dash (Ubuntu's /bin/sh) has no `set -o pipefail`
    cmd: |
      set -euo pipefail
      umask 077
      f="{{ tn_config_dir }}/secrets/{{ item.name }}"
      want="$(cat)"
      have=""
      if [ -s "$f" ]; then have="$(cat "$f")"; fi
      if [ -z "$want" ]; then
        if [ -z "$have" ]; then
          # 48 random bytes: always >= 32 characters after stripping =+/ (the floor
          # TN_ENV=production applies to CSRF_SECRET, TN_SECRETS_KEY, AI_SERVICE_TOKEN).
          printf '%s' "$(head -c 48 /dev/urandom | base64 | tr -d '=+/' | cut -c1-32)" > "$f.tmp"
          mv "$f.tmp" "$f"
          echo GENERATED
        fi
        exit 0
      fi
      # A short vault value is refused before it is persisted (below, by name).
      # (wc, not the shell's length expansion: its "{" + "#" opens a Jinja comment.)
      if [ "$(printf '%s' "$want" | wc -c)" -lt {{ tn_secret_min_length | int }} ]; then echo SHORT; exit 0; fi
      if [ -z "$have" ]; then
        printf '%s' "$want" > "$f.tmp" && mv "$f.tmp" "$f"
        echo WRITTEN
      elif [ "$have" != "$want" ]; then
        if [ "{{ item.first_start | default(false) | bool | ternary('1', '0') }}" = 1 ]; then
          if [ "{{ item.name }}" = "{{ tn_secret_rotating }}" ]; then echo ROTATING; else echo DRIFT; fi
        else
          printf '%s' "$want" > "$f.tmp" && mv "$f.tmp" "$f"
          echo UPDATED
        fi
      fi
    stdin: "{{ item.value | default('') }}"
    stdin_add_newline: false
  register: tn_secret_persist
  loop: "{{ tn_secret_list }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: tn_secret_persist.stdout | default('') in ['GENERATED', 'WRITTEN', 'UPDATED']
  no_log: true

# Those services keep the password they were initialised with: changing only the env
# file would lock the platform out of its own database (or identity provider).
- name: Config — refuse a vault value that differs from an initialised service's password
  vars:
    _drift: >-
      {{ tn_secret_persist.results | default([]) | selectattr('stdout', 'defined')
         | selectattr('stdout', 'equalto', 'DRIFT') | map(attribute='item.name') | list }}
  ansible.builtin.assert:
    that: _drift | length == 0
    fail_msg: |
      The vault sets a different value for {{ _drift | join(', ') }} than the one this
      platform was installed with ({{ tn_config_dir }}/secrets/). These are read only when
      their service first starts, so the new value would reach the env file but not the
      database / Keycloak / OpenSearch / Grafana, and everything using it would be locked out.

      To change it, rotate it (changes the service AND the persisted value):
        ansible-playbook playbooks/rotate-secret.yml -K -e tn_rotate={{ _drift | first | default('<name>') }}
      (docs/runbooks/key-rotation.md). Otherwise put the old value back in the vault, or
      empty it there (the persisted value is then used).
    quiet: true

- name: Config — refuse a vault value that is too short
  vars:
    _short_vault: >-
      {{ tn_secret_persist.results | default([]) | selectattr('stdout', 'defined')
         | selectattr('stdout', 'equalto', 'SHORT') | map(attribute='item.name') | list }}
  ansible.builtin.assert:
    that: _short_vault | length == 0
    fail_msg: >-
      The vault sets {{ _short_vault | map('regex_replace', '^', 'vault_') | join(', ') }} shorter
      than {{ tn_secret_min_length }} characters (not persisted). Use a longer value, or empty it
      so one is generated.
    quiet: true

- name: Config — read persisted secrets back
  ansible.builtin.slurp:
    src: "{{ tn_config_dir }}/secrets/{{ item.name }}"
  register: tn_secret_files
  loop: "{{ tn_secret_list }}"
  loop_control:
    label: "{{ item.name }}"
  # In --check the files of a first install do not exist yet.
  failed_when: tn_secret_files is failed and not ansible_check_mode
  no_log: true

- name: Config — assemble the effective secret map
  ansible.builtin.set_fact:
    tn_secrets: >-
      {{ tn_secrets | default({}) | combine({item.item.name: (item.content | b64decode)}) }}
  loop: "{{ tn_secret_files.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.content is defined
  no_log: true

# Under --check on a first install nothing was persisted: carry the vault values (or a
# placeholder) so the templates below still render.
- name: Config — check mode stand-ins for secrets not yet persisted
  ansible.builtin.set_fact:
    tn_secrets: >-
      {{ tn_secrets | default({}) | combine({item.name: (item.value | default('', true)
         or 'check-mode-placeholder-not-a-real-secret')}) }}
  loop: "{{ tn_secret_list }}"
  loop_control:
    label: "{{ item.name }}"
  when: ansible_check_mode and item.name not in (tn_secrets | default({}))
  no_log: true

- name: Config — every secret is long enough
  vars:
    _short: >-
      {{ tn_secrets | dict2items | selectattr('value', 'string')
         | rejectattr('value', 'regex', '^.{' ~ tn_secret_min_length ~ ',}$')
         | map(attribute='key') | list }}
  ansible.builtin.assert:
    that: _short | length == 0
    fail_msg: >-
      Shorter than {{ tn_secret_min_length }} characters: {{ _short | join(', ') }}
      (in the vault, or in {{ tn_config_dir }}/secrets/). Use a longer value, or empty the
      vault entry so one is generated; a first_start password that is already in use is
      changed with playbooks/rotate-secret.yml.
    quiet: true

# LRS_AUTH is base64("key:secret") — the API sends it as a Basic credential.
- name: Config — derive the LRS basic-auth header value
  ansible.builtin.set_fact:
    tn_lrs_auth: "{{ (tn_secrets['lrs_api_key'] ~ ':' ~ tn_secrets['lrs_api_secret']) | b64encode }}"
  no_log: true
