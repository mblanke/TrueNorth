---
# Secrets the installer will generate on the target when the vault leaves them
# empty. `value` is what the vault supplied; empty means "generate and persist".
#
# Kept as data rather than inline in tasks so the list is reviewable in one
# place — it is the complete set of credentials this platform holds.
tn_generated_secrets:
  - { name: postgres_password, value: "{{ vault_postgres_password | default('') }}" }
  - { name: keycloak_db_password, value: "{{ vault_keycloak_db_password | default('') }}" }
  - { name: lrs_db_password, value: "{{ vault_lrs_db_password | default('') }}" }
  - { name: redis_password, value: "{{ vault_redis_password | default('') }}" }
  - { name: minio_secret_key, value: "{{ vault_minio_secret_key | default('') }}" }
  - { name: jwt_secret, value: "{{ vault_jwt_secret | default('') }}" }
  - { name: csrf_secret, value: "{{ vault_csrf_secret | default('') }}" }
  - { name: lrs_admin_password, value: "{{ vault_lrs_admin_password | default('') }}" }
  - { name: lrs_api_key, value: "{{ vault_lrs_api_key | default('') }}" }
  - { name: lrs_api_secret, value: "{{ vault_lrs_api_secret | default('') }}" }
  - { name: grafana_admin_password, value: "{{ vault_grafana_admin_password | default('') }}" }
  - { name: flower_password, value: "{{ vault_flower_password | default('') }}" }
  # The confidential `truenorth-api` Keycloak client. The realm file ships the
  # placeholder CHANGE_ME_IN_PRODUCTION; roles/tn_keycloak replaces it with this.
  - { name: keycloak_api_client_secret, value: "{{ vault_keycloak_api_client_secret | default('') }}" }
  # OpenSearch security plugin: `admin` (the API, workers and telemetry bootstrap) and
  # `kibanaserver` (OpenSearch Dashboards). roles/tn_tls hashes them into internal_users.yml.
  - { name: opensearch_admin_password, value: "{{ vault_opensearch_admin_password | default('') }}" }
  - { name: opensearch_dashboards_password, value: "{{ vault_opensearch_dashboards_password | default('') }}" }
