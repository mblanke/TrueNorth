---
# Host preparation. Everything here is idempotent and safe to re-run.

- name: Base — packages the installer and the stack rely on
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - dnsutils # dig, for the AD DNS checks
      - git # ansible.builtin.git (tn_app_source, git mode)
      - ldap-utils # the LDAPS bind check in 40-tls
      - python3-cryptography # community.crypto (self-signed TLS, CA conversion)
      - acl # become_user on a non-root target
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Resolve corp.tnrange.lab through AD (tn_dns_servers). A global systemd-resolved
# server is listed first in /run/systemd/resolve/resolv.conf, which is what Docker hands
# containers, so Keycloak resolves the DC as the host does. The DC forwards other names.
- name: Base — systemd-resolved drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: "0755"
  become: true

- name: Base — resolve the AD domain through its DNS
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/90-truenorth-ad.conf
    mode: "0644"
    content: |
      # Managed by the TrueNorth installer (roles/tn_base).
      [Resolve]
      DNS={{ tn_dns_servers | join(' ') }}
      Domains={{ tn_domain }}
  become: true
  register: tn_resolved_conf

- name: Base — apply the resolver change
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  become: true
  when: tn_resolved_conf is changed

- name: Base — the host now resolves the DC
  ansible.builtin.command: "getent hosts {{ tn_dc_host }}"
  register: tn_dc_resolves
  changed_when: false
  retries: 5
  delay: 2
  until: tn_dc_resolves.rc == 0

# OpenSearch sets bootstrap.memory_lock=true and mmaps its indices. The Ubuntu
# default (65530) is far below what it needs, and the container exits during
# startup with a message that does not point at the host.
- name: Base — raise vm.max_map_count for OpenSearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-truenorth.conf
    sysctl_set: true
    reload: true
    state: present
  become: true

- name: Base — data directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  become: true
  loop:
    - { path: "{{ tn_data_root }}" }
    - { path: "{{ tn_app_dir }}" }
    - { path: "{{ tn_config_dir }}", mode: "0750" }
    - { path: "{{ tn_config_dir }}/secrets", mode: "0700" }
    - { path: "{{ tn_tls_dir }}", mode: "0750" }
    - { path: "{{ tn_tls_dir }}/truststores", mode: "0755" }
    - { path: "{{ tn_state_dir }}" }
    # Bind targets for the compose volumes. compose.prod.yml maps its named
    # volumes here via TN_DATA_ROOT; without these the data would land in
    # /var/lib/docker and fill the OS disk while the data disk sits empty.
    # The uids are the ones the images run as.
    - { path: "{{ tn_data_root }}/postgres", owner: "999", group: "999", mode: "0700" }
    - { path: "{{ tn_data_root }}/redis", owner: "999", group: "999" }
    - { path: "{{ tn_data_root }}/minio", owner: "1000", group: "1000" }
    - { path: "{{ tn_data_root }}/opensearch", owner: "1000", group: "1000" }
    - { path: "{{ tn_data_root }}/logs" }
    - { path: "{{ tn_data_root }}/reports" }
    - { path: "{{ tn_data_root }}/artifacts" }
    - { path: "{{ tn_data_root }}/backups" }
