---
# Host preparation. Everything here is idempotent and safe to re-run.

# The index is refreshed with apt-get rather than the apt module's update_cache, which
# fails the whole install when ANY configured source does, including ones this
# installer does not use (on TN-MGMT01: a HashiCorp source with a rotated signing key).
# apt-get exits non-zero on real failures; a broken unrelated source is a warning,
# reported below.
- name: Base — refresh the package index  # noqa command-instead-of-module (see above)
  ansible.builtin.command: apt-get update
  become: true
  register: tn_apt_update
  changed_when: false

- name: Base — report sources apt could not use
  ansible.builtin.debug:
    msg: "{{ tn_apt_update.stdout_lines | select('match', '^(W|Err):') | list }}"
  when: tn_apt_update.stdout_lines | select('match', '^(W|Err):') | list | length > 0

- name: Base — packages the installer and the stack rely on
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - dnsutils # dig, for the AD DNS checks
      - git # ansible.builtin.git (tn_app_source, git mode)
      - ldap-utils # the LDAPS bind check in 40-tls
      - python3-cryptography # community.crypto (self-signed TLS, CA conversion)
      - python3-bcrypt # OpenSearch internal_users.yml password hashes (tn_tls)
      - acl # become_user on a non-root target
      - logrotate # {{ tn_data_root }}/logs (below)
    state: present
  become: true

# Resolve corp.tnrange.lab through AD (tn_dns_servers). A global systemd-resolved
# server is listed first in /run/systemd/resolve/resolv.conf, which is what Docker hands
# containers, so Keycloak resolves the DC as the host does. The DC forwards other names.
# Only with AD (tn_ldap_enabled): a site without TN-DC01 keeps its own resolver.
- name: Base — resolve the AD domain through its DNS
  when: tn_ldap_enabled | bool
  block:
    - name: Base — systemd-resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"
      become: true

    - name: Base — resolver drop-in for the AD domain
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/90-truenorth-ad.conf
        mode: "0644"
        content: |
          # Managed by the TrueNorth installer (roles/tn_base).
          [Resolve]
          DNS={{ tn_dns_servers | join(' ') }}
          Domains={{ tn_domain }}
      become: true
      notify: Restart systemd-resolved

    # The check below needs the new resolver now, not at the end of the play.
    - name: Base — apply the resolver change
      ansible.builtin.meta: flush_handlers

    - name: Base — the host now resolves the DC
      ansible.builtin.command: "getent hosts {{ tn_dc_host }}"
      register: tn_dc_resolves
      changed_when: false
      retries: 5
      delay: 2
      until: tn_dc_resolves.rc == 0

# Without AD DNS (tn_manage_etc_hosts): the seed and smoke checks call the service name
# from this host, where nginx answers on 443.
- name: Base — pin the service name to this host in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ tn_domain_fqdn | regex_escape }}(\s|$)'
    line: "127.0.0.1 {{ tn_domain_fqdn }}"
    mode: "0644"
  become: true
  when: tn_manage_etc_hosts | bool

# nginx writes its access/error logs into {{ tn_data_root }}/logs (the nginx-logs bind
# volume), as does the backup cron. Unrotated, they fill the data disk. copytruncate:
# nginx keeps its file descriptors, nothing needs a signal.
- name: Base — rotate the platform logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/truenorth
    mode: "0644"
    content: |
      # Managed by the TrueNorth installer (roles/tn_base).
      {{ tn_data_root }}/logs/*.log {{ tn_data_root }}/logs/*/*.log {
          daily
          rotate {{ tn_logrotate_days }}
          maxsize 500M
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
          su root root
      }
  become: true

# OpenSearch sets bootstrap.memory_lock=true and mmaps its indices. The Ubuntu
# default (65530) is far below what it needs, and the container exits during
# startup with a message that does not point at the host.
- name: Base — current vm.max_map_count
  ansible.builtin.command: sysctl -n vm.max_map_count
  register: tn_map_count
  changed_when: false
  check_mode: false

# Raise only: a host already set higher (TN-MGMT01 runs 1048576) must not be lowered.
- name: Base — raise vm.max_map_count for OpenSearch
  when: tn_map_count.stdout | int < 262144
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/99-truenorth.conf
    sysctl_set: true
    reload: true
    state: present
  become: true

- name: Base — data directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(ansible_user) }}"
    group: "{{ item.group | default(ansible_user) }}"
    mode: "{{ item.mode | default('0755') }}"
  become: true
  loop:
    - { path: "{{ tn_data_root }}" }
    - { path: "{{ tn_app_dir }}" }
    - { path: "{{ tn_config_dir }}", mode: "0750" }
    - { path: "{{ tn_config_dir }}/secrets", mode: "0700" }
    - { path: "{{ tn_tls_dir }}", mode: "0750" }
    - { path: "{{ tn_tls_dir }}/truststores", mode: "0755" }
    - { path: "{{ tn_state_dir }}" }
    # Bind targets for the compose volumes. compose.prod.yml maps its named
    # volumes here via TN_DATA_ROOT; without these the data would land in
    # /var/lib/docker and fill the OS disk while the data disk sits empty.
    # The uids are the ones the images run as.
    - { path: "{{ tn_data_root }}/postgres", owner: "999", group: "999", mode: "0700" }
    - { path: "{{ tn_data_root }}/redis", owner: "999", group: "999" }
    - { path: "{{ tn_data_root }}/minio", owner: "1000", group: "1000" }
    - { path: "{{ tn_data_root }}/opensearch", owner: "1000", group: "1000" }
    # path.repo: OpenSearch writes its snapshots here (the backup's telemetry).
    - { path: "{{ tn_data_root }}/opensearch-snapshots", owner: "1000", group: "1000", mode: "0750" }
    - { path: "{{ tn_data_root }}/logs" }
    - { path: "{{ tn_data_root }}/reports" }
    - { path: "{{ tn_data_root }}/artifacts" }
    - { path: "{{ tn_data_root }}/backups" }
