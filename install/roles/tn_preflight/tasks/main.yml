---
# Preflight. Read-only by construction: every task is a check, nothing is
# changed. Runs clean under --check.
#
# House rule from the deployment repo, and it applies here: stop and report,
# do not improvise around a failed preflight. Each assert names the fix.

- name: Preflight — collect facts
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - "min"
      - "hardware"
      - "network"

- name: Preflight — OS is Ubuntu 24.04 or newer
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version('24.04', '>=')
    fail_msg: >-
      Expected Ubuntu 24.04+, found {{ ansible_distribution }}
      {{ ansible_distribution_version }}. The platform host is TN-MGMT01.
    success_msg: "OS {{ ansible_distribution }} {{ ansible_distribution_version }}"

# ── Configuration: what must be set before anything else is worth checking ──
# vault.yml.example ships CHANGE_ME placeholders. A placeholder that reaches the target
# becomes a real (and published) password: LDAP bind, vCenter, Keycloak.
- name: Preflight — enclave identity and classification are explicit
  ansible.builtin.assert:
    that:
      - tn_enclave_id is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
      - tn_classification_level in ['unclassified', 'secret', 'top_secret']
    fail_msg: >-
      Set tn_enclave_id to a 1-63 character lowercase enclave identifier and
      tn_classification_level to unclassified, secret or top_secret. These values bind
      result-transfer routes and must describe this independent deployment.
    success_msg: "enclave profile: {{ tn_enclave_id }} / {{ tn_classification_level }}"

# PLATFORM_TENANT_ID must be a tenant UUID or production refuses to start (app/settings.py);
# SITE_TIMEZONE an IANA name (an unknown one is read as UTC, with a warning).
- name: Preflight — platform tenant and site time zone are well formed
  ansible.builtin.assert:
    that:
      - (tn_platform_tenant_id | default('') | string | trim | length == 0)
        or (tn_platform_tenant_id | string | trim | lower
            is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'))
      - (tn_site_timezone | default('') | string | trim | length == 0)
        or (tn_site_timezone | string | trim is match('^[A-Za-z][A-Za-z0-9_+/-]*$'))
    fail_msg: >-
      tn_platform_tenant_id must be empty (the bootstrap tenant) or a tenant UUID, and
      tn_site_timezone empty (the host's zone) or an IANA name such as America/Toronto.
    quiet: true

- name: Preflight — no vault value is still a CHANGE_ME placeholder
  vars:
    _skip: >-
      {{ ([] if tn_ldap_enabled | bool else ['vault_ldap_bind_password'])
         + ([] if tn_uses_vcenter | bool else ['vault_vsphere_password'])
         + ([] if tn_alert_email_enabled | default(false) | bool
            else ['vault_alert_smtp_username', 'vault_alert_smtp_password']) }}
    _placeholders: >-
      {%- set out = [] -%}
      {%- for n in query('ansible.builtin.varnames', '^vault_') | reject('in', _skip) -%}
        {%- if lookup('ansible.builtin.vars', n) | string is search('CHANGE_ME') -%}
          {%- set _ = out.append(n) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  ansible.builtin.assert:
    that: _placeholders | length == 0
    fail_msg: >-
      Still placeholders in inventory/group_vars/all/vault.yml: {{ _placeholders | join(', ') }}.
      Set real values (ansible-vault edit inventory/group_vars/all/vault.yml), or empty the
      ones marked "generated on target if empty".
    success_msg: "vault: no CHANGE_ME placeholders"

# The range machines' generic password (ADR 0012) goes into .env.production single-quoted,
# and Windows refuses a Sysprep password without complexity. Never prints the value.
- name: Preflight — the Windows template password is usable (Sysprep sets it)
  vars:
    _pw: "{{ tn_template_windows_admin_password | default('') | string }}"
  ansible.builtin.assert:
    that: >-
      _pw | length == 0 or (
        _pw | length >= 8 and _pw | length <= 128
        and _pw is search('[A-Z]') and _pw is search('[a-z]') and _pw is search('[0-9]')
        and _pw is search('[^A-Za-z0-9]'))
    fail_msg: >-
      vault_template_windows_admin_password must be empty, or 8-128 characters with an
      upper-case letter, a lower-case letter, a digit and a symbol (Sysprep sets it).
    success_msg: "Windows template password: {{ 'set' if _pw | length else 'not set' }}"

- name: Preflight — vault_range_default_password is ignored
  ansible.builtin.debug:
    msg: >-
      IGNORED: vault_range_default_password. Since ADR 0013 no range machine gets a site-wide
      password: every account is generated per range. Remove it from the vault.
  when: tn_range_default_password | default('') | string | length > 0

# The templates' build login goes into .env.production single-quoted. Never prints a value.
- name: Preflight — the template build login is usable
  vars:
    _vals: >-
      {{ [tn_template_windows_admin_password | default('') | string,
          tn_template_linux_user | default('') | string,
          tn_template_linux_password | default('') | string] }}
  ansible.builtin.assert:
    that: _vals | select('search', "['\\n\\r]") | list | length == 0
    fail_msg: >-
      vault_template_windows_admin_password, tn_template_linux_user and
      vault_template_linux_password must not contain a single quote or a newline.
    success_msg: "template build login: no quotes or newlines"

# ADR 0013 §3: every built range VM is proven not to accept its golden template's password.
# Under enforce (the default) the worker refuses to start without those passwords, so say it
# here, before deploying. Never prints a value.
- name: Preflight — the template-login check can run (RANGE_TEMPLATE_LOGIN_CHECK=enforce)
  ansible.builtin.assert:
    that: >-
      (tn_range_template_login_check | default('enforce')) == 'warn' or not (tn_uses_vcenter | bool) or (
        (tn_template_windows_admin_password | default('') | string | length) > 0
        and (tn_template_linux_password | default('') | string | length) > 0)
    fail_msg: >-
      tn_range_template_login_check is enforce (the default) but vault_template_windows_admin_password
      or vault_template_linux_password is empty: the worker could never prove a range VM no longer
      accepts the golden template's password, and refuses to start. Set both (the Packer build
      values), or set tn_range_template_login_check: warn to build without that proof.
    success_msg: "template-login check: {{ tn_range_template_login_check | default('enforce') }}"

# SharePoint SE's product key goes into .env.production single-quoted; the worker refuses a
# malformed one at deploy anyway. Never prints the key.
- name: Preflight — the SharePoint product key is empty or well-formed
  vars:
    _key: "{{ tn_sharepoint_product_key | default('') | string | trim | upper }}"
  ansible.builtin.assert:
    that: _key | length == 0 or _key is match('^[A-Z0-9]{5}(-[A-Z0-9]{5}){4}$')
    fail_msg: >-
      vault_sharepoint_product_key must be empty or a 25-character product key
      (XXXXX-XXXXX-XXXXX-XXXXX-XXXXX).
    success_msg: "SharePoint product key: {{ 'set' if _key | length else 'not set (SharePoint SE stays staged)' }}"

# Alert email (tn_alert_email_enabled): everything Alertmanager needs to send, or the
# install stops here rather than render a receiver that cannot deliver. Names what is
# missing; never prints a credential.
- name: Preflight — alert email is complete
  vars:
    _user: "{{ tn_alert_smtp_username | default('') | string | trim }}"
    _pass: "{{ tn_alert_smtp_password | default('') | string | trim }}"
    _missing: >-
      {{ ([] if tn_alert_email_to | default('') | string | trim | length > 0 else ['tn_alert_email_to'])
         + ([] if tn_alert_email_from | default('') | string | trim | length > 0 else ['tn_alert_email_from'])
         + ([] if tn_alert_smtp_host | default('') | string | trim | length > 0 else ['tn_alert_smtp_host'])
         + ([] if (tn_alert_smtp_port | default(0) | int) > 0 else ['tn_alert_smtp_port']) }}
  ansible.builtin.assert:
    that:
      - _missing | length == 0
      - _user is not search('CHANGE_ME') and _pass is not search('CHANGE_ME')
      - (_user | length > 0) == (_pass | length > 0)
    fail_msg: >-
      tn_alert_email_enabled is true, but alert email cannot be sent.
      {% if _missing | length > 0 %}Not set in the inventory: {{ _missing | join(', ') }}.{% endif %}
      {% if _user is search('CHANGE_ME') or _pass is search('CHANGE_ME') %}vault_alert_smtp_username /
      vault_alert_smtp_password still read CHANGE_ME (ansible-vault edit inventory/group_vars/all/vault.yml;
      remove both to use the app's tn_smtp_username / vault_smtp_password).{% endif %}
      {% if (_user | length > 0) != (_pass | length > 0) %}Set both vault_alert_smtp_username and
      vault_alert_smtp_password (without them: tn_smtp_username and vault_smtp_password),
      or empty both for a relay without authentication.{% endif %}
      Or set tn_alert_email_enabled: false (alerts are then NOT delivered; install/README.md "Alerting").
    quiet: true
  when: tn_alert_email_enabled | default(false) | bool

# App email (tn_smtp_*; install/README.md "Email (SMTP)"). Optional: an empty tn_smtp_host
# passes (nothing is sent; admins see a banner). With a host, what the app needs to send
# must be sound, so a typo fails here and not silently at the first roll call. Never prints
# the password.
- name: Preflight — app email (SMTP) settings are usable
  vars:
    _host: "{{ tn_smtp_host | default('') | string | trim }}"
    _port: "{{ tn_smtp_port | default('') | string | trim }}"
    _security: "{{ tn_smtp_security | default('starttls') | string | trim }}"
    _from: "{{ tn_smtp_from_address | default('') | string | trim }}"
    _user: "{{ tn_smtp_username | default('') | string | trim }}"
    _pass: "{{ vault_smtp_password | default('') | string }}"
    _problems: >-
      {{ ([] if _host is match('^[A-Za-z0-9._\\[\\]:-]+$') else ['tn_smtp_host must be a host name or address (no spaces, no scheme)'])
         + ([] if _port is match('^[0-9]{1,5}$') and (_port | int) >= 1 and (_port | int) <= 65535
            else ['tn_smtp_port must be a number from 1 to 65535'])
         + ([] if _security in ['starttls', 'tls', 'none'] else ['tn_smtp_security must be starttls, tls or none'])
         + ([] if _from is match('^[^@\\s<>"\'(),;:]+@[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$')
            else ['tn_smtp_from_address must be a plain address such as truenorth@corp.example'])
         + ([] if (_user | length > 0) == (_pass | length > 0)
            else ['set both tn_smtp_username and vault_smtp_password, or neither for a relay without sign-in'])
         + ([] if not (_security == 'none' and _user | length > 0)
            else ['tn_smtp_security none would send the password in clear: use starttls or tls with a sign-in'])
         + ([] if _pass is not search("['\n\r]") else ['vault_smtp_password may not contain a single quote or a line break'])
         + ([] if _pass is not search('CHANGE_ME') else ['vault_smtp_password still reads CHANGE_ME']) }}
  ansible.builtin.assert:
    that: _problems | length == 0
    fail_msg: >-
      tn_smtp_host is set, but the app could not send email: {{ _problems | join('; ') }}.
      Fix it in the inventory (password: ansible-vault edit inventory/group_vars/all/vault.yml),
      or empty tn_smtp_host to install without email (install/README.md "Email (SMTP)").
    success_msg: "app email: {{ _host }}:{{ _port }} ({{ _security }}) from {{ _from }}"
    quiet: true
  when: tn_smtp_host | default('') | string | trim | length > 0

- name: Preflight — app email is off (nothing will be emailed)
  ansible.builtin.debug:
    msg: >-
      tn_smtp_host is empty: roll-call onboarding emails, reminders, seat-forfeit notices
      and calendar invites are NOT sent (only logged), and admins see a banner saying so.
      Set tn_smtp_* to turn email on (install/README.md "Email (SMTP)").
  when: tn_smtp_host | default('') | string | trim | length == 0

# Supported: vsphere_api (ADR 0009) and mock. proxmox_api and hyperv are experimental and
# the API and workers refuse them unless EXPERIMENTAL_PROVISIONERS is true; the Terraform
# backends were removed. Refuse here, before an install that builds no range.
- name: Preflight — the provisioner backend is supported (or experimental and allowed)
  vars:
    _supported: ['mock', 'vsphere_api']
    _experimental: ['proxmox_api', 'hyperv']
  ansible.builtin.assert:
    that: >-
      tn_provisioner_backend in _supported
      or (tn_provisioner_backend in _experimental and tn_experimental_provisioners | default(false) | bool)
    fail_msg: >-
      tn_provisioner_backend is {{ tn_provisioner_backend }}.
      {% if tn_provisioner_backend in _experimental %}It is experimental and switched off: set
      tn_experimental_provisioners: true in the inventory to install it anyway (not supported).
      {% else %}Not a provisioner backend. Valid: {{ (_supported + _experimental) | join(', ') }}
      (vsphere_api for vSphere, not "vsphere"; the Terraform backends were removed).{% endif %}
    quiet: true

# AI is on unless the inventory says tn_ai_enabled: false; then nothing AI is checked here,
# 30-config renders no endpoint or key, and the platform says "AI is not configured".
- name: Preflight — the AI endpoint is configured
  ansible.builtin.assert:
    that: tn_ai_base_url | default('') | length > 0
    fail_msg: >-
      tn_ai_base_url is empty. There is no default (the old one was one lab's internal
      LiteLLM address). Set it in the inventory or with
      -e tn_ai_base_url=http://<litellm-host>:4000/v1, and its key in vault_openai_api_key.
      Or, for a site with no AI server yet, set tn_ai_enabled: false (install/README.md
      "AI (optional)").
    quiet: true
  when: tn_ai_enabled | default(true) | bool

- name: Preflight — AI disabled
  ansible.builtin.debug:
    msg: >-
      AI disabled (tn_ai_enabled=false): AI features will show 'not configured'. No AI endpoint
      is checked; OPENAI_BASE_URL and OPENAI_API_KEY are rendered empty, so the orchestrator
      reports ai_configured=false and AI generation answers 503. To turn it on later:
      install/README.md "AI (optional)".
  when: not (tn_ai_enabled | default(true) | bool)

# ARC² does not use the AI orchestrator: with AI off it may stay on only with a model of its
# own. Names what is set, never a value.
- name: Preflight — ARC² has its own model when AI is disabled
  vars:
    _token: "{{ vault_arc2_claude_oauth_token | default('') | string | trim }}"
    _key: "{{ vault_arc2_anthropic_api_key | default('') | string | trim }}"
    _credential: >-
      {{ (_token | length > 0 and _token is not search('CHANGE_ME'))
         or (_key | length > 0 and _key is not search('CHANGE_ME')) }}
    _endpoint: >-
      {{ (tn_arc2_anthropic_base_url | default('') | string | trim | length > 0)
         or (tn_arc2_local_url | default('') | string | trim | length > 0) }}
  ansible.builtin.assert:
    that: _endpoint | bool or _credential | bool
    fail_msg: >-
      tn_ai_enabled is false and tn_arc2_enabled is true, but ARC² has no model of its own:
      tn_arc2_anthropic_base_url {{ 'set' if tn_arc2_anthropic_base_url | default('') | length > 0 else 'NOT set' }},
      tn_arc2_local_url {{ 'set' if tn_arc2_local_url | default('') | length > 0 else 'NOT set' }},
      vault_arc2_claude_oauth_token {{ 'set' if (vault_arc2_claude_oauth_token | default('') | string | trim | length > 0)
      and (vault_arc2_claude_oauth_token | default('') is not search('CHANGE_ME')) else 'NOT set (or CHANGE_ME)' }},
      vault_arc2_anthropic_api_key {{ 'set' if (vault_arc2_anthropic_api_key | default('') | string | trim | length > 0)
      and (vault_arc2_anthropic_api_key | default('') is not search('CHANGE_ME')) else 'NOT set (or CHANGE_ME)' }}.
      Set one of them ("ARC² Course Studio (optional)"), or set tn_arc2_enabled: false.
    success_msg: "ARC² with AI disabled: it uses its own model endpoint or credential"
  when:
    - not (tn_ai_enabled | default(true) | bool)
    - tn_arc2_enabled | default(false) | bool

# cmi5 (docs/cmi5.md): launches need CMI5_LRS_AUTH, the AU's own LRS credential, or they
# answer 503. 50-stack-up mints it on the LRS with the LRS admin account unless the vault
# supplies one; a supplied one must be base64 "key:secret" and not the server's own LRS
# credential (the LRS would then stamp an AU's statements as TrueNorth's). 50-stack-up
# checks it against the LRS; 99-validate fails an install that ends without it.
- name: Preflight — cmi5 can get its AU credential
  vars:
    _given: "{{ vault_cmi5_lrs_auth | default('') | trim }}"
    _server: >-
      {{ ((vault_lrs_api_key | default('')) ~ ':' ~ (vault_lrs_api_secret | default(''))) | b64encode }}
  ansible.builtin.assert:
    that: >-
      _given | length == 0
      or (_given is match('^[A-Za-z0-9+/]+={0,2}$') and (_given | length) % 4 == 0
          and ':' in (_given | b64decode)
          and not (_given | b64decode).startswith(':') and not (_given | b64decode).endswith(':')
          and _given != _server)
    fail_msg: >-
      vault_cmi5_lrs_auth is set but is not a usable cmi5 AU credential: it must be base64
      of "key:secret" for a credential of this platform's LRS, other than vault_lrs_api_key /
      vault_lrs_api_secret. Empty it to have 50-stack-up mint one (install/README.md
      "Key variables"), or set tn_cmi5_enabled: false to install without cmi5 (launches 503).
    success_msg: >-
      cmi5: on, {{ 'AU credential from the vault' if _given | length > 0
                   else 'AU credential minted on the LRS by 50-stack-up' }}
  when: tn_cmi5_enabled | default(true) | bool

# Backups escrow TN_SECRETS_KEY and every credential (scripts/backup/backup.sh). A backup
# without them restores data nobody can decrypt or log in to.
- name: Preflight — a backup escrow is configured
  ansible.builtin.assert:
    that: >-
      (tn_backup_escrow_pubkey | default('') | length > 0)
      or (tn_backup_escrow | default('') == 'out-of-band')
    fail_msg: |
      No backup escrow. Set ONE of, in the inventory:
        tn_backup_escrow_pubkey: /path/on/the/control/node/escrow.pub   (RSA public key, PEM)
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out escrow.key
            openssl pkey -in escrow.key -pubout -out escrow.pub   # keep escrow.key OFFLINE
        tn_backup_escrow: out-of-band   (you attest the secrets are escrowed elsewhere)
      docs/runbooks/backup-restore.md.
    quiet: true

- name: Preflight — the escrow public key is a readable RSA public key
  ansible.builtin.command:
    argv: [openssl, pkey, -pubin, -in, "{{ tn_backup_escrow_pubkey }}", -noout]
  delegate_to: localhost
  become: false
  changed_when: false
  when: tn_backup_escrow_pubkey | default('') | length > 0

- name: Preflight — AD/LDAPS integration
  ansible.builtin.debug:
    msg: >-
      {{ 'AD/LDAPS: ENABLED (' ~ tn_dc_host ~ '; resolver, LDAPS bind and Keycloak federation are checked)'
         if tn_ldap_enabled | bool else
         'AD/LDAPS: DISABLED (tn_ldap_enabled=false): no TN-DC01 checks, no LDAPS bind, no Keycloak federation;'
         ~ ' local TN-* groups and a local bootstrap administrator (' ~ tn_bootstrap_admin_upn ~ ') instead.' }}
      {{ ' Local recovery administrator kept: ' ~ tn_bootstrap_admin_upn ~ ' (tn_keycloak_local_admin).'
         if tn_ldap_enabled | bool and tn_keycloak_local_admin | bool else '' }}

# The CHANGE_ME check above passes an EMPTY bind password (tn_ldap_bind_password defaults
# to '' so sites without AD need none). With AD, an empty one would reach Keycloak as an
# anonymous bind; stop here instead.
- name: Preflight — AD has a bind password
  ansible.builtin.assert:
    that: tn_ldap_bind_password | default('') | string | length > 0
    fail_msg: >-
      tn_ldap_enabled is true but the LDAP bind password is empty. Set vault_ldap_bind_password
      (ansible-vault edit inventory/group_vars/all/vault.yml) to the password of
      {{ tn_ldap_bind_dn }}.
    success_msg: "LDAP bind password set (not shown)"
  when: tn_ldap_enabled | bool

# With AD and a local recovery administrator, the local account must not be able to name
# (or be confused with) a directory account: a UPN in the AD domain would be one an AD
# user could hold, and a bare name could equal an sAMAccountName.
- name: Preflight — the local recovery administrator is outside the AD domain
  ansible.builtin.assert:
    that:
      - tn_bootstrap_admin_upn | default('') is search('@')
      - not (tn_bootstrap_admin_upn | lower).endswith('@' ~ (tn_domain | lower))
      - not (tn_bootstrap_admin_upn | lower).endswith('.' ~ (tn_domain | lower))
    fail_msg: >-
      tn_keycloak_local_admin is on with AD, so {{ tn_bootstrap_admin_upn | default('(empty)') }}
      becomes a LOCAL Keycloak account. Give it a UPN outside {{ tn_domain }} (for example
      tnadmin@{{ inventory_hostname }}.local), or set tn_keycloak_local_admin false.
    quiet: true
  when: tn_ldap_enabled | bool and tn_keycloak_local_admin | bool

# ── Container runtime ─────────────────────────────────────────────────
# roles/tn_docker (playbooks/00-docker.yml) installs it on Ubuntu 24.04 unless
# tn_install_docker=false; these checks apply either way. The registers are named
# tn_preflight_* because tn_docker_version / tn_compose_version are the pinned versions
# in group_vars, and a register would shadow them for the rest of the run.
- name: Preflight — docker present
  ansible.builtin.command: docker version --format '{{ "{{" }}.Server.Version{{ "}}" }}'
  register: tn_preflight_docker
  changed_when: false
  failed_when: tn_preflight_docker.rc != 0

- name: Preflight — docker compose v2 present
  ansible.builtin.command: docker compose version --short
  register: tn_preflight_compose
  changed_when: false
  failed_when: tn_preflight_compose.rc != 0

# Version strings are extracted with a regex rather than compared raw: the
# deployment repo records "Docker 29.7.2" and "Compose v5.5.0", which match no
# released version, and a raw comparison would blow up rather than report.
- name: Preflight — docker/compose meet the version floor
  vars:
    _docker: "{{ tn_preflight_docker.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
    _compose: "{{ tn_preflight_compose.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
  ansible.builtin.assert:
    that:
      - _docker is not none
      - _compose is not none
      - _docker is version(tn_min_docker_version, '>=')
      - _compose is version(tn_min_compose_version, '>=')
    fail_msg: >-
      Docker {{ _docker | default('?') }} / Compose {{ _compose | default('?') }}
      is below the floor ({{ tn_min_docker_version }} / {{ tn_min_compose_version }}).
      On Ubuntu 24.04 run playbooks/00-docker.yml (tn_install_docker=true, the
      default there; bump tn_docker_version / tn_compose_version); otherwise upgrade
      Docker by hand (install/README.md "Prerequisites").
    success_msg: "Docker {{ _docker }}, Compose {{ _compose }}"

- name: Preflight — current user can reach the docker socket
  ansible.builtin.command: docker info --format '{{ "{{" }}.ServerVersion{{ "}}" }}'
  register: tn_docker_info
  changed_when: false
  failed_when: tn_docker_info.rc != 0

# ── Disk ──────────────────────────────────────────────────────────────
- name: Preflight — locate the mount backing {{ tn_data_root }}
  vars:
    _candidates: >-
      {{ ansible_mounts
         | selectattr('mount', 'in', [tn_data_root, '/srv', '/'])
         | sort(attribute='mount') | list }}
  ansible.builtin.set_fact:
    tn_data_mount: "{{ (_candidates | last) if _candidates else none }}"

- name: Preflight — enough free space for the platform
  ansible.builtin.assert:
    that:
      - tn_data_mount is not none
      - (tn_data_mount.size_available / 1073741824) >= (tn_min_free_gb | int)
    fail_msg: >-
      {{ tn_data_root }} has
      {{ ((tn_data_mount.size_available | default(0)) / 1073741824) | round(1) }} GB free;
      {{ tn_min_free_gb }} GB is required for Postgres, OpenSearch, MinIO and artifacts.
    success_msg: >-
      {{ ((tn_data_mount.size_available) / 1073741824) | round(1) }} GB free on
      {{ tn_data_mount.mount }}

# ── Kernel tuning OpenSearch depends on ───────────────────────────────
# compose.prod.yml runs OpenSearch with bootstrap.memory_lock=true. On a stock
# Ubuntu box vm.max_map_count is 65530 and the container dies on startup with a
# message that does not obviously point here.
- name: Preflight — read vm.max_map_count
  ansible.builtin.command: sysctl -n vm.max_map_count
  register: tn_max_map_count
  changed_when: false

- name: Preflight — report vm.max_map_count (tn_base raises it)
  ansible.builtin.debug:
    msg: >-
      vm.max_map_count is {{ tn_max_map_count.stdout }}.
      {{ 'OK.' if (tn_max_map_count.stdout | int) >= 262144
         else 'Below 262144 — tn_base will raise it, or OpenSearch will not start.' }}

# ── Time ──────────────────────────────────────────────────────────────
- name: Preflight — NTP synchronised
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: tn_ntp
  changed_when: false
  failed_when: false

- name: Preflight — assert clock discipline
  ansible.builtin.assert:
    that: tn_ntp.stdout | trim == "yes"
    fail_msg: >-
      Clock is not NTP-synchronised. OIDC token validation and Kerberos both
      fail on skew, in ways that look like credential errors rather than time errors.
    success_msg: "Clock synchronised"

# ── Name resolution, forward AND reverse ──────────────────────────────
# AD's DNS must know the names. Whether this host already asks it is reported, not
# required: roles/tn_base points the resolver at tn_dns_servers.
- name: Preflight — AD DNS answers for the platform host and the DC
  ansible.builtin.command: "dig +short +time=3 @{{ tn_dns_servers | first }} {{ item }}"
  register: tn_fwd
  changed_when: false
  failed_when: tn_fwd.rc != 0 or (tn_fwd.stdout | trim | length) == 0
  loop:
    - "{{ tn_domain_fqdn }}"
    - "{{ tn_dc_host }}"
  loop_control:
    label: "{{ item }}"
  when: tn_ldap_enabled | bool

- name: Preflight — does this host already resolve the DC?
  ansible.builtin.command: "getent hosts {{ tn_dc_host }}"
  register: tn_local_dns
  changed_when: false
  failed_when: false
  when: tn_ldap_enabled | bool

- name: Preflight — report the host resolver
  ansible.builtin.debug:
    msg: >-
      {{ 'Host resolver already uses AD DNS.' if tn_local_dns.rc == 0 else
         'Host resolver cannot resolve ' ~ tn_dc_host ~ ' yet; 10-base points it at ' ~
         (tn_dns_servers | join(', ')) ~ '.' }}
  when: tn_ldap_enabled | bool

- name: Preflight — reverse DNS for the platform host
  ansible.builtin.command: "dig +short +time=3 @{{ tn_dns_servers | first }} -x {{ ansible_host }}"
  register: tn_rev
  changed_when: false
  failed_when: false
  when: tn_ldap_enabled | bool

- name: Preflight — report reverse DNS
  ansible.builtin.debug:
    msg: >-
      Reverse lookup of {{ ansible_host }}:
      {{ tn_rev.stdout | default('(none)') | trim }}
      {{ '' if (tn_rev.stdout | trim) else '— missing. The 30.30.10.in-addr.arpa zone on TN-DC01 should cover this.' }}
  when: tn_ldap_enabled | bool

# Without AD DNS the service name must still resolve on this host: the seed and smoke
# checks call https://<tn_domain_fqdn>/ from here.
- name: Preflight — does this host resolve the service name?
  ansible.builtin.command: "getent hosts {{ tn_domain_fqdn }}"
  register: tn_fqdn_resolves
  changed_when: false
  failed_when: false
  when: not tn_ldap_enabled | bool

- name: Preflight — assert the service name resolves (or will be pinned)
  ansible.builtin.assert:
    that: tn_fqdn_resolves.rc == 0 or tn_manage_etc_hosts | bool
    fail_msg: >-
      {{ tn_domain_fqdn }} does not resolve on {{ inventory_hostname }}. Add it to DNS, or
      set tn_manage_etc_hosts: true to pin it to 127.0.0.1 in /etc/hosts (10-base).
    quiet: true
  when: not tn_ldap_enabled | bool

# ── Reachability of everything we depend on ───────────────────────────
- name: Preflight — vCenter API reachable
  ansible.builtin.wait_for:
    host: "{{ tn_vcenter_host }}"
    port: "{{ tn_vcenter_port }}"
    timeout: 10
  when: tn_uses_vcenter | bool

- name: Preflight — LDAPS port open on the domain controller
  ansible.builtin.wait_for:
    host: "{{ tn_dc_ip }}" # by address: the host may not resolve the DC until 10-base
    port: "{{ tn_ldap_port }}"
    timeout: 10
  when: tn_ldap_enabled | bool

# The real LDAPS bind (TLS handshake against the AD CS CA, plus the bind account) runs
# in 40-tls, once ldap-utils (10-base) and that CA are on the host. Here only the port.

- name: Preflight — the app repository is reachable (git mode)
  ansible.builtin.uri:
    url: "{{ tn_app_git_repo | regex_replace('\\.git$', '') }}"
    method: HEAD
    status_code: [200, 301, 302]
    timeout: 10
  register: tn_git_probe
  failed_when: false
  when: tn_app_source_mode == 'git'

- name: Preflight — assert the repository is reachable
  ansible.builtin.assert:
    that: tn_git_probe.status | default(0) in [200, 301, 302]
    fail_msg: >-
      {{ tn_app_git_repo }} is not reachable from {{ inventory_hostname }}
      ({{ tn_git_probe.msg | default('no answer') }}). TN-MGMT01 may have no route
      out; deploy a checkout from this machine instead:
      -e tn_app_source_mode=local -e tn_app_local_path=/path/to/TrueNorth
  when: tn_app_source_mode == 'git'

- name: Preflight — AI inference endpoint reachable
  ansible.builtin.uri:
    url: "{{ tn_ai_base_url }}/models"
    method: GET
    status_code: [200, 401, 403]
    timeout: 10
    validate_certs: false
  register: tn_ai_probe
  failed_when: false
  when: tn_ai_enabled | default(true) | bool

- name: Preflight — report AI endpoint
  ansible.builtin.debug:
    msg: >-
      AI endpoint {{ tn_ai_base_url }}:
      {{ 'reachable (HTTP ' ~ tn_ai_probe.status ~ ')' if (tn_ai_probe.status | default(-1) | int) > 0
         else 'UNREACHABLE — the AI orchestrator will start but every generation will fail.' }}
  when: tn_ai_enabled | default(true) | bool

# ── ARC² Course Studio (only with tn_arc2_enabled) ────────────────────
# What 55-arc2 needs before it installs anything. That playbook then probes bubblewrap as
# the runner's own account (it needs root to switch to it; preflight changes nothing) and
# the service's self-test checks the sandbox again under the unit's hardening.
- name: Preflight — ARC² Course Studio
  when: tn_arc2_enabled | default(false) | bool
  block:
    # Which model runs jobs (tn_arc2_mode), and what each mode needs. The messages name the
    # variables and whether each is set, never their values.
    - name: Preflight — ARC² model mode is known
      ansible.builtin.assert:
        that: >-
          tn_arc2_mode | default('subscription') in ['subscription', 'local', 'subscription_with_local_fallback',
          'local_with_subscription_fallback']
        fail_msg: >-
          tn_arc2_mode={{ tn_arc2_mode | default('subscription') }}: use subscription (Claude), local (only the
          gateway at tn_arc2_local_url), subscription_with_local_fallback (Claude, then the gateway) or
          local_with_subscription_fallback (the gateway, then Claude).
        quiet: true

    # Every mode but subscription: an Anthropic-compatible gateway, https on
    # any port (the jobs' egress proxy then allows exactly that host:port), the model it
    # serves, and its token. Never plain http: the token travels in every request.
    - name: Preflight — ARC² local gateway is complete
      when: tn_arc2_mode | default('subscription') != 'subscription'
      ansible.builtin.assert:
        that:
          - tn_arc2_local_url | default('') is match('^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/.*)?$')
          - tn_arc2_local_model | default('') | string | trim | length > 0
          - vault_arc2_local_token | default('') | string | trim | length > 0
          - vault_arc2_local_token | default('') is not search('CHANGE_ME')
        fail_msg: >-
          tn_arc2_mode is {{ tn_arc2_mode | default('subscription') }}, so ARC² needs the local gateway: tn_arc2_local_url
          {{ 'set' if tn_arc2_local_url | default('') | length > 0 else 'NOT set' }} (https://host[:port][/path], never http),
          tn_arc2_local_model {{ 'set' if tn_arc2_local_model | default('') | string | trim | length > 0 else 'NOT set' }},
          vault_arc2_local_token {{ 'set' if (vault_arc2_local_token | default('') | string | trim | length > 0)
          and (vault_arc2_local_token | default('') is not search('CHANGE_ME')) else 'NOT set (or still CHANGE_ME)' }}.
          Or set tn_arc2_mode: subscription.
        quiet: true

    # subscription (and both fallback modes): exactly one credential, so it is never
    # ambiguous which account is billed. In local mode neither is needed, and neither is
    # written to the runner's environment file even if the vault still holds one.
    - name: Preflight — ARC² has exactly one model credential
      when: tn_arc2_mode | default('subscription') != 'local'
      ansible.builtin.assert:
        that:
          - >-
            (vault_arc2_claude_oauth_token | default('') | string | trim | length > 0)
            != (vault_arc2_anthropic_api_key | default('') | string | trim | length > 0)
          - vault_arc2_claude_oauth_token | default('') is not search('CHANGE_ME')
          - vault_arc2_anthropic_api_key | default('') is not search('CHANGE_ME')
        fail_msg: >-
          tn_arc2_enabled is true, so ARC² needs exactly one model credential, and
          {{ 'both vault_arc2_claude_oauth_token and vault_arc2_anthropic_api_key are set'
          if (vault_arc2_claude_oauth_token | default('') | string | trim | length > 0)
          and (vault_arc2_anthropic_api_key | default('') | string | trim | length > 0)
          else 'neither vault_arc2_claude_oauth_token nor vault_arc2_anthropic_api_key is set (or one is still CHANGE_ME)' }}.
          Either a Claude subscription: run `claude setup-token` on a machine signed in to it
          and put the token in vault_arc2_claude_oauth_token; or a pay-per-use Anthropic API
          key issued for this host, in vault_arc2_anthropic_api_key. Leave the other empty
          (ansible-vault edit inventory/group_vars/all/vault.yml), set tn_arc2_mode: local to
          use only a local gateway, or set tn_arc2_enabled: false.
        quiet: true

    # Claude Code reads CLAUDE_CODE_OAUTH_TOKEN as a subscription token and
    # ANTHROPIC_API_KEY as an API key: one in the other's variable fails every job.
    - name: Preflight — ARC² credential is in the right variable
      ansible.builtin.assert:
        that:
          - vault_arc2_claude_oauth_token | default('') | string | trim is not match('sk-ant-api')
          - vault_arc2_anthropic_api_key | default('') | string | trim is not match('sk-ant-oat')
        fail_msg: >-
          An Anthropic API key (sk-ant-api...) is in vault_arc2_claude_oauth_token, or a
          subscription token (sk-ant-oat..., from `claude setup-token`) is in
          vault_arc2_anthropic_api_key. Move it to the other variable.
        quiet: true

    - name: Preflight — ARC² model endpoint is https on port 443
      ansible.builtin.assert:
        that: >-
          tn_arc2_anthropic_base_url | default('') | length == 0
          or tn_arc2_anthropic_base_url is match('^https://[A-Za-z0-9.-]+(:443)?(/.*)?$')
        fail_msg: >-
          tn_arc2_anthropic_base_url={{ tn_arc2_anthropic_base_url }}: the jobs' egress proxy
          tunnels https to one host on port 443 only. Use https://host[/path], or leave it empty
          for api.anthropic.com.
        quiet: true

    - name: Preflight — ARC² runs gid
      ansible.builtin.command: "getent group {{ tn_arc2_runs_gid }}"
      register: tn_arc2_gid_owner
      changed_when: false
      failed_when: tn_arc2_gid_owner.rc not in [0, 2]

    - name: Preflight — ARC² runs gid is free, or already the runs group
      ansible.builtin.assert:
        that: tn_arc2_gid_owner.rc == 2 or tn_arc2_gid_owner.stdout.split(':')[0] == 'tn-arc2-runs'
        fail_msg: >-
          gid {{ tn_arc2_runs_gid }} belongs to {{ tn_arc2_gid_owner.stdout.split(':')[0] }} on this
          host; the api container would join that group. Set tn_arc2_runs_gid to a free gid.
        quiet: true

    - name: Preflight — ARC² kernel user namespaces
      ansible.builtin.command: cat /proc/sys/user/max_user_namespaces
      register: tn_arc2_userns
      changed_when: false

    - name: Preflight — ARC² user namespaces are enabled (bubblewrap needs them)
      ansible.builtin.assert:
        that: tn_arc2_userns.stdout | int > 0
        fail_msg: >-
          user.max_user_namespaces is {{ tn_arc2_userns.stdout }}: no job sandbox can be built and
          the runner would refuse to start. Raise it (sysctl user.max_user_namespaces) or set
          tn_arc2_enabled: false.
        quiet: true

    - name: Preflight — ARC² AppArmor user-namespace restriction
      ansible.builtin.command: cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      register: tn_arc2_aa_userns
      changed_when: false
      failed_when: false

    - name: Preflight — report the restriction (kept on; 55-arc2 scopes an exception)
      ansible.builtin.debug:
        msg: >-
          kernel.apparmor_restrict_unprivileged_userns={{ tn_arc2_aa_userns.stdout | default('n/a') | trim }}.
          It stays as it is: 55-arc2 installs an AppArmor profile that lets only the runner's own
          copy of bwrap create user namespaces.

    - name: Preflight — ARC² free space
      vars:
        _root: >-
          {{ ansible_mounts | selectattr('mount', 'in', ['/', '/opt']) | sort(attribute='mount') | list | last }}
      ansible.builtin.assert:
        that:
          - (tn_data_mount.size_available / 1073741824) >= (tn_arc2_min_free_gb | int)
          - (_root.size_available / 1073741824) >= (tn_arc2_min_free_system_gb | int)
        fail_msg: >-
          ARC² needs {{ tn_arc2_min_free_gb }} GB free for runs on {{ tn_data_mount.mount }}
          ({{ (tn_data_mount.size_available / 1073741824) | round(1) }} GB) and
          {{ tn_arc2_min_free_system_gb }} GB on {{ _root.mount }} for /opt/truenorth-arc2
          ({{ (_root.size_available / 1073741824) | round(1) }} GB).
        quiet: true

    # The runner's proxy connects straight to the endpoint: there is no upstream proxy.
    - name: Preflight — ARC² model endpoint reachable
      vars:
        _host: >-
          {{ (tn_arc2_anthropic_base_url | ansible.builtin.urlsplit('hostname'))
             if tn_arc2_anthropic_base_url | default('') | length > 0 else 'api.anthropic.com' }}
      ansible.builtin.uri:
        url: "https://{{ _host | trim }}/"
        method: GET
        status_code: [200, 301, 302, 400, 401, 403, 404, 405]
        timeout: 10
      register: tn_arc2_endpoint
      failed_when: false

    - name: Preflight — assert the model endpoint is reachable
      ansible.builtin.assert:
        that: tn_arc2_endpoint.status | default(-1) | int > 0
        fail_msg: >-
          {{ tn_arc2_endpoint.msg | default('no answer') }}: the ARC² runner reaches the model
          endpoint directly over HTTPS (its jobs only through the runner). Allow HTTPS out to it
          from {{ inventory_hostname }}, or set tn_arc2_enabled: false.
        quiet: true

# ── Ports we are about to bind ────────────────────────────────────────
- name: Preflight — 80/443 are free
  ansible.builtin.wait_for:
    port: "{{ item }}"
    state: stopped
    timeout: 3
  loop: [80, 443]
  failed_when: false
  register: tn_ports

- name: Preflight — summary
  ansible.builtin.debug:
    msg:
      - "host            : {{ inventory_hostname }} ({{ ansible_host }})"
      - "os              : {{ ansible_distribution }} {{ ansible_distribution_version }}"
      - "docker          : {{ tn_preflight_docker.stdout }} / compose {{ tn_preflight_compose.stdout }}"
      - "free space      : {{ ((tn_data_mount.size_available) / 1073741824) | round(1) }} GB"
      - "vm.max_map_count: {{ tn_max_map_count.stdout }}"
      - "ntp             : {{ tn_ntp.stdout | trim }}"
      - "vcenter         : {{ (tn_vcenter_address ~ ' reachable') if tn_uses_vcenter | bool else 'none (mock: ranges simulated)' }}"
      - "ldaps port      : {{ 'open (the bind itself is checked in 40-tls)' if tn_ldap_enabled | bool else 'n/a (AD/LDAPS disabled)' }}"
      - "backup escrow   : {{ tn_backup_escrow_pubkey if tn_backup_escrow_pubkey | length > 0 else tn_backup_escrow }}"
      - "app source      : {{ tn_app_source_mode }} ({{ tn_app_git_repo if tn_app_source_mode == 'git' else (tn_app_local_path or tn_app_tarball) }})"
      - >-
        ai              : {{ ('enabled (' ~ tn_ai_base_url ~ ')') if tn_ai_enabled | default(true) | bool
        else 'disabled (tn_ai_enabled=false: AI features show not configured)' }}
      - "arc2 studio     : {{ 'enabled (55-arc2 installs the runner)' if tn_arc2_enabled | default(false) | bool else 'off' }}"
