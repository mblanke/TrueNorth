---
# Smoke test and final report.
#
# The important one is the claim-contract check near the bottom. Everything else
# proves the stack is running; that one proves the AD federation, the token claim
# mappers and the registration flow are wired to each other. It is the only test
# here that would catch "everything is green and no trainee can ever register".

- name: Smoke — load the secret map
  ansible.builtin.include_role:
    name: tn_config
    tasks_from: secrets

# tn_kc_internal, tn_kc_realm_url, tn_kc_smoke_client: one definition, tn_keycloak's.
- name: Smoke — Keycloak endpoints and client names
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../tn_keycloak/defaults/main.yml"

# Who the claim-contract check signs in as: a NON-PRIVILEGED account, never an admin.
# Since v1.2.0 privileged users sign in with a second factor, which a password grant
# cannot supply. By default (no AD, or AD with tn_keycloak_local_admin):
# tn_smoke_local_user, which 60-keycloak created locally in TN-Observers with the
# persisted secret smoke_user_password (the AD claims are then checked by the CI `ad`
# lane's tests against the directory, not here). With an AD account named
# (-e tn_smoke_username=<upn> -e tn_smoke_password=...): that account, which must be
# non-privileged, e.g. a TN-Students or TN-Observers member with no authenticator enrolled;
# its token must then carry the directory claims.
- name: Smoke — the identity to sign in as
  ansible.builtin.set_fact:
    tn_smoke_user_effective: >-
      {{ tn_smoke_username | default('', true)
         or ('' if tn_ldap_enabled | bool and not tn_keycloak_local_admin | bool else tn_smoke_local_user) }}
    tn_smoke_password_effective: >-
      {{ tn_smoke_password | default('', true)
         or ('' if tn_ldap_enabled | bool and not tn_keycloak_local_admin | bool
             else tn_secrets['smoke_user_password']) }}
  no_log: true

# Mandatory: "the services are up" is not an installed platform. The claim contract is
# the only check that proves sign-in, the token claims and registration are joined.
- name: Smoke — the claim-contract check has credentials
  ansible.builtin.assert:
    that:
      - tn_smoke_user_effective | trim | length > 0
      - tn_smoke_password_effective | length > 0
    fail_msg: |
      No tn_smoke_username/tn_smoke_password. The claim-contract check is mandatory: re-run with
        ansible-playbook playbooks/95-smoke-test.yml -e tn_smoke_username=<AD upn> -e tn_smoke_password=<password>
      naming a NON-PRIVILEGED AD account (TN-Students or TN-Observers, no authenticator
      enrolled): administrators, instructors and range operators need a second factor,
      which the smoke test's password grant cannot give. --ask-vault-pass as usual; put the
      password in a vaulted file and pass -e @file rather than typing it on the command line.
    quiet: true

# -a: an exited container (crashed, or a one-shot that should not be there) is invisible
# to a plain `ps`, and the check below would pass with a service missing. A service with
# no healthcheck reports Health "" (not null), so "" is "n/a" too, as in tn_migrate.
- name: Smoke — container health
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }} ps -a --format json \
        | jq -rs 'flatten | map({name: .Service, state: .State, health: (if (.Health // "") == "" then "n/a" else .Health end), exit: (.ExitCode // 0)})'
    chdir: "{{ tn_app_dir }}/infra/platform/docker"
  register: tn_ps
  changed_when: false

- name: Smoke — report container states
  ansible.builtin.debug:
    var: tn_ps.stdout | from_json

- name: Smoke — no container is unhealthy or exited
  vars:
    _svcs: "{{ tn_ps.stdout | from_json }}"
    _bad: >-
      {{ _svcs | rejectattr('health', 'in', ['healthy', 'n/a'])
               | list
         + (_svcs | rejectattr('state', 'in', ['running']) | list) }}
  ansible.builtin.assert:
    that: _bad | length == 0
    fail_msg: "Unhealthy, stopped or exited services: {{ _bad }}"
    success_msg: "{{ _svcs | length }} services running"

- name: Smoke — API health through nginx
  ansible.builtin.uri:
    url: "https://{{ tn_domain_fqdn }}/api/health"
    validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
    status_code: 200
    timeout: 20
  register: tn_health
  retries: 12
  delay: 5
  until: tn_health.status | default(0) == 200

- name: Smoke — assert core dependencies are up
  ansible.builtin.assert:
    that:
      - tn_health.json.db | default(false)
      - tn_health.json.redis | default(false)
    fail_msg: "API reports degraded dependencies: {{ tn_health.json }}"
    success_msg: "API healthy: {{ tn_health.json }}"

# /health reports the database and Redis; readiness adds OpenSearch (telemetry, scoring
# evidence), which the API treats as critical whenever it is configured.
- name: Smoke — readiness, including OpenSearch
  ansible.builtin.uri:
    url: "https://{{ tn_domain_fqdn }}/api/health/ready"
    validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
    status_code: [200, 503]
    timeout: 20
  register: tn_ready

- name: Smoke — assert the database, Redis and OpenSearch are healthy
  vars:
    _comp: "{{ tn_ready.json.components | default([]) | items2dict(key_name='name', value_name='status') }}"
    _need: [database, redis, opensearch]
  ansible.builtin.assert:
    that:
      - tn_ready.status == 200
      - _need | reject('in', _comp) | list | length == 0
      - _need | map('extract', _comp) | reject('equalto', 'healthy') | list | length == 0
    fail_msg: "Readiness: {{ tn_ready.json | default(tn_ready.msg | default('')) }}"
    success_msg: "ready: {{ _comp }}"

- name: Smoke — deep health
  ansible.builtin.uri:
    url: "https://{{ tn_domain_fqdn }}/api/health/deep"
    validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
    status_code: [200, 503]
    timeout: 30
  register: tn_deep
  failed_when: false

- name: Smoke — report deep health
  ansible.builtin.debug:
    var: tn_deep.json | default({})

- name: Smoke — the SPA is served
  ansible.builtin.uri:
    url: "https://{{ tn_domain_fqdn }}/"
    validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
    status_code: 200
    return_content: false
    timeout: 20
  register: tn_spa

- name: Smoke — Keycloak discovery document
  ansible.builtin.uri:
    url: "https://{{ tn_domain_fqdn }}/auth/realms/{{ tn_keycloak_realm }}/.well-known/openid-configuration"
    validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
    status_code: 200
    timeout: 20
  register: tn_oidc

# ══════════════════════════════════════════════════════════════════════
# The claim contract — where the installer and the application meet
# ══════════════════════════════════════════════════════════════════════
# The password grant is off on every user-facing client. The token comes from the
# dedicated truenorth-smoke client (roles/tn_keycloak), which is disabled except for the
# few seconds below: enabled, one token request, disabled again whatever happened.
- name: Smoke — token through the smoke-test client
  block:
    - name: Smoke — Keycloak admin token (loopback)
      ansible.builtin.uri:
        url: "{{ tn_kc_internal }}/realms/master/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: admin-cli
          username: "{{ vault_keycloak_admin_user | default('admin') }}"
          password: "{{ tn_secrets['keycloak_admin_password'] }}"
        status_code: 200
      register: tn_smoke_admin
      no_log: true

    - name: Smoke — find the smoke-test client
      ansible.builtin.uri:
        url: "{{ tn_kc_realm_url }}/clients?clientId={{ tn_kc_smoke_client }}"
        headers:
          Authorization: "Bearer {{ tn_smoke_admin.json.access_token }}"
        status_code: 200
      register: tn_smoke_client
      no_log: true

    - name: Smoke — the smoke-test client exists (run playbooks/60-keycloak.yml first)
      ansible.builtin.assert:
        that: tn_smoke_client.json | length == 1
        quiet: true

    - name: Smoke — enable the smoke-test client
      ansible.builtin.uri:
        url: "{{ tn_kc_realm_url }}/clients/{{ tn_smoke_client.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ tn_smoke_admin.json.access_token }}"
        body: {clientId: "{{ tn_kc_smoke_client }}", enabled: true}
        body_format: json
        status_code: [204]
      changed_when: false # disabled again below
      no_log: true

    - name: Smoke — obtain a token for the non-privileged smoke identity
      ansible.builtin.uri:
        url: "https://{{ tn_domain_fqdn }}/auth/realms/{{ tn_keycloak_realm }}/protocol/openid-connect/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: password
          client_id: "{{ tn_kc_smoke_client }}"
          # Confidential: without its secret Keycloak answers 401.
          client_secret: "{{ tn_secrets['keycloak_smoke_client_secret'] }}"
          username: "{{ tn_smoke_user_effective | trim }}"
          password: "{{ tn_smoke_password_effective }}"
          scope: "openid profile email"
        validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
        status_code: [200] # a 400/401 is a failed check, not a skipped one
      register: tn_smoke_token
      no_log: true

  always:
    - name: Smoke — disable the smoke-test client again
      ansible.builtin.uri:
        url: "{{ tn_kc_realm_url }}/clients/{{ tn_smoke_client.json[0].id }}"
        method: PUT
        headers:
          Authorization: "Bearer {{ tn_smoke_admin.json.access_token }}"
        body: {clientId: "{{ tn_kc_smoke_client }}", enabled: false}
        body_format: json
        status_code: [204]
      changed_when: false
      when: tn_smoke_client.json[0].id is defined
      no_log: true

- name: Smoke — decode the access token claims
  ansible.builtin.set_fact:
    tn_claims: >-
      {{ (tn_smoke_token.json.access_token.split('.')[1] | replace('-', '+') | replace('_', '/') ~ '==')
         | b64decode | from_json }}
  no_log: true

- name: Smoke — assert the AD claim contract holds
  ansible.builtin.assert:
    that:
      - tn_claims is defined
      - tn_claims.groups is defined
      - tn_claims.groups | length > 0
      - tn_claims.email is defined
    fail_msg: |
      The access token is missing the claims registration depends on.

      groups            : {{ tn_claims.groups | default('MISSING') }}
      email             : {{ tn_claims.email | default('MISSING') }}
      ad_object_guid    : {{ tn_claims.ad_object_guid | default('MISSING') }}

      A missing `groups` claim means the oidc-group-membership-mapper on the
      truenorth-identity client scope did not take effect. The API will not
      error — it will simply see no groups, suggest no role on every approval
      screen, and treat group-based registration eligibility as unrestricted.

      Re-run: ansible-playbook playbooks/60-keycloak.yml
    success_msg: >-
      Claim contract OK — groups={{ tn_claims.groups | default([]) | join(',') }}

# With AD and an AD account named (-e tn_smoke_username / tn_smoke_password): the token
# must come from the directory, with its groups (the local recovery administrator proves
# neither). With tn_keycloak_local_admin on and no AD account named, say so plainly.
- name: Smoke — an AD account's token carries the directory claims
  ansible.builtin.assert:
    that:
      - tn_claims.ad_object_guid | default('') | length > 0
      - tn_claims.groups | intersect(tn_ad_groups) | length > 0
    fail_msg: >-
      {{ tn_smoke_user_effective }} signed in, but its token has
      ad_object_guid={{ tn_claims.ad_object_guid | default('MISSING') }} and
      groups={{ tn_claims.groups | default([]) }}: it is not federated from AD, or it is in
      no TN-* group. Name an AD account in a TN-* group.
    success_msg: "AD claims OK for {{ tn_smoke_user_effective }}"
  when: tn_ldap_enabled | bool and tn_smoke_username | default('') | length > 0

- name: Smoke — AD claims not proven by this run
  ansible.builtin.debug:
    msg: >-
      WARNING: AD is on, but the claim check signed in as the LOCAL smoke account
      ({{ tn_smoke_user_effective }}), which proves the claim contract, not the directory.
      60-keycloak checked the TN-* groups arrived from AD; to prove an AD sign-in too, re-run
      with -e tn_smoke_username=<AD account in a TN-* group> -e tn_smoke_password=...
  when: tn_ldap_enabled | bool and tn_smoke_username | default('') | length == 0

# ── MFA wiring: the realm asks privileged users for a second factor, and the token says
# how the user signed in (amr). Read on the loopback Admin API; a fresh admin token,
# since the one above may have expired (about 60 s).
- name: Smoke — Keycloak admin token for the MFA checks (loopback)
  ansible.builtin.uri:
    url: "{{ tn_kc_internal }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ vault_keycloak_admin_user | default('admin') }}"
      password: "{{ tn_secrets['keycloak_admin_password'] }}"
    status_code: 200
  register: tn_smoke_admin2
  no_log: true

- name: Smoke — the realm and the identity scope
  ansible.builtin.uri:
    url: "{{ tn_kc_realm_url }}{{ item }}"
    headers:
      Authorization: "Bearer {{ tn_smoke_admin2.json.access_token }}"
    status_code: 200
  loop: ["", "/client-scopes"]
  register: tn_smoke_kc

- name: Smoke — MFA is wired (browser flow tn-browser, AMR mapper on truenorth-identity)
  vars:
    _realm: "{{ tn_smoke_kc.results[0].json }}"
    _scope: "{{ tn_smoke_kc.results[1].json | selectattr('name', 'equalto', 'truenorth-identity') | list }}"
    _mappers: "{{ (_scope | first).protocolMappers | default([]) | map(attribute='protocolMapper') | list if _scope else [] }}"
  ansible.builtin.assert:
    that:
      - _realm.browserFlow is match('tn-browser')
      - "'oidc-amr-mapper' in _mappers"
    fail_msg: >-
      MFA is not wired: browserFlow={{ _realm.browserFlow | default('?') }}, identity scope
      mappers={{ _mappers }}. Privileged users would sign in with a password only, or the
      API could not see their second factor and would refuse them. Re-run
      playbooks/60-keycloak.yml.
    success_msg: "MFA wired: browserFlow={{ _realm.browserFlow }}, amr mapper present"

- name: Smoke — /auth/me answers for that identity
  ansible.builtin.uri:
    url: "https://{{ tn_domain_fqdn }}/api/auth/me"
    headers:
      Authorization: "Bearer {{ tn_smoke_token.json.access_token }}"
    validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
    status_code: 200
    timeout: 20
  register: tn_authme
  no_log: true

- name: Smoke — report the identity state
  ansible.builtin.debug:
    msg: >-
      /auth/me for {{ tn_smoke_user_effective }}:
      status={{ tn_authme.json.status | default('?') }}
      {{ '(registered)'
         if tn_authme.json.status | default('') == 'registered'
         else '(an unregistered identity is offered the registration form rather than a 403, as expected for the smoke account)' }}
