# TrueNorth lab build/depot plane. Run from install/lab/ (separate from install/, which
# targets TN-MGMT01 only).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
stdout_callback = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5
# vault_password_file = ~/.truenorth-vault-pass

[privilege_escalation]
# As in install/: not blanket-enabled. Tasks that need root say so.
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
