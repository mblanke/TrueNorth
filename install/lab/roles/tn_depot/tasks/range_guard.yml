---
# Refuse to put the depot's caches online while range VMs exist (#214), the same check as
# scripts/lab/depot-uplink.sh `on`: VMs under <datacenter>/vm/<TN_RANGE_FOLDER>. Runs once,
# on the control node, with govc and GOVC_URL / GOVC_USERNAME / GOVC_PASSWORD from the
# environment (never printed); GOVC_DATACENTER is set from tn_depot_vcenter_datacenter.
# Fails closed: no govc, no credentials, no answer from vCenter, a datacenter that cannot
# be confirmed or a range folder that cannot be listed is a refusal too.
# -e tn_depot_force_online=true overrides (the range NIC still drops everything from the
# range network while online, range_fw.yml).

- name: Range guard — skipped by tn_depot_force_online
  ansible.builtin.debug:
    msg: "tn_depot_force_online: going online without checking for range VMs. The range NIC firewall still shuts the range network out."
  when: tn_depot_force_online | bool

- name: Range guard — check vCenter
  when: not (tn_depot_force_online | bool)
  delegate_to: localhost
  run_once: true
  become: false
  environment:
    GOVC_DATACENTER: "{{ tn_depot_vcenter_datacenter }}"
  block:
    - name: Range guard — vCenter answers (govc on the control node)
      ansible.builtin.command: govc about
      register: tn_depot_guard_about
      changed_when: false
      failed_when: false

    - name: Range guard — refuse without vCenter
      ansible.builtin.fail:
        msg: >-
          Cannot ask vCenter whether range VMs exist (govc about: rc {{ tn_depot_guard_about.rc }}).
          Export GOVC_URL, GOVC_USERNAME and GOVC_PASSWORD (scripts/lab/lib.sh) on the control
          node, or pass -e tn_depot_force_online=true to go online anyway.
      when: tn_depot_guard_about.rc != 0

    - name: Range guard — the datacenter exists
      ansible.builtin.command: govc datacenter.info "/{{ tn_depot_vcenter_datacenter }}"
      register: tn_depot_guard_dc
      changed_when: false
      failed_when: false

    - name: Range guard — refuse when the datacenter is not confirmed
      ansible.builtin.fail:
        msg: >-
          Datacenter /{{ tn_depot_vcenter_datacenter }} not found in vCenter (tn_depot_vcenter_datacenter):
          the range folder cannot be checked. Fix the value, or pass -e tn_depot_force_online=true.
      when: tn_depot_guard_dc.rc != 0

    - name: Range guard — the range folder
      ansible.builtin.command: govc folder.info "/{{ tn_depot_vcenter_datacenter }}/vm/{{ tn_depot_range_vm_folder }}"
      register: tn_depot_guard_folder
      changed_when: false
      failed_when: false

    # A missing folder is not "no ranges": it may be a wrong name. Refuse; force if sure.
    - name: Range guard — refuse when the range folder cannot be looked up
      ansible.builtin.fail:
        msg: >-
          Range folder /{{ tn_depot_vcenter_datacenter }}/vm/{{ tn_depot_range_vm_folder }} cannot be
          looked up (govc folder.info rc {{ tn_depot_guard_folder.rc }}). If no range was ever
          deployed, or TN_RANGE_FOLDER is set wrong, check it, then pass -e tn_depot_force_online=true.
      when: tn_depot_guard_folder.rc != 0

    - name: Range guard — VMs in the range folder
      ansible.builtin.command: govc find "/{{ tn_depot_vcenter_datacenter }}/vm/{{ tn_depot_range_vm_folder }}" -type m
      register: tn_depot_guard_vms
      changed_when: false

    - name: Range guard — refuse while range VMs exist
      ansible.builtin.fail:
        msg: >-
          {{ tn_depot_guard_vms.stdout_lines | length }} range VM(s) exist under
          /{{ tn_depot_vcenter_datacenter }}/vm/{{ tn_depot_range_vm_folder }}. While the depot is
          online its caches fetch whatever they are asked for. Destroy them, or pass
          -e tn_depot_force_online=true to accept it (the range NIC still drops everything).
      when: tn_depot_guard_vms.stdout_lines | length > 0
