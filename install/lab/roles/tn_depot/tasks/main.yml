---
# TN-DEPOT01. Idempotent. The first run needs the uplink NIC connected
# (scripts/lab/depot-uplink.sh on --apply): packages and the Nexus image come from upstream.

- name: Depot — Ubuntu 24.04 only
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_release == 'noble'
    fail_msg: "TN-DEPOT01 is expected to be a clone of tmpl-ubuntu-2404"

- name: Depot — the data disk is mounted at {{ tn_depot_data_dir }}
  ansible.builtin.assert:
    that: tn_depot_data_dir in (ansible_mounts | map(attribute='mount') | list)
    fail_msg: >-
      {{ tn_depot_data_dir }} is not a mount point. deploy-mgmt-vm.sh adds a data disk that
      cloud-init formats (LABEL=depot-data) and mounts there. Without it the caches would
      fill the OS disk. Check `lsblk -f` and `cloud-init status --long`, or set
      tn_depot_require_data_mount=false deliberately.
  when: tn_depot_require_data_mount | bool

- name: Depot — which packages are missing
  ansible.builtin.package_facts:

- name: Depot — upstream reachable when there is anything to install
  ansible.builtin.uri:
    url: http://archive.ubuntu.com/ubuntu/dists/noble/Release
    method: HEAD
    timeout: 10
  register: tn_depot_net
  failed_when: false
  when: >-
    ['docker.io', 'apt-cacher-ng', 'python3-docker'] | difference(ansible_facts.packages.keys()) | length > 0

- name: Depot — fail early without an uplink
  ansible.builtin.fail:
    msg: >-
      Packages are missing and archive.ubuntu.com is unreachable. Connect the depot's
      uplink NIC first:  scripts/lab/depot-uplink.sh on --apply   (and off again after
      prefetch.yml).
  when: tn_depot_net is not skipped and (tn_depot_net.status | default(-1)) != 200

- name: Depot — apt-cacher-ng never enables CONNECT tunnels (debconf)
  ansible.builtin.debconf:
    name: apt-cacher-ng
    question: apt-cacher-ng/tunnelenable
    vtype: boolean
    value: "false"
  become: true

- name: Depot — packages
  ansible.builtin.apt:
    name: [docker.io, python3-docker, python3-requests, apt-cacher-ng, curl, jq]
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Depot — no routing between its NICs (dockerd, sysctl)
  ansible.builtin.include_tasks: forwarding.yml

# Before Nexus starts: the range NIC gets its firewall, then its address (work site, #214).
- name: Depot — range uplink NIC (firewall, then address)
  ansible.builtin.include_tasks: range_nic.yml
  when: tn_depot_range_ip | length > 0

- name: Depot — data directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0750"
  loop:
    - { path: "{{ tn_depot_acng_dir }}", owner: apt-cacher-ng }
    # The nexus3 image runs as uid 200.
    - { path: "{{ tn_depot_nexus_data }}", owner: "200" }
  become: true

- name: Depot — apt-cacher-ng config and upstream state
  ansible.builtin.include_tasks: upstream.yml

- name: Depot — apt-cacher-ng enabled
  ansible.builtin.systemd_service:
    name: apt-cacher-ng
    enabled: true
    state: started
  become: true

# ── Nexus ─────────────────────────────────────────────────────────────
- name: Depot — Nexus image (pulled only if absent)
  community.docker.docker_image:
    name: "{{ tn_depot_nexus_image }}"
    source: pull
  become: true

# Host networking: Nexus listens on the depot's own addresses (8081, and the Docker
# connectors 8082/8083), so published ports, Docker's DNAT and IP forwarding are not
# needed. Forwarding stays off (forwarding.yml). Nexus listens on 8081 inside the
# container, so tn_depot_nexus_port must be 8081.
- name: Depot — Nexus listens on 8081 (host networking)
  ansible.builtin.assert:
    that: tn_depot_nexus_port | int == 8081
    fail_msg: "tn_depot_nexus_port is {{ tn_depot_nexus_port }}: with host networking Nexus is on 8081"
    quiet: true

- name: Depot — Nexus container
  community.docker.docker_container:
    name: nexus
    image: "{{ tn_depot_nexus_image }}"
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "{{ tn_depot_nexus_data }}:/nexus-data"
    env:
      INSTALL4J_ADD_VM_PARAMS: "{{ tn_depot_nexus_jvm }}"
    state: started
  become: true

- name: Depot — wait for Nexus (first start takes a few minutes)
  ansible.builtin.uri:
    url: "{{ tn_depot_nexus_api }}/v1/status/writable"
    status_code: 200
  register: tn_depot_nexus_up
  until: tn_depot_nexus_up.status == 200
  retries: 60
  delay: 10

- name: Depot — Nexus configuration
  ansible.builtin.include_tasks: nexus.yml

# ── Check what ranges will use ────────────────────────────────────────
- name: Depot — the Chocolatey group feed answers anonymously
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tn_depot_nexus_port }}/repository/chocolatey/"
    status_code: 200

- name: Depot — apt-cacher-ng answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ tn_depot_acng_port }}/acng-report.html"
    status_code: 200

# Forwarding again, now that dockerd and Nexus are running.
- name: Depot — still no routing between its NICs
  ansible.builtin.include_tasks: verify_forwarding.yml

# From the depot itself: proves both services listen on the range address. Whether a
# range firewall gets through is checked on site (install/lab/README.md).
- name: Depot — Nexus and apt-cacher-ng answer on the range address {{ tn_depot_range_ip }}
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
  loop:
    - "http://{{ tn_depot_range_ip }}:{{ tn_depot_nexus_port }}/repository/chocolatey/"
    - "http://{{ tn_depot_range_ip }}:{{ tn_depot_acng_port }}/acng-report.html"
  when: tn_depot_range_ip | length > 0

- name: Depot — report
  vars:
    tn_depot_ranges_see: "{{ tn_depot_range_ip if tn_depot_range_ip | length > 0 else tn_depot_ip }}"
  ansible.builtin.debug:
    msg:
      - "Upstream: {{ 'ONLINE (prefetch window)' if tn_depot_upstream_online | bool else 'offline (cached only)' }}"
      - >-
        Range NIC: {{ ((tn_depot_range_if | default('?')) ~ ' ' ~ tn_depot_range_ip ~ ', firewall: tcp/'
        ~ (tn_depot_range_ports | join(',')) ~ ' from ' ~ tn_depot_range_subnet)
        if tn_depot_range_ip | length > 0 else 'none' }}
      - "Forwarding: off (IPv4 and IPv6)"
      - "TrueNorth .env.production / install/inventory/group_vars/all/main.yml:"
      - "  tn_depot_url:        http://{{ tn_depot_ranges_see }}   (no port, no path: the worker appends :8081/repository/chocolatey/)"
      - "  tn_depot_choco_feed: http://{{ tn_depot_ranges_see }}:{{ tn_depot_nexus_port }}/repository/chocolatey/"
      - "  tn_depot_apt_proxy:  http://{{ tn_depot_ranges_see }}:{{ tn_depot_acng_port }}   (must be set: the empty default is port 80)"
      - "  tn_depot_ports:      {{ tn_depot_nexus_port }},{{ tn_depot_acng_port }}"
      - "Range firewall WAN rule: allow zone nets -> {{ tn_depot_ranges_see }} tcp/{{ tn_depot_nexus_port }},{{ tn_depot_acng_port }}"
