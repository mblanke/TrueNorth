---
# TrueNorth lab - build and depot plane (runbook §4.1a). Separate from install/ on
# purpose: these hosts never share an inventory with TN-MGMT01.
#
# TN-DEPOT01 is reached THROUGH TN-BUILD01 (the UniFi rules allow BUILD01 -> depot
# tcp/22, not the control box -> depot). Both hosts are addressed by IP: the control
# box cannot resolve *.truenorth.lab.
all:
  vars:
    ansible_user: tnadmin
    ansible_ssh_private_key_file: "{{ tn_lab_ssh_key }}"
  children:
    build:
      hosts:
        tn-build01:
          ansible_host: 10.30.31.10
    depot:
      hosts:
        tn-depot01:
          ansible_host: 10.30.32.10
          ansible_ssh_common_args: >-
            -o ProxyCommand="ssh -W %h:%p -i {{ tn_lab_ssh_key }}
            -o StrictHostKeyChecking=accept-new tnadmin@{{ tn_build_ip }}"
