# TrueNorth work site (ADR 0012): TN-MGMT01 is the build host, TN-DEPOT01 the depot.
# Run the shared playbooks from THIS directory so this inventory is used:
#   cd install/lab/work-site && ansible-playbook ../build.yml
[defaults]
inventory = inventory/hosts.yml
roles_path = ../roles
host_key_checking = False
# The community.general `yaml` callback was removed in community.general 12.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = False
interpreter_python = auto_silent
forks = 5

[privilege_escalation]
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
