---
# TrueNorth work site (vCenter 192.168.1.10, DC-Lab / CL-Lab). ADR 0012.
#
# build: TN-MGMT01, the installed TrueNorth host, which also builds the templates (on
#        esx04; Packer callbacks on its second NIC ens224, 10.30.31.20 on dPG-TN-BUILD).
#        Only what it lacks is added (tn_build with the toggles in group_vars): Packer,
#        govc, xorriso. Its Docker and the installed app checkout belong to the installer.
# depot: TN-DEPOT01, three NICs: 10.30.30.30 on dPG-TN-MGMT (ssh, TrueNorth),
#        10.30.31.30 on dPG-TN-BUILD (what builds use), 10.30.32.10 on the range uplink
#        network (what range firewalls reach, tcp/8081,3142 only; #214). Deployed by
#        `scripts/lab/build-phase.sh depot` (scripts/lab/deploy-mgmt-vm.sh --site work).
#
# Both are on the management subnet, so there is no jump host. Running ON TN-MGMT01
# instead of the Mac: add  -e tn_work_build_connection=local
all:
  vars:
    ansible_ssh_private_key_file: "{{ tn_lab_ssh_key }}"
  children:
    build:
      hosts:
        tn-mgmt01:
          ansible_host: 10.30.30.20
          ansible_user: "{{ tn_work_admin_user }}"
          ansible_connection: "{{ tn_work_build_connection | default('ssh') }}"
    depot:
      hosts:
        tn-depot01:
          ansible_host: 10.30.30.30
          ansible_user: tnadmin
