# Work-site install media: the one list both scripts read.
#   scripts/lab/pkrvars-work.py     writes  <packer var> = "<path>"  into lab.auto.pkrvars.hcl
#   scripts/lab/iso-sync-esx04.sh   copies  [esx01-local] ISO/<path> -> [esx04-local] ISO/<path>
#
# Format: <packer variable | -> <path under ISO/ | PENDING> [sha256=<hex>] [# note]
#   -        copy only (no Packer variable yet: media for later role images)
#   PENDING  not downloaded yet: replace with the exact path once it is on [esx01-local] ISO/
#            (pkrvars-work.py then leaves the variable at its MUST-UPLOAD-FIRST default)
#   sha256=  optional pinned checksum. Without it, build-phase.sh builds from an ISO only
#            when its esx04-local copy has the source's (esx01-local) exact size; with it,
#            also only after iso-sync-esx04.sh --verify recorded a matching sha256.
#
# Present on [esx01-local] ISO/ (2026-10-19):
iso_srv2022        windows/en-us_windows_server_2022_updated_july_2026_x64_dvd_75aa9e18.iso
iso_srv2025        windows/en-us_windows_server_2025_updated_july_2026_x64_dvd_4e6f5a42.iso
iso_win11_24h2     windows/en-us_windows_11_consumer_editions_version_24h2_updated_feb_2026_x64_dvd_4e400c9e.iso
iso_ubuntu         linux/ubuntu-24.04.4-live-server-amd64.iso
iso_debian         linux/debian-13.6.0-amd64-DVD-1.iso
iso_rocky          linux/Rocky-10.2-x86_64-dvd1.iso
iso_kali           security-tools/kali-linux-2026.1-installer-everything-amd64.iso
iso_parrot         security-tools/Parrot-security-7.3_amd64.iso  # no debian-installer: parrot is built as a debian13 variant
iso_securityonion  security-tools/securityonion-2.4.211-20260407.iso
iso_pfsense        appliances/pfSense-CE-2.7.2-RELEASE-amd64.iso
iso_vyos           appliances/vyos-2026.10.01-0035-rolling-generic-amd64.iso
iso_sharepoint2019 windows/en_sharepoint_server_2019_x64_dvd_68e34c9e.iso  # SharePoint Server 2019 (VS subscription): srv2022-sharepoint2019, Large Enterprise
