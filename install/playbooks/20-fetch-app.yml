---
# Fetch the TrueNorth application onto the platform host.
#
# Re-runnable on its own:  ansible-playbook playbooks/20-fetch-app.yml
- name: "Fetch the TrueNorth application onto the platform host."
  hosts: platform
  gather_facts: true
  roles:
    # Release mode: read the manifest first, so git mode fetches its git_sha.
    - role: tn_release
      tags: [app]
    - role: tn_app_source
      tags: [app]
