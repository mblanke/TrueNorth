---
# Playbook 07: Upload VM templates and ISOs
- name: Templates -- download and register VM templates
  hosts: hypervisors[0]
  tasks:
    - name: Ensure ISO storage exists
      command: "pvesm status -storage {{ proxmox_iso_storage }}"
      changed_when: false

    - name: Download base templates
      get_url:
        url: "{{ item.url }}"
        dest: "/var/lib/vz/template/iso/{{ item.name }}"
      loop:
        - { name: "ubuntu-22.04-server.iso", url: "https://releases.ubuntu.com/22.04/ubuntu-22.04.4-live-server-amd64.iso" }
      when: not ansible_check_mode
