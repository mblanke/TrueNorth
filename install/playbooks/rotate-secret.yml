---
# Rotate one of the passwords a service reads only on its FIRST start.
#
#   ansible-playbook playbooks/rotate-secret.yml -K --ask-vault-pass -e tn_rotate=<name>
#
# <name> is one of tn_rotatable below. The new value is the vault's (set
# vault_<name> to it first) or, with the vault entry empty, generated on the target. The
# play changes it IN THE SERVICE, then in {{ tn_config_dir }}/secrets/<name>, re-renders
# the env file and recreates whatever uses it. 30-config refuses a vault value that
# differs from the persisted one for exactly these names: this is the way to change them.
# docs/runbooks/key-rotation.md.
- name: "Rotate a first-start secret"
  hosts: platform
  gather_facts: true
  vars:
    tn_rotatable:
      postgres_password: {kind: pg_role, role: "{{ vault_postgres_user | default('forge') }}"}
      keycloak_db_password: {kind: pg_role, role: keycloak}
      lrs_db_password: {kind: pg_role, role: lrs}
      keycloak_admin_password: {kind: keycloak_admin}
      grafana_admin_password: {kind: grafana_admin}
      opensearch_admin_password: {kind: opensearch}
      opensearch_dashboards_password: {kind: opensearch}
    # Lets tn_config/tasks/secrets.yml load while the vault already holds the new value.
    tn_secret_rotating: "{{ tn_rotate | default('') }}"
    _dc: "docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}"
  tasks:
    - name: Rotate — a rotatable secret was named
      ansible.builtin.assert:
        that: tn_rotate | default('') in tn_rotatable
        fail_msg: "-e tn_rotate=<name>, one of: {{ tn_rotatable.keys() | join(', ') }}"
        quiet: true

    - name: Rotate — the current secrets
      ansible.builtin.include_role:
        name: tn_config
        tasks_from: secrets

    - name: Rotate — the vault's value for it
      ansible.builtin.set_fact:
        tn_rotate_old: "{{ tn_secrets[tn_rotate] }}"
        tn_rotate_vault: "{{ (tn_generated_secrets | selectattr('name', 'equalto', tn_rotate) | first).value | default('') }}"
      no_log: true

    - name: Rotate — the vault holds the NEW value, or nothing
      ansible.builtin.assert:
        that: tn_rotate_vault | length == 0 or tn_rotate_vault != tn_rotate_old
        fail_msg: >-
          vault_{{ tn_rotate }} still holds the current value. Put the new value there
          (ansible-vault edit inventory/group_vars/all/vault.yml), or empty it to have one
          generated.
        quiet: true

    - name: Rotate — generate a new value on the target
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: set -o pipefail; head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32
      register: tn_rotate_gen
      changed_when: false
      when: tn_rotate_vault | length == 0
      no_log: true

    - name: Rotate — the new value
      ansible.builtin.set_fact:
        tn_rotate_new: "{{ tn_rotate_vault if tn_rotate_vault | length > 0 else tn_rotate_gen.stdout | trim }}"
      no_log: true

    - name: Rotate — it is long enough
      ansible.builtin.assert:
        that: tn_rotate_new | length >= (tn_secret_min_length | int)
        fail_msg: "the new value is shorter than {{ tn_secret_min_length }} characters"
        quiet: true

    # ── 1. Change it in the service ─────────────────────────────────
    # Over the postgres container's local socket (trusted): the old password is not
    # needed, and the new one reaches psql on stdin, never on a command line.
    - name: Rotate — ALTER ROLE in PostgreSQL
      ansible.builtin.command:
        cmd: "{{ _dc }} exec -T postgres psql -U {{ vault_postgres_user | default('forge') }} -d postgres -v ON_ERROR_STOP=1 -q -f -"
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
        stdin: >-
          ALTER ROLE "{{ tn_rotatable[tn_rotate].role | replace('"', '""') }}"
          WITH PASSWORD '{{ tn_rotate_new | replace("'", "''") }}';
      changed_when: true
      no_log: true
      when: tn_rotatable[tn_rotate].kind == 'pg_role'

    - name: Rotate — Keycloak master admin
      when: tn_rotatable[tn_rotate].kind == 'keycloak_admin'
      block:
        - name: Rotate — Keycloak endpoints
          ansible.builtin.include_vars:
            file: "{{ playbook_dir }}/../roles/tn_keycloak/defaults/main.yml"

        - name: Rotate — admin token with the current password
          ansible.builtin.uri:
            url: "{{ tn_kc_internal }}/realms/master/protocol/openid-connect/token"
            method: POST
            body_format: form-urlencoded
            body:
              grant_type: password
              client_id: admin-cli
              username: "{{ vault_keycloak_admin_user | default('admin') }}"
              password: "{{ tn_rotate_old }}"
            status_code: 200
          register: tn_rot_kc_token
          no_log: true

        - name: Rotate — find the master admin
          ansible.builtin.uri:
            url: "{{ tn_kc_internal }}/admin/realms/master/users?username={{ vault_keycloak_admin_user | default('admin') | urlencode }}&exact=true"
            headers: {Authorization: "Bearer {{ tn_rot_kc_token.json.access_token }}"}
            status_code: 200
          register: tn_rot_kc_user
          no_log: true

        - name: Rotate — set its password
          ansible.builtin.uri:
            url: "{{ tn_kc_internal }}/admin/realms/master/users/{{ tn_rot_kc_user.json[0].id }}/reset-password"
            method: PUT
            headers: {Authorization: "Bearer {{ tn_rot_kc_token.json.access_token }}"}
            body: {type: password, value: "{{ tn_rotate_new }}", temporary: false}
            body_format: json
            status_code: [204]
          changed_when: true
          no_log: true

    - name: Rotate — Grafana admin
      ansible.builtin.command:
        cmd: "{{ _dc }} exec -T grafana grafana cli admin reset-admin-password --password-from-stdin"
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
        stdin: "{{ tn_rotate_new }}"
      changed_when: true
      no_log: true
      when: tn_rotatable[tn_rotate].kind == 'grafana_admin'

    # ── 2. Persist it (OpenSearch: before, since its file is what gets loaded) ──
    - name: Rotate — persist the new value
      ansible.builtin.copy:
        dest: "{{ tn_config_dir }}/secrets/{{ tn_rotate }}"
        content: "{{ tn_rotate_new }}"
        mode: "0600"
      no_log: true

    # internal_users.yml is rebuilt from the persisted secrets, then loaded into the
    # running cluster's security index with the admin certificate.
    - name: Rotate — OpenSearch internal users
      when: tn_rotatable[tn_rotate].kind == 'opensearch'
      block:
        - name: Rotate — rebuild internal_users.yml
          ansible.builtin.include_role:
            name: tn_tls
            tasks_from: opensearch

        - name: Rotate — load it into the security index (securityadmin.sh)
          ansible.builtin.command:
            cmd: >-
              {{ _dc }} exec -T opensearch
              plugins/opensearch-security/tools/securityadmin.sh
              -f /usr/share/opensearch/config/opensearch-security/internal_users.yml -t internalusers
              -icl -nhnv -cacert config/certs/ca.pem -cert config/certs/admin.pem -key config/certs/admin-key.pem
            chdir: "{{ tn_app_dir }}/infra/platform/docker"
          register: tn_rot_secadmin
          changed_when: true
          failed_when: tn_rot_secadmin.rc != 0 or 'Done with success' not in tn_rot_secadmin.stdout

    # ── 3. Everything that uses it gets the new env file ────────────
    - name: Rotate — re-render the env file
      ansible.builtin.include_role:
        name: tn_config

    - name: Rotate — recreate the services whose environment changed
      community.docker.docker_compose_v2:
        project_src: "{{ tn_app_dir }}/infra/platform/docker"
        files: [compose.prod.yml]
        env_files: ["{{ tn_env_file }}"]
        state: present
        build: never
        pull: never
        wait: true
        wait_timeout: 900

    - name: Rotate — done
      ansible.builtin.debug:
        msg: >-
          {{ tn_rotate }} rotated and persisted in {{ tn_config_dir }}/secrets/.
          {{ 'Keep vault_' ~ tn_rotate ~ ' as it is now.' if tn_rotate_vault | length > 0
             else 'The vault entry stays empty (the generated value is used).' }}
          Take a backup now: the escrow in older backups holds the old value.
