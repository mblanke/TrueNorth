---
# Final report.
#
# The old 09-validate.yml asserted total_nodes > 0 and total_appliances > 0,
# which cannot hold on a first install — nothing has been discovered yet, so a
# correct installation failed its own validation. Those assertions are now gated
# behind tn_expect_discovered, false by default: first run reports, later runs
# gate.

- name: "Validate — final state report"
  hosts: platform
  gather_facts: false
  tags: [validate]

  tasks:
    - name: Validate — read recorded state
      ansible.builtin.slurp:
        src: "{{ tn_state_dir }}/{{ item }}"
      register: tn_state_files
      loop: [app.json, providers.json]
      failed_when: false

    - name: Validate — parse state
      ansible.builtin.set_fact:
        tn_app_state: >-
          {{ (tn_state_files.results[0].content | b64decode | from_json)
             if tn_state_files.results[0].content is defined else {} }}
        tn_prov_state: >-
          {{ (tn_state_files.results[1].content | b64decode | from_json)
             if tn_state_files.results[1].content is defined else {} }}

    - name: Validate — alembic head
      ansible.builtin.command:
        cmd: >-
          docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
          exec -T postgres psql -U {{ vault_postgres_user | default('forge') }}
          -d {{ vault_postgres_db | default('forge') }} -tAc
          "SELECT version_num FROM alembic_version"
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      register: tn_head
      changed_when: false
      failed_when: false

    - name: Validate — infrastructure summary
      ansible.builtin.uri:
        url: "https://{{ tn_domain_fqdn }}/api/{{ item }}"
        validate_certs: "{{ tn_tls_mode != 'selfsigned' }}"
        status_code: [200, 401, 403]
        timeout: 20
      register: tn_summaries
      loop: [hypervisors/summary, storage/summary]
      failed_when: false

    # Only a gate once something has been discovered. On a first install this is
    # information, not a failure.
    - name: Validate — assert discovery when expected
      ansible.builtin.assert:
        that:
          - tn_summaries.results[0].json.total_nodes | default(0) > 0
          - tn_summaries.results[1].json.total_appliances | default(0) > 0
        fail_msg: >-
          tn_expect_discovered is true but the platform reports no hypervisor
          nodes or storage appliances. Register the vCenter connection and run
          discovery.
      when:
        - tn_expect_discovered | bool
        # The summaries need a token this play does not have: only assert on an answer.
        - tn_summaries.results[0].status | default(0) == 200

    - name: Validate — ARC² Course Studio runner
      ansible.builtin.systemd_service:
        name: truenorth-arc2-runner
      register: tn_arc2_state
      failed_when: false
      when: tn_arc2_enabled | default(false) | bool

    # cmi5 on: the install fails without its AU credential (launches would answer 503).
    - name: Validate — cmi5
      ansible.builtin.include_role:
        name: tn_cmi5
        tasks_from: validate
      when: tn_cmi5_enabled | bool

    # Where an alert goes. Shown in the report, and as a WARNING of its own when nowhere:
    # the Prometheus rules then fire and nobody is told.
    - name: Validate — alert delivery
      ansible.builtin.set_fact:
        tn_alert_delivery: >-
          {{ ((['email to ' ~ tn_alert_email_to ~ ' via ' ~ tn_alert_smtp_host ~ ':' ~ tn_alert_smtp_port]
               if tn_alert_email_enabled | default(false) | bool else [])
              + (['webhook'] if vault_alertmanager_webhook_url | default('') | length > 0 else []))
             | join(' + ') | default('NOWHERE (null receiver)', true) }}

    - name: Validate — WARNING, alerts are not delivered
      ansible.builtin.debug:
        msg: >-
          WARNING: ALERTS ARE NOT DELIVERED. Alertmanager routes every alert to a null
          receiver: a down service, a stale backup or a failed probe fires and nobody is
          told. Set tn_alert_email_enabled: true with tn_alert_email_to, tn_alert_email_from,
          tn_alert_smtp_host and the vault_alert_smtp_* credentials, re-run
          playbooks/30-config.yml and 50-stack-up.yml, then prove delivery with
          playbooks/alert-test.yml (install/README.md "Alerting").
      when: tn_alert_delivery.startswith('NOWHERE')
    # ADR 0011: record this out of band. Without it, someone with root on this host could
    # re-sign a rewritten audit export with a new key and nothing would tell them apart.
    - name: Validate — audit export signing key fingerprint
      ansible.builtin.command:
        cmd: >-
          docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
          run --rm --no-deps -T --entrypoint python worker-scenario -m worker.audit_signing
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      register: tn_audit_key
      changed_when: false
      failed_when: false

    # The daily export runs at 00:45 UTC; run it once now, so a host just installed or
    # upgraded is exported through yesterday and deep health's audit_export is current
    # straight away (staging, v1.2.0-rc7: degraded until the first night). Idempotent: it
    # exports only days with no export yet. Fails the install below, after the report, if
    # the export cannot run (no seed, archive not writable, archive ahead of the database).
    - name: Validate — run the signed audit export once
      ansible.builtin.command:
        cmd: >-
          docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
          exec -T worker-scenario python -m worker.audit_export_now
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
      register: tn_audit_export_now
      changed_when: >-
        tn_audit_export_now.rc == 0 and '"exported": []' not in tn_audit_export_now.stdout
      failed_when: false

    # The orchestrator lists its own endpoint's models from inside its container, with the
    # key it already holds: the key never reaches this play or its output. Every chat model
    # it is configured with (OPENAI_DEFAULT_MODEL, AI_HEAVY/GENERAL/CODE_MODEL) must be
    # listed; staging rc7 called models its router did not have and answered 502.
    - name: Validate — AI orchestrator's models exist on its endpoint
      ansible.builtin.command:
        cmd: >-
          docker compose -f {{ tn_compose_file }} --env-file {{ tn_env_file }}
          exec -T ai-orchestrator python -
        chdir: "{{ tn_app_dir }}/infra/platform/docker"
        stdin: |
          import json, os, sys, urllib.error, urllib.request
          names = ("OPENAI_DEFAULT_MODEL", "AI_HEAVY_MODEL", "AI_GENERAL_MODEL", "AI_CODE_MODEL")
          configured = {n: os.environ.get(n, "") for n in names}
          base, key = os.environ.get("OPENAI_BASE_URL", "").rstrip("/"), os.environ.get("OPENAI_API_KEY", "")
          req = urllib.request.Request(base + "/models", headers={"Authorization": "Bearer " + key} if key else {})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = json.load(r)
          except urllib.error.HTTPError as exc:
              print(json.dumps({"error": f"HTTP {exc.code} from {base}/models", "configured": configured}))
              sys.exit(0)
          except Exception as exc:
              print(json.dumps({"error": f"{type(exc).__name__} listing {base}/models", "configured": configured}))
              sys.exit(0)
          rows = body.get("data", []) if isinstance(body, dict) else []
          ids = sorted({str(m.get("id")) for m in rows if isinstance(m, dict) and m.get("id")})
          missing = sorted({v for v in configured.values() if v and v not in ids})
          print(json.dumps({"models": ids, "configured": configured, "missing": missing}))
      register: tn_ai_models_raw
      changed_when: false
      failed_when: false

    - name: Validate — parse the AI model check
      ansible.builtin.set_fact:
        tn_ai_models: >-
          {{ (tn_ai_models_raw.stdout | from_json)
             if tn_ai_models_raw.rc | default(1) == 0 and (tn_ai_models_raw.stdout | default('')).startswith('{')
             else {'error': 'the ai-orchestrator container did not answer (rc ' ~ (tn_ai_models_raw.rc | default('?')) ~ ')'} }}

    - name: Validate — REPORT
      ansible.builtin.debug:
        msg:
          - "══════════════════════════════════════════════════════════════"
          - " TrueNorth Range — install report"
          - "══════════════════════════════════════════════════════════════"
          - " host          : {{ inventory_hostname }} ({{ ansible_host }})"
          - " url           : https://{{ tn_domain_fqdn }}/"
          - " app source    : {{ tn_app_state.source_mode | default('?') }}"
          - " app ref       : {{ tn_app_state.ref | default('?') }}"
          - " app commit    : {{ (tn_app_state.commit | default('unknown'))[:12] }}"
          - " images        : {{ tn_app_state.image_source | default('?') }} {{ tn_app_state.release | default('') }}"
          - " alerts        : {{ tn_alert_delivery }}"
          - " alembic head  : {{ tn_head.stdout | default('unknown') | trim }}"
          - " tls mode      : {{ tn_tls_mode }}"
          - " realm         : {{ tn_keycloak_realm }} (AD: {{ tn_domain }})"
          - " ldap component: {{ tn_keycloak_ldap_component_id | default('not set') }}"
          - " provisioner   : {{ tn_prov_state.backend | default(tn_provisioner_backend) }}"
          - " vcenter       : {{ tn_prov_state.vcenter | default(tn_vcenter_address) if tn_uses_vcenter | bool else 'none' }}"
          - " can provision : {{ tn_prov_state.can_provision | default('unknown') }}"
          - >-
            {{ ' arc2 studio   : on, runner ' ~ (tn_arc2_state.status.ActiveState | default('unknown'))
               if tn_arc2_enabled | default(false) | bool else ' arc2 studio   : off' }}
          - " cmi5          : {{ 'on, AU credential set' if tn_cmi5_enabled | bool else 'off (launches answer 503)' }}"
          - " audit key     : {{ tn_audit_key.stdout | default('') | trim or 'UNKNOWN (no AUDIT_SIGNING_SEED?)' }} (record it out of band)"
          - >-
            {{ ' audit export  : ' ~ ('current (' ~ (tn_audit_export_now.stdout | default('') | trim) ~ ')'
               if tn_audit_export_now.rc | default(1) == 0
               else 'FAILED: ' ~ (tn_audit_export_now.stderr | default('') | trim | truncate(200))) }}
          - >-
            {{ ' ai models     : ' ~ ('UNVERIFIED, ' ~ tn_ai_models.error if tn_ai_models.error is defined
               else ('MISSING on the endpoint: ' ~ tn_ai_models.missing | join(', ') if tn_ai_models.missing
                     else 'all listed (' ~ (tn_ai_models.configured | dict2items | map(attribute='value')
                                             | unique | join(', ')) ~ ')')) }}
          - " env file      : {{ tn_env_file }}"
          - " data root     : {{ tn_data_root }}"
          - "──────────────────────────────────────────────────────────────"
          - " Accepted warnings / open items"
          - "──────────────────────────────────────────────────────────────"
          - >-
            {{ ' * vCenter role TrueNorth-Provision is NOT assigned — range provisioning
            will fail at first use.' if not (tn_prov_state.can_provision | default(true))
            else ' * vCenter provisioning privileges: OK' }}
          - >-
            {{ ' * Range networks: per-range port groups on ' ~ (tn_vsphere_range_dvs | default(''))
            ~ ', VLAN pool ' ~ (tn_vsphere_vlan_pool | default(''))
            if (tn_vsphere_network | default('') | length) == 0
            else (' * Fallback network ' ~ tn_vsphere_network ~ ' does not exist yet.'
                  if not (tn_prov_state.network_present | default(true))
                  else ' * Fallback network: present') }}
          - >-
            {{ ' * TLS is self-signed — issue a certificate from corp-TN-DC01-CA before
            a cohort uses this.' if tn_tls_mode == 'selfsigned'
            else ' * TLS: operator-supplied certificate' }}
          - >-
            {{ ' * Demo data was NOT seeded (correct for a real deployment).'
            if not (tn_seed_demo_data | bool)
            else ' * Demo data WAS seeded — do not use this for a real cohort.' }}
          - "──────────────────────────────────────────────────────────────"
          - " Next: sign in as {{ tn_bootstrap_admin_upn | default('the bootstrap admin') }},"
          - " then Users -> Approvals to admit the first cohort."
          - "══════════════════════════════════════════════════════════════"

    # After the report, so a failed install still shows everything above.
    - name: Validate — the signed audit export ran
      ansible.builtin.assert:
        that: tn_audit_export_now.rc | default(1) == 0
        fail_msg: >-
          The audit export could not run (worker-scenario: python -m worker.audit_export_now,
          exit {{ tn_audit_export_now.rc | default('?') }}): {{ tn_audit_export_now.stderr | default('') | trim }}.
          Exit 1: AUDIT_SIGNING_SEED is missing or short. Otherwise see
          docs/runbooks/backup-restore.md ("Archive newer than the database") and that the
          archive {{ tn_audit_archive_path | default('') }} is writable by uid 10001.
        quiet: true

    - name: Validate — the AI orchestrator's models exist on its endpoint
      ansible.builtin.assert:
        that: tn_ai_models.error is defined or (tn_ai_models.missing | default([]) | length == 0)
        fail_msg: >-
          {{ tn_ai_base_url }} does not serve {{ tn_ai_models.missing | default([]) | join(', ') }}
          (it lists: {{ tn_ai_models.models | default([]) | join(', ') }}). Set tn_ai_default_model,
          or tn_ai_heavy_model / tn_ai_general_model / tn_ai_code_model, to ids it lists, then
          re-run playbooks/30-config.yml and 50-stack-up.yml.
        quiet: true

    - name: Validate — WARNING, the AI models could not be checked
      ansible.builtin.debug:
        msg: >-
          WARNING: the AI orchestrator could not list its endpoint's models ({{ tn_ai_models.error }}),
          so its configured models ({{ tn_ai_models.configured | default({}) | dict2items
          | map(attribute='value') | unique | join(', ') }}) are unverified.
      when: tn_ai_models.error is defined
