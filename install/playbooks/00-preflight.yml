---
# Preflight — verify the platform host is ready. Read-only; nothing is changed.
#
# Re-runnable on its own:  ansible-playbook playbooks/00-preflight.yml
- name: "Preflight"
  hosts: platform
  gather_facts: true
  # Every task here only reads, so it runs for real under --check too: a check-mode
  # preflight that skipped its commands would report nothing.
  check_mode: false
  roles:
    - role: tn_preflight
      tags: [preflight]
