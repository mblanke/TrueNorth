[alembic]
script_location = alembic
# Migrations import `app` (GUID and friends). Without this, `alembic heads` / `history`
# load revision files before env.py and only the ones that patch sys.path themselves
# import; the installer's pre-migration check crashed on that in the image (v1.2.0-rc1).
prepend_sys_path = .
sqlalchemy.url = postgresql+psycopg://truenorth:truenorth@localhost:5432/truenorth_range

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %%H:%%M:%%S
