# Upstreams are resolved per request, not once at startup. With a literal
# `proxy_pass http://api:8080/`, recreating the api container (new IP) left this nginx
# proxying to the old address: every /api call returned 502 until web was restarted.
# 127.0.0.11 is Docker's embedded DNS. This file is only used under Docker Compose; the
# Helm chart mounts its own config over it (configmap-nginx.yaml).
map $request_uri $api_path  { ~^/api(?<rest>/.*)$  $rest; default /; }
map $request_uri $auth_path { ~^/auth(?<rest>/.*)$ $rest; default /; }

# ── Response headers, chosen per path ────────────────────────────────────────
# Set once at server level from these maps, so no location declares add_header and
# silently drops the rest (nginx inherits add_header only into blocks with none of
# their own). An empty value adds nothing: /api/ and /auth/ responses keep the
# headers the API and Keycloak set themselves.
#
# In production the edge (infra/platform/nginx) replaces the security headers with
# its full set, including the SPA's script policy. This file serves :4200 directly
# in development, where Keycloak is on another origin (TN_KEYCLOAK_URL), so its CSP
# restricts framing and plugins only and leaves script and connect sources alone.
map $uri $tn_cache_control {
    ~^/(api|auth)/                                     "";
    /assets/config.json                                "no-store";
    # Hashed build artefacts are immutable — their name changes when they do.
    ~*\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$    "public, max-age=31536000, immutable";
    # index.html must NOT be cached: it is the only file whose name never changes, and
    # it is what points at the hashed bundles. A cached copy keeps sending browsers to
    # the previous build's chunks, so a redeploy looks like it silently did nothing.
    default                                            "no-cache, must-revalidate";
}
map $uri $tn_csp {
    ~^/(api|auth)/       "";
    # Design mock-ups the SPA frames: inline scripts, so a CSP sandbox (opaque origin).
    ~^/assets/previews/  "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'";
    default              "frame-ancestors 'self'; object-src 'none'; base-uri 'self'";
}
# SAMEORIGIN, not DENY: the SPA frames its own silent-SSO page and the previews.
map $uri $tn_frame_options { ~^/(api|auth)/ ""; default "SAMEORIGIN"; }
map $uri $tn_nosniff       { ~^/(api|auth)/ ""; default "nosniff"; }
# $request_uri, not $uri: try_files has turned /au/... into /index.html by header time.
map $request_uri $tn_referrer { ~^/(api|auth)/ ""; ~^/au/ "no-referrer"; default "strict-origin-when-cross-origin"; }
# cmi5 launch URLs carry a one-time fetch secret (fetch=...): never log it, nor a Referer holding it.
map $request $tn_request_logged {
    "~^(?<tn_a>.*[?&]fetch=)[^& ]*(?<tn_b>.*)$" "${tn_a}<redacted>${tn_b}";
    default $request;
}
map $http_referer $tn_referer_logged {
    "~^(?<tn_ra>.*[?&]fetch=)[^&]*(?<tn_rb>.*)$" "${tn_ra}<redacted>${tn_rb}";
    default $http_referer;
}
log_format tn_redacted '$remote_addr - $remote_user [$time_local] "$tn_request_logged" '
                       '$status $body_bytes_sent "$tn_referer_logged" "$http_user_agent"';
map $uri $tn_permissions   { ~^/(api|auth)/ ""; default "camera=(), microphone=(), geolocation=()"; }

server {
    # 8080: the image runs nginx as an unprivileged user, which cannot bind below 1024.
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log tn_redacted;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control           $tn_cache_control;
    add_header Content-Security-Policy $tn_csp           always;
    add_header X-Frame-Options         $tn_frame_options always;
    add_header X-Content-Type-Options  $tn_nosniff       always;
    add_header Referrer-Policy         $tn_referrer      always;
    add_header Permissions-Policy      $tn_permissions   always;

    # Build artefacts: a missing one is a 404, not index.html (a stale tab asking for an
    # old chunk must fail loudly). /api/ and /auth/ are excluded: without that, an
    # attachment named x.png or Keycloak's login-theme CSS was answered from the web root.
    location ~* ^/(?!api/|auth/).*\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config, written at container start by docker/40-truenorth-runtime-config.sh
    # into /tmp (the web root is read-only to the unprivileged nginx user). Falls back to
    # the image's built-in copy when no TN_* variable was set. Never cached: it changes
    # per deployment under the same name ($tn_cache_control).
    location = /assets/config.json {
        root /tmp/truenorth-runtime;
        try_files /config.json @builtin_config;
    }
    location @builtin_config {
        root /usr/share/nginx/html;
    }

    # Prometheus scrapes the API directly (api:8080/metrics) on the internal network.
    # Never expose it through the public edge.
    location ~ ^/api/(v1/)?metrics/?$ {
        return 404;
    }

    # Operator surfaces are not served through the web container. In development use
    # the API's own published port (127.0.0.1:8081/docs) and Keycloak's (:8180/admin);
    # in production the edge serves them to management networks only.
    location ~* ^/api/(v1/)?(docs|redoc|openapi\.json|health/deep)(/|$) {
        return 404;
    }
    location ~* "^/auth/(admin|realms/master|metrics|health)([/;]|$)" {
        return 404;
    }

    # Calendar-feed URLs carry a bearer token in the path (ADR 0004), and cmi5 fetch URLs a
    # one-time secret (docs/cmi5.md): never log them.
    location ~ ^/api/(v1/)?(schedule/feed|cmi5/fetch)/ {
        access_log off;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$api_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Multipart uploads: range documents and ticket attachments allow 25 MB per file,
    # the API 50 MB per request. Keep in step with the edge's upload location
    # (tests/contracts/test_edge_nginx.py checks both against the OpenAPI contract).
    location ~ ^/api/(v1/)?(collective-exercises/[^/]+/(mesl|objectives)/import|course-releases|courses/import-(course-content|programme)|curricula/[^/]+/documents|golden-images/import-catalogue|qsp/import-(competency-)?crosswalk|ranges/[^/]+/(description/import|documents)|threat-intel/feeds/[^/]+/upload|tickets/[^/]+/attachments|users/import-csv)/?$ {
        client_max_body_size 50M;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$api_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 300s;
    }

    location /api/ {
        # The API's own cap on a non-multipart body (InputSanitizationMiddleware).
        client_max_body_size 10M;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$api_path;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: the API believes this header from us (TRUSTED_PROXY_CIDRS),
        # so a client must not be able to seed it.
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    location /auth/ {
        set $auth_upstream keycloak:8080;
        proxy_pass http://$auth_upstream$auth_path;
        proxy_set_header Host $host;
    }
}
