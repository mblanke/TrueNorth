<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>LMS development preview</title><style>html{color-scheme:light dark}body{margin:0}i[data-lucide]{display:none}</style></head><body>
<div id="tn-development" aria-label="TrueNorth learning and development design">
  <style>
    #tn-development { --tn-bg:light-dark(#f4f6f8,#111820); --tn-surface:light-dark(#ffffff,#19232d); --tn-ink:light-dark(#172b39,#edf2f6); --tn-muted:light-dark(#526473,#b1bfcb); --tn-line:light-dark(#dce3e8,#354450); --tn-accent:light-dark(#0d655e,#8bdbcf); --tn-soft:light-dark(#e5f2ee,#243b3b); --tn-warm:light-dark(#f8efe0,#3c3426); --tn-warm-ink:light-dark(#77501a,#e8c18a); --tn-button:light-dark(#163f49,#a9e0de); --tn-button-ink:light-dark(#ffffff,#102f32); --tn-space:22px; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--tn-ink); background:var(--tn-bg); border:1px solid var(--tn-line); border-radius:14px; overflow:hidden; }
    #tn-development * { box-sizing:border-box; }
    #tn-development button,#tn-development select,#tn-development textarea { font:inherit; }
    #tn-development button { color:inherit; }
    #tn-development button:focus-visible,#tn-development select:focus-visible,#tn-development textarea:focus-visible { outline:3px solid var(--tn-accent); outline-offset:3px; }
    #tn-development .tn-preview { padding:10px 18px; border-bottom:1px solid var(--tn-line); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:var(--tn-warm); color:var(--tn-warm-ink); font-size:12px; }
    #tn-development .tn-preview label { display:flex; gap:8px; align-items:center; }
    #tn-development select { background:var(--tn-surface); border:1px solid var(--tn-line); border-radius:7px; padding:7px; color:var(--tn-ink); max-width:100%; }
    #tn-development .tn-top { display:flex; align-items:center; gap:16px; padding:17px 22px; background:var(--tn-surface); border-bottom:1px solid var(--tn-line); }
    #tn-development .tn-brand { font-size:19px; font-weight:650; display:flex; gap:9px; align-items:center; letter-spacing:-.6px; }
    #tn-development .tn-brand i { color:var(--tn-accent); }
    #tn-development .tn-product { color:var(--tn-muted); border-left:1px solid var(--tn-line); padding-left:16px; }
    #tn-development .tn-avatar { margin-left:auto; border-radius:50%; background:var(--tn-soft); color:var(--tn-accent); width:33px; height:33px; display:grid; place-items:center; font-size:12px; flex-shrink:0; }
    #tn-development .tn-layout { display:grid; grid-template-columns:183px minmax(0,1fr); }
    #tn-development .tn-side { background:var(--tn-surface); border-right:1px solid var(--tn-line); padding:22px 12px; }
    #tn-development .tn-side-title { font-size:11px; text-transform:uppercase; letter-spacing:1.3px; color:var(--tn-muted); padding:0 10px 10px; }
    #tn-development .tn-nav { display:flex; flex-direction:column; gap:5px; }
    #tn-development .tn-nav button { border:0; background:transparent; padding:11px 10px; text-align:left; display:flex; align-items:center; gap:10px; border-radius:7px; width:100%; }
    #tn-development .tn-nav button[aria-current="page"] { background:var(--tn-soft); color:var(--tn-accent); font-weight:600; }
    #tn-development .tn-nav button:hover { background:var(--tn-soft); }
    #tn-development .tn-side-foot { border-top:1px solid var(--tn-line); margin:25px 10px 0; padding-top:16px; font-size:12px; color:var(--tn-muted); }
    #tn-development .tn-side-foot strong { display:block; color:var(--tn-ink); font-weight:500; }
    #tn-development main { min-width:0; padding:var(--tn-space); }
    #tn-development h1 { font-size:27px; line-height:1.18; font-weight:600; letter-spacing:-.8px; margin:5px 0 9px; }
    #tn-development h2 { font-size:17px; font-weight:600; margin:0 0 13px; }
    #tn-development h3 { font-size:14px; font-weight:600; margin:0 0 5px; }
    #tn-development p { margin:0 0 12px; }
    #tn-development .tn-muted { color:var(--tn-muted); }
    #tn-development .tn-small { font-size:12px; }
    #tn-development .tn-eyebrow { font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--tn-accent); }
    #tn-development .tn-pagehead { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
    #tn-development .tn-pagehead p { max-width:58ch; margin:0; }
    #tn-development .tn-panel { background:var(--tn-surface); border:1px solid var(--tn-line); border-radius:10px; padding:18px; min-width:0; }
    #tn-development .tn-panel + .tn-panel { margin-top:15px; }
    #tn-development .tn-grid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:16px; align-items:start; }
    #tn-development .tn-equal { grid-template-columns:repeat(2,minmax(0,1fr)); }
    #tn-development .tn-stack { display:grid; gap:16px; }
    #tn-development .tn-stack .tn-panel { margin:0; }
    #tn-development .tn-hero { background:var(--tn-soft); border:0; margin-bottom:18px; }
    #tn-development .tn-hero h2 { font-size:22px; line-height:1.25; margin:7px 0 9px; letter-spacing:-.4px; }
    #tn-development .tn-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:14px; }
    #tn-development .tn-action { border:1px solid var(--tn-line); border-radius:7px; padding:8px 12px; background:var(--tn-surface); display:inline-flex; align-items:center; gap:7px; text-align:left; }
    #tn-development .tn-primary { background:var(--tn-button); color:var(--tn-button-ink); border-color:transparent; }
    #tn-development .tn-link { background:transparent; border:0; color:var(--tn-accent); padding:4px 0; display:inline-flex; gap:6px; align-items:center; text-align:left; }
    #tn-development .tn-row { padding:12px 0; border-top:1px solid var(--tn-line); display:flex; justify-content:space-between; gap:14px; align-items:center; }
    #tn-development .tn-row:first-of-type { border-top:0; padding-top:0; }
    #tn-development .tn-row:last-child { padding-bottom:0; }
    #tn-development .tn-row p { margin:3px 0 0; }
    #tn-development .tn-row strong { font-weight:600; }
    #tn-development .tn-chip { display:inline-block; padding:3px 7px; border-radius:5px; background:var(--tn-soft); color:var(--tn-accent); font-size:11px; font-weight:500; }
    #tn-development .tn-chip.warm { color:var(--tn-warm-ink); background:var(--tn-warm); }
    #tn-development .tn-chip.neutral { background:var(--tn-bg); color:var(--tn-muted); }
    #tn-development .tn-meta { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
    #tn-development .tn-path { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin:22px 0; }
    #tn-development .tn-path button { border:1px solid var(--tn-line); border-radius:8px; padding:12px 9px; background:var(--tn-surface); text-align:left; }
    #tn-development .tn-path button[aria-pressed="true"] { background:var(--tn-soft); border-color:var(--tn-accent); }
    #tn-development .tn-path strong,#tn-development .tn-path span { display:block; }
    #tn-development .tn-path span { font-size:11px; color:var(--tn-muted); margin-top:5px; }
    #tn-development .tn-path strong { font-size:12px; font-weight:600; }
    #tn-development .tn-tabs { display:flex; gap:5px; flex-wrap:wrap; border-bottom:1px solid var(--tn-line); margin-bottom:18px; padding-bottom:9px; }
    #tn-development .tn-tabs button { background:transparent; border:0; padding:7px 11px; border-radius:6px; color:var(--tn-muted); }
    #tn-development .tn-tabs button[aria-pressed="true"] { color:var(--tn-accent); background:var(--tn-soft); }
    #tn-development .tn-note { padding:13px 15px; border-left:3px solid var(--tn-accent); background:var(--tn-soft); margin:16px 0; }
    #tn-development .tn-note p:last-child { margin:0; }
    #tn-development .tn-unit { display:grid; grid-template-columns:170px minmax(0,1fr); gap:16px; }
    #tn-development .tn-units { display:flex; flex-direction:column; gap:7px; }
    #tn-development .tn-units button { background:transparent; border:0; padding:10px; border-radius:7px; text-align:left; }
    #tn-development .tn-units button[aria-pressed="true"] { background:var(--tn-soft); color:var(--tn-accent); }
    #tn-development .tn-answer { display:flex; align-items:flex-start; gap:8px; padding:9px 0; }
    #tn-development .tn-answer input { margin-top:5px; }
    #tn-development .tn-feedback { background:var(--tn-bg); border-radius:7px; padding:13px; margin-top:14px; }
    #tn-development .tn-kv { display:grid; grid-template-columns:110px minmax(0,1fr); gap:7px 12px; font-size:12px; }
    #tn-development .tn-kv dt { color:var(--tn-muted); }
    #tn-development .tn-kv dd { margin:0; }
    #tn-development .tn-observation { padding:14px 0; border-top:1px solid var(--tn-line); }
    #tn-development .tn-observation p { margin-bottom:6px; }
    #tn-development .tn-back { margin-bottom:15px; }
    #tn-development .tn-check { display:flex; gap:10px; margin:13px 0; align-items:flex-start; }
    #tn-development .tn-check i { flex-shrink:0; color:var(--tn-accent); margin-top:3px; }
    #tn-development .tn-check p { margin:0; }
    #tn-development textarea { width:100%; padding:10px; background:var(--tn-bg); border:1px solid var(--tn-line); color:var(--tn-ink); border-radius:7px; min-height:85px; resize:vertical; }
    #tn-development .tn-live { padding:0 22px; color:var(--tn-accent); background:var(--tn-surface); font-size:12px; }
    #tn-development .tn-live:not(:empty) { padding:12px 22px; border-top:1px solid var(--tn-line); }
    #tn-development .tn-footer { padding:10px 20px; font-size:11px; color:var(--tn-muted); background:var(--tn-surface); border-top:1px solid var(--tn-line); }
    #tn-development .tn-list { padding-left:19px; margin:10px 0; }
    #tn-development .tn-list li { margin:7px 0; }
    #tn-development .tn-table { width:100%; border-collapse:collapse; font-size:12px; table-layout:fixed; overflow-wrap:anywhere; }
    #tn-development .tn-table th { text-align:left; color:var(--tn-muted); font-weight:500; }
    #tn-development .tn-table th,#tn-development .tn-table td { padding:11px 8px; border-bottom:1px solid var(--tn-line); vertical-align:top; }
    @media(max-width:800px) { #tn-development .tn-layout { grid-template-columns:150px minmax(0,1fr); } #tn-development .tn-grid { grid-template-columns:1fr; } #tn-development main { padding:18px; } #tn-development .tn-path { grid-template-columns:repeat(3,minmax(0,1fr)); } #tn-development .tn-unit { grid-template-columns:1fr; } #tn-development .tn-units { flex-direction:row; flex-wrap:wrap; } }
    @media(max-width:550px) { #tn-development .tn-layout { display:block; } #tn-development .tn-side { padding:10px; border-right:0; border-bottom:1px solid var(--tn-line); } #tn-development .tn-side-title,#tn-development .tn-side-foot { display:none; } #tn-development .tn-nav { flex-direction:row; flex-wrap:wrap; gap:2px; } #tn-development .tn-nav button { width:auto; padding:8px; font-size:12px; } #tn-development .tn-nav button svg { display:none; } #tn-development .tn-top { padding:14px; gap:10px; } #tn-development .tn-product { font-size:12px; padding-left:10px; } #tn-development main { padding:14px; } #tn-development h1 { font-size:24px; } #tn-development .tn-path { grid-template-columns:repeat(2,minmax(0,1fr)); } #tn-development .tn-row { align-items:flex-start; flex-wrap:wrap; } #tn-development .tn-kv { grid-template-columns:90px minmax(0,1fr); } }
    @media(pointer:coarse) { #tn-development button,#tn-development select { min-height:44px; } }
  </style>
  <div class="tn-preview"><span>DESIGN PREVIEW · Fictional people, courses &amp; records</span><label>Preview as <select id="tn-persona" aria-label="Preview persona"><option value="member">Member</option><option value="instructor">Instructor</option><option value="mentor">Mentor</option><option value="lead">Programme lead</option></select></label></div>
  <header class="tn-top"><div class="tn-brand"><i data-lucide="compass" aria-hidden="true"></i>TrueNorth</div><span class="tn-product">Learning &amp; development</span><span class="tn-avatar" id="tn-avatar">AL</span></header>
  <div class="tn-layout"><aside class="tn-side"><div class="tn-side-title" id="tn-workspace">My workspace</div><nav class="tn-nav" id="tn-nav" aria-label="Workspace navigation"></nav><div class="tn-side-foot"><strong>Your work. Your direction.</strong>Foundations → practice → depth → contribution</div></aside><main id="tn-main"></main></div>
  <div id="tn-live" class="tn-live" role="status" aria-live="polite"></div>
  <footer class="tn-footer">Proposed experience · Local preview actions only · DP1–2 pathway supplied by programme stakeholder</footer>
</div>
<script>
(() => {
  const root = document.getElementById('tn-development');
  const main = root.querySelector('#tn-main');
  const initial = {role:'member', phase:'college', page:'home', stage:1, unit:1, filter:'explore', evidence:'work', saved:false, savedOpportunities:[], trainingView:'briefing', practiceRun:false, developmentSuggestion:false, handoffState:'pending'};
  let state = {...initial};
  let history = [];
  const design = {density:'Comfortable', emphasis:'Balanced'};
  const menus = {
    member:[['home','Home','house'],['programme','Programme','route'],['learning','My learning','book-open'],['portfolio','Portfolio','folder-check'],['opportunities','Opportunities','telescope'],['plan','Development plan','sprout']],
    instructor:[['home','Teaching','presentation'],['learning','Course workspace','book-open'],['portfolio','Assessment evidence','folder-check'],['programme','Curriculum context','route']],
    mentor:[['home','Mentoring','users'],['plan','Development plan','sprout'],['portfolio','Shared evidence','folder-check'],['opportunities','Opportunities','telescope']],
    lead:[['home','Programme overview','layers'],['programme','Pathway & handoffs','route'],['opportunities','Opportunity capacity','telescope']]
  };
  const phases = {college:['Algonquin College','Year 2 · Current semester'],ctu:['CTU Kingston · RMC activities','Current training block'],unit:['Operational development','Supervised practice & specialist growth']};
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const chip = (text, cls='') => `<span class="tn-chip ${cls}">${text}</span>`;
  const btn = (label,action,primary=false) => `<button type="button" class="tn-action ${primary?'tn-primary':''}" data-action="${action}">${label}${icon('arrow-up-right')}</button>`;
  const link = (label,action) => `<button type="button" class="tn-link" data-action="${action}">${label}${icon('arrow-right')}</button>`;
  const row = (title,description,right='') => `<div class="tn-row"><div><strong>${title}</strong><p class="tn-small tn-muted">${description}</p></div>${right}</div>`;
  const panel = (title,body) => `<section class="tn-panel"><h2>${title}</h2>${body}</section>`;
  const head = (eyebrow,title,subtitle,control='') => `<div class="tn-pagehead"><div><span class="tn-eyebrow">${eyebrow}</span><h1>${title}</h1><p class="tn-muted">${subtitle}</p></div>${control}</div>`;
  const tabs = (items,current,prefix) => `<div class="tn-tabs">${items.map(([value,label])=>`<button type="button" aria-pressed="${value===current}" data-action="${prefix}:${value}">${label}</button>`).join('')}</div>`;
  function applySaved(saved) {
    const s = saved?.privateContent;
    if (!s || s.version!==1) return;
    if (Object.hasOwn(menus,s.role)) state.role=s.role;
    if (Object.hasOwn(phases,s.phase)) state.phase=s.phase;
    if (['home','programme','learning','course','portfolio','evidence-detail','opportunities','opportunity','plan','handoff','submission','training','contribution'].includes(s.page)) state.page=s.page;
    else state.page='home';
    if (Number.isInteger(s.stage)&&s.stage>=0&&s.stage<=4) state.stage=s.stage;
    if (['explore','depth','contribute'].includes(s.filter)) state.filter=s.filter;
    if (Number.isInteger(s.unit)&&s.unit>=0&&s.unit<=2) state.unit=s.unit;
    if (['work','skills','records','contributions'].includes(s.evidence)) state.evidence=s.evidence;
    if (['briefing','practice','evidence','debrief'].includes(s.trainingView)) state.trainingView=s.trainingView;
    state.practiceRun=s.practiceRun===true;
    state.developmentSuggestion=s.developmentSuggestion===true;
    if (['pending','correction','acknowledged'].includes(s.handoffState)) state.handoffState=s.handoffState;
    if (['explore','depth','contribute'].includes(s.opportunityType)) state.opportunityType=s.opportunityType;
    if (s.opportunityIndex===0||s.opportunityIndex===1) state.opportunityIndex=s.opportunityIndex;
    state.savedOpportunities=Array.isArray(s.savedOpportunities)?s.savedOpportunities.filter(x=>/^(explore|depth|contribute):[01]$/.test(x)):[];
    state.saved=state.savedOpportunities.length>0;
  }
  applySaved(window.openai?.widgetState);
  function save() {
    window.openai?.setWidgetState?.({modelContent:{workspace:state.role,phase:state.phase,view:state.page,opportunitySaved:state.saved},privateContent:{version:1,...state}})?.catch(()=>{});
  }
  function navigate(page) { history.push({...state}); state.page=page; render(); save(); }
  function announce(message) { root.querySelector('#tn-live').textContent=message; }
  function home() {
    if(state.role==='instructor') return instructor();
    if(state.role==='mentor') return mentoring();
    if(state.role==='lead') return leadership();
    const phasePicker = `<label class="tn-small tn-muted">Preview phase<br><select id="tn-phase"><option value="college" ${state.phase==='college'?'selected':''}>College · 3 years</option><option value="ctu" ${state.phase==='ctu'?'selected':''}>CTU / RMC · 8 months</option><option value="unit" ${state.phase==='unit'?'selected':''}>Operational development</option></select></label>`;
    const content = {
      college:{title:'Your semester, in focus.',subtitle:'Continue your studies, make room for curiosity, and keep your next step in sight.',kicker:'Continue learning · Network investigation',hero:'Turn observations into an explanation.',body:'Unit 4 · Investigating an unfamiliar traffic pattern. Your draft analysis is ready to resume.',action:'Resume unit',due:[['Traffic analysis report','Thursday · Draft saved'],['Systems administration practical','Friday · Briefing available']],next:'Discuss your investigation with your mentor',nextBody:'Tuesday, 14:00 · Bring one question and a piece of work you want to develop.'},
      ctu:{title:'Put your foundations to work.',subtitle:'Your college evidence travels with you into military training and practical assessment.',kicker:'Prepare · CTU training block',hero:'Explain the incident. Defend your decisions.',body:'Review the exercise briefing, practise the handover, and inspect the assessment criteria before your scheduled session.',action:'Open training activity',due:[['Incident response assessment','Thursday · Preparation open'],['RMC teaching session','Friday · Readings assigned']],next:'Review the evidence for your next transition',nextBody:'One practical assessment is awaiting review. Your receiving owner will acknowledge the final package.'},
      unit:{title:'Build depth. Make a contribution.',subtitle:'Your development plan connects supervised practice, specialist work, and the people supporting you.',kicker:'Development project · Detection engineering',hero:'Make a detection another team can trust.',body:'Your sponsor has allocated two hours each week. Next: reproduce the evaluation and review false positives with your mentor.',action:'Open development plan',due:[['Project evidence review','Thursday · Evaluation draft ready'],['Peer teaching session','Next week · Outline in progress']],next:'Your next review: evidence and direction',nextBody:'Consider what you learned, what the team can reuse, and whether this specialty still fits your interests.'}
    }[state.phase];
    return head(phases[state.phase][0],content.title,content.subtitle,phasePicker)+
      `<section class="tn-panel tn-hero"><span class="tn-eyebrow">${content.kicker}</span><h2>${content.hero}</h2><p>${content.body}</p><div class="tn-actions">${btn(content.action,state.phase==='unit'?'nav:plan':state.phase==='ctu'?'nav:training':'nav:course',true)}${link('View programme','nav:programme')}</div></section>`+
      `<div class="tn-grid"><div class="tn-stack">${panel('Coming up',content.due.map(x=>row(x[0],x[1],link('Open',state.phase==='ctu'?'nav:training':state.phase==='unit'?'nav:plan':'nav:course'))).join(''))}${panel('Feedback worth returning to',row('Your reasoning is improving','Sample instructor feedback · “Show what would disprove your explanation.”',link('Read feedback',state.phase==='ctu'?'training:debrief':state.phase==='unit'?'nav:evidence-detail':'unit:2')))}</div><div class="tn-stack">${panel('Your development conversation',`<p>${content.next}</p><p class="tn-small tn-muted">${content.nextBody}</p>${link('View your plan','nav:plan')}`)}${panel('A little room to explore',`<div class="tn-meta">${chip('Optional')}${chip('2 hours','neutral')}</div><h3>Explain an unfamiliar binary</h3><p class="tn-small tn-muted">A guided taster with a mentor. No specialty commitment.</p>${link('Explore opportunities','nav:opportunities')}`)}</div></div>`;
  }
  function programme() {
    const stages=[['Year 1','Algonquin · Foundations'],['Years 2–3','Algonquin · Integration'],['8 months','CTU · includes RMC'],['Years 4–6','Practice & depth'],['Years 7–10','Expertise & contribution']];
    const info=[
      ['Build the foundations','Develop confidence in systems, networks, programming, and disciplined reasoning.',['Learn through structured teaching and guided practice','Try short explorations across specialties','Start a portfolio with reflections and selected work']],
      ['Connect what you know','Use concepts across courses and build increasingly independent work.',['Follow the current term’s course offerings and deadlines','Develop a substantial project with assessed evidence','Prepare a reviewed handoff into CTU training']],
      ['Demonstrate in context','Build on college learning through CTU training and scheduled RMC activities.',['Prepare for practical tasks against published criteria','Resolve gaps through feedback and reassessment','Complete the institutional handoff with a receiving owner']],
      ['Find depth through useful work','Agree a development direction with a mentor and organisational sponsor.',['Practise in supervised assignments','Explore a specialty through a funded or time-supported project','Build reproducible evidence and reusable contributions']],
      ['Multiply your expertise','Develop deep capability while strengthening colleagues and the profession.',['Maintain a technical contribution others rely on','Mentor emerging specialists and teach from experience','Feed lessons back into curriculum and research']]
    ][state.stage];
    return head('One continuing development record','Your programme, your possibilities.','DP1–2 spans the supplied college and CTU/RMC pathway. Later horizons illustrate development, not automatic qualification.')+
      `<div class="tn-path" aria-label="Select a programme stage">${stages.map((s,i)=>`<button type="button" data-action="stage:${i}" aria-pressed="${state.stage===i}"><strong>${s[0]}</strong><span>${s[1]}</span></button>`).join('')}</div>`+
      `<div class="tn-grid">${panel(info[0],`<p class="tn-muted">${info[1]}</p><ul class="tn-list">${info[2].map(s=>`<li>${s}</li>`).join('')}</ul><div class="tn-actions">${btn(state.stage<3?'View learning':'View development plan',state.stage<3?'nav:learning':'nav:plan',true)}</div>`)}${panel('The next handoff',`<div class="tn-meta">${chip('Preparation in progress','warm')}</div><h3>College → CTU Kingston</h3><p class="tn-small tn-muted">Formal records, selected developmental evidence, identified gaps, and an accountable receiving owner.</p>${link('Inspect handoff package','nav:handoff')}`)}</div><div class="tn-note tn-small">Exact course sequencing and qualification awards follow the approved curriculum version. Time in a phase does not grant a qualification.</div>`;
  }
  function learning() {
    if(state.role==='member'&&state.phase==='ctu') return head('CTU Kingston · includes RMC activities','Your current training block.','Preparation, instruction, practical work, and review, connected to the same learner record.')+panel('Current training',row('Incident handover practice','Briefing, sample evidence, and a reviewed debrief',btn('Open training activity','nav:training',true))+row('RMC teaching activities','Readings and teaching sessions linked to this block',chip('Institutional source','neutral'))+row('Formal practical assessment','Scheduled separately from the practice preview',chip('Assessor-owned','warm')));

      const output=root.querySelector('#tn-practice-result');
      output.className='tn-feedback';
      output.textContent=!answer?'Choose an explanation to see feedback.':answer.value==='compare'?'A defensible next step. Corroborating evidence helps distinguish expected automation from activity that needs investigation. This practice response does not change your grade.':'Revisit the evidence. Timing alone, or the absence of an alert, cannot settle the explanation. Compare expected activity and look for corroboration.';
    }
    if(action==='keep-note'){const field=root.querySelector('#tn-reflection');announce(field.value.trim()?'Note remains in this open preview. It has not been shared or saved to a member record.':'Add a preparation note first.');}
  });
  root.addEventListener('change',event=>{
    if(event.target.id==='tn-persona'){state.role=event.target.value;state.page='home';history=[];render();save();announce('Previewing a fictional '+state.role+' workspace.');}
    if(event.target.id==='tn-phase'){state.phase=event.target.value;state.stage={college:1,ctu:2,unit:3}[state.phase];render();save();announce('Showing the '+phases[state.phase][0]+' phase.');}
  });
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){applySaved(event.detail.globals.widgetState);render();}});
  render();
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:render});tweak.addSelect(design,'density',{label:'Workspace density',options:['Comfortable','Compact']});tweak.addSelect(design,'emphasis',{label:'Home emphasis',options:['Balanced','Programme first']});}
})();
</script>
