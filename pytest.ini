[pytest]
testpaths = tests
pythonpath =
    control-plane/api
    control-plane/worker
    scenario-engine
    ai-orchestrator
    tools
    noise-agent
addopts = -v --tb=short
markers =
    slow: marks tests as slow
    integration: marks tests requiring external services
    vcsim: needs the vSphere simulator (infra/platform/docker/compose.vcsim.yml, CI job vsphere-sim)
    audit443: a confirmed finding of the GA audit (issue #443), written as a strict xfail until its fix lands; remove the xfail with the fix
